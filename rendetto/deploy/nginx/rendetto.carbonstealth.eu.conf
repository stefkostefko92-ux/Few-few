# nginx на ХОСТА за Rendetto. TLS сертификатите се управляват с certbot.
# Приложението слуша на 127.0.0.1:4320 (публикуван порт от docker-compose.yml).
#
# Не се пише на ръка: rendetto/deploy/deploy.sh слага точно този файл в
# /etc/nginx/sites-available/rendetto при всеки деплой (nginx -t, после reload), щом има сертификат.
# Сертификатът — веднъж, преди това (виж DEPLOY.md, т. 2).

server {
    listen 80;
    listen [::]:80;
    server_name rendetto.carbonstealth.eu;
    location / { return 308 https://$host$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rendetto.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/rendetto.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rendetto.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    # Без OCSP stapling: Let's Encrypt не слага OCSP адрес в сертификатите от 07.05.2025 и спря
    # OCSP сървърите на 06.08.2025 — `ssl_stapling on` би дал само предупреждение в лога.

    server_tokens off;

    # Над лимитите на приложението (JSON 64 KB, форми 32 KB), без да отваря машината за големи тела.
    client_max_body_size 1m;

    # Текстът се компресира: витрината е ~100 KB HTML (листът от разкроя е вграден SVG),
    # редакторът ~850 KB JavaScript при първо зареждане (~240 KB с gzip). Приложението праща JS като
    # text/javascript (Express) — без него в списъка редакторът тръгва некомпресиран.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json application/xml
               image/svg+xml text/plain text/xml;

    # CSP, HSTS, X-Frame-Options и Referrer-Policy ги задава приложението (helmet, nonce на заявка).
    # Не се дублират тук — два източника на един заглавен ред се разминават тихо.

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:4320;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Презаписва, не добавя: клиентът не може да подпъхне свой адрес — от него зависят
        # държавата, ограниченията на заявките и одитът.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
