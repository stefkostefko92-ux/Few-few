# Rendetto в продукция: база + приложение.
#
# TLS и публичният вход са на nginx-а на ХОСТА (Let's Encrypt) — конфигът е
# `deploy/nginx/rendetto.carbonstealth.eu.conf` в това репо, не се пише на ръка на сървъра.
#
# Тайните НЕ са тук — идват от `.env` до този файл (mode 600 на сървъра, никога в репото).
# Задължителни: POSTGRES_PASSWORD · ENC_KEY · HMAC_KEY · PUBLIC_BASE_URL · SMTP_HOST.
# По избор: SMTP_USER/SMTP_PASS, RENDETTO_DATA (папката с catalog.json и GeoIP базата), HTTP_PORT (4320).
name: rendetto

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rendetto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}
      POSTGRES_DB: rendetto
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rendetto -d rendetto']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4320'
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://rendetto:${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}@db:5432/rendetto
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?липсва PUBLIC_BASE_URL}
      ENC_KEY: ${ENC_KEY:?липсва ENC_KEY}
      HMAC_KEY: ${HMAC_KEY:?липсва HMAC_KEY}
      SMTP_HOST: ${SMTP_HOST:?липсва SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Rendetto <no-reply@carbonstealth.eu>}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-info@carbonstealth.eu}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL:-privacy@carbonstealth.eu}
      TOTP_ISSUER: ${TOTP_ISSUER:-Rendetto}
      # Портът е публикуван през Docker NAT: приложението вижда шлюза на мрежата, не 127.0.0.1.
      # `uniquelocal` (10/8, 172.16/12, 192.168/16) вярва само на nginx-а на хоста през тази мрежа;
      # портът е вързан за 127.0.0.1, значи никой друг не стига дотук.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
    volumes:
      # Каталогът от магазините и GeoIP базата — само на сървъра, извън репото и образа.
      - ${RENDETTO_DATA:-./data}:/app/data
    ports:
      - '127.0.0.1:${HTTP_PORT:-4320}:4320'
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

volumes:
  db-data:
