# V.F.R. — Nginx config
# /etc/nginx/sites-available/vfr.carbonstealth.eu → symlink в sites-enabled
# Каноничният домейн е vfr.carbonstealth.eu (без www). Смени го на едно място при собствен домейн.

server {
    listen 80;
    listen [::]:80;
    server_name vfr.carbonstealth.eu;
    location ^~ /.well-known/acme-challenge/ { root /var/www/vfr.carbonstealth.eu; }
    location / { return 301 https://vfr.carbonstealth.eu$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vfr.carbonstealth.eu;

    ssl_certificate /etc/letsencrypt/live/vfr.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vfr.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    root /var/www/vfr.carbonstealth.eu;
    index index.html;
    charset utf-8;

    # Security headers. CSP: нула външни скриптове; шрифтовете са self-hosted;
    # frame-src само Google Maps (зарежда се след клик); Google Maps линковете са обикновени <a>.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    location ^~ /.well-known/ { access_log off; }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    location = /favicon.ico { access_log off; return 204; }
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /llms.txt    { access_log off; }
    location = /indexnow-key.txt { access_log off; }

    # Непознат път е истинско 404 (не soft-404 с код 200)
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }

    # Никога не сервираме служебни файлове
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~* (^|/)(CLAUDE|SECURITY|README)\.md$ { deny all; }
    location ~* (^|/)(package(-lock)?\.json|nginx\.conf|deploy\.sh)$ { deny all; }
    location ^~ /tools/ { deny all; }

    access_log /var/log/nginx/vfr.access.log;
    error_log /var/log/nginx/vfr.error.log;
}
