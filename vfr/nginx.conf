# V.F.R. — Nginx config
# /etc/nginx/sites-available/vfr.carbonstealth.eu → symlink в sites-enabled
# Каноничният домейн е vfr.carbonstealth.eu (без www). Смени го на едно място при собствен домейн.

server {
    listen 80;
    listen [::]:80;
    server_name vfr.carbonstealth.eu;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/vfr.carbonstealth.eu; }
    location / { return 301 https://vfr.carbonstealth.eu$request_uri; }
}

# Евтин DoS/скрейп: щедро за реален браузър (едно зареждане ≈ 22 заявки по HTTP/2, 4 бързи
# презареждания минават), спира наводнение от един IP. Измерено от червения екип: 600 заявки →
# 121×200 + 479×429. rate=10r/s burst=60 режеше нормални презареждания; limit_conn брои всеки
# HTTP/2 поток като връзка — затова не се ползва.
limit_req_zone $binary_remote_addr zone=vfr_req:10m rate=20r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vfr.carbonstealth.eu;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/vfr.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vfr.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 само с AEAD + forward secrecy (както evanitasport); TLS 1.3 има свой фиксиран набор.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # ssl_stapling НЕ се ползва: Let's Encrypt спря OCSP.

    root /var/www/vfr.carbonstealth.eu;
    # Симлинк в уеб корена (напр. вкаран с комит) не може да сочи извън него.
    disable_symlinks on from=$document_root;
    index index.html;
    charset utf-8;
    # Пренасочването към папка (/css → /css/) е относително: не отразява Host заглавката.
    absolute_redirect off;
    limit_req zone=vfr_req burst=120 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;

    # Security headers. CSP: нула външни скриптове и нула inline стилове (404 също ползва файл);
    # шрифтовете са self-hosted; frame-src само Google Maps (зарежда се след клик).
    # ВАЖНО: nginx наследява add_header от server САМО ако location-ът няма свой add_header
    # (nginx.org, ngx_http_headers_module). Затова location-ите по-долу ползват само `expires` —
    # иначе css/js/снимките/шрифтовете тихо губят всички хедъри отгоре.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    location ^~ /.well-known/ { access_log off; }

    # Служебните файлове никога не се сервират. ПРЕДИ кеш regex-ите: regex location-ите се проверяват
    # по реда на появата и печели ПЪРВИЯТ (nginx.org, ngx_http_core_module) — иначе /.git/x.js или
    # /.secret/y.png минават през кеш блока с 200.
    location ~ /\.(?!well-known/) { deny all; access_log off; log_not_found off; }
    location ~* (^|/)(CLAUDE|SECURITY|README)\.md$ { deny all; }
    location ~* (^|/)(package(-lock)?\.json|photos\.json|nginx\.conf|deploy\.sh)$ { deny all; }
    location ^~ /tools/ { deny all; }

    # Без add_header тук (виж горе). `expires` сам слага Cache-Control: max-age.
    # Без `immutable`: файловете нямат версия в името и се подменят на място.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff2)$ { expires 30d; access_log off; }
    location ~* \.(css|js)$ { expires 7d; access_log off; }

    location = /favicon.ico { access_log off; return 204; }
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /llms.txt    { access_log off; }
    location = /indexnow-key.txt { access_log off; }

    # Непознат път е истинско 404 (не soft-404 с код 200)
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }


    access_log /var/log/nginx/vfr.access.log;
    error_log /var/log/nginx/vfr.error.log;
}
