# Хоспис „Борис Дали“ — Nginx конфиг (статичен сайт)
# Постави в /etc/nginx/sites-available/hospis.carbonstealth.eu
# ln -s /etc/nginx/sites-available/hospis.carbonstealth.eu /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name hospis.carbonstealth.eu;
    # Let's Encrypt (webroot) трябва да мине по HTTP, всичко останало отива към HTTPS
    location ^~ /.well-known/acme-challenge/ { root /var/www/hospis.carbonstealth.eu; }
    location / { return 301 https://hospis.carbonstealth.eu$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name hospis.carbonstealth.eu;

    # SSL — Let's Encrypt (certbot)
    ssl_certificate /etc/letsencrypt/live/hospis.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hospis.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    # ssl_stapling НЕ се ползва: Let's Encrypt спря OCSP (2025).

    root /var/www/hospis.carbonstealth.eu;
    index index.html;

    # Security headers. Сайтът няма инлайн скриптове/стилове → CSP е строг (без 'unsafe-inline').
    # frame-src: само Google Maps, и то след изричен клик на посетителя (виж assets/js/contact.js).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; frame-src https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/ld+json application/manifest+json application/javascript application/xml image/svg+xml;

    # .well-known (security.txt) — ПРЕДИ забраната за скрити файлове
    location ^~ /.well-known/ {
        access_log off;
    }

    # ВАЖНО: в location блоковете НЕ ползвай add_header — в nginx един вътрешен add_header
    # нулира всички наследени от server (CSP, nosniff, X-Frame…). За кеша стига `expires`.

    # Шрифтове: имената не се менят → дълго кеширане
    location ~* \.woff2$ {
        expires 365d;
        access_log off;
    }

    # CSS/JS се викат с ?v=<хеш> (променя се при редакция) → безопасно за дълго кеширане
    location ~* \.(css|js)$ {
        expires 30d;
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Robots, sitemap, llms, IndexNow ключ
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /llms.txt    { access_log off; }
    location = /indexnow-key.txt { access_log off; }

    # Един адрес за началната страница (без дублиране на /index.html). Внимание: само `return 301 /`
    # дава безкраен цикъл, защото директивата `index` вътрешно превежда `/` в `/index.html`.
    location = /index.html {
        if ($request_uri ~ "^/index\.html") { return 301 /; }
    }

    # Непознат път е истинско 404 (не soft-404 с код 200)
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        try_files $uri $uri/ =404;
    }

    # Скритите файлове са забранени
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/hospis.access.log;
    error_log /var/log/nginx/hospis.error.log;
}
