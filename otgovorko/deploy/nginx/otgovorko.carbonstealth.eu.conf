# nginx на ХОСТА за Отговорко. Приложението слуша на 127.0.0.1:4380 (docker-compose.yml).
# Панелът — само от позволените адреси: /etc/nginx/otgovorko-allow.conf на сървъра (адресите не влизат в
# репото). Публичен е само webhook-ът на Brevo inbound (/inbound/brevo/<таен път>): Brevo няма подпис и
# IP диапазоните му не са достъпни (27.11.2026) — пазят тайният път и Bearer токенът в приложението.
# Без дневник на заявките; error_log само crit.

limit_req_zone $binary_remote_addr zone=otgovorko_inbound:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=otgovorko_panel:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name otgovorko.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name otgovorko.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/otgovorko.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otgovorko.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:OtgovorkoSSL:10m;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    include /etc/nginx/otgovorko-allow.conf;
    deny all;

    # CSP, HSTS, X-Frame-Options, Referrer-Policy и X-Robots-Tag ги задава приложението (helmet).

    # Единственият публичен път: webhook-ът на Brevo (само POST, тяло до 10 MB). Регулярният израз е в
    # кавички — съдържа „{“ (изискване на nginx).
    location ~ "^/inbound/brevo/[A-Za-z0-9_-]{32,128}$" {
        allow all;
        limit_except POST { deny all; }
        limit_req zone=otgovorko_inbound burst=60 nodelay;
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:4380;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=otgovorko_panel burst=40 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:4380;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
