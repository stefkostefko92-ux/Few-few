# nginx на ХОСТА за Korpora. TLS сертификатите се управляват с certbot.
# Приложението слуша на 127.0.0.1:4320 (публикуван порт от docker-compose.yml); при друг HTTP_PORT
# в .env deploy.sh вписва него вместо 4320.
#
# Не се пише на ръка: korpora/deploy/deploy.sh слага точно този файл в
# /etc/nginx/sites-available/korpora при всеки деплой (nginx -t, после reload), щом има сертификат.
# Сертификатът — веднъж, преди това (виж DEPLOY.md, т. 2).
#
# Без дневник на заявките и с error_log само за crit: политиката за поверителност обещава, че
# дневниците на сървъра не съдържат IP адреси (access log-ът и грешките на ниво error ги пишат).

server {
    listen 80;
    listen [::]:80;
    server_name korpora.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://$host$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name korpora.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/korpora.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/korpora.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    # Без OCSP stapling: Let's Encrypt не слага OCSP адрес в сертификатите от 07.05.2025 и спря
    # OCSP сървърите на 06.08.2025 — `ssl_stapling on` би дал само предупреждение в лога.

    server_tokens off;
    # Без дневник на заявките: политиката за поверителност казва, че IP адрес остава само в дневника
    # за грешки. Приложението води свой дневник без имейли и IP (pino с redact).
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Над лимитите на приложението (JSON 64 KB, форми 32 KB), без да отваря машината за големи тела.
    client_max_body_size 1m;

    # Текстът се компресира: витрината е ~100 KB HTML (листът от разкроя е вграден SVG),
    # редакторът ~850 KB JavaScript при първо зареждане (~240 KB с gzip). Приложението праща JS като
    # text/javascript (Express) — без него в списъка редакторът тръгва некомпресиран.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json application/xml
               image/svg+xml text/plain text/xml;

    # CSP, HSTS, X-Frame-Options и Referrer-Policy ги задава приложението (helmet, nonce на заявка).
    # Не се дублират тук — два източника на един заглавен ред се разминават тихо.

    # Докато приложението не отговаря (деплой, месечният рестарт за GeoIP, срив), nginx показва
    # страницата на Korpora вместо голата си „502 Bad Gateway“. Само грешките, които прави самият nginx
    # (без proxy_intercept_errors): отговорите на приложението, и неговите 503, минават както са.
    # Страницата е самостоятелна (стил и лого вътре), защото /static отива към същия паднал upstream;
    # deploy.sh я слага в /var/www/korpora преди всеки `up`. Кодът остава 502/503/504.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/korpora;
        internal;
        charset utf-8;
        # Тук helmet го няма: строга CSP само за стила на страницата (хешът му) и логото (data:).
        # При промяна на <style> в deploy/nginx/maintenance.html хешът се сменя (тестът го сверява).
        add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-Zd1cDjdpc0UmZKXCvn7O4nLJmFwCzQPxW2FK1HBX/5E='; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 30 always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4320;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Презаписва, не добавя: клиентът не може да подпъхне свой адрес — от него зависят
        # държавата, ограниченията на заявките и одитът.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
