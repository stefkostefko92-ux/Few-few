# Продукционен стек за zabobovdol.bg на VPS: приложение + база + reverse proxy.
# Стартиране: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zabobovdol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabobovdol}
      POSTGRES_DB: ${POSTGRES_DB:-zabobovdol}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zabobovdol}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      DATABASE_URL: postgresql://${POSTGRES_USER:-zabobovdol}:${POSTGRES_PASSWORD:-zabobovdol}@db:5432/${POSTGRES_DB:-zabobovdol}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://zabobovdol.bg}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@zabobovdol.bg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme12345}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-rules}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # За HTTPS разкоментирайте и монтирайте сертификати (виж DEPLOY.md):
      # - "443:443"
    volumes:
      - ./nginx/zabobovdol.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  db-data:
