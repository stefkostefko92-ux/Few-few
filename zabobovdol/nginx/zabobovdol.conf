# Reverse proxy за приложението.
#
# ВАЖНО за продукция: пуснете сайта по HTTPS. Долу има готов 443 блок и
# пренасочване от 80 → 443. Издайте сертификат (certbot) или поставете
# готови в ./nginx/certs/, разкоментирайте 443 блока и порт 443 в
# docker-compose.yml. Не оставяйте админ панела само на HTTP.

upstream zabobovdol_app {
    server app:3000;
}

# Общи настройки за проксиране (споделят се от 80 и 443).
# X-Forwarded-For се ЗАДАВА на реалния клиентски адрес (не се добавя към
# подаден от клиента), за да не може да се подмени IP-то и да се заобиколи
# ограничението на заявките (rate limit).
map $host $zbd_dummy { default 1; }

server {
    listen 80;
    server_name zabobovdol.carbonstealth.eu;

    # За издаване/подновяване на сертификат с certbot (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Когато HTTPS е включен, разкоментирайте, за да пренасочвате всичко: ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Заглавия за сигурност и на ниво прокси (в случай че път заобиколи app).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static/ {
        proxy_pass http://zabobovdol_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://zabobovdol_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

