# Reverse proxy за приложението. По подразбиране слуша на 80.
# За HTTPS вижте коментарите по-долу и DEPLOY.md.

upstream zabobovdol_app {
    server app:3000;
}

server {
    listen 80;
    server_name zabobovdol.carbonstealth.eu;

    # Размер на качваните данни (форми/обяви).
    client_max_body_size 8m;

    # Газип компресия.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Дълъг кеш за статичните ресурси на Next.
    location /_next/static/ {
        proxy_pass http://zabobovdol_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://zabobovdol_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

