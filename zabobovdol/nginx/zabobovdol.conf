# Reverse proxy за приложението.
#
# ВАЖНО за продукция: пуснете сайта по HTTPS. Долу има готов 443 блок и
# пренасочване от 80 → 443. Издайте сертификат (certbot) или поставете
# готови в ./nginx/certs/, разкоментирайте 443 блока и порт 443 в
# docker-compose.yml. Не оставяйте админ панела само на HTTP.

upstream zabobovdol_app {
    server app:3000;
}

# Общи настройки за проксиране (споделят се от 80 и 443).
# X-Forwarded-For се ЗАДАВА на реалния клиентски адрес (не се добавя към
# подаден от клиента), за да не може да се подмени IP-то и да се заобиколи
# ограничението на заявките (rate limit).
map $host $zbd_dummy { default 1; }

# Реалният IP на посетителя, когато пред контейнера стои още един Nginx на хоста
# (продукцията: хост → 127.0.0.1:HTTP_PORT → този контейнер). Без това
# $remote_addr тук е адресът на Docker шлюза и ВСИЧКИ посетители делят един ключ
# за ограничаване на заявките — един спамер спира формите за целия град.
# Вярваме на X-Real-IP САМО от локални/частни адреси (хостовият прокси и мрежата
# на Docker); външен клиент, свързан директно, не може да си подаде чужд IP.
# Ако хостовият прокси не подава X-Real-IP, нищо не се променя спрямо преди.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# Access лог без текста на търсенията. При /tarsene и /api/search адресът носи
# въведеното (?q=…) — понякога ЕГН, телефон или име — а лог редът е заедно с IP.
# Затова за тях в лога остава САМО пътят; същото за Referer, когато посетителят
# идва от страница с търсене (браузърът праща пълния адрес при същия сайт).
# Останалите заявки се записват както с формата `main` на официалния образ.
map $uri $zbd_log_uri {
    ~^/(?:tarsene|api/search)(?:/|$)    $uri;
    default                             $request_uri;
}
map $http_referer $zbd_log_referer {
    ""                                                          "-";
    "~^(?<zbd_ref_path>[^?#]*/(?:tarsene|api/search)/?)[?#]"    $zbd_ref_path;
    default                                                     $http_referer;
}
log_format zbd_main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $zbd_log_uri $server_protocol" '
                    '$status $body_bytes_sent "$zbd_log_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name zabobovdol.carbonstealth.eu;

    # Без текста на търсенията (виж zbd_main горе); пак към stdout на контейнера.
    access_log /var/log/nginx/access.log zbd_main;

    # За издаване/подновяване на сертификат с certbot (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Когато HTTPS е включен, разкоментирайте, за да пренасочвате всичко: ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Заглавия за сигурност и на ниво прокси (в случай че път заобиколи app).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static/ {
        proxy_pass http://zabobovdol_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://zabobovdol_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

