# Evanita Sport — Nginx config
# Place in /etc/nginx/sites-available/evanita.carbonstealth.eu
# ln -s /etc/nginx/sites-available/evanita.carbonstealth.eu /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name evanita.carbonstealth.eu;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name evanita.carbonstealth.eu;

    # SSL — Let's Encrypt (certbot)
    ssl_certificate /etc/letsencrypt/live/evanita.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evanita.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Document root
    root /var/www/evanita.carbonstealth.eu;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://maps.google.com https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # .well-known (security.txt) — ПРЕДИ забраната за скрити файлове
    location ^~ /.well-known/ {
        access_log off;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # Favicon
    location = /favicon.svg {
        expires 30d;
        access_log off;
    }
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Robots, sitemap, llms, IndexNow ключ
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /llms.txt    { access_log off; }
    location = /indexnow-key.txt { access_log off; }

    # Main location — непознат път е истинско 404 (не soft-404 с код 200)
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/evanita.access.log;
    error_log /var/log/nginx/evanita.error.log;
}
