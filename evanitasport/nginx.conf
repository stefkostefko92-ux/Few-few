# Evanita Sport — Nginx config
# Place in /etc/nginx/sites-available/evanita-bg.com
# ln -s /etc/nginx/sites-available/evanita-bg.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name evanita-bg.com www.evanita-bg.com;
    server_tokens off;
    return 301 https://evanita-bg.com$request_uri;
}

# Евтин DoS/скрейп: щедро за реален браузър (едно зареждане е няколко десетки заявки по HTTP/2,
# бързи презареждания минават), спира наводнение от един IP. Стойностите са измерени на vfr/
# (червен тест 2026-09-23): rate=10r/s burst=60 режеше нормални презареждания, а limit_conn брои
# всеки HTTP/2 поток като връзка — затова не се ползва.
limit_req_zone $binary_remote_addr zone=evanita_req:10m rate=20r/s;

# www → гол домейн (каноничният е без www)
server {
    listen 443 ssl http2;
    server_name www.evanita-bg.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/evanita-bg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evanita-bg.com/privkey.pem;
    return 301 https://evanita-bg.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name evanita-bg.com;
    server_tokens off;

    # SSL — Let's Encrypt (certbot)
    ssl_certificate /etc/letsencrypt/live/evanita-bg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evanita-bg.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # ssl_stapling НЕ се ползва: Let's Encrypt спря OCSP (2025) — новите
    # сертификати нямат responder URL и nginx само предупреждава.

    # Document root
    root /var/www/evanita-bg.com;
    # Симлинк в уеб корена не може да сочи извън него.
    disable_symlinks on from=$document_root;
    index index.html;
    # Пренасочването към папка (/css → /css/) е относително: не отразява Host заглавката.
    absolute_redirect off;
    limit_req zone=evanita_req burst=120 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;

    # Security headers
    # ВАЖНО: nginx наследява add_header от server САМО ако location-ът няма свой add_header
    # (nginx.org, ngx_http_headers_module, add_header_default_inherit). Затова location-ите по-долу
    # ползват само `expires` — иначе css/js/снимките тихо губят всички хедъри отгоре.
    # CSP пази 'unsafe-inline' и Google Fonts нарочно: страницата ползва inline style= и шрифтове
    # от fonts.googleapis.com / fonts.gstatic.com.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://maps.google.com https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # .well-known (security.txt) — ПРЕДИ забраната за скрити файлове
    location ^~ /.well-known/ {
        access_log off;
    }

    # Служебните и скритите файлове никога не се сервират. ПРЕДИ кеш regex-ите: regex location-ите
    # се проверяват по реда на появата и печели ПЪРВИЯТ (nginx.org, ngx_http_core_module) — иначе
    # /.git/x.js или /.secret/y.png минават през кеш блока с 200.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* (^|/)(CLAUDE|SECURITY|README)\.md$ { deny all; }
    location ~* (^|/)(package(-lock)?\.json|nginx\.conf|deploy\.sh)$ { deny all; }

    # Кеш на статичните файлове. Без add_header тук (виж горе) — `expires` сам слага
    # Cache-Control: max-age. Без `immutable`: файловете нямат версия в името и се подменят на място.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff2)$ {
        expires 30d;
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        access_log off;
    }

    # Favicon
    location = /favicon.svg {
        expires 30d;
        access_log off;
    }
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Robots, sitemap, llms, IndexNow ключ
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /llms.txt    { access_log off; }
    location = /indexnow-key.txt { access_log off; }

    # Main location — непознат път е истинско 404 (не soft-404 с код 200)
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/evanita.access.log;
    error_log /var/log/nginx/evanita.error.log;
}
