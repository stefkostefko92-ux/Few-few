# evanita.carbonstealth.eu — Nginx vhost (HTTP → HTTPS + статичен сайт).
# Инсталира се от deploy/autodeploy.sh (deploy_evanita) като
# /etc/nginx/sites-available/evanita.conf + symlink в sites-enabled/.
#
# ИЗИСКВА вече издаден сертификат в /etc/letsencrypt/live/evanita.carbonstealth.eu/.
# Докато няма — деплоят слага nginx.http.conf и взима сертификат по webroot.
# НЕ инсталирай този файл ръчно преди certbot: nginx -t ще падне и ще счупи
# reload за ВСИЧКИ сайтове на кутията.

server {
    listen 80;
    listen [::]:80;
    server_name evanita.carbonstealth.eu;

    # ACME остава по HTTP → подновяването не зависи от валиден TLS.
    location ^~ /.well-known/ {
        root /var/www/evanita.carbonstealth.eu;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 (Ubuntu 24.04 stock) иска http2 в listen. При nginx ≥1.25.1
    # deploy_evanita авто-мигрира към отделна директива `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evanita.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/evanita.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evanita.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # БЕЗ ssl_stapling: Let's Encrypt махна OCSP URL-ите от сертификатите
    # (07.05.2025) и изключи респондерите (06.08.2025) → stapling е мъртъв код,
    # а без `resolver` nginx така или иначе го игнорираше мълчаливо.

    root /var/www/evanita.carbonstealth.eu;
    index index.html;

    # ── Сигурност ─────────────────────────────────────────────────────────────
    # ВНИМАНИЕ: add_header НЕ се наследява в location, който сам има add_header.
    # Затова по-долу няма НИТО ЕДИН add_header — иначе изображенията и CSS/JS
    # щяха да се сервират без тези заглавия.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    # CSP по инвентара на index.html: локален JS (js/main.js), self-hosted
    # шрифтове, Google Maps iframe (click-to-load), inline style="" атрибути
    # (оттам 'unsafe-inline' в style-src). Нула inline <script> (JSON-LD не е
    # изпълним и не иска изключение).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://maps.google.com https://www.google.com; connect-src 'self'; upgrade-insecure-requests" always;

    # ── Компресия ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript text/javascript application/xml+rss image/svg+xml;

    # ── Кеш ───────────────────────────────────────────────────────────────────
    # Без add_header тук! `expires` сам издава Cache-Control.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff2)$ {
        expires 30d;
        access_log off;
    }
    # CSS/JS: имената НЕ са хеширани (няма cache busting) → къс кеш, иначе
    # поправка в style.css стига до върнал се посетител чак след дни.
    location ~* \.(css|js)$ {
        expires 1h;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; }

    # ACME + бъдещ security.txt (префиксът бие regex-а за скрити файлове).
    location ^~ /.well-known/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    # One-page сайт: несъществуващ път → истински 404 (не soft-404 с 200).
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    access_log /var/log/nginx/evanita.access.log;
    error_log  /var/log/nginx/evanita.error.log;
}
