# evanita.carbonstealth.eu — БУТСТРАП vhost (само HTTP).
# Ползва се САМО докато няма /etc/letsencrypt/live/evanita.carbonstealth.eu/.
# deploy/autodeploy.sh (deploy_evanita) го слага, взима сертификат по webroot,
# после инсталира пълния nginx.conf. Така няма chicken-and-egg: този конфиг
# минава `nginx -t` без нито един сертификат на кутията.
server {
    listen 80;
    listen [::]:80;
    server_name evanita.carbonstealth.eu;

    root /var/www/evanita.carbonstealth.eu;
    index index.html;

    # ACME HTTP-01 (webroot) — префиксът ^~ бие регекса за скрити файлове.
    location ^~ /.well-known/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    access_log /var/log/nginx/evanita.access.log;
    error_log  /var/log/nginx/evanita.error.log;
}
