<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MedQR">
  <defs>
    <linearGradient id="mqTile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#16a6cb"/>
      <stop offset="0.55" stop-color="#0b6e8c"/>
      <stop offset="1" stop-color="#074a5e"/>
    </linearGradient>
  </defs>

  <!-- Плочка -->
  <rect width="64" height="64" rx="15" fill="url(#mqTile)"/>
  <!-- Лек горен блик за обем -->
  <rect width="64" height="30" rx="15" fill="#ffffff" opacity="0.07"/>

  <!-- QR finder ъгли (горе-ляво, горе-дясно, долу-ляво) -->
  <g>
    <rect x="7"  y="7"  width="12" height="12" rx="3.2" fill="#fff"/>
    <rect x="9.6" y="9.6" width="6.8" height="6.8" rx="1.7" fill="url(#mqTile)"/>
    <rect x="11.3" y="11.3" width="3.4" height="3.4" rx="0.9" fill="#fff"/>

    <rect x="45" y="7"  width="12" height="12" rx="3.2" fill="#fff"/>
    <rect x="47.6" y="9.6" width="6.8" height="6.8" rx="1.7" fill="url(#mqTile)"/>
    <rect x="49.3" y="11.3" width="3.4" height="3.4" rx="0.9" fill="#fff"/>

    <rect x="7"  y="45" width="12" height="12" rx="3.2" fill="#fff"/>
    <rect x="9.6" y="47.6" width="6.8" height="6.8" rx="1.7" fill="url(#mqTile)"/>
    <rect x="11.3" y="49.3" width="3.4" height="3.4" rx="0.9" fill="#fff"/>
  </g>

  <!-- Бяло сърце -->
  <path fill="#fff" transform="translate(15.92 16.92) scale(1.34)"
        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.49 4.04 3 5.5l7 7Z"/>

  <!-- Медицински кръст като негативно пространство (показва плочката) -->
  <g fill="url(#mqTile)">
    <rect x="29.6" y="23.5" width="4.8" height="15" rx="2.4"/>
    <rect x="24.5" y="28.6" width="15" height="4.8" rx="2.4"/>
  </g>
</svg>
