# fail2ban филтър + jail за MedQR.
# Приложението вече има заключване на ниво акаунт; това добавя защита на ниво IP
# срещу разпределени опити и сканиране.
#
# Инсталация:
#   1. Сложете секцията [Definition] в /etc/fail2ban/filter.d/medqr.conf
#   2. Сложете секцията [medqr] в /etc/fail2ban/jail.d/medqr.local
#   3. logpath трябва да съвпада с access лога и формата на reverse proxy-то.
#   4. systemctl restart fail2ban && fail2ban-client status medqr

# ---------------- filter.d/medqr.conf ----------------
[Definition]
# Работи и с Caddy JSON лог (по подразбиране), и с nginx/Caddy combined текст:
# хваща 401/429 по чувствителните пътища. За JSON — полетата "remote_ip",
# "uri" и "status"; за combined — класическия ред.
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/(login|2fa|forgot|reset|webauthn|e/[^"?]*)[^"]*".*"status":(401|429)
            ^<HOST> .* "(POST|GET) /(login|2fa|forgot|reset|webauthn|e/[^ ]*) HTTP/[^"]+" (401|429)
ignoreregex =
# Caddy JSON ползва Unix timestamp в полето "ts".
datepattern = "ts":{Epoch}

# ---------------- jail.d/medqr.local ----------------
[medqr]
enabled  = true
port     = http,https
filter   = medqr
# Caddy (препоръчан): /var/log/caddy/medqr.log (format json).
# nginx: /var/log/nginx/access.log (log_format combined).
logpath  = /var/log/caddy/medqr.log
maxretry = 10
findtime = 10m
bantime  = 1h
