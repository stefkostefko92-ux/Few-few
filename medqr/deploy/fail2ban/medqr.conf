# fail2ban филтър + jail за MedQR.
# Приложението вече има заключване на ниво акаунт; това добавя защита на ниво IP
# срещу разпределени опити и сканиране.
#
# Инсталация:
#   1. Сложете секцията [Definition] в /etc/fail2ban/filter.d/medqr.conf
#   2. Сложете секцията [medqr] в /etc/fail2ban/jail.d/medqr.local
#   3. Логовете на reverse proxy (Caddy/nginx) трябва да съдържат пътя и статуса.

# ---------------- filter.d/medqr.conf ----------------
[Definition]
# Хваща 401/429 по чувствителните пътища от access лога на reverse proxy-то.
failregex = ^<HOST> .* "(POST|GET) /(login|2fa|forgot|reset|e/[^ ]*) HTTP/[^"]+" (401|429)
ignoreregex =

# ---------------- jail.d/medqr.local ----------------
# [medqr]
# enabled  = true
# port     = http,https
# filter   = medqr
# logpath  = /var/log/caddy/medqr.log
# maxretry = 10
# findtime = 10m
# bantime  = 1h
