# Резервен път: ако `Karakochev.xcodeproj` се повреди (или искаш да го
# генерираш наново), инсталирай XcodeGen и пусни `xcodegen generate` тук.
# Проектът в репото е равностоен на този манифест — XcodeGen НЕ е задължителен
# за ежедневната работа.
name: Karakochev
options:
  bundleIdPrefix: eu.carbonstealth
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Karakochev:
    type: application
    platform: iOS
    sources:
      - path: Karakochev
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: eu.carbonstealth.karakochev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        # Попълни отбора си (Xcode → Signing & Capabilities), за да пуснеш на телефон.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
