<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="../src/shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><defs><radialGradient id="tbm-pop-glow" cx="16" cy="14" r="17" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#27e08a" stop-opacity=".34"/><stop offset="1" stop-color="#27e08a" stop-opacity="0"/></radialGradient><linearGradient id="tbm-pop-blade" x1="12.8" y1="0" x2="19.2" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cdd6dc"/><stop offset=".47" stop-color="#fff"/><stop offset=".5" stop-color="#7f8a94"/><stop offset="1" stop-color="#b6c0c8"/></linearGradient><linearGradient id="tbm-pop-brass" x1="0" y1="17.4" x2="0" y2="20.6" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".55" stop-color="#e2b246"/><stop offset="1" stop-color="#9a6a1a"/></linearGradient><linearGradient id="tbm-pop-grip" x1="14.4" y1="0" x2="17.6" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4b3223"/><stop offset=".45" stop-color="#a77852"/><stop offset="1" stop-color="#3a271b"/></linearGradient><radialGradient id="tbm-pop-gem" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#d9ffec"/><stop offset=".35" stop-color="#27e08a"/><stop offset="1" stop-color="#087a49"/></radialGradient></defs><rect x=".6" y=".6" width="30.8" height="30.8" rx="8" fill="#0a0b0d" stroke="#27e08a" stroke-opacity=".7" stroke-width="1.1"/><rect x=".6" y=".6" width="30.8" height="30.8" rx="8" fill="url(#tbm-pop-glow)"/><g><path d="M16 2.3 L19.2 8 V17.6 H12.8 V8 Z" fill="url(#tbm-pop-blade)"/><path d="M16 5.2 V15.8" stroke="#56626c" stroke-width=".6" stroke-opacity=".75" stroke-linecap="round"/><rect x="4.6" y="17.4" width="22.8" height="3.2" rx="1.6" fill="url(#tbm-pop-brass)"/><rect x="4.6" y="19.6" width="22.8" height="1" rx=".5" fill="#4a2f06" opacity=".45"/><rect x="14.4" y="20.4" width="3.2" height="5" rx=".8" fill="url(#tbm-pop-grip)"/><path d="M14.4 22.1 L17.6 21.2 M14.4 23.7 L17.6 22.8 M14.4 25.3 L17.6 24.4" stroke="#1d1109" stroke-width=".6" opacity=".85"/><circle cx="16" cy="27" r="2.9" fill="#e2b246"/><circle cx="16" cy="27" r="2.1" fill="url(#tbm-pop-gem)"/><circle cx="15.3" cy="26.3" r=".55" fill="#fff" opacity=".9"/></g></svg>
    <h1 data-i18n="extName">Tanoth Master Bot</h1>
  </header>

  <div id="no-game" class="banner callout hidden" role="status" data-i18n="popupNoGame">
    Open Tanoth in a tab to control the bot.
  </div>

  <section class="status-card">
    <div class="status-row">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <span id="status-text" role="status" data-i18n="uiIdle">Idle</span>
    </div>
    <div class="char" id="char"></div>
    <div class="license" id="license"></div>
  </section>

  <div class="controls">
    <button id="btn-start" class="btn start" data-i18n="uiStart">Start</button>
    <button id="btn-pause" class="btn pause" data-i18n="uiPause">Pause</button>
    <button id="btn-stop" class="btn stop" data-i18n="uiStop">Stop</button>
  </div>

  <section id="subscribe" class="subscribe hidden">
    <p class="warn callout" data-i18n="legalBanWarning"></p>
    <div class="plans">
      <button id="pay-monthly" class="btn pay">€<span id="price-m">4</span> / <span data-i18n="uiMonth">month</span></button>
      <button id="pay-lifetime" class="btn pay alt">€<span id="price-l">20</span> <span data-i18n="uiLifetime">lifetime</span></button>
    </div>
    <div class="pay-note" data-i18n="uiRevolutNote">Pay via Revolut, then paste your key below</div>
    <label class="consent"><input type="checkbox" id="consent"> <span data-i18n="legalConsent"></span></label>
    <input id="key" class="key" data-i18n-ph="uiKeyPlaceholder" placeholder="License key">
    <button id="btn-activate" class="btn activate" data-i18n="uiActivate">Activate</button>
    <div id="pay-msg" class="pay-msg"></div>
    <div class="legal"><span id="merchant"></span> · <button type="button" class="linkbtn inline" id="open-terms" data-i18n="legalTerms"></button> · <button type="button" class="linkbtn inline" id="open-privacy" data-i18n="legalPrivacy"></button></div>
  </section>

  <section class="stats" id="stats"></section>

  <footer>
    <button type="button" class="linkbtn" id="open-options" data-i18n="uiOptions">Settings</button>
    <button type="button" class="linkbtn" id="open-stats" data-i18n="uiStats">Stats</button>
    <button type="button" class="linkbtn" id="show-panel" data-i18n="popupShowPanel">Show panel</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
