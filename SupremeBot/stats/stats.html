<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Tanoth Master Bot - Statistics</title>
  <link rel="stylesheet" href="../src/shared/ui.css">
  <link rel="stylesheet" href="stats.css">
</head>
<body>
  <header>
    <svg class="mark" viewBox="0 0 28 28" aria-hidden="true" focusable="false"><rect class="m-tile" x=".75" y=".75" width="26.5" height="26.5" rx="7" stroke-width="1.5"/><path class="m-blade" d="M14 3.6l2.4 2.9v9.6h-4.8V6.5z"/><path class="m-guard" d="M8.8 16.9h10.4M14 16.9v4.6" stroke-width="2.2" stroke-linecap="round" fill="none"/><circle class="m-blade" cx="14" cy="23.6" r="1.4"/></svg>
    <h1 data-i18n="statsTitle">Statistics</h1>
    <button id="reset" data-i18n="statsReset">Reset</button>
  </header>

  <section class="since" id="since"></section>

  <section class="cards" id="cards"></section>

  <section class="chart-card">
    <h2 data-i18n="statsChart">Activity breakdown</h2>
    <div id="chart"></div>
  </section>

  <script type="module" src="stats.js"></script>
</body>
</html>
