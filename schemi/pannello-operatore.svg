<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" font-family="Arial, Helvetica, sans-serif">
  <style>
    .panel{fill:#cdd3da;stroke:#333;stroke-width:2}
    .comp{fill:#fff;stroke:#222;stroke-width:1.5}
    .lbl{font-size:13px;fill:#111}
    .lblb{font-size:14px;fill:#111;font-weight:bold}
    .note{font-size:11px;fill:#333}
    .title{font-size:18px;font-weight:bold;fill:#111}
    .red{fill:#c0392b;stroke:#7b241c;stroke-width:2}
    .grn{fill:#27ae60;stroke:#1e8449;stroke-width:2}
    .blk{fill:#2c3e50;stroke:#1b2631;stroke-width:2}
    .yel{fill:#f1c40f;stroke:#b7950b;stroke-width:2}
    .screen{fill:#0b1020;stroke:#111;stroke-width:3}
    .scrtx{fill:#e8edf7;font-size:12px} .scrmut{fill:#8b96ad;font-size:10px}
  </style>

  <rect x="8" y="8" width="1107" height="778" fill="none" stroke="#111" stroke-width="2"/>
  <text x="30" y="40" class="title">PANNELLO OPERATORE — stazione di manovra in locale macchina + HMI touch</text>
  <text x="30" y="60" class="note">Comandi di ispezione (uomo presente) e HMI touch di diagnostica. La sicurezza resta cablata; l'HMI è in sola lettura.</text>

  <!-- pannello fisico ispezione -->
  <rect x="40" y="90" width="430" height="500" rx="10" class="panel"/>
  <text x="60" y="120" class="lblb">STAZIONE DI ISPEZIONE / REVISIONE</text>

  <!-- selettore NORMALE/ISPEZIONE -->
  <circle cx="110" cy="180" r="26" class="comp"/>
  <line x1="110" y1="180" x2="128" y2="165" stroke="#111" stroke-width="4"/>
  <text x="78" y="220" class="lbl">-S-REV</text>
  <text x="60" y="235" class="note">NORMALE ⟷ ISPEZIONE</text>

  <!-- fungo emergenza -->
  <circle cx="250" cy="180" r="30" class="red"/>
  <circle cx="250" cy="180" r="14" fill="#e74c3c"/>
  <text x="210" y="230" class="lbl">-S1 ARRESTO</text>
  <text x="212" y="245" class="note">(apertura positiva)</text>

  <!-- selettore luce vano -->
  <rect x="360" y="158" width="70" height="44" class="comp"/>
  <text x="370" y="185" class="lbl">LUCE</text>
  <text x="370" y="218" class="note">illum. vano</text>

  <!-- pulsanti salita/discesa/comune -->
  <circle cx="110" cy="320" r="28" class="grn"/>
  <text x="98" y="326" fill="#fff" font-size="20" font-weight="bold">▲</text>
  <text x="80" y="368" class="lbl">-SB-REVU SALITA</text>

  <circle cx="250" cy="320" r="28" class="blk"/>
  <text x="234" y="328" fill="#fff" font-size="18" font-weight="bold">COM</text>
  <text x="210" y="368" class="lbl">COMUNE (uomo presente)</text>

  <circle cx="390" cy="320" r="28" class="grn"/>
  <text x="378" y="326" fill="#fff" font-size="20" font-weight="bold">▼</text>
  <text x="355" y="368" class="lbl">-SB-REVD DISCESA</text>

  <!-- spie -->
  <circle cx="110" cy="440" r="14" class="yel"/><text x="135" y="445" class="lbl">Fuori servizio (-H-OOS)</text>
  <circle cx="110" cy="480" r="14" class="grn"/><text x="135" y="485" class="lbl">In servizio</text>
  <circle cx="110" cy="520" r="14" class="red"/><text x="135" y="525" class="lbl">Allarme / guasto</text>

  <text x="60" y="565" class="note">Comandi attivi solo con selettore in ISPEZIONE; salita/discesa a uomo presente,</text>
  <text x="60" y="580" class="note">bassa velocità, richiedono COMUNE premuto. Vedi PRG_*.st stato ST_REVISIONE.</text>

  <!-- HMI touch -->
  <rect x="520" y="90" width="560" height="500" rx="14" fill="#1a1f2e" stroke="#111" stroke-width="3"/>
  <text x="540" y="120" fill="#e8edf7" font-size="14" font-weight="bold">HMI TOUCH (tablet / Siemens KTP700 / pagina ESP32)</text>

  <!-- schermo -->
  <rect x="545" y="135" width="510" height="430" class="screen"/>
  <!-- header -->
  <rect x="545" y="135" width="510" height="40" fill="#131a2e"/>
  <text x="558" y="160" class="scrtx" font-weight="bold">🛗 HMI Quadro di manovra</text>
  <rect x="940" y="144" width="60" height="22" rx="11" fill="#123a23"/>
  <text x="952" y="159" fill="#2ecc71" font-size="11">ONLINE</text>
  <rect x="1005" y="144" width="44" height="22" rx="11" fill="#1c2746"/>
  <text x="1012" y="159" fill="#8b96ad" font-size="11">GEARED</text>
  <!-- tabs -->
  <text x="560" y="195" class="scrtx" font-weight="bold">STATO</text>
  <text x="640" y="195" class="scrmut">I/O</text>
  <text x="700" y="195" class="scrmut">ALLARMI</text>
  <text x="800" y="195" class="scrmut">MANUTENZIONE</text>
  <line x1="545" y1="205" x2="1055" y2="205" stroke="#26314f"/>

  <!-- piano grande + frecce + stato -->
  <text x="575" y="285" fill="#e8edf7" font-size="72" font-weight="800">3</text>
  <text x="650" y="265" fill="#3a86ff" font-size="40">▲</text>
  <text x="650" y="305" fill="#33405f" font-size="40">▼</text>
  <text x="900" y="245" class="scrmut">STATO</text>
  <text x="900" y="275" fill="#e8edf7" font-size="22" font-weight="bold">MARCIA</text>

  <!-- cards -->
  <g>
    <rect x="560" y="330" width="150" height="80" rx="10" fill="#131a2e" stroke="#26314f"/>
    <text x="575" y="355" class="scrmut">PORTE</text><text x="575" y="390" class="scrtx" font-size="24" font-weight="bold">CHIUSE</text>
    <rect x="725" y="330" width="150" height="80" rx="10" fill="#131a2e" stroke="#26314f"/>
    <text x="740" y="355" class="scrmut">VELOCITÀ</text><text x="740" y="390" class="scrtx" font-size="24" font-weight="bold">1.00 m/s</text>
    <rect x="890" y="330" width="150" height="80" rx="10" fill="#131a2e" stroke="#26314f"/>
    <text x="905" y="355" class="scrmut">CORRENTE</text><text x="905" y="390" class="scrtx" font-size="24" font-weight="bold">6.2 A</text>
  </g>
  <!-- io leds -->
  <g>
    <circle cx="575" cy="450" r="6" fill="#2ecc71"/><text x="590" y="455" class="scrtx">Catena sicurezza</text>
    <circle cx="575" cy="478" r="6" fill="#2ecc71"/><text x="590" y="483" class="scrtx">Zona porta</text>
    <circle cx="775" cy="450" r="6" fill="#2ecc71"/><text x="790" y="455" class="scrtx">KM salita</text>
    <circle cx="775" cy="478" r="6" fill="#2ecc71"/><text x="790" y="483" class="scrtx">Alta velocità</text>
    <circle cx="575" cy="506" r="6" fill="#33405f"/><text x="590" y="511" class="scrtx">Sovraccarico</text>
    <circle cx="775" cy="506" r="6" fill="#33405f"/><text x="790" y="511" class="scrtx">Fuori servizio</text>
  </g>
  <text x="558" y="548" class="scrmut">Sola lettura · dati da /api/hmi (Modbus→PLC) · sicurezza cablata indipendente</text>

  <!-- cartiglio -->
  <rect x="640" y="610" width="440" height="120" class="comp"/>
  <line x1="640" y1="646" x2="1080" y2="646" stroke="#111"/>
  <line x1="640" y1="682" x2="1080" y2="682" stroke="#111"/>
  <line x1="880" y1="610" x2="880" y2="730" stroke="#111"/>
  <text x="650" y="632" class="lblb">Pannello operatore + HMI</text>
  <text x="650" y="668" class="note">Stazione ispezione (uomo presente) e HMI diagnostica</text>
  <text x="650" y="704" class="note">geared / idraulico · sola lettura HMI</text>
  <text x="890" y="632" class="note">Foglio 6/6</text>
  <text x="890" y="668" class="note">Rev. A</text>
</svg>
