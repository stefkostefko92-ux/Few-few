# nginx за Ospedali Trasparenti. TLS сертификатите се управляват с certbot.
# Приложението (нула зависимости, node:http) слуша на 127.0.0.1:8788.

# Пренасочване на HTTP към HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name ospedalitrasparenti.it www.ospedalitrasparenti.it;
    location / { return 308 https://ospedalitrasparenti.it$request_uri; }
}

# www → без www (каноничен хост).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ospedalitrasparenti.it;

    ssl_certificate     /etc/letsencrypt/live/ospedalitrasparenti.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ospedalitrasparenti.it/privkey.pem;
    return 308 https://ospedalitrasparenti.it$request_uri;
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1 на сървъра;
    # новият `http2 on;` дава „unknown directive" при по-стар nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ospedalitrasparenti.it;

    ssl_certificate     /etc/letsencrypt/live/ospedalitrasparenti.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ospedalitrasparenti.it/privkey.pem;

    # Само модерни протоколи и шифри.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ВАЖНО: презапис (не append) — сервизът чете първата стойност на
        # X-Forwarded-For за дневния анонимен хеш и за rate-limit на /admin.
        # $proxy_add_x_forwarded_for би допуснал клиентът да подправи веригата.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
