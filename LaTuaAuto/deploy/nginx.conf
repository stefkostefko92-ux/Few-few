# /etc/nginx/sites-available/latuaauto — TLS през certbot (Let's Encrypt).
# Порт 3300 е локалният compose порт; сверù със `ss -tlnp` преди деплой.
server {
    listen 80;
    server_name latuaauto.carbonstealth.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name latuaauto.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/latuaauto.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/latuaauto.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
