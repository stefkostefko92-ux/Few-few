<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dice renderer — demo</title>
    <style>
      body { margin: 0; background: #0b0e0d; color: #e8e2d2; font-family: system-ui, sans-serif; padding: 24px; }
      h2 { font-weight: 600; margin: 28px 0 10px; font-size: 15px; letter-spacing: .04em; color: #d9b25f; }
      .cap { font-size: 12px; color: #9fb3a8; margin: 6px 0 0; }
      .tray { width: 420px; max-width: 92vw; padding: 20px; border-radius: 18px;
        background: radial-gradient(120% 100% at 50% 0%, #1a4030, #0c2c1f);
        box-shadow: inset 0 0 60px rgba(0,0,0,.5), 0 10px 30px -10px rgba(0,0,0,.6); }
      .ab { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
      /* flat CSS die (the "before") */
      .row { display: flex; gap: 10px; justify-content: center; }
      .die { width: 60px; height: 60px; border-radius: 12px; background: #f4f1e8;
        display: grid; grid-template-columns: repeat(3,1fr); padding: 8px; box-sizing: border-box; }
      .die i { display: block; align-self: center; justify-self: center; width: 11px; height: 11px;
        border-radius: 50%; background: #15171a; }
      .die i.off { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/features/game/dice/diceDemo.ts"></script>
  </body>
</html>
