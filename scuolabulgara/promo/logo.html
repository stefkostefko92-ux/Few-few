<!doctype html>
<!-- Логото на Qui Bulgaria, избродирано с кръстат бод — като снимка на истинско платно.
     Рендира го logo.mjs: страницата рисува всичко веднъж и казва window.__ready.
     Логото е само 270×235 px, затова се чете клетка по клетка: покритие и цвят на всяка
     клетка → цял бод, полубод по ръба (по посоката на ръба) или нищо. Конецът е нарисуван
     от две нишки с усукване, светлина отгоре вляво, сянка върху плата; платът е канава
     Аида с дупки точно там, където влиза иглата. Накрая — лек наклон, дълбочина на
     рязкост, винетка и зърно, като на снимка. -->
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Qui Bulgaria — бродерия</title>
<style>
  html, body { margin: 0; width: var(--out); height: var(--out); overflow: hidden; background: #2a2420; }
  #stage { position: absolute; inset: 0; perspective: 2600px; overflow: hidden; }
  #tilt { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
  #tilt canvas { position: absolute; left: 0; top: 0; }
  #blur { filter: blur(var(--dof)); }
  #vignette, #grain { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse 75% 70% at 46% 44%, rgba(0,0,0,0) 55%, rgba(30,18,8,.38) 100%); mix-blend-mode: multiply; }
</style>
</head>
<body>
<div id="stage"><div id="tilt"></div></div>
<div id="vignette"></div>
<canvas id="grain"></canvas>
<script>
/*__DATA__*/
const OUT = CFG.out, SS = 2, W = Math.round(OUT * 1.16 * SS); // платното е по-голямо от кадъра: наклонът не показва ръбовете
document.documentElement.style.setProperty("--out", OUT + "px");
document.documentElement.style.setProperty("--dof", (OUT / 900).toFixed(2) + "px");

// ---- детерминиран шум --------------------------------------------------------
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(20141014);
const rnd = (a, b) => a + (b - a) * R();
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const rgb = (c, k = 0, to = 0) => `rgb(${c.map((v) => Math.round(v + (to - v) * k)).join(",")})`;
const rgba = (c, a) => `rgba(${c.map(Math.round).join(",")},${a})`;
const shift = (c, f) => c.map((v) => clamp(v * f, 0, 255));

// ---- 1. логото → клетки ------------------------------------------------------
function readLogo(im) {
  const w = im.naturalWidth, h = im.naturalHeight;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(im, 0, 0);
  const px = x.getImageData(0, 0, w, h).data;
  const row = (y) => { let n = 0; for (let i = 0; i < w; i++) if (px[(y * w + i) * 4 + 3] > 40) n++; return n; };
  // подписът „centro linguistico e culturale“ е тънка гъста ивица най-отдолу; опашката на „g“
  // слиза почти до нея, затова режем на най-празния ред в долната петина, ако е почти празен
  let top = 0, bottom = h - 1;
  while (top < h && row(top) === 0) top++;
  while (bottom > 0 && row(bottom) === 0) bottom--;
  let cut = h, min = Infinity, peak = 0;
  for (let y = top; y <= bottom; y++) peak = Math.max(peak, row(y));
  for (let y = Math.round(bottom - (bottom - top) * 0.2); y < bottom - 3; y++) if (row(y) < min) { min = row(y); cut = y; }
  if (min > peak * 0.15) cut = h;
  let x0 = w, x1 = 0, y0 = h, y1 = 0;
  for (let yy = 0; yy < cut; yy++) for (let xx = 0; xx < w; xx++) if (px[(yy * w + xx) * 4 + 3] > 40) {
    x0 = Math.min(x0, xx); x1 = Math.max(x1, xx); y0 = Math.min(y0, yy); y1 = Math.max(y1, yy);
  }
  return { x0, y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

function cells(im, box, N) {
  const M = Math.round((box.h / box.w) * N), K = 8;
  const c = document.createElement("canvas"); c.width = N * K; c.height = M * K;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.imageSmoothingQuality = "high";
  x.drawImage(im, box.x0, box.y0, box.w, box.h, 0, 0, N * K, M * K);
  const px = x.getImageData(0, 0, N * K, M * K).data;
  const out = [];
  for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) {
    let a = 0, r = 0, g = 0, b = 0;
    const q = [0, 0, 0, 0];
    for (let yy = 0; yy < K; yy++) for (let xx = 0; xx < K; xx++) {
      const o = ((j * K + yy) * N * K + i * K + xx) * 4, al = px[o + 3] / 255;
      a += al; r += px[o] * al; g += px[o + 1] * al; b += px[o + 2] * al;
      q[(yy < K / 2 ? 0 : 2) + (xx < K / 2 ? 0 : 1)] += al;
    }
    const cov = a / (K * K);
    out.push({ i, j, cov, q: q.map((v) => v / (K * K / 4)), col: a ? [r / a, g / a, b / a] : [0, 0, 0] });
  }
  return { N, M, list: out, at: (i, j) => (i < 0 || j < 0 || i >= N || j >= M ? null : out[j * N + i]) };
}

// Конците: цветовете на логото (k-средни от плътните клетки), като истински мулине
function palette(grid) {
  const solid = grid.list.filter((c) => c.cov > 0.6);
  const lum = (c) => 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2];
  let centers = [
    solid.reduce((m, c) => (lum(c.col) < lum(m.col) ? c : m)).col,        // черно
    solid.reduce((m, c) => (c.col[1] - c.col[0] > m.col[1] - m.col[0] ? c : m)).col, // лимоненозелено
    solid.reduce((m, c) => (c.col[0] - c.col[1] > m.col[0] - m.col[1] ? c : m)).col, // червено
  ];
  for (let it = 0; it < 12; it++) {
    const sum = centers.map(() => [0, 0, 0, 0]);
    for (const c of solid) { const k = nearest(centers, c.col); sum[k][0] += c.col[0]; sum[k][1] += c.col[1]; sum[k][2] += c.col[2]; sum[k][3]++; }
    centers = sum.map((s, k) => (s[3] ? [s[0] / s[3], s[1] / s[3], s[2] / s[3]] : centers[k]));
  }
  // мулинето не е мастило: черното е въглено, наситените цветове — малко по-меки
  return centers.map((c, k) => (k === 0 ? [30, 27, 28] : c.map((v) => v * 0.94 + 6)));
}
function nearest(cs, c) {
  let best = 0, d = Infinity;
  cs.forEach((p, k) => { const e = (p[0] - c[0]) ** 2 * 2 + (p[1] - c[1]) ** 2 * 4 + (p[2] - c[2]) ** 2 * 3; if (e < d) { d = e; best = k; } });
  return best;
}

// ---- 2. платното: канава Аида -------------------------------------------------
function fabric(ctx, s, ox, oy) {
  const base = [236, 228, 212];
  ctx.fillStyle = rgb(base);
  ctx.fillRect(0, 0, W, W);
  // неравномерно избелване на лена
  for (let k = 0; k < 260; k++) {
    const x = rnd(0, W), y = rnd(0, W), r = rnd(W * 0.04, W * 0.18), light = R() < 0.5;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, light ? "rgba(255,252,244,.05)" : "rgba(120,92,60,.045)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  // тъканта: във всяка клетка — снопче нишки напряко, издуто към средата; дупка в ъгъла
  const n = Math.ceil(W / s) + 2;
  for (let j = -1; j < n; j++) for (let i = -1; i < n; i++) {
    const x = ox + i * s, y = oy + j * s, v = rnd(-0.035, 0.035);
    const horiz = (i + j) % 2 === 0;
    const g = horiz ? ctx.createLinearGradient(x, y, x, y + s) : ctx.createLinearGradient(x, y, x + s, y);
    g.addColorStop(0, rgba(shift(base, 0.86 + v), 1));
    g.addColorStop(0.35, rgba(shift(base, 1.05 + v), 1));
    g.addColorStop(0.65, rgba(shift(base, 1.02 + v), 1));
    g.addColorStop(1, rgba(shift(base, 0.84 + v), 1));
    ctx.fillStyle = g;
    const p = s * 0.1;
    roundRect(ctx, x + p, y + p, s - 2 * p, s - 2 * p, s * 0.22); ctx.fill();
    // нишките в снопчето
    ctx.strokeStyle = "rgba(120,95,65,.13)"; ctx.lineWidth = s * 0.035;
    for (let k = 1; k < 4; k++) {
      ctx.beginPath();
      if (horiz) { ctx.moveTo(x + p * 1.5, y + (k * s) / 4 + rnd(-1, 1)); ctx.lineTo(x + s - p * 1.5, y + (k * s) / 4 + rnd(-1, 1)); }
      else { ctx.moveTo(x + (k * s) / 4 + rnd(-1, 1), y + p * 1.5); ctx.lineTo(x + (k * s) / 4 + rnd(-1, 1), y + s - p * 1.5); }
      ctx.stroke();
    }
  }
  // дупките: там влиза иглата
  for (let j = -1; j < n; j++) for (let i = -1; i < n; i++) {
    const x = ox + i * s, y = oy + j * s, r = s * rnd(0.12, 0.16);
    const g = ctx.createRadialGradient(x + r * 0.2, y + r * 0.25, 0, x, y, r * 1.6);
    g.addColorStop(0, "rgba(60,40,24,.62)"); g.addColorStop(0.55, "rgba(90,66,42,.35)"); g.addColorStop(1, "rgba(90,66,42,0)");
    ctx.fillStyle = g; ctx.fillRect(x - r * 1.6, y - r * 1.6, r * 3.2, r * 3.2);
  }
  // мъх от влакна
  ctx.lineWidth = Math.max(0.6, s * 0.025);
  for (let k = 0; k < (W * W) / 900; k++) {
    const x = rnd(0, W), y = rnd(0, W), a = rnd(0, Math.PI), L = rnd(s * 0.15, s * 0.6);
    ctx.strokeStyle = R() < 0.5 ? "rgba(255,250,240,.16)" : "rgba(110,84,56,.1)";
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a + 0.6) * L * 0.5, y + Math.sin(a + 0.6) * L * 0.5, x + Math.cos(a) * L, y + Math.sin(a) * L); ctx.stroke();
  }
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---- 3. конецът ---------------------------------------------------------------
// Един крак от дупка до дупка: вретено, стеснено там, където влиза в плата; две нишки
// (жлеб по средата), всяка усукана (наклонени отблясъци), светлина отгоре вляво.
const LIGHT = [-Math.SQRT1_2, -Math.SQRT1_2];
function legPath(ctx, L, hw) {
  // вретено: пълно по средата, стиснато там, където влиза в дупката
  const a = L / 2, k = L * 0.13;
  ctx.beginPath();
  ctx.moveTo(-a, 0);
  ctx.bezierCurveTo(-a + k, -hw * 1.33, a - k, -hw * 1.33, a, 0);
  ctx.bezierCurveTo(a - k, hw * 1.33, -a + k, hw * 1.33, -a, 0);
  ctx.closePath();
}
function leg(ctx, x0, y0, x1, y1, s, col, seed) {
  const r = rng(seed);
  const mx = (x0 + x1) / 2 + (r() - 0.5) * s * 0.05, my = (y0 + y1) / 2 + (r() - 0.5) * s * 0.05;
  const ang = Math.atan2(y1 - y0, x1 - x0) + (r() - 0.5) * 0.05;
  const L = Math.hypot(x1 - x0, y1 - y0) * (0.96 + r() * 0.04), hw = s * (0.29 + r() * 0.025);
  const c = shift(col, 0.95 + r() * 0.1), dark = 1 - clamp((0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]) / 120); // 1 = черно
  // коя страна гледа към светлината
  const nx = -Math.sin(ang), ny = Math.cos(ang), lit = nx * LIGHT[0] + ny * LIGHT[1] > 0 ? 1 : -1;
  ctx.save();
  ctx.translate(mx, my); ctx.rotate(ang);
  legPath(ctx, L, hw);
  const g = ctx.createLinearGradient(0, -hw * lit, 0, hw * lit);
  g.addColorStop(0, rgb(c, 0.3 - 0.14 * dark, 255)); g.addColorStop(0.3, rgb(c, 0.1 - 0.05 * dark, 255)); g.addColorStop(0.55, rgb(c));
  g.addColorStop(0.85, rgb(c, 0.38, 0)); g.addColorStop(1, rgb(c, 0.6, 0));
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  // двете нишки: жлеб между тях, леко вълнист
  ctx.lineCap = "round";
  ctx.strokeStyle = rgba(shift(c, 0.45), 0.55); ctx.lineWidth = s * 0.045;
  ctx.beginPath();
  for (let t = -L / 2; t <= L / 2; t += L / 12) { const yy = Math.sin(t / s * 7 + seed) * s * 0.025; t === -L / 2 ? ctx.moveTo(t, yy) : ctx.lineTo(t, yy); }
  ctx.stroke();
  // усукването: наклонени светли и тъмни ивици по всяка нишка
  const step = s * 0.115, tilt = hw * 0.75;
  for (const side of [-1, 1]) {
    const yA = side * hw * 0.05, yB = side * hw * 1.05;
    for (let t = -L / 2 - step + (seed % 7) * 0.01 * s; t < L / 2 + step; t += step) {
      ctx.strokeStyle = rgba(c.map((v) => v + (255 - v) * 0.55), (side === -lit ? 0.28 : 0.17) * (1 - 0.45 * dark));
      ctx.lineWidth = s * 0.034;
      ctx.beginPath(); ctx.moveTo(t - tilt * 0.5, yB); ctx.quadraticCurveTo(t, (yA + yB) / 2 - side * hw * 0.08, t + tilt * 0.5, yA); ctx.stroke();
      ctx.strokeStyle = rgba(shift(c, 0.35), 0.3);
      ctx.lineWidth = s * 0.03;
      ctx.beginPath(); ctx.moveTo(t - tilt * 0.5 + step * 0.48, yB); ctx.quadraticCurveTo(t + step * 0.48, (yA + yB) / 2 - side * hw * 0.08, t + tilt * 0.5 + step * 0.48, yA); ctx.stroke();
    }
  }
  // отблясъкът на копринения гланц — по осветената страна
  const sh = ctx.createLinearGradient(-L / 2, 0, L / 2, 0);
  sh.addColorStop(0, "rgba(255,255,255,0)"); sh.addColorStop(0.3, "rgba(255,255,255,.2)"); sh.addColorStop(0.55, "rgba(255,255,255,.28)"); sh.addColorStop(1, "rgba(255,255,255,0)");
  ctx.strokeStyle = sh; ctx.lineWidth = s * 0.05;
  ctx.beginPath(); ctx.moveTo(-L * 0.36, -lit * hw * 0.45); ctx.quadraticCurveTo(0, -lit * hw * 0.62, L * 0.36, -lit * hw * 0.45); ctx.stroke();
  // краищата потъват в дупките
  const e = ctx.createLinearGradient(-L / 2, 0, L / 2, 0);
  e.addColorStop(0, "rgba(20,10,6,.6)"); e.addColorStop(0.15, "rgba(20,10,6,0)"); e.addColorStop(0.85, "rgba(20,10,6,0)"); e.addColorStop(1, "rgba(20,10,6,.6)");
  ctx.fillStyle = e; ctx.fillRect(-L / 2, -hw * 1.5, L, hw * 3);
  ctx.restore();
  // мъх: косъмче-две, което стърчи от конеца
  ctx.lineWidth = Math.max(0.7, s * 0.018);
  for (let k = 0; k < 2; k++) {
    const t = (r() - 0.5) * L * 0.7, side = r() < 0.5 ? -1 : 1, len = s * (0.08 + r() * 0.14);
    ctx.strokeStyle = rgba(c.map((v) => v + (255 - v) * 0.4), 0.35);
    ctx.beginPath(); ctx.moveTo(t, side * hw * 0.7); ctx.quadraticCurveTo(t + len * 0.6, side * (hw + len * 0.5), t + len, side * (hw + len * 0.2)); ctx.stroke();
  }
  ctx.restore();
}
function legShadow(ctx, x0, y0, x1, y1, s) {
  const mx = (x0 + x1) / 2 + s * 0.07, my = (y0 + y1) / 2 + s * 0.11, ang = Math.atan2(y1 - y0, x1 - x0);
  ctx.save(); ctx.translate(mx, my); ctx.rotate(ang); legPath(ctx, Math.hypot(x1 - x0, y1 - y0) * 0.95, s * 0.27); ctx.fill(); ctx.restore();
}

// ---- 4. шевицата ----------------------------------------------------------------
function embroider() {
  const im = IMG;
  const box = readLogo(im);
  const grid = cells(im, box, CFG.stitches);
  const pal = palette(grid);
  const s = (W * CFG.fill) / grid.N / 1.16; // CFG.fill — делът от ширината на кадъра
  const ox = Math.round((W - grid.N * s) / 2), oy = Math.round((W - grid.M * s) / 2 + s * CFG.lift);
  const main = document.createElement("canvas"); main.width = main.height = W;
  const ctx = main.getContext("2d");
  const T = performance.now(), mark = (n) => (window.__t = (window.__t || []).concat(n + " " + Math.round(performance.now() - T)));
  fabric(ctx, s, ox % s, oy % s); mark("плат");

  // кои клетки и как: цял бод, полубод по ръба, нищо
  const stitches = [];
  for (const c of grid.list) {
    if (c.cov < 0.3) continue;
    const k = nearest(pal, c.col);
    const X = ox + c.i * s, Y = oy + c.j * s;
    if (c.cov >= 0.55) { stitches.push({ X, Y, k, full: true, seed: c.j * 1000 + c.i }); continue; }
    // полубод: кракът, който лежи по ръба. Покритие в ъгъл горе вляво или долу вдясно →
    // ръбът е „/“; горе вдясно или долу вляво → „\“.
    const [tl, tr, bl, br] = c.q;
    stitches.push({ X, Y, k, full: false, back: tr + bl > tl + br, seed: c.j * 1000 + c.i });
  }

  // сенките на конеца върху плата — меки, отдолу вдясно
  const sh = document.createElement("canvas"); sh.width = sh.height = W;
  const sx = sh.getContext("2d"); sx.fillStyle = "rgba(38,22,10,1)";
  for (const st of stitches) {
    legShadow(sx, st.X, st.Y + s, st.X + s, st.Y, s);
    if (st.full) legShadow(sx, st.X, st.Y, st.X + s, st.Y + s, s);
  }
  ctx.save(); ctx.filter = `blur(${(s * 0.12).toFixed(1)}px)`; ctx.globalAlpha = 0.5; ctx.drawImage(sh, 0, 0); ctx.restore();
  ctx.save(); ctx.filter = `blur(${(s * 0.45).toFixed(1)}px)`; ctx.globalAlpha = 0.22; ctx.drawImage(sh, s * 0.1, s * 0.15); ctx.restore();

  mark("сенки");
  const inset = s * 0.025;
  // долните крака „/“ първо, после горните „\“ — както шие ръката, всички в една посока
  for (const st of stitches) if (st.full || !st.back) leg(ctx, st.X + inset, st.Y + s - inset, st.X + s - inset, st.Y + inset, s, pal[st.k], st.seed * 7 + 1);
  // сянката на горния крак върху долния
  // (един слой, размит веднъж — филтър за всеки бод поотделно струва минути)
  sx.clearRect(0, 0, W, W);
  for (const st of stitches) if (st.full) legShadow(sx, st.X + inset, st.Y + inset, st.X + s - inset, st.Y + s - inset, s * 0.7);
  ctx.save(); ctx.globalAlpha = 0.3; ctx.filter = `blur(${(s * 0.05).toFixed(1)}px)`; ctx.drawImage(sh, 0, 0); ctx.restore();
  for (const st of stitches) if (st.full || st.back) leg(ctx, st.X + inset, st.Y + inset, st.X + s - inset, st.Y + s - inset, s, pal[st.k], st.seed * 7 + 2);

  mark("бод");
  // светлината в стаята: по-светло отгоре вляво, леки вълни на плата
  const lg = ctx.createLinearGradient(0, 0, W, W);
  lg.addColorStop(0, "rgba(255,248,235,.12)"); lg.addColorStop(0.5, "rgba(255,248,235,0)"); lg.addColorStop(1, "rgba(40,24,10,.16)");
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, W);
  for (let k = 0; k < 5; k++) {
    const y = rnd(0, W), g = ctx.createLinearGradient(0, y - W * 0.08, W * 0.2, y + W * 0.08);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.5, k % 2 ? "rgba(255,250,240,.05)" : "rgba(60,40,20,.05)"); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
  }

  // към размера на кадъра (смаляването изглажда като обектив) + рязкост/размазване
  const fin = document.createElement("canvas"); fin.width = fin.height = W / SS;
  const fx = fin.getContext("2d"); fx.imageSmoothingQuality = "high"; fx.drawImage(main, 0, 0, W / SS, W / SS);
  const size = W / SS, tilt = document.getElementById("tilt");
  tilt.style.width = tilt.style.height = size + "px";
  tilt.style.transform = `translate(-50%, -50%) rotateX(${CFG.tiltX}deg) rotateZ(${CFG.tiltZ}deg)`;
  const sharp = fin, blurred = document.createElement("canvas");
  blurred.width = blurred.height = size; blurred.getContext("2d").drawImage(fin, 0, 0);
  blurred.id = "blur";
  const m = "linear-gradient(180deg, #000 0%, rgba(0,0,0,.65) 14%, transparent 34%, transparent 66%, rgba(0,0,0,.7) 88%, #000 100%)";
  blurred.style.webkitMaskImage = m; blurred.style.maskImage = m;
  tilt.append(sharp, blurred);

  mark("кадър");
  // зърно на сензора
  const gr = document.getElementById("grain"); gr.width = gr.height = OUT;
  const gx = gr.getContext("2d"), id = gx.createImageData(OUT, OUT);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (R() - 0.5) * 60; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; }
  gx.putImageData(id, 0, 0);
  gr.style.mixBlendMode = "overlay";
  window.__stats = { t: window.__t, cells: grid.N + "×" + grid.M, stitches: stitches.length, half: stitches.filter((s) => !s.full).length, palette: pal.map((c) => rgb(c)) };
}

const IMG = new Image();
IMG.onload = () => { try { embroider(); window.__ready = true; } catch (e) { window.__error = String(e && e.stack || e); } };
IMG.onerror = () => console.error("logo");
IMG.src = CFG.logo;
</script>
