# scuolabg.carbonstealth.eu — the site's address until it moved to its own domain.
# Every request goes to www.scuolabulgaramilano.it with a 301, path included
# (bookmarks, shared links, search results). This replaces the file certbot edited
# when the domain was set up (`certbot --nginx -d scuolabg.carbonstealth.eu`), so its
# certificate stays in use and keeps renewing: certbot answers its own challenge with
# an exact-match location, which beats `location /`.
server {
    listen 80;
    listen [::]:80;
    server_name scuolabg.carbonstealth.eu;

    location / {
        return 301 https://www.scuolabulgaramilano.it$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scuolabg.carbonstealth.eu;

    ssl_certificate /etc/letsencrypt/live/scuolabg.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scuolabg.carbonstealth.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://www.scuolabulgaramilano.it$request_uri;
    }
}
