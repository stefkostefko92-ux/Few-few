# scuolabg.carbonstealth.eu → the app container (docker compose, QB_PORT=3110).
# No GeoIP module needed: without X-Country the app picks the language from the
# browser (Accept-Language). TLS: certbot --nginx -d scuolabg.carbonstealth.eu
server {
    listen 80;
    listen [::]:80;
    server_name scuolabg.carbonstealth.eu;

    client_max_body_size 15m;   # photo uploads from the admin

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
