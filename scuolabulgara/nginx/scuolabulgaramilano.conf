# Sample nginx reverse proxy for the Hetzner VPS.
# Key part: it derives the visitor's country with the GeoIP2 module and passes
# it to the app as the `X-Country` header, which powers language auto-selection.
#
# 1) Install the module:   apt install libnginx-mod-http-geoip2
# 2) Download GeoLite2-Country.mmdb (free, MaxMind account) to /etc/nginx/geoip/
# 3) Add the geoip2 block below inside the http { } context of nginx.conf
# 4) Put TLS in front with certbot (certbot --nginx -d scuolabulgaramilano.it)

# ---- inside http { } ----
# geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
#     auto_reload 60m;
#     $geoip2_country_code country iso_code;
# }

server {
    listen 80;
    server_name scuolabulgaramilano.it www.scuolabulgaramilano.it;

    # Redirect to HTTPS (managed by certbot once TLS is set up)
    # return 301 https://$host$request_uri;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Country for language auto-detection (falls back to Accept-Language).
        proxy_set_header X-Country $geoip2_country_code;
    }

    # Optional: let nginx serve uploaded media directly for speed.
    # location /uploads/ {
    #     alias /var/lib/scuolabulgaramilano/uploads/;
    #     expires 30d;
    #     access_log off;
    # }
}
