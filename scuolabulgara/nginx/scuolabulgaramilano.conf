# www.scuolabulgaramilano.it → the app container (docker compose; QB_PORT=3110 on our VPS —
# change the proxy_pass port if your .env says otherwise).
#
#   cp nginx/scuolabulgaramilano.conf /etc/nginx/sites-available/scuolabulgaramilano
#   ln -s /etc/nginx/sites-available/scuolabulgaramilano /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx --redirect -d www.scuolabulgaramilano.it -d scuolabulgaramilano.it
#
# certbot then adds the 443 lines and the http → https redirect to this file itself.
# Language: without X-Country the app picks it from the browser (Accept-Language);
# the GeoIP2 module or Cloudflare are optional (DEPLOY.md §4).

# The old WordPress site lived at this domain: its pages (Google, Facebook posts,
# bookmarks) land on the matching section instead of a 404. $uri is decoded, so the
# Bulgarian slugs are written in Cyrillic. "/" alone lets the app pick the language.
map $uri $qb_legacy {
    default                                        "";
    "~^/chi-siamo/?$"                              "/it#chi-siamo";
    "~^/corsi-di-bulgaro/?$"                       "/it#corsi";
    "~^/insegnanti-scuola-bulgara/?$"              "/it#insegnanti";
    "~^/danza-tradizionale/?$"                     "/it#danza";
    "~^/contatti/?$"                               "/it#contatti";
    "~^/bg/home-2/?$"                              "/bg";
    "~^/bg/za-nas/?$"                              "/bg#chi-siamo";
    "~^/bg/уроци-по-български/?$"                  "/bg#corsi";
    "~^/bg/нашите-учители/?$"                      "/bg#insegnanti";
    "~^/bg/народни-танци/?$"                       "/bg#danza";
    "~^/bg/contatti-2/?$"                          "/bg#contatti";
    "~^/bg/[0-9]{4}/[0-9]{2}/[0-9]{2}/училищен-"   "/bg#documenti";
    "~^/bg/[0-9]{4}/[0-9]{2}/[0-9]{2}/"            "/bg";
    "~^/[0-9]{4}/[0-9]{2}/[0-9]{2}/"               "/it";
    "~*^/wp-content/uploads/.+\.pdf$"              "/#documenti";
    "~^/(blog|feed|comments/feed|bg/feed)/?$"      "/";
}

# The bare domain → www (one address for Google; $scheme works before and after certbot).
server {
    listen 80;
    listen [::]:80;
    server_name scuolabulgaramilano.it;

    location / {
        return 301 $scheme://www.scuolabulgaramilano.it$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.scuolabulgaramilano.it;

    client_max_body_size 15m;   # photo and PDF uploads from the admin

    if ($qb_legacy) {
        return 301 $qb_legacy;
    }

    # WordPress is gone: answer the scanners here instead of waking the app.
    location ~* \.php$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
