# АСО — stack built FROM SOURCE on the host (manual deploy; no registry).
# Upload the repo (WinSCP) and run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
#
# Security: app ports + DB bind to 127.0.0.1 only — the public entrypoint is the
# host nginx (infra/nginx/aso.conf) on 443. Postgres/Redis are not published at
# all (reached over the internal compose network). Ports are env-overridable;
# marketing defaults to 8090 (8080 is often taken on shared boxes).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aso}
      POSTGRES_DB: ${POSTGRES_DB:-aso}
    volumes:
      - aso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aso}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aso_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4500
      DATABASE_URL: postgresql://${POSTGRES_USER:-aso}:${POSTGRES_PASSWORD:-aso}@postgres:5432/${POSTGRES_DB:-aso}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4502}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TOS_CONFIGURED: ${STRIPE_TOS_CONFIGURED:-false}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:4502}
      # Public origin of the API for OAuth callbacks (must match what's registered
      # with Google/Facebook). Only used when OAuth is configured. A non-empty
      # value is required — an empty string fails URL validation and blocks boot.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://gaming.carbonstealth.eu}
      WEB_BASE_PATH: ${WEB_BASE_PATH:-/app}
      # Transactional email (verify / password reset). Unset SMTP_HOST => emails
      # are logged, not sent. SMTP_PORT must stay a positive int (never empty).
      EMAIL_FROM: "${EMAIL_FROM:-АСО <no-reply@gaming.carbonstealth.eu>}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Social login (enabled only when both id + secret are set).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Discord admin notifications (enabled only when the webhook URL is set).
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_NAME: ${DISCORD_WEBHOOK_NAME:-АСО}
      # Error tracking (enabled only when a DSN is set).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret-change-me}
      # Reach the realtime node's in-memory room list (admin live-tables view).
      REALTIME_INTERNAL_URL: ${REALTIME_INTERNAL_URL:-http://realtime:4501}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4500}:4500"

  realtime:
    build:
      context: ..
      dockerfile: infra/Dockerfile.realtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REALTIME_PORT: 4501
      DATABASE_URL: postgresql://${POSTGRES_USER:-aso}:${POSTGRES_PASSWORD:-aso}@postgres:5432/${POSTGRES_DB:-aso}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4502}
      BOT_FALLBACK_SECONDS: ${BOT_FALLBACK_SECONDS:-8}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4500}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret-change-me}
    ports:
      - "127.0.0.1:${RT_HOST_PORT:-4501}:4501"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aso}:${POSTGRES_PASSWORD:-aso}@postgres:5432/${POSTGRES_DB:-aso}?schema=public
      REDIS_URL: redis://redis:6379
      SEASON_DAYS: ${SEASON_DAYS:-35}

  # Play app (Vite SPA) — static, served under /app/ by its own nginx.
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4502}:4502"

  # Public marketing/SEO layer (Next.js static export).
  marketing:
    build:
      context: ..
      dockerfile: infra/Dockerfile.marketing
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MK_HOST_PORT:-8090}:8080"

volumes:
  aso_pgdata:
  aso_redisdata:
