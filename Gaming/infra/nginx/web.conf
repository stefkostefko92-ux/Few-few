# Serves the Vite play-app SPA (inside the web container) on 4502. The app is
# built with base /app/, so the bundle lives under /app/. The edge nginx
# (aso.conf) proxies everything except /api and /socket.io here; those two are
# routed to the api/realtime services and reach the SPA same-origin.
server {
  listen 4502;
  server_name _;
  root /usr/share/nginx/html;

  # Bare root → the play app.
  location = / {
    return 302 /app/;
  }

  # SPA: serve the bundle and fall back to index.html for client-side routes.
  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  # Long-cache the immutable, content-hashed asset bundle.
  location /app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
