# АСО — edge reverse proxy for gaming.carbonstealth.eu.
# Install on the HOST nginx (the same one that serves the Pterodactyl panel —
# this is just an extra server block, selected by server_name, so the two
# coexist). HTTP-first on purpose: after installing + reloading nginx, run
#   certbot --nginx -d gaming.carbonstealth.eu
# and certbot adds the TLS (443) block + HTTP->HTTPS redirect automatically.
#
# Routing (single public domain, matches SITE.url):
#   /            -> marketing (Next.js static export, SEO layer)   :8090
#   /app/        -> web (Vite SPA, built with base /app/)          :4502
#   /api/        -> api (REST; routes are mounted under /api)      :4500
#   /webhooks/stripe -> api (raw-body Stripe route, outside /api)
#   /socket.io/  -> realtime (WebSocket)                           :4501
#   /health      -> api health probe
# Upstream ports are the host ports published by docker-compose.prod.yml; if you
# changed *_HOST_PORT in .env, update them here too.

upstream aso_api       { server 127.0.0.1:4500; }
upstream aso_realtime  { server 127.0.0.1:4501; }
upstream aso_web       { server 127.0.0.1:4502; }
upstream aso_marketing { server 127.0.0.1:8090; }

server {
  listen 80;
  listen [::]:80;
  server_name gaming.carbonstealth.eu;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # HSTS — harmless over :80, and carries into the 443 block certbot generates.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  # Content Security Policy. Tuned for a Vite SPA + Stripe + WebSockets + WebGL
  # (workers/blobs). Validate against the built app before tightening further.
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://js.stripe.com; connect-src 'self' https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; font-src 'self' data:" always;

  client_max_body_size 2m;

  # REST API — keep the /api prefix (the app mounts routes under /api).
  location /api/ {
    proxy_pass http://aso_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Correlation id for cross-service request tracing (the API echoes it).
    proxy_set_header X-Request-Id $request_id;
  }

  # Stripe webhook (raw-body route on the API, lives outside /api/).
  location = /webhooks/stripe {
    proxy_pass http://aso_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health { proxy_pass http://aso_api/health; }

  # Realtime WebSocket upgrade.
  location /socket.io/ {
    proxy_pass http://aso_realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Play app (Vite SPA, served under /app/ by its own container nginx).
  location /app/ {
    proxy_pass http://aso_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /app { return 301 /app/; }

  # Marketing / SEO layer owns the root.
  location / {
    proxy_pass http://aso_marketing;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
