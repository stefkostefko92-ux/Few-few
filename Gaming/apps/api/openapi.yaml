  # ── Админ: модерация ──────────────────────────────────────────────────────
  /api/admin/flags:
    get:
      operationId: adminFlagsList
      tags: [Админ]
      summary: Флагове за колюзия за преглед (по score, курсор).
      x-required-roles: [MODERATOR, SUPPORT, ADMIN, OWNER]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, REVIEWING, DISMISSED, CONFIRMED], default: OPEN }, description: "Непозната стойност = без филтър." }
        - { $ref: "#/components/parameters/Take" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Страница флагове.
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags: { type: array, items: { type: object, additionalProperties: true } }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/flags/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: adminFlagReview
      tags: [Админ]
      summary: Преглед на флаг (никога автоматичен бан).
      x-required-roles: [MODERATOR, ADMIN, OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [REVIEWING, DISMISSED, CONFIRMED] }
      responses:
        "200":
          description: Обновеният флаг.
          content:
            application/json:
              schema: { type: object, properties: { flag: { type: object, additionalProperties: true } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/mail:
    get:
      operationId: adminMailGet
      tags: [Админ]
      summary: Пощата на портала (Brevo SMTP) — записаното без ключа и откъде тръгват писмата сега.
      description: >-
        По модела на Rilievi Impianti. Настройката от панела (ключът — шифрован с
        SETTINGS_SECRET_KEY, AES-256-GCM) има предимство пред SMTP_* от .env, докато е включена.
      x-required-roles: [OWNER]
      responses:
        "200":
          description: Изгледът на настройката.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSettingsView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: adminMailPut
      tags: [Админ]
      summary: Записва и включва настройката на пощата (иска паролата на акаунта).
      description: >-
        Празен `password` пази записания ключ — освен при друг сървър или логин
        (`password_new_server`). В продукция `host` е име на хост (не IP, не localhost).
      x-required-roles: [OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [host, port, username, password, fromName, fromEmail, accountPassword]
              properties:
                host: { type: string, maxLength: 253, example: smtp-relay.brevo.com }
                port: { type: integer, enum: [587, 2525, 465] }
                username: { type: string, maxLength: 254, description: SMTP логинът от Brevo. }
                password: { type: string, maxLength: 512, description: "SMTP ключът; празно = остава записаният. Никога не се връща." }
                fromName: { type: string, maxLength: 80 }
                fromEmail: { type: string, format: email, maxLength: 254 }
                accountPassword: { type: string, description: Паролата на собственика (потвърждение). }
      responses:
        "200":
          description: Обновеният изглед.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSettingsView" }
        "400":
          description: "`validation_error`, `invalid_host`, `password_required` или `password_new_server`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (не е OWNER) или `wrong_password`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`settings_key_missing` — на сървъра няма SETTINGS_SECRET_KEY."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/mail/test:
    post:
      operationId: adminMailTest
      tags: [Админ]
      summary: Пробно писмо до самия собственик (verify + изпращане).
      x-required-roles: [OWNER]
      responses:
        "200":
          description: "Резултатът: `sent`, `disabled` (няма поща) или `error` със SMTP кода (EAUTH, ECONNECTION…)."
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result: { type: string, enum: [sent, disabled, error] }
                  to: { type: string, format: email }
                  code: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/mail/disable:
    post:
      operationId: adminMailDisable
      tags: [Админ]
      summary: Изключва настройката от панела (остава записана; пак важи .env).
      x-required-roles: [OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountPassword]
              properties:
                accountPassword: { type: string }
      responses:
        "200":
          description: Обновеният изглед.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSettingsView" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` или `wrong_password`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
