        content:
          application/json:
            schema:
              type: object
              properties:
                webhookUrl:
                  type: string
                  maxLength: 400
                  description: "Празно = изчиства; иначе https Discord webhook адрес (`…discord.com/api/webhooks/…`)."
                webhookName: { type: string, minLength: 1, maxLength: 80 }
                enabled: { type: boolean }
                events:
                  type: object
                  properties:
                    registration: { type: boolean }
                    purchase: { type: boolean }
                    vip: { type: boolean }
                    flag: { type: boolean }
                    adminAction: { type: boolean }
                    broadcast: { type: boolean }
      responses:
        "200":
          description: Новата конфигурация.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscordConfig" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/discord/test:
    post:
      operationId: adminDiscordTest
      tags: [Админ]
      summary: Изпраща тестово съобщение в Discord.
      x-required-roles: [ADMIN, OWNER]
      responses:
        "200":
          description: Резултат.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  enabled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/broadcast:
    post:
      operationId: adminBroadcast
      tags: [Админ]
      summary: Изпраща съобщение в Discord (не е обява в приложението).
      x-required-roles: [ADMIN, OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 1800 }
      responses:
        "200":
          description: "`sent` е false, ако Discord е изключен."
          content:
            application/json:
              schema: { type: object, properties: { sent: { type: boolean } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/products:
    get:
      operationId: adminProductsList
      tags: [Админ]
      summary: Целият каталог (активни и неактивни).
      x-required-roles: [MODERATOR, SUPPORT, ADMIN, OWNER]
      responses:
        "200":
          description: Продуктите.
          content:
            application/json:
              schema:
                type: object
                properties:
                  products: { type: array, items: { $ref: "#/components/schemas/AdminProduct" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminProductCreate
      tags: [Админ]
      summary: Добавя продукт.
      x-required-roles: [ADMIN, OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, kind, priceCents]
              properties:
                sku: { type: string, minLength: 1, maxLength: 64, pattern: "^[a-zA-Z0-9_]+$" }
                kind: { $ref: "#/components/schemas/ProductKind" }
                priceCents: { type: integer, minimum: 0, maximum: 1000000 }
                gems: { type: [integer, "null"], minimum: 0, maximum: 1000000 }
                chips: { type: [integer, "null"], minimum: 0, maximum: 1000000000 }
                cosmeticId: { type: [string, "null"], maxLength: 120 }
                active: { type: boolean }
      responses:
        "200":
          description: Създаденият продукт.
          content:
            application/json:
              schema: { type: object, properties: { product: { $ref: "#/components/schemas/AdminProduct" } } }
        "400":
          description: "`validation_error` или `sku_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: adminProductPatch
      tags: [Админ]
      summary: Променя цена/награда/активност (без hard delete — деактивирай).
      x-required-roles: [ADMIN, OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priceCents: { type: integer, minimum: 0, maximum: 1000000 }
                gems: { type: [integer, "null"], minimum: 0, maximum: 1000000 }
                chips: { type: [integer, "null"], minimum: 0, maximum: 1000000000 }
                cosmeticId: { type: [string, "null"], maxLength: 120 }
                active: { type: boolean }
      responses:
        "200":
          description: Обновеният продукт.
          content:
            application/json:
              schema: { type: object, properties: { product: { $ref: "#/components/schemas/AdminProduct" } } }
        "400":
          description: "`validation_error`, `not_found` или `noop`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: adminProductDelete
      tags: [Админ]
      summary: Изтрива продукт без покупки (иначе 409 — деактивирай го).
      x-required-roles: [ADMIN, OWNER]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`product_has_purchases`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/orders:
    get:
      operationId: adminOrdersList
      tags: [Админ]
      summary: Всички покупки със сума, платена към момента на покупката (курсор).
      x-required-roles: [MODERATOR, SUPPORT, ADMIN, OWNER]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [completed, refunded] }, description: "Непозната стойност = без филтър." }
        - { $ref: "#/components/parameters/Take" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/ItemsPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/orders/{id}/refund:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: adminOrderRefund
      tags: [Админ]
      summary: Връща еднократна покупка през Stripe; по избор взима обратно наградата (до наличното).
      description: Абонаментни фактури не се връщат оттук (портал/Stripe табло). Виртуалната валута не се взима автоматично.
      x-required-roles: [ADMIN, OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clawback: { type: boolean, description: "Взима обратно начислените камъни/чипове, не под нула." }
      responses:
        "200":
          description: Върнато.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  clawedGems: { type: integer }
                  clawedChips: { type: integer }
        "400":
          description: "`validation_error`, `not_found`, `already_refunded`, `not_refundable`, `stripe_lookup_failed`, `refund_failed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: "`stripe_not_configured`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/announcements:
    get:
      operationId: adminAnnouncementsList
      tags: [Админ]
      summary: Всички обяви (активни и неактивни, до 100).
      x-required-roles: [MODERATOR, SUPPORT, ADMIN, OWNER]
      responses:
        "200": { $ref: "#/components/responses/ItemsList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminAnnouncementCreate
      tags: [Админ]
      summary: Публикува обява за играчите.
      x-required-roles: [ADMIN, OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                body: { type: string, minLength: 1, maxLength: 2000 }
                expiresAt: { type: [string, "null"], format: date-time, description: "Трябва да е в бъдещето." }
      responses:
        "200":
          description: Създадената обява.
          content:
            application/json:
              schema: { type: object, properties: { announcement: { type: object, additionalProperties: true } } }
        "400":
          description: "`validation_error` или `expiry_past`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/announcements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: adminAnnouncementPatch
      tags: [Админ]
      summary: Активира или деактивира обява.
      x-required-roles: [ADMIN, OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200":
          description: Обновената обява.
          content:
            application/json:
              schema: { type: object, properties: { announcement: { type: object, additionalProperties: true } } }
        "400":
          description: "`validation_error` или `not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: adminAnnouncementDelete
      tags: [Админ]
      summary: Изтрива обява завинаги.
      x-required-roles: [ADMIN, OWNER]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Админ: сезони ─────────────────────────────────────────────────────────
  /api/admin/seasons:
    get:
      operationId: adminSeasonsList
      tags: [Админ]
      summary: Всички сезони (най-новите първо, до 200).
      x-required-roles: [MODERATOR, SUPPORT, ADMIN, OWNER]
      responses:
        "200": { $ref: "#/components/responses/ItemsList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminSeasonCreate
      tags: [Админ]
      summary: Нов (неактивен) сезон; активира се отделно.
      x-required-roles: [ADMIN, OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index, startsAt, endsAt]
              properties:
                index: { type: integer, minimum: 1, maximum: 100000 }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time, description: "След `startsAt`." }
      responses:
        "200":
          description: Създаденият сезон.
          content:
            application/json:
              schema: { type: object, properties: { season: { type: object, additionalProperties: true } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`season_index_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/seasons/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: adminSeasonPatch
      tags: [Админ]
      summary: Сменя датите (краят остава след началото).
      x-required-roles: [ADMIN, OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
      responses:
        "200":
          description: Обновеният сезон.
          content:
            application/json:
              schema: { type: object, properties: { season: { type: object, additionalProperties: true } } }
        "400":
          description: "`validation_error` или `season_dates_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: adminSeasonDelete
      tags: [Админ]
      summary: Изтрива неактивен сезон, който не тече в момента.
      x-required-roles: [ADMIN, OWNER]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`season_active` или `season_current`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/seasons/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: adminSeasonActivate
      tags: [Админ]
      summary: Прави сезона единствен активен (транзакция).
      x-required-roles: [ADMIN, OWNER]
      responses:
        "200":
          description: Активираният сезон.
          content:
            application/json:
              schema: { type: object, properties: { season: { type: object, additionalProperties: true } } }
        "400":
          description: "`season_ended` — сезонът вече е приключил."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aso_at
      description: httpOnly access JWT, издаден от login/register/refresh. Ревокирани (блокирани/изтрити) сесии получават 401.
    refreshCookie:
      type: apiKey
      in: cookie
      name: aso_rt
      description: httpOnly refresh токен; изпраща се само към `/api/auth/*`.
    internalSecret:
      type: apiKey
      in: header
      name: x-internal-secret
      description: Споделена тайна между услугите (service-to-service). Не е за клиенти.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Подпис на Stripe, проверен със webhook secret върху суровото тяло.
    metricsBearer:
      type: http
      scheme: bearer
      description: Изисква се само ако на сървъра е зададен `METRICS_TOKEN`.

  parameters:
    Take:
      name: take
      in: query
      description: Размер на страницата, 1..100 (по подразбиране 50); извън обхвата се ограничава. Нечислова стойност в `/api/admin/matches` дава 400 `validation_error`.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: "`nextCursor` от предишната страница."
      schema: { type: string }

  responses:
    Ok:
      description: Успех.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Ok" }
    ValidationError:
      description: "`validation_error` — входът не минава Zod схемата (`issues` е `ZodError.flatten()`) или друга домейн грешка 400."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthorized` — липсваща, невалидна, изтекла или ревокирана сесия."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`forbidden` (недостатъчна роля или правило за ранг) или `csrf_origin`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Banned:
      description: "`banned` — акаунтът е блокиран; `message` е причината, `until` е краят (ISO, null = безсрочно)."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, const: banned }
                  message: { type: string }
                  until: { type: [string, "null"], format: date-time }
    NotFound:
      description: "`not_found` — няма такъв обект."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited` — твърде много опити (лимитер по IP и по акаунт)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EquippedList:
      description: Идентификаторите на всички екипирани козметики.
      content:
        application/json:
          schema:
            type: object
            required: [equipped]
            properties:
              equipped: { type: array, items: { type: string } }
    ItemsList:
      description: Списък `items`.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: { type: array, items: { type: object, additionalProperties: true } }
    ItemsPage:
      description: Страница `items` с курсор.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: { type: array, items: { type: object, additionalProperties: true } }
              nextCursor: { type: [string, "null"] }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "Стабилен машинен код, напр. `validation_error`, `unauthorized`, `not_found`." }
            message: { type: string }
            issues: { type: object, additionalProperties: true, description: "Само при `validation_error`." }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    Readiness:
      type: object
      required: [status, db, redis]
      properties:
        status: { type: string, enum: [ready, degraded] }
        db: { type: boolean }
        redis: { type: boolean }
    Role:
      type: string
      enum: [GUEST, PLAYER, VIP_PLAYER, MODERATOR, SUPPORT, ADMIN, OWNER]
    VipTier:
      type: string
      enum: [NONE, BRONZE, SILVER, GOLD, PLATINUM]
    ProductKind:
      type: string
      enum: [GEMS, COSMETIC, VIP_SUB, CHIP_PACK]
    GameKey:
      type: string
      enum: [BELOTE, SANTASE, SVARA, WAR, GOFISH, KENT, CHESS, BACKGAMMON, DRAUGHTS, LUDO, RUMMY, DOMINO, BRIDGE, BATTLESHIP, DICE, BINGO, WORDS, EIGHTBALL, NINEBALL, SNOOKER, MAGNAT]
    PublicUser:
      type: object
      required: [id, email, emailVerified, displayName, role, locale, chips, gems, xp, level, vipTier]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        locale: { type: string, enum: [bg, it, en] }
        chips: { type: string, description: "BigInt, сериализиран като низ." }
        gems: { type: integer }
        xp: { type: integer }
        level: { type: integer, description: "Смята се от `xp`." }
        vipTier: { $ref: "#/components/schemas/VipTier" }
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/PublicUser" }
    RegisterInput:
      type: object
      required: [email, password, displayName, acceptedTerms]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 200 }
        displayName: { type: string, minLength: 2, maxLength: 32 }
        locale: { type: string, enum: [bg, it, en] }
        acceptedTerms: { type: boolean, const: true, description: "18+ и Условия/Поверителност — изрично `true` (GDPR)." }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
    EmailInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    TokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 10, maxLength: 512 }
    ResponsibleView:
      type: object
      required: [realityCheckMinutes, dailyLimitMinutes, dailyLimitPending, playedTodayMinutes, selfExcludedUntil]
      properties:
        realityCheckMinutes: { type: integer }
        dailyLimitMinutes:
          type: [integer, "null"]
          description: Действащият дневен лимит (минути в мачове за игровия ден по софийско време); null = без.
        dailyLimitPending:
          description: Чакащо вдигане или махане на лимита — влиза в сила в effectiveAt (24 ч след заявката).
          oneOf:
            - type: "null"
            - type: object
              required: [minutes, effectiveAt]
              properties:
                minutes: { type: [integer, "null"], description: "null = лимитът отпада." }
                effectiveAt: { type: string, format: date-time }
        playedTodayMinutes: { type: integer, description: Изиграни минути в мачове днес (сървърно преброени). }
        selfExcludedUntil: { type: [string, "null"], format: date-time }
    MailSettingsView:
      type: object
      required: [settings, hasPassword, source, keyReady]
      properties:
        settings:
          oneOf:
            - type: "null"
            - type: object
              properties:
                host: { type: string }
                port: { type: integer }
                username: { type: string }
