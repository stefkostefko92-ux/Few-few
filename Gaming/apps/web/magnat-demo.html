<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>МАГНАТ 3D board — demo</title>
    <style>
      body { margin: 0; background: #0b0e0d; color: #e8e2d2; font-family: system-ui, sans-serif; padding: 24px; }
      h2 { font-weight: 600; margin: 0 0 12px; font-size: 15px; letter-spacing: .04em; color: #d9b25f; }
      .board { width: 720px; max-width: 92vw; border-radius: 18px; overflow: hidden;
        background: radial-gradient(120% 100% at 50% 0%, #1a4030, #0b2418);
        box-shadow: inset 0 0 60px rgba(0,0,0,.5), 0 16px 40px -16px rgba(0,0,0,.7); }
      .board canvas { width: 100%; height: auto; display: block; }
    </style>
  </head>
  <body>
    <h2>МАГНАТ — 3D board (Stylized Bulgaria, fixed isometric)</h2>
    <div class="board"><canvas id="c"></canvas></div>
    <script type="module" src="/src/features/game/magnat/magnatDemo.ts"></script>
  </body>
</html>
