# Nginx reverse proxy за уебсайта на СГБ
# Поставете в /etc/nginx/sites-available/sgb и създайте симлинк към sites-enabled.
# SSL сертификатът се издава лесно с: sudo certbot --nginx -d bg.sgbbg.com -d www.bg.sgbbg.com

# Пренасочване HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bg.sgbbg.com www.bg.sgbbg.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bg.sgbbg.com www.bg.sgbbg.com;

    # Сертификати (certbot ги попълва автоматично)
    ssl_certificate     /etc/letsencrypt/live/bg.sgbbg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bg.sgbbg.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Сигурностни заглавия
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 60M;        # за PDF на вестника
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/rss+xml image/svg+xml;
    gzip_min_length 256;

    # Статични файлове директно от Nginx (производителност)
    location /uploads/ {
        alias /var/www/sgb-website/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* ^/(css|js|img)/ {
        root /var/www/sgb-website/public;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri @app;
    }

    location @app { proxy_pass http://127.0.0.1:3000; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
