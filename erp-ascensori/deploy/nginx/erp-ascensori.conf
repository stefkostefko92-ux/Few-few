# Обратен прокси за ERP Ascensori. Смени домейна (4 места) и IP-то на мониторинга.
# Сертификатът се взима ПРЕДИ включването на този файл (DEPLOY.md § 5):
#   certbot certonly --webroot -w /var/www/html -d erp.azienda.it

server {
    listen 80;
    server_name erp.azienda.it;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name erp.azienda.it;

    # Изрично, не „попълва се от certbot": `certonly` не пипа конфигурацията.
    ssl_certificate     /etc/letsencrypt/live/erp.azienda.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.azienda.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Приложението не е за индексиране (вътрешен B2B инструмент) и слага свои
    # сигурностни хедъри; тук добавяме само това, което Next не може.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Импортът праща до 2000 реда наведнъж — при 1 MB по подразбиране се къса.
    client_max_body_size 16m;

    access_log /var/log/nginx/erp-ascensori.access.log;
    error_log  /var/log/nginx/erp-ascensori.error.log;

    # ── Здравни маршрути: не за пред публиката ──────────────────────────────
    # `/api/healthz/automatismi` издава кога за последно е минал автоматизмът.
    location ^~ /api/healthz {
        allow 127.0.0.1;
        # allow <IP на мониторинга>;
        deny all;
        proxy_pass http://127.0.0.1:3050;
        include /etc/nginx/proxy_params_erp;
    }

    # `readyz` без токен връща само „готов/не" — може да е достъпен за монитора.
    location = /api/readyz {
        allow 127.0.0.1;
        # allow <IP на мониторинга>;
        deny all;
        proxy_pass http://127.0.0.1:3050;
        include /etc/nginx/proxy_params_erp;
    }

    location / {
        proxy_pass http://127.0.0.1:3050;
        include /etc/nginx/proxy_params_erp;

        # HTML-ЪТ НОСИ NONCE ЗА ВСЯКА ЗАЯВКА — КЕШИРАН Е ОТРОВЕН.
        # Втори посетител би получил чужд nonce и ВСИЧКИ скриптове замлъкват:
        # бяла страница, без нито един ред в лога на сървъра. Днес тук няма
        # `proxy_cache`, но забраната е изрична, за да не се появи „за
        # производителност". Същото важи и пред нас: ако има Cloudflare —
        # правило `Cache Level: Bypass` за този хост.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
