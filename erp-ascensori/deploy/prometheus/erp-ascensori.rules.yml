# Аларми по СИМПТОМ, не по причина.
#
# Праг върху „процент грешки за 5 минути" греши в двете посоки: къс пик буди
# човек без причина, а бавно изтичане не го буди изобщо. Затова мерим скоростта
# на изгаряне на бюджета за грешки в ДВА прозореца едновременно — дългият дава
# достоверност, късият спира алармата, щом инцидентът приключи.
#
# SLO: 99,5 % наличност за 30 дни → бюджет 0,5 %.
#   14,4× изгаря 2 % от бюджета за час   → буди веднага
#    6×   изгаря 5 % за шест часа        → в работно време

groups:
  - name: erp-ascensori-slo
    rules:
      - record: erp:errori:rate5m
        expr: |
          sum(rate(erp_errori_totale[5m]))
            / clamp_min(sum(rate(erp_richieste_totale[5m])), 0.001)
      - record: erp:errori:rate30m
        expr: |
          sum(rate(erp_errori_totale[30m]))
            / clamp_min(sum(rate(erp_richieste_totale[30m])), 0.001)
      - record: erp:errori:rate1h
        expr: |
          sum(rate(erp_errori_totale[1h]))
            / clamp_min(sum(rate(erp_richieste_totale[1h])), 0.001)
      - record: erp:errori:rate6h
        expr: |
          sum(rate(erp_errori_totale[6h]))
            / clamp_min(sum(rate(erp_richieste_totale[6h])), 0.001)

      - alert: ErpBudgetBruciaVeloce
        # И двата прозореца — иначе единичен пик от една минута вдига телефона.
        expr: erp:errori:rate1h > (14.4 * 0.005) and erp:errori:rate5m > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critica
        annotations:
          summary: "ERP: il budget di errore brucia 14,4× — 2 % all'ora"
          description: >-
            Errori 5xx {{ $value | humanizePercentage }} sull'ultima ora.
            A questo ritmo il budget mensile finisce in due giorni.
          runbook: docs/OSSERVABILITA.md

      - alert: ErpBudgetBruciaLento
        expr: erp:errori:rate6h > (6 * 0.005) and erp:errori:rate30m > (6 * 0.005)
        for: 15m
        labels:
          severity: avviso
        annotations:
          summary: "ERP: perdita lenta del budget di errore (6×)"
          description: "Errori 5xx {{ $value | humanizePercentage }} sulle ultime 6 ore."
          runbook: docs/OSSERVABILITA.md

      - alert: ErpLatenzaAlta
        # p95 от хистограмата, не средно: средното крие точно опашката, която
        # потребителят усеща.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(erp_richieste_durata_secondi_bucket[30m]))
          ) > 0.5
        for: 15m
        labels:
          severity: avviso
        annotations:
          summary: "ERP: p95 sopra 500 ms"
          description: "p95 a {{ $value }} s sulle ultime 30 minuti."

  - name: erp-ascensori-integrita
    rules:
      # ПО ИМЕ, С РАЗЛИЧНИ ПРАГОВЕ. Общата възраст се държеше свежа от дневния
      # `contratti` и маскираше провал на `scadenze` — точно случаят, за който
      # dead-man съществува. И един праг не важи за всички: седмичното
      # прочистване под 26 часа би звъняло всеки ден.
      - alert: ErpAutomatismoFermoGiornaliero
        # 26 ч, не 24: автоматизмът е дневен и трябва да има място за забавяне
        # при рестарт, без да звъни. `-1` значи „никога не е минавал".
        expr: >-
          erp_automatismo_eta_secondi{nome=~"scadenze|contratti"} > 93600
          or erp_automatismo_eta_secondi{nome=~"scadenze|contratti"} == -1
        for: 10m
        labels:
          severity: critica
        annotations:
          summary: "ERP: l'automatismo {{ $labels.nome }} non gira da oltre 26 ore"
          description: >-
            `scadenze` ha effetti di sicurezza (art. 13 D.P.R. 162/1999);
            `contratti` genera i canoni, cioè il fatturato ricorrente.

      - alert: ErpRetentionFerma
        # Седмичен каданс: прагът е 11 дни, не 26 часа.
        expr: >-
          erp_automatismo_eta_secondi{nome="retention"} > 950400
          or erp_automatismo_eta_secondi{nome="retention"} == -1
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "ERP: la cancellazione periodica non gira da oltre 11 giorni"
          description: "Effetto legale (art. 5(1)(e) GDPR), non operativo."

      - alert: ErpWebhookFermo
        # Каданс от пет минути: шест пропуснати цикъла значи спрян процес.
        # `== -1` НЕ е излишно: при него автоматизмът никога не е минавал, а
        # `-1 > 1800` е лъжа — без този клон алармата изглежда като покритие и
        # не може да се задейства нито веднъж.
        expr: >-
          erp_automatismo_eta_secondi{nome="webhook"} > 1800
          or erp_automatismo_eta_secondi{nome="webhook"} == -1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "ERP: le consegne webhook non partono da oltre 30 minuti"
          description: "Le integrazioni del cliente smettono di ricevere eventi."

      - alert: ErpNotificheFerme
        # Каданс от петнайсет минути; час и половина мълчание значи спрян
        # процес. `== -1` НЕ е излишно — виж ErpWebhookFermo: без него
        # алармата не може да се задейства нито веднъж.
        #
        # НЕ се вдига при неконфигуриран SMTP: там автоматизмът минава, оставя
        # следа и излиза чист. Липсващата конфигурация е решение на клиента и
        # се вижда в интерфейса, не е авария.
        expr: >-
          erp_automatismo_eta_secondi{nome="notifiche"} > 5400
          or erp_automatismo_eta_secondi{nome="notifiche"} == -1
        for: 20m
        labels:
          severity: ticket
        annotations:
          summary: "ERP: gli avvisi di scadenza non partono da oltre 90 minuti"
          description: >-
            La coda si riempie e nessuno riceve gli avvisi. Le scadenze
            normative continuano a decorrere (art. 13 D.P.R. 162/1999).

      - alert: ErpAutomatismiFermi
        # Остава като мрежа за случаите, в които изобщо НИЩО не минава.
        expr: erp_automatismi_eta_secondi > 93600 or erp_automatismi_eta_secondi == -1
        for: 10m
        labels:
          severity: critica
        annotations:
          summary: "ERP: nessun automatismo completato da oltre 26 ore"
          description: >-
            Scadenze non aggiornate e conservazione non applicata.
            Le prime hanno effetti di sicurezza (art. 13 D.P.R. 162/1999),
            la seconda ha effetti legali (art. 5(1)(e) GDPR).

      # Предпазителят за кардиналността е безполезен, ако никой не разбере, че е
      # сработил: оттам нататък нови редици не се раждат, тоест ИСТИНСКИ
      # проблем на нов маршрут вече не вдига аларма.
      - alert: ErpCardinalitaAlLimite
        expr: increase(erp_metriche_serie_scartate_totale[1h]) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "ERP: il registro delle metriche ha raggiunto il tetto"
          description: >-
            Nuove serie non vengono più create: da questo momento un errore su
            una rotta mai vista prima non produce alcun segnale.

      # Липсваща редица НЕ вдига аларма. При провал на четенето от базата
      # маршрутът връща 200 с празен списък, тоест `up` остава 1, а всички
      # интегритетни аларми млъкват точно когато базата е зле.
      - alert: ErpIndicatoriAssenti
        expr: >-
          erp_indicatori_ok == 0
          or absent(erp_indicatori_ok)
          or absent(erp_automatismo_eta_secondi{nome="scadenze"})
        for: 15m
        labels:
          severity: critica
        annotations:
          summary: "ERP: gli indicatori dal database non arrivano più"
          description: >-
            Lo scrape risponde ma senza dati: le altre soglie di questo gruppo
            non possono scattare.

      # ФАКТУРА, ЗА КОЯТО СИСТЕМАТА МИСЛИ, ЧЕ Е ТРЪГНАЛА. SDI се произнася за
      # дни; седмица мълчание значи, че файлът най-вероятно не е стигнал. За
      # данъчната администрация такъв документ е НЕИЗДАДЕН — чл. 6, ал. 1
      # D.Lgs. 471/1997: 70 % от данъка, минимум 300 € на операция. Открива се
      # при проверка месеци по-късно, ако никой не гледа.
      - alert: ErpFattureSenzaEsitoSdi
        expr: erp_sdi_senza_esito > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "ERP: fatture trasmesse senza notifica dallo SdI da oltre 7 giorni"
          description: >-
            Verificare il canale di trasmissione: una fattura che il gestionale
            considera trasmessa ma che lo SdI non ha ricevuto è, per il fisco,
            non emessa (art. 6 c. 1 D.Lgs. 471/1997).

      # Пет дни от известието за преиздаване със същия номер (циркуляр 13/E от
      # 2018 г. на Agenzia delle Entrate). Пропуснат срок = дупка в регистъра.
      - alert: ErpRinvioSdiInScadenza
        expr: erp_sdi_rinvio_in_scadenza > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "ERP: scade il termine per il rinvio di una fattura scartata"
          description: >-
            Meno di 2 giorni per correggere e ritrasmettere con lo stesso numero
            e la stessa data.

      # Хранилището нарочно НЕ вали readiness (пълен диск не бива да сваля
      # фактурирането в цикъл от рестарти) — затова тук трябва аларма, иначе
      # влошаването е тихо: качването отказва, а никой не разбира.
      - alert: ErpArchivioNonScrivibile
        expr: erp_archivio_scrivibile == 0
        for: 10m
        labels:
          severity: critica
        annotations:
          summary: "ERP: l'archivio degli allegati non è scrivibile"
          description: >-
            Il caricamento di certificati e verbali non funziona e i documenti
            già caricati spariscono alla prossima ricreazione del container.
            Verificare il volume montato.

      - alert: ErpRlsDisattivata
        # Отказ, който НЕ се вижда никъде другаде: политиките стоят, приложението
        # работи, а ролята ги заобикаля. Без тази аларма счупената изолация се
        # открива от клиента.
        expr: erp_rls_attiva == 0
        for: 10m
        labels:
          severity: critica
        annotations:
          summary: "ERP: l'isolamento per azienda NON è in vigore"
          description: >-
            Le policy esistono ma il ruolo applicativo le aggira (superuser o
            BYPASSRLS). Verificare con GET /api/readyz.

      - alert: ErpNonRaggiungibile
        expr: up{job="erp-ascensori"} == 0
        for: 5m
        labels:
          severity: critica
        annotations:
          summary: "ERP: lo scrape non risponde"
