<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nessuna connessione — ERP Ascensori</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fff; color: #1b1d21; padding: 1.5rem; text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #14161a; color: #e8eaed; } }
      .segno { width: 56px; height: 56px; border-radius: 14px; background: #116bb5; margin: 0 auto 1.25rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.5rem; opacity: .75; max-width: 32ch; }
      button {
        font: inherit; padding: .6rem 1.1rem; border: 0; border-radius: 8px;
        background: #116bb5; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="segno"></div>
      <h1>Nessuna connessione</h1>
      <!-- Нарочно НЕ показваме стари данни: в гестионал остаряла giacenza или
           стар статус изглежда като истина и е по-опасна от липсата ѝ. -->
      <p>
        I dati del gestionale sono sempre in tempo reale: senza rete non vengono mostrati valori
        vecchi. Riprovare quando il segnale torna.
      </p>
      <button onclick="location.reload()">Riprova</button>
    </div>
  </body>
</html>
