# /etc/nginx/sites-available/liftpilot.conf — LiftPilot, liftpilot.carbonstealth.eu
# Installed by deploy/deploy.sh (the port 4330 is replaced with APP_PORT from .env). TLS from Let's Encrypt.
# Security headers other than HSTS come from the application (CSP with a nonce per request, frame, referrer, …).

# HTTP → HTTPS (the ACME challenge stays on HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name liftpilot.carbonstealth.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liftpilot.carbonstealth.eu;

    ssl_certificate /etc/letsencrypt/live/liftpilot.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liftpilot.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LiftPilotSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # own directory, rotated daily and deleted after 14 days by deploy/deploy.sh (the privacy notice states it)
    access_log /var/log/nginx/liftpilot/access.log;
    error_log  /var/log/nginx/liftpilot/error.log;

    # forms only, no uploads
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # the calculation report is rendered on request (a few seconds at most)
        proxy_read_timeout 60s;
    }
}
