# LiftPilot on the VPS: application + PostgreSQL. The application listens only on 127.0.0.1:${APP_PORT}; the host
# nginx (deploy/nginx/liftpilot.conf) terminates TLS for the public name. Secrets come from .env (mode 600, never in git).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: liftpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: liftpilot
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftpilot -d liftpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://liftpilot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/liftpilot?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (at least 32 characters) in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
      # the beta by invitation (invite) or the registration open to anyone (open)
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@carbonstealth.eu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Carbon Stealth VCC}
      ADMIN_COMPANY: ${ADMIN_COMPANY:-Carbon Stealth VCC}
      # e-mails (registration, forgotten password): Brevo's SMTP relay; without SMTP_HOST both stay closed
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # the subscription (Stripe): without all four the billing stays off (every company works without limits)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRODUCT_SEATS: ${STRIPE_PRODUCT_SEATS:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-14}
      # the first day of paid use (YYYY-MM-DD): before it, or without it, the beta goes on whatever Stripe's values
      BILLING_START: ${BILLING_START:-}
      # the automatic reading of the survey sketches (Claude on Google Cloud Vertex AI, EU only): off unless the project
      # is set and the service account's key is in the mounted directory below (a file of the container's user, mode
      # 600: src/server/schizzi/config.ts, DEPLOY.md); the region is eu or an EU-27 europe-* one (VERTEX_REGIONS in
      # src/lib/env-schema.ts: not London europe-west2, not Zurich europe-west6), nothing else starts
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-eu}
      VERTEX_CREDENTIALS_FILE: ${VERTEX_CREDENTIALS_FILE:-/run/vertex/service-account.json}
      SKETCH_MODEL: ${SKETCH_MODEL:-claude-opus-5-5}
      TZ: UTC
    # read-only: the directory of the Vertex key on the host (deploy/deploy.sh makes it, empty: the feature off)
    volumes:
      - ${VERTEX_DIR:-/opt/few-few/shared/liftpilot/vertex}:/run/vertex:ro
    ports:
      - "127.0.0.1:${APP_PORT:-4330}:3000"
    security_opt:
      - no-new-privileges:true
    # a Node process on an unprivileged port needs no capability; the renderers (report/*.py, and the image tools of the
    # survey sketches: pdftoppm, heif-convert) are bounded in number by
    # the application (two at a time) and here in memory and processes, so a burst cannot starve the rest of the host
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 256

volumes:
  db-data:
