# ============================================================================
#  Балкан — FiveM сървър (Qbox + ox стек)
#  Стартиране:  <FXServer>/run.sh +exec server.cfg    (виж README.md)
#  ВАЖНО: това е примерен конфиг. Тайните (DB парола, лицензен ключ, steam_webApiKey)
#  се задават през convar-и на СЪРВЪРА (виж server.secret.cfg.example) — НЕ в репото.
# ============================================================================

# --- Мрежа ------------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --- OneSync Infinity (задължителен за нашия server-authoritative дизайн) -----
set onesync on
set onesync_population true
set sv_maxclients 64          # старт на 64: по-добре пълен 64, отколкото празен 128

# --- Идентичност на сървъра --------------------------------------------------
sv_hostname "Балкан 🇧🇬 | Сериозен BG RP | Qbox"
sets sv_projectName "Балкан"
sets sv_projectDesc "Консолидиран български RP — жив свят, който помни какво правиш."
sets Discord "https://discord.gg/example"
sets Locale "bg-BG"
sets tags "roleplay, bulgaria, qbox, serious"
load_server_icon server-icon.png

# --- Сигурност (server-authoritative дисциплина) -----------------------------
sv_filterRequestControl 4          # спира кражба на entity control от клиент
sv_enableNetworkedSounds false
sv_enableNetworkedPhoneExplosions false
set sv_pure_verify_client_settings true

# --- Тайни (заредени от отделен, git-игнориран файл на сървъра) ---------------
# exec server.secret.cfg
# Съдържа: sv_licenseKey, set mysql_connection_string, set steam_webApiKey, rcon_password ...
# Виж server.secret.cfg.example.

# ============================================================================
#  РЕСУРСИ — редът има значение (зависимости първи)
# ============================================================================

# --- База: ox + qbx (теглят се от setup.sh, НЕ са в репото) -------------------
ensure oxmysql
ensure ox_lib
ensure ox_target
ensure ox_inventory
ensure qbx_core

