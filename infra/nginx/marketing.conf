# Serves the Next.js static export for the marketing layer (inside the
# marketing container). The edge nginx (aso.conf) proxies the public marketing
# host here, while /app, /api, /socket.io go to the play app + services.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Trailing-slash static export: try the directory's index.html.
  location / {
    try_files $uri $uri/ $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;

  # Long-cache the immutable Next asset bundle.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
