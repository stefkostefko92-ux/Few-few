# АСО — nginx reverse proxy (S17). Kept in repo, not edited on the server.
# Single public domain (matches SITE.url in the marketing layer):
#   /              -> marketing (Next.js static export, SEO layer)
#   /app/          -> web (Vite SPA play app, built with base /app/)
#   /api/          -> api (REST)
#   /socket.io/    -> realtime (WebSocket, S3)
#   /health        -> api health probe
# TLS termination via Let's Encrypt (certbot) — paths illustrative.

upstream aso_api {
  server 127.0.0.1:4500;
}
upstream aso_realtime {
  server 127.0.0.1:4501;
}
upstream aso_web {
  server 127.0.0.1:4502;
}
upstream aso_marketing {
  server 127.0.0.1:8080;
}

# Redirect HTTP -> HTTPS.
server {
  listen 80;
  server_name gaming.carbonstealth.eu;
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name gaming.carbonstealth.eu;

  ssl_certificate     /etc/letsencrypt/live/gaming.carbonstealth.eu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gaming.carbonstealth.eu/privkey.pem;

  # Security headers (S14).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 2m;

  # REST API.
  location /api/ {
    proxy_pass http://aso_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Stripe webhook lives on the API outside /api/ (raw-body route, §11.3).
  location = /webhooks/stripe {
    proxy_pass http://aso_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Health probe straight to the API.
  location = /health {
    proxy_pass http://aso_api/health;
  }

  # Realtime WebSocket upgrade (S3).
  location /socket.io/ {
    proxy_pass http://aso_realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Play app (Vite SPA, served under /app/ by its own nginx — web.conf).
  location /app/ {
    proxy_pass http://aso_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /app {
    return 301 /app/;
  }

  # Marketing / SEO layer (Next.js static export) owns the root.
  location / {
    proxy_pass http://aso_marketing;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
