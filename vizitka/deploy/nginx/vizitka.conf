# nginx за Vizitka. TLS сертификатите се управляват с certbot.
# Приложението слуша на 127.0.0.1:3100.

# Пренасочване на HTTP към HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name vizitka-bg.com;
    location / { return 308 https://$host$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1 на сървъра;
    # новият `http2 on;` дава „unknown directive" при по-стар nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vizitka-bg.com;

    ssl_certificate     /etc/letsencrypt/live/vizitka-bg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vizitka-bg.com/privkey.pem;

    # Само модерни протоколи и шифри.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 4m — банерите са до 3 MB (multer limits: снимки 2 MB, банери 3 MB) + резерв
    # за multipart overhead; иначе nginx връща 413 преди приложението. HSTS/CSP
    # ги задава самото приложение — не ги дублираме тук.
    client_max_body_size 4m;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
