# nginx за Vizitka. TLS сертификатите се управляват с certbot.
# Приложението слуша на 127.0.0.1:3100.

# Пренасочване на HTTP към HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name vizitka.carbonstealth.eu;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vizitka.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/vizitka.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vizitka.carbonstealth.eu/privkey.pem;

    # Само модерни протоколи и шифри.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 3m — качване на снимки до 2 MB + резерв (app-ът задава HSTS/CSP).
    client_max_body_size 3m;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
