# nginx за Vizitka. TLS сертификатите се управляват с certbot.
# Приложението слуша на 127.0.0.1:3105 (портът се подменя от server-setup.sh
# според реално зададения PORT — на споделена машина 3100 може да е зает).

# Лимити по IP. Приложението има свои лимити само за вход/портфейл; тук пазим и
# публичните маршрути, които са скъпи (QR се генерира, визитката пише в базата).
limit_req_zone $binary_remote_addr zone=viz_gen:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=viz_heavy:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=viz_conn:10m;

# Анонимизиран лог: пълният URI съдържа слъга, тоест име на човек, а IP-то е лично
# данно. Пазим последния октет нулиран и държим лога отделно от другите проекти —
# иначе изтриване „само за vizitka“ по чл. 17 ОРЗД е практически невъзможно.
map $remote_addr $viz_ip_anon {
    ~(?P<ip4>\d+\.\d+\.\d+)\.    $ip4.0;
    ~(?P<ip6>[^:]+:[^:]+):       $ip6::;
    default                      0.0.0.0;
}
log_format viz_anon '$viz_ip_anon - [$time_local] "$request" $status $body_bytes_sent';

# Пренасочване на HTTP към HTTPS (и на www към голия домейн).
server {
    listen 80;
    listen [::]:80;
    server_name vizitka-bg.com www.vizitka-bg.com;
    location / { return 308 https://vizitka-bg.com$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1 на сървъра;
    # новият `http2 on;` дава „unknown directive" при по-стар nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vizitka-bg.com;

    ssl_certificate     /etc/letsencrypt/live/vizitka-bg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vizitka-bg.com/privkey.pem;

    # Само модерни протоколи и шифри.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    # OCSP stapling: Let's Encrypt спря OCSP през 2025 г. и новите сертификати нямат
    # responder URL — директивата тогава е без ефект и пълни error лога. Провери с
    #   openssl x509 -noout -ocsp_uri -in /etc/letsencrypt/live/vizitka-bg.com/fullchain.pem
    # Празен изход → махни следващите два реда.
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/vizitka.access.log viz_anon;
    error_log  /var/log/nginx/vizitka.error.log warn;

    # 4m — банерите са до 3 MB (multer limits: снимки 2 MB, банери 3 MB) + резерв
    # за multipart overhead; иначе nginx връща 413 преди приложението. HSTS/CSP и
    # nosniff ги задава самото приложение (helmet) — не ги дублираме тук.
    client_max_body_size 4m;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    limit_req  zone=viz_gen burst=40 nodelay;
    limit_conn viz_conn 20;

    # Скъпите маршрути: QR се рисува наново, vCard чете снимката, .pkpass пуска openssl.
    location ~ ^/p/[^/]+/(qr\.png|vizitka\.vcf|wallet/) {
        limit_req zone=viz_heavy burst=5 nodelay;
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
