# Отклонение на живата машина, версионирано тук, за да не се загуби.
#
# Защо съществува: seccomp филтърът от основния unit убиваше Node със SIGSYS
# (systemd показва `status=31/SYS`, услугата влиза в рестарт-цикъл). На живо това
# беше „оправено“ с празен `SystemCallFilter=`, но празното присвояване НУЛИРА
# целия списък — и allowlist-а, и denylist-а — тоест изключва seccomp напълно.
#
# Тук пазим филтъра, но сменяме НАКАЗАНИЕТО: блокираното извикване връща EPERM
# вместо да убива процеса. libuv/V8 преглъщат errno; SIGSYS не се преглъща.
#
# Ако услугата пак умира с status=31, намери виновния syscall, преди да разхлабваш:
#   journalctl -u vizitka -g SIGSYS -n 50
#   ausearch -m SECCOMP -ts recent        # ако auditd е инсталиран
#   systemd-analyze security vizitka      # цел: под 5
[Service]
SystemCallErrorNumber=EPERM

# DNS през glibc (getaddrinfo/getifaddrs) минава през netlink сокет. Без него
# резолвът деградира, а от него зависят SMTP (нулиране на парола), IndexNow и
# портфейлите (Apple APNs, Google Wallet).
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK

# Евтини ограничители срещу разбягване (openssl се spawn-ва за всеки .pkpass).
MemoryMax=512M
TasksMax=256
LimitNOFILE=4096

# Мрежов демон: чистият изход също е повод за рестарт, но без вечен цикъл.
Restart=always
StartLimitIntervalSec=300
StartLimitBurst=5
