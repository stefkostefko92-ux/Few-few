# Carbon Stealth Portfolio — Nginx config
# Постави в /etc/nginx/sites-available/portfolio.carbonstealth.eu
# ln -s /etc/nginx/sites-available/portfolio.carbonstealth.eu /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.carbonstealth.eu;
    return 301 https://portfolio.carbonstealth.eu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portfolio.carbonstealth.eu;

    ssl_certificate /etc/letsencrypt/live/portfolio.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    root /var/www/portfolio.carbonstealth.eu;
    index index.html;

    # Security headers (статичен сайт: скриптове и стилове само от нас, шрифтове от Google Fonts).
    # frame-ancestors 'self': хъбът показва демотата в мащабирани iframe-и от същия origin.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    location ^~ /.well-known/ { access_log off; }

    location ~* \.(png|svg|ico|webp|jpg|jpeg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }
    location = /favicon.ico { access_log off; return 204; }
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /llms.txt    { access_log off; }
    location = /indexnow-key.txt { access_log off; }

    # Коренът е избор на език (noindex) — реалният x-default е /bg/.
    # Непознат път е истинско 404 (не soft-404 с код 200).
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }

    access_log /var/log/nginx/portfolio.access.log;
    error_log /var/log/nginx/portfolio.error.log;
}
