# Argano on the VPS: application + PostgreSQL. The application listens only on 127.0.0.1:${APP_PORT}; the host
# nginx (deploy/nginx/argano.conf) terminates TLS for the public name. Secrets come from .env (mode 600, never in git).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: argano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: argano
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argano -d argano"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://argano:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/argano?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (at least 32 characters) in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://argano.carbonstealth.eu}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@carbonstealth.eu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Carbon Stealth VCC}
      ADMIN_COMPANY: ${ADMIN_COMPANY:-Carbon Stealth VCC}
      TZ: UTC
    ports:
      - "127.0.0.1:${APP_PORT:-4320}:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
