services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_ascensori
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ErpAscensori2026!}
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp_ascensori"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-ErpRedis2026!}
    volumes:
      - erp_redisdata:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ErpRedis2026!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://erp_admin:${DB_PASSWORD:-ErpAscensori2026!}@postgres:5432/erp_ascensori
      REDIS_URL: redis://:${REDIS_PASSWORD:-ErpRedis2026!}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-erp-jwt-secret-2026-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-erp-refresh-secret-2026-change-me}
      HMAC_SECRET: ${HMAC_SECRET:-erp-hmac-secret-2026}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      APP_URL: ${APP_URL:-}
      DEFAULT_TENANT: ${DEFAULT_TENANT:-default}
      AZIENDA_NOME: ${AZIENDA_NOME:-}
      AZIENDA_PIVA: ${AZIENDA_PIVA:-}
      AZIENDA_CF: ${AZIENDA_CF:-}
      AZIENDA_INDIRIZZO: ${AZIENDA_INDIRIZZO:-}
      AZIENDA_CITTA: ${AZIENDA_CITTA:-}
      AZIENDA_CAP: ${AZIENDA_CAP:-}
      AZIENDA_PROVINCIA: ${AZIENDA_PROVINCIA:-}
      AZIENDA_TELEFONO: ${AZIENDA_TELEFONO:-}
      AZIENDA_EMAIL: ${AZIENDA_EMAIL:-}
      AZIENDA_PEC: ${AZIENDA_PEC:-}
      AZIENDA_IBAN: ${AZIENDA_IBAN:-}
      AZIENDA_BANCA: ${AZIENDA_BANCA:-}
      AZIENDA_REA: ${AZIENDA_REA:-}
      AZIENDA_CAPITALE: ${AZIENDA_CAPITALE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      PORT: 4000
    ports:
      - "4100:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    ports:
      - "3100:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  erp_pgdata:
  erp_redisdata:
