# Nginx vhost за mastilko-bg.com — ПЪЛНИЯТ работещ конфиг (порт 80 → 443 + прокси
# към Next на 127.0.0.1:3200). Слага се в /etc/nginx/sites-available/mastilko +
# symlink в sites-enabled. Виж deploy/DEPLOY.md за реда на настройка.
#
# ВАЖНО (платено с реален инцидент 12.08.2026):
#   • Мастилко живее на ОТДЕЛЕН VPS (Hetzner nbg1) — autodeploy.sh се пуска ТАМ,
#     не на машината с останалите продукти. Ако деплойнеш на грешния сървър, кодът
#     се билдва, но mastilko-bg.com не се променя (nginx там не сочи натам).
#   • 443 блокът по-долу иска СЕРТИФИКАТ да съществува вече. На ПРЪВ setup първо
#     вземи сертификата (виж DEPLOY.md), иначе `nginx -t` гърми „cannot load
#     certificate". НЕ припокривай жив vhost с по-къса версия — губиш TLS.

server {
    listen 80;
    listen [::]:80;
    server_name mastilko-bg.com;

    # Let's Encrypt HTTP-01 предизвикателство (за издаване/подновяване на cert)
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Всичко останало → HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mastilko-bg.com;

    # Не разкривай версията на nginx в заглавката Server (по подразбиране
    # отговорът беше „nginx/1.24.0 (Ubuntu)" — версия + дистрибуция).
    server_tokens off;

    # Логът е ИЗРИЧЕН, за да е проверимо обещанието в /poveritelnost, че
    # съдържанието на заявките (вкл. към MCP конектора /api/mcp) не се записва.
    # Форматът `combined` по дефиниция НЕ съдържа тялото на заявката — само
    # адрес, време, метод, път, статус, размер, референт и user-agent. Никога
    # не слагай $request_body в log_format за този vhost. Файлът попада под
    # глобалното въртене /var/log/nginx/*.log (виж DEPLOY.md, стъпка 4б).
    access_log /var/log/nginx/mastilko.access.log combined;
    error_log  /var/log/nginx/mastilko.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/mastilko-bg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mastilko-bg.com/privkey.pem;

    # Next.js (systemd сервиз `mastilko`) слуша само на loopback, зад този прокси.
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next сам праща Cache-Control: immutable за /_next/static/ — не дублираме.
    client_max_body_size 1m;
}

# ── www.mastilko-bg.com → mastilko-bg.com (ПО ИЗБОР, виж DEPLOY.md „www“) ──────
# Днес www НЕ отговаря изобщо (няма DNS запис) — който напише www, вижда грешка.
# Разкоментирай САМО след като: (1) има A/AAAA запис за www към този VPS и
# (2) сертификатът покрива и www (`certbot ... -d mastilko-bg.com -d www.mastilko-bg.com`).
# Иначе `nginx -t` е зелен, но браузърите показват грешен сертификат за www.
