# Nginx vhost за mastilko-bg.com — еднократна настройка (виж DEPLOY.md).
# Слага се в /etc/nginx/sites-available/mastilko + symlink в sites-enabled.
# TLS се добавя от certbot (--nginx) и той пренаписва listen 443 блока.

server {
    listen 80;
    listen [::]:80;
    server_name mastilko-bg.com;

    # Let's Encrypt HTTP-01 предизвикателство
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Бележка: Next 15 сам праща Cache-Control: immutable за /_next/static/ —
    # не добавяме add_header, за да не дублираме хедъра.

    client_max_body_size 1m;
}
