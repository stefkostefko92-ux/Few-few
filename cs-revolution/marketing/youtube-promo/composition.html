<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Carbon Stealth VCC — промо клип (композиция)</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* 1920×1080, 30 fps. Нищо не се анимира с CSS: render(t) нарежда всеки кадър от времето t,
   за да е рендерът детерминистичен (кадър по кадър през Playwright → ffmpeg). */
:root{--bg:#0A0C0E;--s1:#111417;--s2:#181C20;--ink:#C9D1D6;--ink2:#7C868D;--c:#00e5ff;--line:rgba(201,209,214,.07)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:'Space Mono','JetBrains Mono',monospace;-webkit-font-smoothing:antialiased}
.disp{font-family:'Space Grotesk','Onest',sans-serif;font-weight:600;letter-spacing:-.02em}
.mono{font-family:'Space Mono','JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase}
.chrome{background-image:linear-gradient(100deg,transparent calc(var(--sx,-40%) - 6%),rgba(255,255,255,.95) var(--sx,-40%),transparent calc(var(--sx,-40%) + 6%)),linear-gradient(180deg,#F4F7F8 0%,#D6DDE1 38%,#8E989F 52%,#E4E9EC 62%,#F4F7F8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;background-size:100% 100%,100% 1.05em;background-repeat:no-repeat,repeat-y}
#bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 60% at 60% 45%,rgba(0,229,255,.06),transparent 70%),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/96px 96px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/96px 96px,
  repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 3px,transparent 3px 8px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.012) 0 3px,transparent 3px 8px),var(--bg)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55));pointer-events:none;z-index:50}
.scene{position:absolute;inset:0;opacity:0;will-change:clip-path,opacity}
.scan{position:absolute;top:0;bottom:0;width:2px;background:var(--c);box-shadow:0 0 18px var(--c),0 0 60px rgba(0,229,255,.5);z-index:40;opacity:0}
.hscan{position:absolute;left:0;right:0;height:2px;background:var(--c);box-shadow:0 0 18px var(--c),0 0 60px rgba(0,229,255,.5);z-index:40;opacity:0}
/* intro */
#intro .logo{position:absolute;left:50%;top:150px;width:420px;height:420px;margin-left:-210px}
#intro .t{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:104px}
#intro .s{position:absolute;left:0;right:0;top:745px;text-align:center;font-size:24px;color:var(--ink2)}
#intro .s b{color:var(--c);font-weight:400}
/* capabilities */
#caps .eye{position:absolute;left:120px;top:120px;font-size:20px;color:var(--c)}
#caps .h{position:absolute;left:120px;top:160px;font-size:112px}
#caps .item{position:absolute;width:760px;height:96px;opacity:0}
#caps .item .n{position:absolute;left:0;top:14px;font-size:20px;color:var(--c)}
#caps .item .w{position:absolute;left:72px;top:0;font-size:52px;color:#E8EEF1}
#caps .item .u{position:absolute;left:72px;right:0;bottom:12px;height:1px;background:linear-gradient(90deg,var(--c),rgba(0,229,255,.08));transform-origin:left;transform:scaleX(0)}
/* product */
.prod .eye{position:absolute;left:110px;top:300px;font-size:20px;color:var(--c);white-space:nowrap}
.prod .name{position:absolute;left:110px;top:340px;width:640px;font-size:92px;line-height:1.02}
.prod .desc{position:absolute;left:110px;width:600px;font-size:30px;line-height:1.45;font-family:'Space Grotesk','Onest',sans-serif;font-weight:400;color:var(--ink)}
.prod .foot{position:absolute;left:110px;top:930px;font-size:16px;color:var(--ink2)}
.prod .foot i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:10px;vertical-align:1px;box-shadow:0 0 10px var(--c)}
.dev{position:absolute;overflow:hidden;background:#000}
.dev img{position:absolute;left:0;top:0;width:100%;display:block}
.desk{left:770px;top:180px;width:1060px;height:663px;border:1px solid rgba(0,229,255,.35);box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 40px rgba(0,229,255,.08)}
.phone{left:1600px;top:452px;width:236px;height:511px;border-radius:30px;box-shadow:0 0 0 9px #14181c,0 0 0 10px rgba(0,229,255,.45),0 30px 70px rgba(0,0,0,.8)}
.reg{position:absolute;width:18px;height:18px;border-color:var(--c);border-style:solid;opacity:.9}
.dim{position:absolute;height:1px;background:rgba(0,229,255,.55)}
.dim::before,.dim::after{content:'';position:absolute;top:-5px;width:1px;height:11px;background:var(--c)}.dim::before{left:0}.dim::after{right:0}
.dim span{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:14px;letter-spacing:.18em;color:var(--c);background:var(--bg);padding:0 8px;white-space:nowrap}
.seal{position:absolute;left:800px;top:700px;display:flex;align-items:center;gap:22px;padding:22px 30px;background:rgba(10,12,14,.92);border:1px solid rgba(138,180,248,.7);box-shadow:0 0 40px rgba(138,180,248,.25);opacity:0;z-index:5}
.seal .t1{font-size:26px;letter-spacing:.24em;color:#E8EEF1}
.seal .t2{font-size:17px;letter-spacing:.2em;color:#8ab4f8;margin-top:6px}
.seal .t3{font-size:15px;letter-spacing:.04em;color:var(--ink2);margin-top:8px;text-transform:none;font-family:'Space Grotesk','Onest',sans-serif}
.stamp{position:absolute;padding:12px 26px;border:3px solid var(--c);color:var(--c);font-size:30px;letter-spacing:.28em;transform:rotate(-6deg);opacity:0;z-index:6;background:rgba(10,12,14,.6)}
/* trust */
#trust .cell{position:absolute;top:300px;width:520px;text-align:center}
#trust .big{font-size:220px;line-height:1;height:220px;overflow:hidden}
#trust .lab{font-size:22px;color:var(--ink2);margin-top:26px}
#trust .row{position:absolute;left:0;right:0;top:770px;text-align:center;font-size:26px;color:#E8EEF1}
#trust .row b{color:#8ab4f8;font-weight:400}
.drum{display:inline-block;height:1em;overflow:hidden;vertical-align:top}.drum>span{display:block}.drum>span>span{display:block;height:1em}
/* outro */
#outro .logo{position:absolute;left:50%;top:150px;width:340px;height:340px;margin-left:-170px}
#outro .t{position:absolute;left:0;right:0;top:540px;text-align:center;font-size:96px}
#outro .s{position:absolute;left:0;right:0;top:700px;text-align:center;font-size:30px;color:var(--c)}
#outro .s2{position:absolute;left:0;right:0;top:760px;text-align:center;font-size:20px;color:var(--ink2)}
#black{position:absolute;inset:0;background:#000;opacity:0;z-index:90}
#subs{position:absolute;left:0;right:0;bottom:44px;text-align:center;z-index:80;opacity:0}
#subs span{display:inline-block;max-width:1400px;padding:10px 22px;background:rgba(0,0,0,.72);font-family:'Space Grotesk','Onest',sans-serif;font-size:30px;color:#fff;letter-spacing:.005em}
#tc{position:absolute;right:28px;top:22px;font-size:14px;color:var(--ink2);z-index:85;letter-spacing:.18em}
</style>
</head>
<body>
<div id="bg"></div>

<div id="intro" class="scene">
  <img class="logo" src="/brand/cs-logo-480.webp" alt="">
  <div class="t disp chrome">CARBON STEALTH VCC</div>
  <div class="s mono">Софтуер с толеранс <b>±0,02</b></div>

</div>

<div id="caps" class="scene">
  <div class="eye mono">// Какво правим</div>

<div id="prods"></div>

<div id="trust" class="scene">

  <div class="cell" style="left:700px"><div class="big disp" id="d2"></div><div class="lab mono">в разработка</div></div>

</div>

<div id="subs"><span></span></div>
<div id="vig"></div>
<div id="black"></div>
<div id="tc" class="mono"></div>

<script>
// ─── данни ───────────────────────────────────────────────────────────────────
var CAPS = ["Сайтове", "Онлайн магазини", "Софтуер и ERP", "Мобилни приложения", "Chrome разширения", "Discord ботове и SaaS", "SEO · GEO · AEO", "Хостинг в ЕС"];
// limD/limM: колко най-много да се скролира в изходните пиксели (ОУ Вапцаров: спира преди вграденото видео)
var PRODUCTS = [
  { id: "zabobovdol", name: "За Бобов дол", tag: "Civic · BG", desc: "Граждански портал: важни телефони, услуги и помощ стъпка по стъпка за всички възрасти." },
  { id: "panev", name: "Panev Ascensori", tag: "Ascensori · IT", desc: "Патентовани скоби за асансьори: каталог, 3D изглед и поръчка по имейл на три езика." },
  { id: "vizitka", name: "Vizitka", tag: "QR · Профил", desc: "Дигитална визитка с постоянен QR — раздадените визитки се обновяват сами." },
  { id: "mastilko", name: "Мастилко", tag: "Печат · Инструменти", desc: "Безплатни етикети, визитки и CV, готови за печат на истински А4 лист." },
  { id: "supremebot", name: "Supreme Bot", tag: "SaaS · Discord", desc: "Осем бота за Discord и едно табло: тикети, формуляри, панели и AI." },
  { id: "adblock", name: "Supreme AdBlock", tag: "Privacy · Chrome", desc: "Блокира рекламите в Chrome, вкл. в YouTube, без телеметрия.", verified: true },
  { id: "liftpilot", name: "Lift Pilot", tag: "Асансьори · В разработка", desc: "Проектиране на асансьори с проверка по нормите EN 81-20 / EN 81-50.", wip: true },
  { id: "evanita", name: "Evanita Sport", tag: "Фитнес · BG", desc: "Дамско студио за Kangoo Jumps в Дупница: бърз сайт, направен първо за телефона." },
  { id: "vaptsarov", name: "ОУ „Никола Вапцаров“", tag: "Училище · BG", desc: "Сайтът на училището в Бобов дол, със система за новини.", limD: 240, limM: 1300 },
  { id: "eternal", name: "Eternal Touch", tag: "Ателие · IT", desc: "Витрина и каталог на ръчни гипсови декорации, на три езика." },
  { id: "scuola", name: "Scuola Bulgara Milano", tag: "Училище · IT", desc: "Българското училище в Милано: сайт със собствена система за съдържание на три езика." }
];
var VO = [
  [0.6, 3.8, "Не обещаваме. Измерваме."],
  [4.3, 10.6, "Carbon Stealth VCC проектира сайтове, магазини, софтуер и приложения — с прецизността на инженерен цех."]
].concat([
  "За Бобов дол — гражданският портал на града.",
  "Panev Ascensori — каталог на патентовани скоби, с 3D изглед.",
  "Vizitka — визитка, която се обновява сама.",
  "Мастилко — етикети, визитки и CV, готови за печат.",
  "Supreme Bot — Discord ботове, управлявани от едно табло.",
  "Supreme AdBlock — без реклами, без телеметрия. Verified Publisher в Chrome Web Store.",
  "Lift Pilot — проектиране на асансьори по нормите. В разработка.",
  "Evanita Sport — сайт за фитнес студио, направен първо за телефона.",
  "ОУ „Никола Вапцаров“ — новините на училището в Бобов дол.",
  "Eternal Touch — витрина на ателие за ръчни декорации.",
  "Scuola Bulgara Milano — българското училище в Милано, на три езика."
].map(function (s, i) { var a = 11 + i * 4.8; return [a + 0.5, a + 4.5, s]; })).concat([
  [64.2, 68.6, "Десет продукта на живо. Един в разработка. Три езика."],
  [69.6, 74.2, "Твоят проект е следващият. carbonstealth.eu"]
]);
var T_INTRO = 0, T_CAPS = 4, T_PROD = 11, PD = 4.8, T_TRUST = T_PROD + PRODUCTS.length * PD, T_OUT = 69, T_END = 75;
var SUBS = !/subs=0/.test(location.search);

// ─── помощни ─────────────────────────────────────────────────────────────────
function cl(x, a, b) { return Math.max(a, Math.min(b, x)); }
function seg(t, a, b) { return cl((t - a) / (b - a), 0, 1); }
function eo(x) { return 1 - Math.pow(1 - x, 3); }
function eio(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function $(q, r) { return (r || document).querySelector(q); }
function el(tag, cls, html, parent) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function regs(parent, x, y, w, h) {
  [[0, 0, "2px 0 0 2px"], [1, 0, "2px 2px 0 0"], [0, 1, "0 0 2px 2px"], [1, 1, "0 2px 2px 0"]].forEach(function (c) {
    var r = el("i", "reg", null, parent); r.style.left = (x + c[0] * w - (c[0] ? 18 : 0) + (c[0] ? 10 : -10)) + "px"; r.style.top = (y + c[1] * h - (c[1] ? 18 : 0) + (c[1] ? 10 : -10)) + "px";
    r.style.borderWidth = ["2px 0 0 2px", "2px 2px 0 0", "0 0 2px 2px", "0 2px 2px 0"][c[0] + c[1] * 2];
  });
}
function dim(parent, x, y, w, label, vertical) { var d = el("div", "dim", "<span>" + label + "</span>", parent); d.style.left = x + "px"; d.style.top = y + "px"; d.style.width = w + "px"; return d; }
// background-clip:text does not reach into transformed children, so each digit carries the chrome itself
function drumHTML(n) { return "<span class='drum'><span>" + "0123456789".split("").map(function (d) { return "<span class='chrome'>" + d + "</span>"; }).join("") + "</span></span>"; }

// ─── сцени на продуктите ─────────────────────────────────────────────────────
var prods = $("#prods"), PS = [];
PRODUCTS.forEach(function (p, i) {
  var s = el("div", "scene prod", null, prods); s.style.zIndex = 10 + i;
  el("div", "", null, s).style.cssText = "position:absolute;inset:0;background:inherit";
  var bgc = el("div", "", null, s); bgc.style.cssText = "position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 70% 45%,rgba(0,229,255,.05),transparent 70%),#0A0C0E";
  var o = { s: s, p: p };
  o.eye = el("div", "eye mono", String(i + 1).padStart(2, "0") + " / " + PRODUCTS.length + " · " + p.tag, s);
  o.name = el("div", "name disp chrome", p.name, s);
  o.desc = el("div", "desc", p.desc, s);
  o.foot = el("div", "foot mono", p.wip ? "<i></i>в разработка" : "<i></i>на живо · заснето от сайта", s);
  if (!p.wip) {
    o.desk = el("div", "dev desk", null, s); o.dImg = el("img", "", null, o.desk); o.dImg.src = "/shots/" + p.id + "-d.jpg";
    o.phone = el("div", "dev phone", null, s); o.mImg = el("img", "", null, o.phone); o.mImg.src = "/shots/" + p.id + "-m.jpg";
    o.deco = el("div", "", null, s); o.deco.style.cssText = "position:absolute;inset:0";
    regs(o.deco, 770, 180, 1060, 663);
    dim(o.deco, 770, 146, 1060, "1440 × 900");
    var dv = dim(o.deco, 1590, 985, 256, "390 × 844");
  } else {
    o.bp = el("div", "", blueprint(), s); o.bp.style.cssText = "position:absolute;left:820px;top:150px;width:960px;height:760px";
    o.stamp = el("div", "stamp mono", "В разработка", s); o.stamp.style.left = "1330px"; o.stamp.style.top = "760px";
  }
  if (p.verified) {
    o.seal = el("div", "seal mono", '<svg width="64" height="64" viewBox="0 0 24 24"><path fill="#8ab4f8" d="M12 1l2.6 2.2 3.4-.4 1 3.3 3 1.6-1 3.3 1 3.3-3 1.6-1 3.3-3.4-.4L12 23l-2.6-2.2-3.4.4-1-3.3-3-1.6 1-3.3-1-3.3 3-1.6 1-3.3 3.4.4z"/><path fill="none" stroke="#0A0C0E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.5 12.3l3 3 6-6.3"/></svg><div><div class="t1">Verified Publisher</div><div class="t2">Chrome Web Store</div><div class="t3">Created by the owner of the listed website · no history of violations</div></div>', s);
  }
  o.scan = el("div", "scan", null, s);
  PS.push(o);
});

// чертеж на шахта (Lift Pilot): само геометрия и имената на нормите, без стойности от тях
function blueprint() {
  var g = "<svg width='960' height='760' viewBox='0 0 960 760' fill='none' stroke-linecap='round'>";
  for (var x = 0; x <= 960; x += 40) g += "<line x1='" + x + "' y1='0' x2='" + x + "' y2='760' stroke='rgba(0,229,255,.07)'/>";
  for (var y = 0; y <= 760; y += 40) g += "<line x1='0' y1='" + y + "' x2='960' y2='" + y + "' stroke='rgba(0,229,255,.07)'/>";
  g += "<rect x='300' y='60' width='360' height='640' stroke='#00e5ff' stroke-width='2'/>";                       // шахта
  g += "<line x1='330' y1='60' x2='330' y2='700' stroke='rgba(0,229,255,.45)' stroke-dasharray='8 8'/><line x1='630' y1='60' x2='630' y2='700' stroke='rgba(0,229,255,.45)' stroke-dasharray='8 8'/>";
  g += "<g id='car'><rect x='350' y='0' width='190' height='200' stroke='#C9D1D6' stroke-width='2'/><line x1='445' y1='0' x2='445' y2='-60' stroke='#C9D1D6'/><text x='445' y='110' fill='#C9D1D6' font-family='Space Mono' font-size='16' text-anchor='middle' stroke='none'>CABINA</text></g>";
  g += "<g id='cw'><rect x='575' y='0' width='40' height='120' stroke='#7C868D' stroke-width='2'/></g>";
  g += "<line x1='240' y1='60' x2='240' y2='700' stroke='#00e5ff'/><line x1='230' y1='60' x2='250' y2='60' stroke='#00e5ff'/><line x1='230' y1='700' x2='250' y2='700' stroke='#00e5ff'/>";
  g += "<text x='225' y='385' fill='#00e5ff' font-family='Space Mono' font-size='16' text-anchor='end' stroke='none'>CORSA</text>";
  g += "<line x1='300' y1='735' x2='660' y2='735' stroke='#00e5ff'/><text x='480' y='728' fill='#00e5ff' font-family='Space Mono' font-size='16' text-anchor='middle' stroke='none'>VANO</text>";
  g += "<text x='700' y='110' fill='#7C868D' font-family='Space Mono' font-size='18' stroke='none'>EN 81-20</text><text x='700' y='140' fill='#7C868D' font-family='Space Mono' font-size='18' stroke='none'>EN 81-50</text>";
  g += "<g id='chk' font-family='Space Mono' font-size='18' stroke='none'><text x='700' y='230' fill='#C9D1D6'>verifica fossa</text><text x='700' y='265' fill='#C9D1D6'>verifica testata</text><text x='700' y='300' fill='#C9D1D6'>porte di piano</text></g>";
  return g + "</svg>";
}

// ─── вход: сцената с услугите ───────────────────────────────────────────────
var caps = $("#caps"), CI = [];
CAPS.forEach(function (c, i) {
  var it = el("div", "item", "<div class='n mono'>" + String(i + 1).padStart(2, "0") + "</div><div class='w disp'>" + c + "</div><div class='u'></div>", caps);
  it.style.left = (i < 4 ? 120 : 1000) + "px"; it.style.top = (390 + (i % 4) * 140) + "px"; CI.push(it);
});
$("#d1").innerHTML = drumHTML() + drumHTML(); $("#d2").innerHTML = drumHTML(); $("#d3").innerHTML = drumHTML();

// ─── рендер на кадър ─────────────────────────────────────────────────────────
function show(e, a) { e.style.opacity = a; }
function setDrum(root, digits, p) {
  var ds = root.querySelectorAll(".drum>span");
  digits.forEach(function (d, i) { var k = eo(seg(p, i * .12, .7 + i * .12)); ds[i].style.transform = "translateY(" + (-d * k) + "em)"; });
}
window.render = function (t) {
  $("#tc").textContent = "";
  // intro
  var I = $("#intro"), li = seg(t, 0, 4);
  show(I, t < 4.2 ? 1 - seg(t, 3.55, 4.0) : 0);
