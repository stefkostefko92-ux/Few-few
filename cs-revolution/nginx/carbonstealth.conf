server {
    listen 80;
    server_name carbonstealth.eu www.carbonstealth.eu;
    return 301 https://carbonstealth.eu$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.carbonstealth.eu;
    ssl_certificate /etc/letsencrypt/live/carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carbonstealth.eu/privkey.pem;
    return 301 https://carbonstealth.eu$request_uri;
}

server {
    listen 443 ssl http2;
    server_name carbonstealth.eu;

    # 301 REDIRECTS: Old Italian slugs -> Localized slugs
    rewrite ^/en/servizi/?$ /en/services/ permanent;
    rewrite ^/en/servizi/sviluppo-siti-web/?$ /en/services/web-development/ permanent;
    rewrite ^/en/servizi/ecommerce/?$ /en/services/ecommerce/ permanent;
    rewrite ^/en/servizi/sviluppo-software/?$ /en/services/software-development/ permanent;
    rewrite ^/en/servizi/erp/?$ /en/services/erp/ permanent;
    rewrite ^/en/servizi/app-mobile/?$ /en/services/mobile-apps/ permanent;
    rewrite ^/en/servizi/seo/?$ /en/services/seo/ permanent;
    rewrite ^/en/servizi/hosting/?$ /en/services/hosting/ permanent;
    rewrite ^/en/chi-siamo/?$ /en/about/ permanent;
    rewrite ^/en/contatti/?$ /en/contact/ permanent;
    rewrite ^/en/termini/?$ /en/terms/ permanent;
    rewrite ^/bg/servizi/?$ /bg/uslugi/ permanent;
    rewrite ^/bg/servizi/sviluppo-siti-web/?$ /bg/uslugi/web-razrabotka/ permanent;
    rewrite ^/bg/servizi/ecommerce/?$ /bg/uslugi/ecommerce/ permanent;
    rewrite ^/bg/servizi/sviluppo-software/?$ /bg/uslugi/softuer/ permanent;
    rewrite ^/bg/servizi/erp/?$ /bg/uslugi/erp/ permanent;
    rewrite ^/bg/servizi/app-mobile/?$ /bg/uslugi/mobilni-prilozheniya/ permanent;
    rewrite ^/bg/servizi/seo/?$ /bg/uslugi/seo/ permanent;
    rewrite ^/bg/servizi/hosting/?$ /bg/uslugi/hosting/ permanent;
    rewrite ^/bg/chi-siamo/?$ /bg/za-nas/ permanent;
    rewrite ^/bg/contatti/?$ /bg/kontakti/ permanent;
    rewrite ^/bg/termini/?$ /bg/usloviya/ permanent;

    ssl_certificate /etc/letsencrypt/live/carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/carbonstealth.eu;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://analytics.carbonstealth.eu; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://ipapi.co https://analytics.carbonstealth.eu https://*.carbonstealth.eu https://ouvaptsarov.com https://vizitka-bg.com https://mastilko-bg.com; img-src 'self' data: blob:; media-src 'self'; worker-src 'self' blob:;" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets — aggressive cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        access_log off;
    }

    # No cache for HTML (include security headers — nginx drops parent add_header in child blocks)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://analytics.carbonstealth.eu; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://ipapi.co https://analytics.carbonstealth.eu https://*.carbonstealth.eu https://ouvaptsarov.com https://vizitka-bg.com https://mastilko-bg.com; img-src 'self' data: blob:; media-src 'self'; worker-src 'self' blob:;" always;
    }

    # Robots.txt — force text/plain
    location = /robots.txt {
        types { }
        default_type "text/plain; charset=utf-8";
    }

    # Never serve PII logs or server-side include-only PHP files (highest-priority prefix/regex)
    location ^~ /api/logs/ { deny all; return 404; }
    location ~ ^/api/(_auth|config|email-templates)\.php$ { deny all; return 404; }

    # PHP API
    location /api/ {
        alias /var/www/carbonstealth.eu/api/;
        index index.php;

        # Block direct access to logs
        location ~ ^/api/logs/ {
            deny all;
            return 404;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            include fastcgi_params;
            # Explicit path — with alias + nested location, $request_filename can
            # resolve to a directory ("Primary script unknown"). Build it from the
            # webroot + script name instead so it always points at the real file.
            fastcgi_param SCRIPT_FILENAME /var/www/carbonstealth.eu$fastcgi_script_name;
            fastcgi_read_timeout 180;
        }
    }

    # /test/ analyzer — static HTML (not SPA)
    location = /test/ {
        try_files /test/index.html =404;
    }
    location = /en/test/ {
        try_files /en/test/index.html =404;
    }
    location = /bg/test/ {
        try_files /bg/test/index.html =404;
    }

    # Static pages — serve actual HTML files before SPA fallback
    location ~ ^/(servizi|chi-siamo|portfolio|blog|contatti|privacy|cookie|termini|geo)/ {
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ~ ^/en/(services|about|contact|portfolio|blog|privacy|cookie|terms|geo)/ {
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ~ ^/bg/(uslugi|za-nas|kontakti|portfolio|blog|privacy|cookie|usloviya|geo)/ {
        try_files $uri $uri/ $uri/index.html =404;
    }
    location = /en/ {
        try_files /en/index.html =404;
    }
    location = /bg/ {
        try_files /bg/index.html =404;
    }

    # SPA fallback — homepage and unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block exploits
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }
    location ~ (wp-admin|wp-login|xmlrpc|phpinfo|phpmyadmin) {
        deny all;
        return 404;
    }
    if ($query_string ~* "union.*select|insert.*into|delete.*from|drop.*table|<script") {
        return 403;
    }
    if ($http_user_agent ~* "masscan|sqlmap|nikto|nuclei|acunetix|libwww-perl") {
        return 403;
    }

    # Rate limiting
    limit_req zone=cs_limit burst=60 nodelay;

    # Logging
    access_log /var/log/nginx/carbonstealth.access.log;
    error_log /var/log/nginx/carbonstealth.error.log;
}
