# Nginx пред агентския шлюз. Смени agents.example.eu с реалния домейн.
# Зоните са в http контекста: файлът се включва от sites-enabled/ вътре в http {}.
limit_req_zone $binary_remote_addr zone=agentgw:10m rate=30r/m;
# /widget.js е статичен скрипт, който всяка страница с джаджата тегли — по-щедра зона,
# но с таван, за да не се ползва шлюзът като безплатен усилвател на трафик.
limit_req_zone $binary_remote_addr zone=agentgw_widget:10m rate=120r/m;

# Анонимен лог (agentgw/CLAUDE.md: логове без съдържание, без ключ, без IP). За разлика от
# viz_anon във vizitka тук няма и съкратен IP; $uri е без query низа, User-Agent и Referer липсват.
log_format agentgw_anon '[$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name agents.example.eu;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agents.example.eu;

    ssl_certificate     /etc/letsencrypt/live/agents.example.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agents.example.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    limit_req_status 429;
    client_max_body_size 128k;
    # Без логове на тела; достъп-логът пази само метод/път/статус (формат agentgw_anon горе).
    access_log /var/log/nginx/agentgw.access.log agentgw_anon;

    location = /widget.js {
        limit_req zone=agentgw_widget burst=30 nodelay;
        proxy_pass http://127.0.0.1:3070;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=agentgw burst=10 nodelay;
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE: без буфериране, дълго четене (шлюзът прекъсва сам на 90 s)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
