# Nginx пред агентския шлюз. Смени agents.example.eu с реалния домейн.
limit_req_zone $binary_remote_addr zone=agentgw:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name agents.example.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agents.example.eu;

    ssl_certificate     /etc/letsencrypt/live/agents.example.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agents.example.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128k;
    # Без логове на тела; достъп-логът пази само метод/път/статус.
    access_log /var/log/nginx/agentgw.access.log;

    location = /widget.js {
        proxy_pass http://127.0.0.1:3070;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=agentgw burst=10 nodelay;
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE: без буфериране, дълго четене (шлюзът прекъсва сам на 90 s)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
