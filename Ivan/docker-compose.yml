services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: sklad
      POSTGRES_USER: sklad_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SkladSecure2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sklad_user -d sklad"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sklad_user:${DB_PASSWORD:-SkladSecure2026!}@postgres:5432/sklad
      JWT_SECRET: ${JWT_SECRET:-SkladJWT2026SuperSecret!}
      PORT: 4000
    ports:
      - "127.0.0.1:4100:4000"

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4180:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
