server {
    listen 80;
    server_name sklad.carbonstealth.eu;
    # Позволява подновяването на Let's Encrypt по webroot (challenge файлът
    # трябва да се сервира по http, ПРЕДИ пренасочването към https).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sklad.carbonstealth.eu;
    ssl_certificate /etc/letsencrypt/live/sklad.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sklad.carbonstealth.eu/privkey.pem;
    client_max_body_size 10M;
    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # React и Babel са от unpkg с SRI (integrity в index.html); Babel изпълнява JSX като вграден скрипт
    # (затова 'unsafe-inline', но без 'unsafe-eval'). connect-src 'self': данните не излизат към чужд адрес.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
