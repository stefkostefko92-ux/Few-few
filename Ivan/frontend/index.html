let JWT = localStorage.getItem("sklad-jwt") || "";
const apiCall = async (path, opts = {}) => {
  const res = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", ...(JWT ? { Authorization: "Bearer " + JWT } : {}) },
    ...(opts.body ? { body: JSON.stringify(opts.body) } : {}),
  });
  if (res.status === 401) { JWT = ""; localStorage.removeItem("sklad-jwt"); throw new Error("AUTH"); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Грешка");
  return data;
};

  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>@media print{@page{margin:12mm}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none!important}}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;color:#1a1a2e;padding:20px;font-size:13px}.header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #e8a032;padding-bottom:14px;margin-bottom:20px}.header h1{font-size:20px;color:#1a1a2e}.header .sub{color:#667;font-size:12px}.meta{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}.meta span{font-size:12px;color:#555}.meta strong{color:#1a1a2e}table{width:100%;border-collapse:collapse;margin-bottom:16px}th{background:#f5f0e8;color:#1a1a2e;font-weight:700;font-size:11px;text-transform:uppercase;padding:8px 10px;text-align:left;border-bottom:2px solid #e8a032}td{padding:8px 10px;border-bottom:1px solid #e8e8e8;font-size:12px}tr:nth-child(even){background:#fafaf8}.mono{font-family:'Courier New',monospace}.right{text-align:right}.total-row{font-weight:700;background:#f5f0e8!important;border-top:2px solid #e8a032}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}.low{color:#dc2626;background:#fef2f2}.mid{color:#d97706;background:#fffbeb}.ok{color:#16a34a;background:#f0fdf4}.notes{margin-top:10px;padding:10px 14px;background:#f9f9f6;border-left:3px solid #e8a032;font-style:italic;color:#555;font-size:12px}.footer{margin-top:20px;padding-top:12px;border-top:1px solid #ddd;text-align:center;color:#999;font-size:10px}</style></head><body><div class="no-print" style="margin-bottom:16px"><button onclick="window.print()" style="background:#e8a032;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-right:8px">Принтирай</button><button onclick="window.close()" style="background:#667;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer">Затвори</button></div>${content}<div class="footer">СКЛАД АВТОЧАСТИ — ${new Date().toLocaleString("bg-BG")}</div></body></html>`);
  w.document.close();
}

  const tq=parts.reduce((s,p)=>s+p.quantita,0), tv=parts.reduce((s,p)=>s+p.quantita*p.prezzo,0);

}

  const [toast, setToast] = useState({ message: "", type: "" });

  const [dashSearch, setDashSearch] = useState("");
  const [tipoFilter, setTipoFilter] = useState("");
  const [tipoSub, setTipoSub] = useState([]);
  const [editModal, setEditModal] = useState(null);
  const [addModal, setAddModal] = useState(false);

  const [orderSearch, setOrderSearch] = useState("");
  const [ordersSearch, setOrdersSearch] = useState("");
  const [orderHistory, setOrderHistory] = useState(false);
  const [userModal, setUserModal] = useState(null);
  const [addUserModal, setAddUserModal] = useState(false);
  const [showNotif, setShowNotif] = useState(false);
  const [auditFilter, setAuditFilter] = useState("ALL");
  const [moreMenu, setMoreMenu] = useState(false);
  const [cartOpen, setCartOpen] = useState(false);
  const [detailPart, setDetailPart] = useState(null);
  const [showRoleEditor, setShowRoleEditor] = useState(false);
  const [newRoleModal, setNewRoleModal] = useState(false);
  const builtinRoles = ["SUPER_ADMIN","ADMIN","VIEWER_PRICE","VIEWER"];
  const perms = user ? (roles[user.ruolo] || {}) : {};

  const showToast = useCallback((m, t="success") => { setToast({message:m,type:t}); setTimeout(()=>setToast({message:"",type:""}),2500); }, []);

  const fetchAll = useCallback(async () => {
    try {
      const [p, o, r, au, s, n] = await Promise.all([
        apiCall("/parts"), apiCall("/orders"), apiCall("/roles"),
        apiCall("/audit").catch(()=>[]), apiCall("/settings").catch(()=>DEFAULT_SETTINGS),
        apiCall("/notifications").catch(()=>[]),
      ]);
      setParts(p); setOrders(o); setRoles(r); setAuditLog(au); setSettings(s); setNotifications(n);
      try { setUsers(await apiCall("/users")); } catch(e) {}
    } catch (e) { if (e.message === "AUTH") { setUser(null); return; } }
    setLoading(false);
  }, []);
  useEffect(() => { if (user) fetchAll(); }, [user, fetchAll]);

  const refreshAudit = useCallback(async () => {
    try { const [au,n] = await Promise.all([apiCall("/audit").catch(()=>[]),apiCall("/notifications").catch(()=>[])]); setAuditLog(au); setNotifications(n); } catch(e) {}
  }, []);

  const unread = useMemo(()=>notifications.filter(n=>!n.read).length,[notifications]);
  const dashData = useMemo(() => {
    const tp=parts.reduce((s,p)=>s+p.quantita,0), tv=parts.reduce((s,p)=>s+p.quantita*p.prezzo,0);
    const brands=[...new Set(parts.map(p=>p.marchio))], lowTh=settings.lowStockThreshold||10, low=parts.filter(p=>p.quantita<=lowTh);
    const bb=brands.map(b=>{const bp=parts.filter(p=>p.marchio===b);return{m:b,pz:bp.reduce((s,p)=>s+p.quantita,0),a:bp.length,v:bp.reduce((s,p)=>s+p.quantita*p.prezzo,0)}}).sort((a,b)=>b.pz-a.pz);
    // Group by code — sum across different К/Т
    const codes=[...new Set(parts.map(p=>p.codice))];
    const bc=codes.map(c=>{const cp=parts.filter(p=>p.codice===c);return{code:c,marchio:cp[0].marchio,rawTipo:cp[0].tipo||"",rawTipoValue:cp[0].tipoValue||"",tipo:cp[0].tipo?(cp[0].tipo==="DYUZA"?"Дюза":"ГНП")+(cp[0].tipoValue?": "+cp[0].tipoValue:""):"",tubes:cp.map(p=>p.riferimento),totalQty:cp.reduce((s,p)=>s+p.quantita,0),totalVal:cp.reduce((s,p)=>s+p.quantita*p.prezzo,0),avgPrice:cp.length?cp.reduce((s,p)=>s+p.prezzo,0)/cp.length:0,count:cp.length}}).sort((a,b)=>a.code.localeCompare(b.code));
    return{tp,tv,bc:brands.length,low,bb,ta:parts.length,byCode:bc};
  }, [parts,settings]);
  const applyTipo = useCallback((list) => {
    if (!tipoFilter) return list;
    let r = list.filter(p => p.tipo === tipoFilter);
    if (tipoSub.length > 0) {
      if (tipoFilter === "DYUZA") r = r.filter(p => tipoSub.includes(p.tipoValue));
      else r = r.filter(p => tipoSub.some(b => (p.tipoValue||"").split(",").map(x=>x.trim()).includes(b)));
    }
    return r;

                              <I.Trash />
                            </button>
                          ) : <span style={{ fontSize:10, color:"#334" }}>—</span>}
                        </td>}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {showRoleEditor && (
                <div style={{ padding:"12px 16px", borderTop:"1px solid rgba(255,255,255,0.06)", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8 }}>
                  <span style={{ color:"#667788", fontSize:12 }}>Супер Админ не може да се ограничава. Вградените роли не могат да се трият.</span>
                  <div style={{ display:"flex", gap:8 }}>
                    <Btn variant="primary" onClick={()=>setNewRoleModal(true)} style={{ padding:"8px 14px", fontSize:12, minHeight:34 }}><I.Plus /> Нова роля</Btn>
                    <Btn variant="danger" onClick={()=>{if(confirm("Възстанови правата по подразбиране?")){apiCall("/roles/reset",{method:"POST"}).then(()=>apiCall("/roles")).then(r=>setRoles(r)).catch(e=>showToast(e.message,"error"))}}} style={{ padding:"8px 14px", fontSize:12, minHeight:34 }}><I.Clear /> Нулирай</Btn>
                  </div>
                </div>
              )}
            </div>

            {/* ─── User List ─── */}
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {users.map(u=>(
                <div key={u.id} style={{ background:"rgba(255,255,255,0.03)", border:u.id===user.id?"1px solid rgba(232,160,50,0.3)":"1px solid rgba(255,255,255,0.06)", borderRadius:14, padding: mob?"14px":"16px 20px" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
                    <div>
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}><span style={{ fontSize:15, fontWeight:600 }}>{u.nome}</span>{u.id===user.id && <span style={{ fontSize:10, background:"rgba(232,160,50,0.15)", color:"#e8a032", padding:"2px 8px", borderRadius:6 }}>Ти</span>}</div>
                      <div style={{ fontSize:12, color:"#667788", marginTop:3 }}>{u.email}</div>
                      {/* Inline permission badges */}
                      <div style={{ display:"flex", flexWrap:"wrap", gap:4, marginTop:6 }}>
                        {roles[u.ruolo] && PERM_KEYS.filter(k=>roles[u.ruolo][k]).map(k=>(
                          <span key={k} style={{ fontSize:10, padding:"2px 7px", borderRadius:5, background:"rgba(34,197,94,0.08)", border:"1px solid rgba(34,197,94,0.15)", color:"#22c55e" }}>{PERM_LABELS[k]}</span>
                        ))}
                      </div>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                      <span style={{ fontSize:12, fontWeight:600, color:"#a78bfa", background:"rgba(167,139,250,0.1)", padding:"4px 12px", borderRadius:8 }}>{roles[u.ruolo]?.label||u.ruolo}</span>
                      <button onClick={()=>setUserModal(u)} style={{ background:"rgba(96,165,250,0.1)", border:"1px solid rgba(96,165,250,0.2)", borderRadius:8, width:36, height:36, display:"flex", alignItems:"center", justifyContent:"center", color:"#60a5fa" }}><I.Edit /></button>
                      <button onClick={()=>{if(confirm("Изтриване?"))delUser(u.id)}} disabled={u.id===user.id} style={{ background:u.id===user.id?"rgba(255,255,255,0.02)":"rgba(239,68,68,0.1)", border:u.id===user.id?"1px solid rgba(255,255,255,0.04)":"1px solid rgba(239,68,68,0.2)", borderRadius:8, width:36, height:36, display:"flex", alignItems:"center", justifyContent:"center", color:u.id===user.id?"#334":"#ef4444", opacity:u.id===user.id?0.3:1 }}><I.Trash /></button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ═══ ОДИТ ═══ */}
        {tab==="audit" && perms.canAudit && (
          <div style={{ animation:"fadeIn 0.3s" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:10 }}>
              <h2 style={{ color:"#ccd6e0", fontSize: mob?16:18, fontWeight:600, margin:0 }}>Одит лог</h2>
              <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                <select value={auditFilter} onChange={e=>setAuditFilter(e.target.value)} style={{ ...inp(), width:"auto", padding:"8px 12px", fontSize:12 }}>
                  <option value="ALL">Всички</option>
                  {Object.entries(ACTION_TYPES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                </select>
                <span style={{ color:"#556677", fontSize:12, fontFamily:"'JetBrains Mono',monospace" }}>{fAudit.length}</span>

              </div>
            </div>
            <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:14, overflow:"hidden" }}>
              {fAudit.length===0?<div style={{ padding:50, textAlign:"center", color:"#445566" }}>Няма записи</div>:
              <div style={{ maxHeight:600, overflowY:"auto" }}>{fAudit.map((e,i)=>{
                const at=ACTION_TYPES[e.action]||{label:e.action,color:"#667"};
                return(<div key={e.id} style={{ padding: mob?"12px 14px":"14px 20px", borderBottom:"1px solid rgba(255,255,255,0.03)", background:i%2===0?"transparent":"rgba(255,255,255,0.01)" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:4, marginBottom:4 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
                      <span style={{ fontSize:12, fontWeight:600, color:at.color }}>{at.label}</span>
                      <span style={{ fontSize:12, color:"#ccd6e0", fontWeight:500 }}>{e.userName}</span>
                      <span style={{ fontSize:10, color:"#556677", background:"rgba(255,255,255,0.04)", padding:"1px 6px", borderRadius:4 }}>{roles[e.userRole]?.label||e.userRole}</span>
                    </div>
                    <span style={{ fontSize:11, color:"#556677", fontFamily:"'JetBrains Mono',monospace" }}>{mob?fmtDateShort(e.timestamp):fmtDate(e.timestamp)}</span>
                  </div>
                  <div style={{ fontSize:13, color:"#99aabb" }}>{e.description}</div>
                  {e.details && <div style={{ fontSize:12, color:"#667788", marginTop:4, fontFamily:"'JetBrains Mono',monospace", background:"rgba(255,255,255,0.02)", padding:"5px 8px", borderRadius:6, wordBreak:"break-all" }}>{e.details}</div>}

        {/* ═══ НАСТРОЙКИ ═══ */}
        {tab==="settings" && perms.canSettings && (
          <div style={{ animation:"fadeIn 0.3s", maxWidth:640 }}>
            <h2 style={{ color:"#ccd6e0", fontSize: mob?16:18, fontWeight:600, margin:"0 0 20px" }}>Настройки</h2>
            <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:14, padding: mob?18:24, marginBottom:16 }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:18 }}><I.Mail /><h3 style={{ color:"#e8a032", fontSize:15, fontWeight:600, margin:0 }}>Имейл известия</h3></div>

                <ToggleRow label="Активирай имейл известия" on={settings.emailEnabled} toggle={()=>{const ns={...settings,emailEnabled:!settings.emailEnabled};setSettings(ns);apiCall("/settings",{method:"PUT",body:ns})}} />
                {settings.emailEnabled && (<>
                  <Field label="Имейл"><input value={settings.notifyEmail} onChange={e=>setSettings(s=>({...s,notifyEmail:e.target.value}))} style={inp()} placeholder="admin@firma.bg" type="email" onBlur={()=>apiCall("/settings",{method:"PUT",body:settings}).catch(()=>{})} /></Field>
                  <div style={{ borderTop:"1px solid rgba(255,255,255,0.06)", paddingTop:14 }}>
                    <div style={{ color:"#8899aa", fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:1, marginBottom:10 }}>Известия при:</div>
                    <ToggleRow label="Промяна на артикул" on={settings.notifyOnPartChange} toggle={()=>{const ns={...settings,notifyOnPartChange:!settings.notifyOnPartChange};setSettings(ns);apiCall("/settings",{method:"PUT",body:ns})}} />
                    <ToggleRow label="Нова поръчка" on={settings.notifyOnOrder} toggle={()=>{const ns={...settings,notifyOnOrder:!settings.notifyOnOrder};setSettings(ns);apiCall("/settings",{method:"PUT",body:ns})}} />
                    <ToggleRow label="Промяна на потребител" on={settings.notifyOnUserChange} toggle={()=>{const ns={...settings,notifyOnUserChange:!settings.notifyOnUserChange};setSettings(ns);apiCall("/settings",{method:"PUT",body:ns})}} />
                  </div>
                  {settings.notifyEmail && <div style={{ background:"rgba(34,197,94,0.08)", border:"1px solid rgba(34,197,94,0.2)", borderRadius:10, padding:"10px 14px", fontSize:13, color:"#22c55e", display:"flex", alignItems:"center", gap:8 }}><I.Check /> Известия на: <strong>{settings.notifyEmail}</strong></div>}
                </>)}
              </div>
            </div>
            {/* Low stock settings */}
            <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:14, padding: mob?18:24, marginBottom:16 }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:18 }}><I.Warning /><h3 style={{ color:"#ef4444", fontSize:15, fontWeight:600, margin:0 }}>Ниска наличност</h3></div>
              <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                <ToggleRow label="Показвай предупреждение за ниска наличност" on={settings.lowStockEnabled!==false} toggle={()=>{const ns={...settings,lowStockEnabled:!settings.lowStockEnabled};setSettings(ns);apiCall("/settings",{method:"PUT",body:ns})}} />
                {settings.lowStockEnabled!==false && (
                  <div>
                    <label style={{ color:"#8899aa", fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:1, marginBottom:6, display:"block" }}>Праг (бройки ≤)</label>
                    <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                      <input type="number" min={1} max={999} value={settings.lowStockThreshold||10} onChange={e=>{const ns={...settings,lowStockThreshold:parseInt(e.target.value)||10};setSettings(ns);apiCall("/settings",{method:"PUT",body:ns}).catch(()=>{})}} style={{ ...inp(true), width:100, textAlign:"center", fontSize:18 }} />
                      <span style={{ color:"#667788", fontSize:13 }}>Артикули с ≤ <strong style={{ color:"#ef4444" }}>{settings.lowStockThreshold||10}</strong> бр. ще се маркират</span>
                    </div>
                    <div style={{ marginTop:12, fontSize:12, color:"#556677" }}>Засегнати артикули: <strong style={{ color:"#f87171" }}>{parts.filter(p=>p.quantita<=(settings.lowStockThreshold||10)).length}</strong> от {parts.length}</div>
                  </div>
                )}
              </div>
            </div>
            <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:14, padding: mob?18:24 }}>
              <h3 style={{ color:"#ccd6e0", fontSize:14, fontWeight:600, margin:"0 0 14px" }}>Система</h3>
              {[["Артикули",parts.length],["Бройки",fmtN(dashData.tp)],["Поръчки",orders.length],["Одит записи",auditLog.length],["Потребители",users.length]].map(([l,v])=>(<div key={l} style={{ display:"flex", justifyContent:"space-between", padding:"7px 0", borderBottom:"1px solid rgba(255,255,255,0.03)" }}><span style={{ color:"#8899aa", fontSize:13 }}>{l}</span><span style={{ color:"#e0e8f0", fontSize:13, fontWeight:600, fontFamily:"'JetBrains Mono',monospace" }}>{v}</span></div>))}
            </div>
          </div>
        )}
      </div>

      {/* Modals */}
      {(addModal||editModal) && <PartForm part={editModal} onSave={savePart} onClose={()=>{setEditModal(null);setAddModal(false)}} sp={perms.canSeePrice} />}
      {(addUserModal||userModal) && <UserForm usr={userModal} onSave={saveUser} onClose={()=>{setUserModal(null);setAddUserModal(false)}} roles={roles} />}
      {detailPart && <PartDetailModal part={detailPart} onClose={()=>setDetailPart(null)} canSeePrice={perms.canSeePrice} sameBrandParts={parts.filter(p=>p.marchio===detailPart.marchio)} onSelect={showDetail} />}
      {newRoleModal && <NewRoleModal onClose={()=>setNewRoleModal(false)} existingKeys={Object.keys(roles)} onSave={async(key,role)=>{try{await apiCall("/roles",{method:"POST",body:{id:key,...role}});setRoles(await apiCall("/roles"));setNewRoleModal(false);showToast("Роля "+role.label+" създадена")}catch(e){showToast(e.message,"error")}}} />}
    </div>
  );
}

// ─── Toggle ───
function ToggleRow({ label, on, toggle }) {
  return (<div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"6px 0" }}>
    <span style={{ color:"#ccd6e0", fontSize:14 }}>{label}</span>
    <button onClick={toggle} style={{ width:48, height:28, borderRadius:14, border:"none", background:on?"#22c55e":"rgba(255,255,255,0.1)", position:"relative", transition:"background 0.2s", flexShrink:0 }}>
      <div style={{ width:22, height:22, borderRadius:11, background:"#fff", position:"absolute", top:3, left:on?23:3, transition:"left 0.2s", boxShadow:"0 2px 4px rgba(0,0,0,0.3)" }}/>
    </button>
  </div>);
}

// ─── Cart Panel ───
function CartPanel({ cart, cartTot, orderNote, setOrderNote, clientName, setClientName, clientPhone, setClientPhone, updCart, rmCart, submitOrder, sp, onClose, onDetail }) {
  return (
    <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:14, overflow:"hidden" }}>
      <div style={{ padding:"14px 18px", borderBottom:"1px solid rgba(255,255,255,0.06)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <h3 style={{ color:"#e8a032", fontSize:15, fontWeight:700, margin:0 }}>Количка <span style={{ color:"#667788", fontWeight:400, fontSize:13 }}>({cart.length})</span></h3>
        {onClose && <button onClick={onClose} style={{ background:"rgba(255,255,255,0.06)", border:"none", borderRadius:10, width:36, height:36, display:"flex", alignItems:"center", justifyContent:"center", color:"#8899aa" }}><I.X /></button>}
      </div>
      <div style={{ maxHeight:260, overflowY:"auto" }}>
        {cart.length===0?<div style={{ padding:30, textAlign:"center", color:"#445566", fontSize:13 }}>Празна</div>:

          <div key={c.id} style={{ padding:"12px 18px", borderBottom:"1px solid rgba(255,255,255,0.03)", display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:12, fontFamily:"'JetBrains Mono',monospace", color:"#e8a032", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", cursor: onDetail?"pointer":"default", borderBottom: onDetail?"1px dashed rgba(232,160,50,0.4)":"none" }} onClick={()=>onDetail&&onDetail(c.id)}>{c.codice}</div>
              <div style={{ fontSize:12, color:"#667788", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.marchio}</div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:2 }}>
              <button onClick={()=>updCart(c.id,-1)} style={{ width:32, height:32, borderRadius:8, border:"none", background:"rgba(255,255,255,0.06)", display:"flex", alignItems:"center", justifyContent:"center", color:"#8899aa" }}><I.Minus /></button>
              <span style={{ width:32, textAlign:"center", fontFamily:"'JetBrains Mono',monospace", fontSize:15, fontWeight:700, color:"#e0e8f0" }}>{c.qty}</span>
              <button onClick={()=>updCart(c.id,1)} style={{ width:32, height:32, borderRadius:8, border:"none", background:"rgba(255,255,255,0.06)", display:"flex", alignItems:"center", justifyContent:"center", color:"#8899aa" }}><I.Plus /></button>
            </div>
            {sp && <div style={{ width:65, textAlign:"right", fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:"#60a5fa" }}>{fmt(c.qty*c.prezzo)}</div>}
            <button onClick={()=>rmCart(c.id)} style={{ width:32, height:32, borderRadius:8, border:"none", background:"rgba(239,68,68,0.08)", display:"flex", alignItems:"center", justifyContent:"center", color:"#ef4444" }}><I.X /></button>
          </div>
        ))}
      </div>
      <div style={{ padding:"14px 18px", borderTop:"1px solid rgba(255,255,255,0.06)", display:"flex", flexDirection:"column", gap:10 }}>
        {/* Client info */}
        <div style={{ background:"rgba(167,139,250,0.05)", border:"1px solid rgba(167,139,250,0.12)", borderRadius:10, padding:12, display:"flex", flexDirection:"column", gap:8 }}>
          <div style={{ color:"#a78bfa", fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:1 }}>Данни на клиент</div>
          <input value={clientName} onChange={e=>setClientName(e.target.value)} placeholder="Име на клиент *" style={{ ...inp(), padding:"10px 12px", fontSize:14 }} />
          <input value={clientPhone} onChange={e=>setClientPhone(e.target.value)} placeholder="Телефон" type="tel" style={{ ...inp(true), padding:"10px 12px", fontSize:14 }} />
        </div>
        <textarea value={orderNote} onChange={e=>setOrderNote(e.target.value)} placeholder="Бележки..." style={{ ...inp(), resize:"vertical", minHeight:40, fontSize:13 }} />
        {sp && <div style={{ display:"flex", justifyContent:"space-between", fontSize:16 }}><span style={{ color:"#8899aa", fontWeight:600 }}>Общо</span><span style={{ fontFamily:"'JetBrains Mono',monospace", fontWeight:700, color:"#22c55e" }}>{fmt(cartTot)}</span></div>}
        <Btn variant="green" disabled={cart.length===0} onClick={submitOrder} style={{ width:"100%" }}>Потвърди поръчка</Btn>
      </div>
    </div>
  );
}

// ─── New Role Modal ───
function NewRoleModal({ onClose, existingKeys, onSave }) {
  const [label, setLabel] = useState("");
  const [permsState, setPermsState] = useState(
    Object.fromEntries(PERM_KEYS.map(k => [k, false]))
  );
  const togglePerm = (k) => setPermsState(prev => ({ ...prev, [k]: !prev[k] }));
  const save = () => {
    if (!label.trim()) return;
    const key = "CUSTOM_" + label.trim().toUpperCase().replace(/[^A-ZА-Я0-9]/gi, "_").replace(/_+/g, "_") + "_" + Date.now().toString(36);
    if (existingKeys.includes(key)) return;
    onSave(key, { label: label.trim(), ...permsState });
  };
  const allOn = PERM_KEYS.every(k => permsState[k]);
  const allOff = PERM_KEYS.every(k => !permsState[k]);
  return (
    <Modal title="Нова роля" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <Field label="Име на ролята">
          <input value={label} onChange={e => setLabel(e.target.value)} style={inp()} placeholder="Напр. Складов работник" autoFocus />
        </Field>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <label style={{ color: "#8899aa", fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: 1 }}>Права</label>
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={() => setPermsState(Object.fromEntries(PERM_KEYS.map(k => [k, true])))} style={{ background: "rgba(34,197,94,0.1)", border: "1px solid rgba(34,197,94,0.2)", borderRadius: 6, padding: "3px 8px", color: "#22c55e", fontSize: 11, fontWeight: 600, cursor: "pointer", opacity: allOn ? 0.4 : 1 }}>Всички</button>
              <button onClick={() => setPermsState(Object.fromEntries(PERM_KEYS.map(k => [k, false])))} style={{ background: "rgba(239,68,68,0.1)", border: "1px solid rgba(239,68,68,0.2)", borderRadius: 6, padding: "3px 8px", color: "#ef4444", fontSize: 11, fontWeight: 600, cursor: "pointer", opacity: allOff ? 0.4 : 1 }}>Нищо</button>
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {PERM_KEYS.map(k => (
              <button key={k} onClick={() => togglePerm(k)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", background: permsState[k] ? "rgba(34,197,94,0.06)" : "rgba(255,255,255,0.02)", border: permsState[k] ? "1px solid rgba(34,197,94,0.15)" : "1px solid rgba(255,255,255,0.06)", borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
                <span style={{ fontSize: 14, color: permsState[k] ? "#e0e8f0" : "#667788", fontWeight: 500 }}>{PERM_LABELS[k]}</span>
                <span style={{ fontSize: 18, color: permsState[k] ? "#22c55e" : "rgba(239,68,68,0.3)", fontWeight: 700 }}>{permsState[k] ? "✓" : "✗"}</span>
              </button>
            ))}
          </div>
        </div>
        <Btn onClick={save} disabled={!label.trim()} style={{ marginTop: 4 }}><I.Plus /> Създай роля</Btn>
      </div>
    </Modal>
  );
}

// ─── Forms ───
function PartForm({ part, onSave, onClose, sp }) {
  const [f, setF] = useState({codice:"",marchio:"",riferimento:"",quantita:0,prezzo:0,note:"",tipo:"",tipoValue:"",...(part||{})});
  const u = (k,v) => setF(p=>({...p,[k]:v}));
  return (<Modal title={part?"Редакция":"Нов артикул"} onClose={onClose}>
    <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
      <Field label="Код"><input value={f.codice} onChange={e=>u("codice",e.target.value)} style={inp(true)} placeholder="BRK-PAD-001" /></Field>
      <Field label="Марка"><input value={f.marchio} onChange={e=>u("marchio",e.target.value)} style={inp()} placeholder="Brembo" /></Field>
      {/* Дюза / ГНП */}
      <div>
        <label style={{ color:"#8899aa", fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:1 }}>Дюза / ГНП</label>
        <div style={{ display:"flex", gap:8, marginTop:8 }}>
          {["","DYUZA","GNP"].map(t=>(
            <button key={t} onClick={()=>{u("tipo",t);if(t!==f.tipo)u("tipoValue","")}} style={{ flex:1, padding:"10px 0", borderRadius:10, border:f.tipo===t?"2px solid "+(t==="DYUZA"?"#60a5fa":t==="GNP"?"#a78bfa":"#e8a032"):"1px solid rgba(255,255,255,0.08)", background:f.tipo===t?(t==="DYUZA"?"rgba(96,165,250,0.12)":t==="GNP"?"rgba(167,139,250,0.12)":"rgba(232,160,50,0.1)"):"rgba(255,255,255,0.03)", color:f.tipo===t?"#e0e8f0":"#667788", fontSize:13, fontWeight:600, cursor:"pointer", textAlign:"center" }} type="button">
              {t===""?"Няма":t==="DYUZA"?"Дюза":"ГНП"}
            </button>
          ))}
        </div>
        {f.tipo==="DYUZA" && (
          <div style={{ marginTop:10 }}>
            <label style={{ color:"#3d6a99", fontSize:10, fontWeight:600, textTransform:"uppercase", letterSpacing:1, marginBottom:4, display:"block" }}>Марка дюза</label>
            <select value={f.tipoValue||""} onChange={e=>u("tipoValue",e.target.value)} style={{...inp(),color:"#e0e8f0"}}>
              <option value="" style={{color:"#000"}}>— Избери —</option>
              {DYUZA_BRANDS.map(b=><option key={b} value={b} style={{color:"#000"}}>{b}</option>)}
            </select>
          </div>
        )}
        {f.tipo==="GNP" && (
          <div style={{ marginTop:10 }}>
            <label style={{ color:"#a78bfa", fontSize:10, fontWeight:600, textTransform:"uppercase", letterSpacing:1, marginBottom:4, display:"block" }}>Марки коли (може повече от 1)</label>
            <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginTop:6 }}>
              {CAR_BRANDS.map(b=>{
                const sel=(f.tipoValue||"").split(",").filter(Boolean);
                const on=sel.includes(b);
                return <button key={b} type="button" onClick={()=>{const nv=on?sel.filter(x=>x!==b):[...sel,b];u("tipoValue",nv.join(","))}} style={{ padding:"6px 12px", borderRadius:8, border:on?"1px solid rgba(167,139,250,0.5)":"1px solid rgba(255,255,255,0.08)", background:on?"rgba(167,139,250,0.15)":"rgba(255,255,255,0.03)", color:on?"#a78bfa":"#667788", fontSize:12, fontWeight:on?600:400, cursor:"pointer" }}>{b}</button>;
              })}
            </div>
            {(f.tipoValue||"").split(",").filter(Boolean).length>0 && <div style={{ marginTop:8, fontSize:12, color:"#a78bfa" }}>Избрани: {(f.tipoValue||"").split(",").filter(Boolean).join(", ")}</div>}
          </div>
        )}
      </div>
      <Field label="Кутия/Тубе"><input value={f.riferimento} onChange={e=>u("riferimento",e.target.value)} style={inp(true)} placeholder="P 85 020" /></Field>
      <div style={{ display:"flex", gap:10 }}>
        <div style={{ flex:1 }}><Field label="Количество"><input type="number" min={0} value={f.quantita} onChange={e=>u("quantita",parseInt(e.target.value)||0)} style={inp(true)} /></Field></div>
        {sp && <div style={{ flex:1 }}><Field label="Цена (€)"><input type="number" min={0} step={0.01} value={f.prezzo} onChange={e=>u("prezzo",parseFloat(e.target.value)||0)} style={inp(true)} /></Field></div>}
      </div>
      <Field label="Бележки"><textarea value={f.note||""} onChange={e=>u("note",e.target.value)} style={{ ...inp(), resize:"vertical", minHeight:60, fontSize:14 }} placeholder="Допълнителна информация за артикула..." /></Field>
      <Btn onClick={()=>{if(f.codice&&f.marchio)onSave(f)}} style={{ marginTop:4 }}>{part?"Запази":"Добави"}</Btn>
    </div>
  </Modal>);
}
function UserForm({ usr, onSave, onClose, roles }) {
  const [f, setF] = useState(usr || { nome:"", email:"", ruolo:"VIEWER", pin:"" });
  const u = (k,v) => setF(p=>({...p,[k]:v}));
  return (<Modal title={usr?"Редакция":"Нов потребител"} onClose={onClose}>
    <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
      <Field label="Име"><input value={f.nome} onChange={e=>u("nome",e.target.value)} style={inp()} placeholder="Иван Иванов" /></Field>
      <Field label="Имейл"><input value={f.email} onChange={e=>u("email",e.target.value)} style={inp()} placeholder="ivan@firma.bg" /></Field>
      <Field label="Роля"><select value={f.ruolo} onChange={e=>u("ruolo",e.target.value)} style={inp()}>{Object.entries(roles).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></Field>
      <Field label="ПИН (4 цифри)"><input value={f.pin} maxLength={4} onChange={e=>u("pin",e.target.value.replace(/\D/g,""))} style={{ ...inp(true), letterSpacing:10, textAlign:"center", fontSize:22 }} placeholder="••••" /></Field>
      <Btn onClick={()=>{if(f.nome&&f.pin.length===4)onSave(f)}} style={{ marginTop:4 }}>{usr?"Запази":"Създай"}</Btn>
    </div>
  </Modal>);
}

// ─── Login ───
function LoginScreen({ onLogin }) {
  const [users, setUsers] = useState([]);
  const [sel, setSel] = useState(null);
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  useEffect(() => { fetch("/api/auth/users").then(r=>r.json()).then(setUsers).catch(()=>{}); }, []);
  const go = async () => { if(!sel)return; const u=users.find(x=>x.id===sel); if(!u)return; try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:u.email,pin})});const d=await r.json();if(!r.ok){setErr(d.error||"Грешка");setTimeout(()=>setErr(""),2000);return}onLogin(d.user,d.token)}catch(e){setErr("Грешка");setTimeout(()=>setErr(""),2000)} };
  return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#0f1419 0%,#1a1f2e 50%,#0f1419 100%)", display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'DM Sans',sans-serif", padding:16 }}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
      <style>{CSS}</style>
      <div style={{ background:"rgba(26,31,46,0.95)", border:"1px solid rgba(232,160,50,0.2)", borderRadius:20, padding:"32px 28px", width:"100%", maxWidth:380, boxShadow:"0 25px 80px rgba(0,0,0,0.6)" }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ width:60, height:60, background:"linear-gradient(135deg,#e8a032,#d4880a)", borderRadius:16, display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 14px" }}><I.Lock /></div>
          <h1 style={{ color:"#e8a032", fontSize:20, fontWeight:700, margin:0, letterSpacing:1 }}>СКЛАД АВТОЧАСТИ</h1>
          <p style={{ color:"#8899aa", fontSize:13, marginTop:5 }}>Система за управление</p>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          <label style={{ color:"#8899aa", fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:1 }}>Потребител</label>
          {users.map(u=>(
            <button key={u.id} onClick={()=>{setSel(u.id);setErr("")}} style={{ background:sel===u.id?"rgba(232,160,50,0.15)":"rgba(255,255,255,0.03)", border:sel===u.id?"1px solid rgba(232,160,50,0.5)":"1px solid rgba(255,255,255,0.06)", borderRadius:12, padding:"12px 14px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span style={{ color:sel===u.id?"#e8a032":"#ccd6e0", fontWeight:500, fontSize:14 }}>{u.nome}</span>
              <span style={{ color:"#667788", fontSize:11, fontFamily:"'JetBrains Mono',monospace", background:"rgba(255,255,255,0.04)", padding:"2px 8px", borderRadius:6 }}>{DEFAULT_ROLES[u.ruolo]?.label||u.ruolo}</span>
            </button>
          ))}
          {sel && (<>
            <label style={{ color:"#8899aa", fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:1, marginTop:6 }}>ПИН код</label>
            <input type="password" value={pin} maxLength={4} onChange={e=>{setPin(e.target.value.replace(/\D/g,""));setErr("")}} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="••••" style={{ ...inp(true), textAlign:"center", fontSize:22, letterSpacing:14, padding:"14px" }} />
            {err && <div style={{ color:"#ef4444", fontSize:13, textAlign:"center" }}>{err}</div>}
            <Btn onClick={go} style={{ marginTop:6 }}>Вход</Btn>
          </>)}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
  </script>
