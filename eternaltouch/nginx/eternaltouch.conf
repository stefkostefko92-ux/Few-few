# /etc/nginx/sites-available/eternaltouch.conf
# Eternal Touch — eternaltouch.it

# www → non-www redirect
server {
    listen 80;
    listen [::]:80;
    server_name www.eternaltouch.it;
    return 301 https://eternaltouch.it$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eternaltouch.it;

    ssl_certificate /etc/letsencrypt/live/eternaltouch.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eternaltouch.it/privkey.pem;

    return 301 https://eternaltouch.it$request_uri;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name eternaltouch.it;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eternaltouch.it;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/eternaltouch.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eternaltouch.it/privkey.pem;

    # Modern TLS profile (Mozilla "intermediate")
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EtSSL:10m;
    ssl_session_tickets off;

    # NB: OCSP stapling is intentionally NOT configured — Let's Encrypt stopped
    # including an OCSP responder URL in its certificates (2025, moving to CRLs),
    # so ssl_stapling would be ignored and would only emit a warning.

    # Logs
    access_log /var/log/nginx/eternaltouch.access.log;
    error_log  /var/log/nginx/eternaltouch.error.log;

    # Body size for uploads
    client_max_body_size 30M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss application/atom+xml image/svg+xml;

    # ── Security headers ───────────────────────────────────────────────
    # Deliberately NONE here. The Node app (helmet) is the single source of
    # security headers — HSTS, X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy and CSP — and it applies them to every
    # response, including static assets (served by express.static behind this
    # proxy). Re-adding them here would produce duplicate/conflicting headers.

    # Static assets — long cache
    location ~* ^/(css|js|images|fonts)/.*\.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:4300;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploads — medium cache (since they may be replaced)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4300;
        expires 7d;
        add_header Cache-Control "public";
    }

    # All other traffic → Node.js app
    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
