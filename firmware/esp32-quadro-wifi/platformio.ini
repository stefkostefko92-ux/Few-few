; PlatformIO - Modulo WiFi quadro di manovra ascensore (PROTOTIPO DIDATTICO)
; Target: ESP32 DevKit. Web-server locale (AP) + Modbus RTU verso il controller.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    me-no-dev/ESP Async WebServer @ ^1.2.4
    me-no-dev/AsyncTCP @ ^1.1.1
    bblanchon/ArduinoJson @ ^7.0.4
    4-20ma/ModbusMaster @ ^2.0.1

build_flags =
    -DCORE_DEBUG_LEVEL=2

; Caricare l'interfaccia web e la mappa parametri nel filesystem:
;   1) copiare config/parametri.json del repo in data/parametri.json
;   2) pio run -t uploadfs
;   3) pio run -t upload
