<text x="834" y="234" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="834" dy="0">KB2</tspan></text>
<line x1="810" y1="250" x2="810" y2="300" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<line x1="810" y1="300" x2="810" y2="306" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
<rect x="798" y="306" width="24" height="34" rx="0" fill="none" stroke="#111827" stroke-width="1.4"/>
<line x1="810" y1="340" x2="810" y2="346" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
<text x="828" y="327" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="828" dy="0">BR2  bobina freno 2</tspan></text>
<text x="620" y="384" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="620" dy="0">Il PLC comanda KB1/KB2 solo tramite il consenso della catena;</tspan></text>
<text x="620" y="400" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="620" dy="0">la rilevazione dello stato (feedback) di ciascun freno va al PLC e</tspan></text>
<text x="620" y="416" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="620" dy="0">al modulo UCM. Meccanica del freno: certificato del costruttore</tspan></text>
<text x="620" y="432" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="620" dy="0">dell'argano (non si sostituisce il freno certificato).</tspan></text>
<text x="620" y="490" font-size="13" text-anchor="start" font-weight="700" fill="#111827"><tspan x="620" dy="0">AUSILIARI (dal sezionatore QS2, separati dalla potenza)</tspan></text>
<rect x="620" y="508" width="48" height="26" rx="3" fill="none" stroke="#b91c1c" stroke-width="1.6"/>
<text x="644" y="526" font-size="11" text-anchor="middle" font-weight="700" fill="#b91c1c"><tspan x="644" dy="0">QF2</tspan></text>
<text x="682" y="526" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="682" dy="0">230 V luce cabina / FM cabina e vano</tspan></text>
<rect x="620" y="544" width="48" height="26" rx="3" fill="none" stroke="#15803d" stroke-width="1.6"/>
<text x="644" y="562" font-size="11" text-anchor="middle" font-weight="700" fill="#15803d"><tspan x="644" dy="0">QF3</tspan></text>
<text x="682" y="562" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="682" dy="0">trasformatore → SMPS 48 V (catena)</tspan></text>
<rect x="620" y="580" width="48" height="26" rx="3" fill="none" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="644" y="598" font-size="11" text-anchor="middle" font-weight="700" fill="#1d4ed8"><tspan x="644" dy="0">QF4</tspan></text>
<text x="682" y="598" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="682" dy="0">SMPS 24 V logica, bus, router, gateway</tspan></text>
<rect x="620" y="616" width="48" height="26" rx="3" fill="none" stroke="#b45309" stroke-width="1.6"/>
<text x="644" y="634" font-size="11" text-anchor="middle" font-weight="700" fill="#b45309"><tspan x="644" dy="0">QF5</tspan></text>
<text x="682" y="634" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="682" dy="0">caricabatterie ARD / allarme / luce emergenza</tspan></text>
<rect x="1000" y="90" width="560" height="380" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1010" y="106" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280"><tspan x="1010" dy="0">Note di progetto</tspan></text>
<text x="1014" y="120" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">1. Il PLC non pilota mai la potenza direttamente: dà il consenso, la catena lo toglie.</tspan></text>
<text x="1014" y="146" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">2. Arresto del motore da inverter, EN 81-20:2020 5.9.2.5.4: bastano 2 contattori (a),</tspan></text>
<text x="1014" y="172" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">    OPPURE un STO conforme a EN 61800-5-2 SIL 3 con HFT ≥ 1 (d). Scelta economica: (a);</tspan></text>
<text x="1014" y="198" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">    con (d) si eliminano KM1/KM2. Non servono entrambi.</tspan></text>
<text x="1014" y="224" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">3. KM1/KM2: contatti a specchio, retroazione letta dal PLC e dalla catena; se uno resta</tspan></text>
<text x="1014" y="250" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">    chiuso la ripartenza è bloccata al più tardi alla prossima inversione (5.9.2.5.2).</tspan></text>
<text x="1014" y="276" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">4. Freno: 2 dispositivi elettromeccanici indipendenti (5.9.2.2.2.3) con retroazione;</tspan></text>
<text x="1014" y="302" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">    la meccanica del freno è quella certificata dell'argano.</tspan></text>
<text x="1014" y="328" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">5. Limitatore di tempo del motore: min(45 s; corsa completa + 10 s, minimo 20 s),</tspan></text>
<text x="1014" y="354" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">    reset manuale (5.9.2.7). Cablato o in modulo certificato, non solo software.</tspan></text>
<text x="1014" y="380" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">6. Protezione termica su ogni motore (5.10.4.2); sovratemperatura apparecchi → stop</tspan></text>
<text x="1014" y="406" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">    al piano e ripartenza dopo raffreddamento (5.10.4.3).</tspan></text>
<text x="1014" y="432" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1014" dy="0">7. Taglia (kW), sezioni e protezioni: dal motore reale; qui solo la struttura.</tspan></text>
<rect x="1300" y="520" width="230" height="94" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1"/>
