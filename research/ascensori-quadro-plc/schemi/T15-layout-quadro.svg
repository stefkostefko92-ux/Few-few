<text x="814" y="80" font-size="12" text-anchor="start" font-weight="700" fill="#111827"><tspan x="814" dy="0">Variante</tspan></text>
<text x="1064" y="80" font-size="12" text-anchor="start" font-weight="700" fill="#111827"><tspan x="1064" dy="0">Armadio</tspan></text>
<text x="1204" y="80" font-size="12" text-anchor="start" font-weight="700" fill="#111827"><tspan x="1204" dy="0">Note</tspan></text>
<line x1="810" y1="92" x2="1550" y2="92" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="814" y="124" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">Trazione ≤ 7,5 kW, 12 fermate</tspan></text>
<text x="1064" y="124" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1064" dy="0">600×800×250</tspan></text>
<text x="1204" y="124" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1204" dy="0">inverter a parete o su guida; dissipazione ≈ 3 % della potenza</tspan></text>
<line x1="810" y1="136" x2="1550" y2="136" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="814" y="168" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">Trazione ≤ 15 kW, fino a 24 fermate</tspan></text>
<text x="1064" y="168" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1064" dy="0">800×1000×300</tspan></text>
<text x="1204" y="168" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1204" dy="0">come in figura; nessun componente in più per le fermate</tspan></text>
<line x1="810" y1="180" x2="1550" y2="180" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="814" y="212" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">Idraulico con soft starter</tspan></text>
<text x="1064" y="212" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1064" dy="0">600×800×250</tspan></text>
<text x="1204" y="212" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1204" dy="0">niente inverter né reattanza; soft starter + contattore di by-pass</tspan></text>
<line x1="810" y1="224" x2="1550" y2="224" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="814" y="256" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">Idraulico con inverter</tspan></text>
<text x="1064" y="256" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1064" dy="0">800×1000×300</tspan></text>
<text x="1204" y="256" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1204" dy="0">inverter con reattanza + filtro EMC; valvola proporzionale</tspan></text>
<line x1="810" y1="268" x2="1550" y2="268" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="814" y="300" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">Senza locale macchine (MRL)</tspan></text>
<text x="1064" y="300" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1064" dy="0">in architrave o nel vano</tspan></text>
<text x="1204" y="300" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1204" dy="0">accessibile per manutenzione dal piano; ingombro minimo</tspan></text>
<line x1="810" y1="312" x2="1550" y2="312" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="814" y="330" font-size="12.5" text-anchor="start" font-weight="700" fill="#111827"><tspan x="814" dy="0">Regole di montaggio</tspan></text>
<text x="814" y="356" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">• Separare nel canale: 400 V (nero) · 48 V sicurezza (verde) · 24 V + CAN (blu/arancio).</tspan></text>
<text x="814" y="384" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">• Potenza e bus in canali diversi o a ≥ 100 mm, con schermi a terra solo dal lato quadro.</tspan></text>
<text x="814" y="412" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">• Morsetti con ponticelli di prova sulla catena di sicurezza e punto di misura per ogni tratto.</tspan></text>
<text x="814" y="440" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">• Ventilazione o termostato, riscaldamento anticondensa se il quadro è in ambiente freddo.</tspan></text>
<text x="814" y="468" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">• Targhetta per ogni conduttore, schemi in tasca; sezionatore lucchettabile.</tspan></text>
<text x="814" y="496" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">• I punti di misura della catena e il modulo CE sono accessibili senza smontare altro.</tspan></text>
<text x="814" y="524" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="814" dy="0">• Aerazione del locale e del vano: vedere 02-normativa (scheda VSA 2016).</tspan></text>
</g>

