<title>T09 — Controllo delle porte</title>
<defs><marker id="ah-1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ah-15803d" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="1587" height="1122" fill="#ffffff"/>

<rect x="8" y="8" width="1571" height="1106" fill="none" stroke="#111827" stroke-width="2"/>
<rect x="14" y="14" width="1559" height="1094" fill="none" stroke="#111827" stroke-width="0.8"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="40" y="100" width="200" height="90" rx="6" fill="#eff6ff" stroke="#111827" stroke-width="1.6"/>
<text x="140" y="137.0625" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="140" dy="0">PLC</tspan></text>
<text x="140" y="150.1875" font-size="8.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="140" dy="0">Q10 apri · Q11 chiudi</tspan><tspan x="140" dy="10.625">I23 aperta · I24 chiusa · I25 barriera</tspan></text>
<rect x="340" y="100" width="220" height="90" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="450" y="134.875" font-size="13" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="450" dy="0">Operatore porte</tspan></text>
<text x="450" y="151.125" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="450" dy="0">inverter dedicato</tspan><tspan x="450" dy="13.75">rampe e coppia proprie</tspan></text>
<rect x="660" y="100" width="200" height="90" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="760" y="142.375" font-size="13" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="760" dy="0">Motore + cinghia</tspan></text>
<text x="760" y="158.625" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="760" dy="0">anta cabina → anta piano</tspan></text>
<rect x="960" y="100" width="220" height="90" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="1070" y="134.875" font-size="13" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="1070" dy="0">Accoppiatore</tspan></text>
<text x="1070" y="151.125" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="1070" dy="0">sblocca la serratura</tspan><tspan x="1070" dy="13.75">in zona di sbloccaggio</tspan></text>
<polyline points="240,145 340,145" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-1d4ed8)"/>
<text x="290" y="137" font-size="11" text-anchor="middle" font-weight="600" fill="#1d4ed8"><tspan x="290" dy="0">24 V</tspan></text>
<polyline points="560,145 660,145" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-111827)"/>
<polyline points="860,145 960,145" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-111827)"/>
<polyline points="400,190 400,240 200,240 200,190" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-1d4ed8)"/>
<text x="300" y="256" font-size="11" text-anchor="middle" font-weight="600" fill="#1d4ed8"><tspan x="300" dy="0">limiti aperto/chiuso (I23, I24)</tspan></text>
<rect x="340" y="300" width="220" height="80" rx="6" fill="#fff7ed" stroke="#111827" stroke-width="1.6"/>
<text x="450" y="329.875" font-size="13" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="450" dy="0">Barriera / costa</tspan></text>
<text x="450" y="346.125" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="450" dy="0">protezione 25–1 800 mm</tspan><tspan x="450" dy="13.75">senza contatto fisico</tspan></text>
<polyline points="500,300 500,190" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-1d4ed8)"/>
<text x="534" y="245" font-size="11" text-anchor="middle" font-weight="600" fill="#1d4ed8"><tspan x="534" dy="0">riapertura</tspan></text>
<polyline points="340,340 90,340 90,190" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-1d4ed8)"/>
<text x="90" y="259" font-size="11" text-anchor="middle" font-weight="600" fill="#1d4ed8"><tspan x="90" dy="0">I25</tspan></text>
<rect x="660" y="300" width="220" height="80" rx="6" fill="#ecfdf5" stroke="#15803d" stroke-width="1.6"/>
<text x="770" y="329.875" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d"><tspan x="770" dy="0">Contatti di sicurezza</tspan></text>
<text x="770" y="346.125" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="770" dy="0">serratura piano (tratto C)</tspan><tspan x="770" dy="13.75">porta cabina (tratto D)</tspan></text>
<polyline points="880,340 960,340 1000,340" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1010" y="344" font-size="11" text-anchor="start" font-weight="700" fill="#15803d"><tspan x="1010" dy="0">verso la catena (T04) — mai al PLC come comando</tspan></text>
<rect x="40" y="440" width="1500" height="520" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="50" y="456" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280"><tspan x="50" dy="0">Valori e punti di norma</tspan></text>
<text x="56" y="480" font-size="12" text-anchor="start" font-weight="700" fill="#111827"><tspan x="56" dy="0">Grandezza</tspan></text>
<text x="560" y="480" font-size="12" text-anchor="start" font-weight="700" fill="#111827"><tspan x="560" dy="0">Valore</tspan></text>
<text x="1180" y="480" font-size="12" text-anchor="start" font-weight="700" fill="#111827"><tspan x="1180" dy="0">Punto</tspan></text>
<line x1="50" y1="492" x2="1530" y2="492" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="516" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Energia cinetica delle porte automatiche</tspan></text>
<text x="560" y="516" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">≤ 10 J</tspan></text>
<text x="1180" y="516" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">EN 81-20:2020 5.3.6.2.2.1 a)</tspan></text>
<line x1="50" y1="528" x2="1530" y2="528" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="552" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Forza di arresto</tspan></text>
<text x="560" y="552" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">≤ 150 N</tspan></text>
<text x="1180" y="552" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">5.3.6.2.2.1 c)</tspan></text>
<line x1="50" y1="564" x2="1530" y2="564" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="588" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Copertura della riapertura automatica</tspan></text>
<text x="560" y="588" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">25 … 1 600 mm; ostacolo Ø 50 mm</tspan></text>
<text x="1180" y="588" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">5.3.6.2.2.1 b)</tspan></text>
<line x1="50" y1="600" x2="1530" y2="600" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="624" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Protezione senza contatto (accessibilità)</tspan></text>
<text x="560" y="624" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">25 … 1 800 mm dalla soglia</tspan></text>
<text x="1180" y="624" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">EN 81-70:2005 5.2.4</tspan></text>
<line x1="50" y1="636" x2="1530" y2="636" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="660" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Pulsante di riapertura in cabina</tspan></text>
<text x="560" y="660" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">obbligatorio con porte automatiche</tspan></text>
<text x="1180" y="660" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">5.3.6.3</tspan></text>
<line x1="50" y1="672" x2="1530" y2="672" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="696" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Zona di sbloccaggio</tspan></text>
<text x="560" y="696" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">≤ 0,20 m (≤ 0,35 m con porte motorizzate accoppiate)</tspan></text>
<text x="1180" y="696" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">5.3.8.1</tspan></text>
<line x1="50" y1="708" x2="1530" y2="708" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="732" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Moto con porta aperta</tspan></text>
<text x="560" y="732" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">solo livellamento ≤ 0,80 m/s, rilivellamento ≤ 0,30 m/s</tspan></text>
<text x="1180" y="732" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">5.12.1.4</tspan></text>
<line x1="50" y1="744" x2="1530" y2="744" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="768" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Tempo porte aperte (installatore, non utente)</tspan></text>
<text x="560" y="768" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">regolabile, tipico 2–20 s; DM 236/1989: ≥ 8 s aperte, chiusura ≥ 4 s</tspan></text>
<text x="1180" y="768" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">EN 81-70:2005 5.2.3; DM 236/1989 8.1.12</tspan></text>
<line x1="50" y1="780" x2="1530" y2="780" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="804" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Porte manuali: cabina ferma</tspan></text>
<text x="560" y="804" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">≥ 2 s dopo l'arresto</tspan></text>
<text x="1180" y="804" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">5.12.4.1</tspan></text>
<line x1="50" y1="816" x2="1530" y2="816" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="840" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Ostruzione prolungata / guasto della protezione</tspan></text>
<text x="560" y="840" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">forza ridotta ≤ 4 J + avviso acustico a ogni chiusura</tspan></text>
<text x="1180" y="840" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">5.3.6.2.2.1 b)</tspan></text>
<line x1="50" y1="852" x2="1530" y2="852" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="876" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Controllo dei contatti porta in zona</tspan></text>
<text x="560" y="876" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="560" dy="0">guasto → niente servizio normale</tspan></text>
<text x="1180" y="876" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280"><tspan x="1180" dy="0">5.12.1.9</tspan></text>
<line x1="50" y1="888" x2="1530" y2="888" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<rect x="1330" y="90" width="230" height="76" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1"/>
<text x="1338" y="105" font-size="11" text-anchor="start" font-weight="700" fill="#111827"><tspan x="1338" dy="0">Legenda</tspan></text>
<line x1="1340" y1="122" x2="1376" y2="122" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
<text x="1384" y="126" font-size="10.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1384" dy="0">Segnali 24 V</tspan></text>
<line x1="1340" y1="140" x2="1376" y2="140" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
<text x="1384" y="144" font-size="10.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1384" dy="0">Catena</tspan></text>
<line x1="1340" y1="158" x2="1376" y2="158" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
<text x="1384" y="162" font-size="10.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="1384" dy="0">Potenza</tspan></text>
</g>

<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="827" y="1010" width="746" height="98" fill="#fff" stroke="#111827" stroke-width="1.2"/>
<line x1="827" y1="1042" x2="1573" y2="1042" stroke="#111827" stroke-width="0.8"/>
<line x1="1437" y1="1010" x2="1437" y2="1108" stroke="#111827" stroke-width="0.8"/>
<line x1="1437" y1="1075" x2="1573" y2="1075" stroke="#111827" stroke-width="0.8"/>
<text x="837" y="1028" font-size="10" fill="#6b7280">QUADRO DI MANOVRA A PLC — PROGETTO DI FATTIBILITÀ · Carbon Stealth VCC</text>
<text x="837" y="1062" font-size="17" font-weight="700" fill="#111827">Controllo delle porte</text>
<text x="837" y="1084" font-size="11" fill="#374151">Operatore con inverter proprio · il PLC comanda e legge, la sicurezza resta nella catena</text>
<text x="837" y="1100" font-size="10" fill="#b45309">Schema di principio: non è un esecutivo. Lo firma un progettista abilitato.</text>
<text x="1445" y="1026" font-size="10" fill="#6b7280">Tavola</text>
<text x="1445" y="1056" font-size="26" font-weight="700">T09</text>
<text x="1445" y="1090" font-size="10" fill="#6b7280">Rev. A · 2026-10-07</text>
<text x="1445" y="1103" font-size="10" fill="#6b7280">A3 · senza scala</text>
</g>
