<text x="40" y="66" font-size="12" text-anchor="start" font-weight="700" fill="#111827"><tspan x="40" dy="0">CABINA E TETTO</tspan></text>
<rect x="50" y="80" width="250" height="80" rx="6" fill="#fff7ed" stroke="#111827" stroke-width="1.6"/>
<text x="175" y="117.625" font-size="12" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="175" dy="0">COP</tspan></text>
<text x="175" y="132.625" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="175" dy="0">pulsanti 12–24 · display · voce</tspan></text>
<rect x="320" y="80" width="250" height="80" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="445" y="117.625" font-size="12" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="445" dy="0">Operatore porte</tspan></text>
<text x="445" y="132.625" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="445" dy="0">inverter proprio · limiti aperto/chiuso</tspan></text>
<rect x="50" y="180" width="250" height="80" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="175" y="217.625" font-size="12" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="175" dy="0">Barriera / costa</tspan></text>
<text x="175" y="232.625" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="175" dy="0">protezione porte 25–1 800 mm</tspan></text>
<rect x="320" y="180" width="250" height="80" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="445" y="217.625" font-size="12" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="445" dy="0">Pesacarico</tspan></text>
<text x="445" y="232.625" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="445" dy="0">4–20 mA · sovraccarico ≥ +10 %, min 75 kg</tspan></text>
<rect x="50" y="280" width="250" height="80" rx="6" fill="#fff7ed" stroke="#111827" stroke-width="1.6"/>
<text x="175" y="317.625" font-size="12" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="175" dy="0">Citofono + pulsante giallo</tspan></text>
<text x="175" y="332.625" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="175" dy="0">EN 81-28 · comunicatore 4G/5G</tspan></text>
<rect x="320" y="280" width="250" height="80" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="445" y="317.625" font-size="12" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="445" dy="0">Luce cabina + emergenza</tspan></text>
<text x="445" y="332.625" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="445" dy="0">≥ 100 lx · emergenza ≥ 5 lx per 1 h</tspan></text>
<rect x="50" y="380" width="250" height="80" rx="6" fill="#ecfdf5" stroke="#111827" stroke-width="1.6"/>
<text x="175" y="417.625" font-size="12" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="175" dy="0">Sensori zona porta ×2</tspan></text>
<text x="175" y="432.625" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="175" dy="0">verso modulo CE (T04)</tspan></text>
<rect x="320" y="380" width="250" height="80" rx="6" fill="#ecfdf5" stroke="#111827" stroke-width="1.6"/>
<text x="445" y="417.625" font-size="12" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="445" dy="0">Contatto porta cabina</tspan></text>
<text x="445" y="432.625" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="445" dy="0">catena tratto D (T04)</tspan></text>
<rect x="50" y="480" width="250" height="80" rx="6" fill="#ecfdf5" stroke="#111827" stroke-width="1.6"/>
<text x="175" y="517.85" font-size="11.1" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="175" dy="0">Ispezione tetto</tspan></text>
<text x="175" y="531.725" font-size="9.1" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="175" dy="0">commutatore · salita · discesa · MARCIA · STOP</tspan></text>
<rect x="320" y="480" width="250" height="80" rx="6" fill="#eff6ff" stroke="#111827" stroke-width="1.6"/>
<text x="445" y="517.625" font-size="12" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="445" dy="0">Scatola di derivazione</tspan></text>
<text x="445" y="532.625" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="445" dy="0">morsettiera di cabina · uscita cavo mobile</tspan></text>
<rect x="630" y="50" width="920" height="560" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="640" y="66" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280"><tspan x="640" dy="0">CAVO MOBILE (conduttori)</tspan></text>
<line x1="650" y1="80" x2="700" y2="80" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="85" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Catena di sicurezza 48 V c.c. (porta cabina, ispezione, STOP tetto, paracadute)</tspan></text>
<text x="1520" y="85" font-size="12" text-anchor="end" font-weight="700" fill="#15803d"><tspan x="1520" dy="0">4</tspan></text>
<line x1="650" y1="116" x2="700" y2="116" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="121" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">CAN1 — coppia twistata schermata 120 Ω</tspan></text>
<text x="1520" y="121" font-size="12" text-anchor="end" font-weight="700" fill="#c2410c"><tspan x="1520" dy="0">2 + schermo</tspan></text>
<line x1="650" y1="152" x2="700" y2="152" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="157" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Alimentazione 24 V (bus, display, COP)</tspan></text>
<text x="1520" y="157" font-size="12" text-anchor="end" font-weight="700" fill="#1d4ed8"><tspan x="1520" dy="0">2</tspan></text>
<line x1="650" y1="188" x2="700" y2="188" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="193" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Sensori zona porta (2 × alimentazione + segnale)</tspan></text>
<text x="1520" y="193" font-size="12" text-anchor="end" font-weight="700" fill="#15803d"><tspan x="1520" dy="0">6</tspan></text>
<line x1="650" y1="224" x2="700" y2="224" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="229" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Pesacarico 4–20 mA (schermato)</tspan></text>
<text x="1520" y="229" font-size="12" text-anchor="end" font-weight="700" fill="#1d4ed8"><tspan x="1520" dy="0">2 + schermo</tspan></text>
<line x1="650" y1="260" x2="700" y2="260" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="265" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Operatore porte: alimentazione 230 V</tspan></text>
<text x="1520" y="265" font-size="12" text-anchor="end" font-weight="700" fill="#b91c1c"><tspan x="1520" dy="0">3</tspan></text>
<line x1="650" y1="296" x2="700" y2="296" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="301" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Operatore porte: comando e limiti</tspan></text>
<text x="1520" y="301" font-size="12" text-anchor="end" font-weight="700" fill="#1d4ed8"><tspan x="1520" dy="0">6</tspan></text>
<line x1="650" y1="332" x2="700" y2="332" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="337" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Luce cabina 230 V (separata dal generale)</tspan></text>
<text x="1520" y="337" font-size="12" text-anchor="end" font-weight="700" fill="#b91c1c"><tspan x="1520" dy="0">3</tspan></text>
<line x1="650" y1="368" x2="700" y2="368" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="373" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Citofono / comunicatore (fonia, alimentazione, pulsante)</tspan></text>
<text x="1520" y="373" font-size="12" text-anchor="end" font-weight="700" fill="#b45309"><tspan x="1520" dy="0">4</tspan></text>
<line x1="650" y1="404" x2="700" y2="404" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="409" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Luce di emergenza (ricarica + segnale)</tspan></text>
<text x="1520" y="409" font-size="12" text-anchor="end" font-weight="700" fill="#b45309"><tspan x="1520" dy="0">2</tspan></text>
<line x1="650" y1="440" x2="700" y2="440" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="445" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Ispezione tetto (pulsanti e commutatore)</tspan></text>
<text x="1520" y="445" font-size="12" text-anchor="end" font-weight="700" fill="#15803d"><tspan x="1520" dy="0">5</tspan></text>
<line x1="650" y1="476" x2="700" y2="476" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="481" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Terra di protezione</tspan></text>
<text x="1520" y="481" font-size="12" text-anchor="end" font-weight="700" fill="#111827"><tspan x="1520" dy="0">1</tspan></text>
<line x1="650" y1="512" x2="700" y2="512" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
<text x="714" y="517" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="714" dy="0">Riserva ≈ 15 %</tspan></text>
<text x="1520" y="517" font-size="12" text-anchor="end" font-weight="700" fill="#6b7280"><tspan x="1520" dy="0">6</tspan></text>
<line x1="650" y1="546" x2="1530" y2="546" stroke="#111827" stroke-width="1" stroke-linecap="round"/>
<text x="714" y="566" font-size="12.5" text-anchor="start" font-weight="700" fill="#111827"><tspan x="714" dy="0">Totale indicativo</tspan></text>
<text x="1520" y="566" font-size="12.5" text-anchor="end" font-weight="700" fill="#111827"><tspan x="1520" dy="0">≈ 44 fili + 2 schermi</tspan></text>
<rect x="30" y="640" width="1520" height="330" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="40" y="656" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280"><tspan x="40" dy="0">Vano: dispositivi e punti di norma (EN 81-20:2020, numero e valore)</tspan></text>
<text x="46" y="672" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="46" dy="0">Contatti serratura di piano · 5.3.9.1 (blocco, SIL 3) · 5.3.9.1.2 impegno ≥ 7 mm · 5.3.8.1 zona di sbloccaggio ≤ 0,20 m (≤ 0,35 m con porte motorizzate accoppiate).</tspan></text>
<text x="46" y="706" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="46" dy="0">Fossa · 5.2.1.5.1: STOP (≤ 1,60 m di profondità: uno; &gt; 1,60 m: due), ispezione entro 0,30 m dal rifugio, presa 2P+PE, luce vano ≥ 50 lx (5.2.1.4.1).</tspan></text>
<text x="46" y="740" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="46" dy="0">Tetto cabina · 5.4.8: ispezione entro 0,30 m dal rifugio, STOP ≤ 1 m dall'accesso, presa 2P+PE · 5.12.1.5.2.1 ispezione ≤ 0,63 m/s (≤ 0,30 m/s con ≤ 2,0 m di spazio).</tspan></text>
<text x="46" y="774" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="46" dy="0">Extracorsa · 5.12.2.1 (trazione: alto e basso; idraulico: solo alto) · 5.12.2.2.1 organo distinto da quello della fermata normale.</tspan></text>
<text x="46" y="808" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="46" dy="0">Limitatore di velocità e paracadute (trazione) · 5.6.2.2.1.6 (DES a SIL 2) · 5.6.2.1.5 (paracadute, SIL 1) · cavo del limitatore: nessun comando wireless (5.6.2.2.1.4 c) 1)).</tspan></text>
<text x="46" y="842" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="46" dy="0">Sensori di zona porta · 5.12.1.4: 2 sensori indipendenti verso il modulo CE (SIL 2) · il PLC ne riceve una copia per la manovra.</tspan></text>
<text x="46" y="876" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="46" dy="0">Allarme dalla fossa e dal tetto · 5.2.1.6: dispositivi di allarme nei punti dove si può restare intrappolati.</tspan></text>
<text x="46" y="910" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="46" dy="0">Cavi pendenti · 5.10.6.1: EN 50214 / IEC 60227-6 / IEC 60245-5 · sezione minima da EN 60204-1 prosp. 5.</tspan></text>
</g>

