<text x="754" y="752" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="754" dy="0">5.9.3.4.2 salita · 5.9.3.4.3 discesa · 5.9.3.4.4 sorveglianza · 5.9.3.10 limitatore di tempo: min(45 s; corsa + 10 s; min 20 s).</tspan></text>
<text x="754" y="780" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="754" dy="0">5.9.3.5.3.2 valvola di sovrappressione ≤ 140 % · 5.9.3.8.1 vm, vd ≤ 1,0 m/s · 5.9.3.9.1 discesa manuale ≤ 0,3 m/s.</tspan></text>
<text x="754" y="808" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="754" dy="0">5.12.1.10 antideriva 15 min · 5.12.2.3.2 extracorsa idraulico · 5.9.3.11 temperatura olio.</tspan></text>
<text x="754" y="836" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="754" dy="0">Il blocco valvole e il cilindro hanno certificato proprio: si comandano secondo la loro scheda.</tspan></text>
