<text x="837" y="1028" font-size="10" fill="#6b7280">QUADRO DI MANOVRA A PLC — PROGETTO DI FATTIBILITÀ · Carbon Stealth VCC</text>
<text x="837" y="1062" font-size="17" font-weight="700" fill="#111827">Potenza — ascensore idraulico (centralina + blocco valvole)</text>
<text x="837" y="1084" font-size="11" fill="#374151">2 contattori in salita · 2 dispositivi in serie sulle valvole di discesa · limitatore di tempo · discesa di emergenza</text>
<text x="837" y="1100" font-size="10" fill="#b45309">Schema di principio: non è un esecutivo. Lo firma un progettista abilitato.</text>
