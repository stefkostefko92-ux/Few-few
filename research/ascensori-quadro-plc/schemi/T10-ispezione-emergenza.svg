<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1587 1122" width="1587" height="1122" role="img" aria-label="Ispezione, emergenza, manutenzione e recupero">
<title>T10 — Ispezione, emergenza, manutenzione e recupero</title>
<defs><marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="1587" height="1122" fill="#ffffff"/>

<rect x="8" y="8" width="1571" height="1106" fill="none" stroke="#111827" stroke-width="2"/>
<rect x="14" y="14" width="1559" height="1094" fill="none" stroke="#111827" stroke-width="0.8"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="40" y="60" width="700" height="80" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="390" y="97.375" font-size="13" text-anchor="middle" font-weight="700" fill="#b91c1c"><tspan x="390" dy="0">STOP (fossa, tetto, ispezione, macchinario, pannello)</tspan></text>
<text x="390" y="113.625" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="390" dy="0">ferma e tiene fuori servizio · bistabile · SIL 3 · mai in cabina</tspan></text>
<polyline points="402,140 402,156" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-6b7280)"/>
<rect x="64" y="156" width="676" height="80" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
<text x="402" y="193.375" font-size="13" text-anchor="middle" font-weight="700" fill="#b45309"><tspan x="402" dy="0">ISPEZIONE (tetto / fossa)</tspan></text>
<text x="402" y="209.625" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="402" dy="0">uomo presente · ≤ 0,63 m/s (≤ 0,30 m/s se ≤ 2,0 m) · esclude servizio normale, emergenza e livellamento</tspan></text>
<polyline points="402,236 402,252" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-6b7280)"/>
<rect x="88" y="252" width="652" height="80" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
<text x="414" y="289.375" font-size="13" text-anchor="middle" font-weight="700" fill="#b45309"><tspan x="414" dy="0">EMERGENZA ELETTRICA (pannello)</tspan></text>
<text x="414" y="305.625" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="414" dy="0">uomo presente · ≤ 0,30 m/s · energia per portare la cabina al piano entro 1 h</tspan></text>
<polyline points="402,332 402,348" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-6b7280)"/>
<rect x="112" y="348" width="628" height="80" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.6"/>
<text x="426" y="385.375" font-size="13" text-anchor="middle" font-weight="700" fill="#7e22ce"><tspan x="426" dy="0">MANUTENZIONE (chiave nel quadro)</tspan></text>
<text x="426" y="401.625" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="426" dy="0">esclude chiamate di piano e comandi remoti · ferma le porte · invia ai piani estremi</tspan></text>
<polyline points="402,428 402,444" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-6b7280)"/>
<rect x="136" y="444" width="604" height="80" rx="6" fill="#ecfdf5" stroke="#15803d" stroke-width="1.6"/>
<text x="438" y="481.375" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d"><tspan x="438" dy="0">SERVIZIO NORMALE</tspan></text>
<text x="438" y="497.625" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="438" dy="0">solo se tutti i livelli sopra sono inattivi e la catena è chiusa</tspan></text>
<text x="40" y="560" font-size="11" text-anchor="start" font-weight="400" fill="#111827"><tspan x="40" dy="0">Più postazioni di ispezione: la cabina si muove solo premendo gli stessi tasti su tutte (5.12.1.5.2.1 i).</tspan></text>
<rect x="800" y="50" width="750" height="520" rx="8" fill="none" stroke="#111827" stroke-width="1.2"/>
<text x="810" y="66" font-size="12" text-anchor="start" font-weight="700" fill="#111827"><tspan x="810" dy="0">PANNELLO DI EMERGENZA E PROVE (fuori dal vano o nel quadro, EN 81-20:2020 5.2.6.6)</tspan></text>
<rect x="820" y="90" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="990" y="125.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="990" dy="0">Generale QS1</tspan></text>
<text x="990" y="141.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="990" dy="0">lucchettabile</tspan></text>
<rect x="1180" y="90" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="1350" y="125.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="1350" dy="0">Commutatore EMERGENZA</tspan></text>
<text x="1350" y="141.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="1350" dy="0">SIL 3 · IPXXD</tspan></text>
<rect x="820" y="182" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="990" y="217.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="990" dy="0">Pulsanti SALITA · DISCESA · MARCIA</tspan></text>
<text x="990" y="233.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="990" dy="0">bianco · nero · blu (prosp. 17)</tspan></text>
<rect x="1180" y="182" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="1350" y="217.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="1350" dy="0">Display / vista macchina</tspan></text>
<text x="1350" y="233.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="1350" dy="0">direzione · zona · velocità</tspan></text>
<rect x="820" y="274" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="990" y="309.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="990" dy="0">BYPASS porte</tspan></text>
<text x="990" y="325.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="990" dy="0">coperchio o presa-spina · cicalino</tspan></text>
<rect x="1180" y="274" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="1350" y="309.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="1350" dy="0">STOP del pannello</tspan></text>
<text x="1350" y="325.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="1350" dy="0">bistabile, EN 60947-5-5</tspan></text>
<rect x="820" y="366" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="990" y="401.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="990" dy="0">Citofono di soccorso</tspan></text>
<text x="990" y="417.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="990" dy="0">verso la cabina</tspan></text>
<rect x="1180" y="366" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="1350" y="401.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="1350" dy="0">Interruttore MANUTENZIONE</tspan></text>
<text x="1350" y="417.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="1350" dy="0">chiave · blocca anche il web</tspan></text>
<rect x="820" y="458" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="990" y="493.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="990" dy="0">Ripristino esterno al vano</tspan></text>
<text x="990" y="509.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="990" dy="0">riservato (ispezione in fossa)</tspan></text>
<rect x="1180" y="458" width="340" height="76" rx="6" fill="#f1f5f9" stroke="#111827" stroke-width="1.6"/>
<text x="1350" y="493.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#111827"><tspan x="1350" dy="0">Luce ≥ 200 lx</tspan></text>
<text x="1350" y="509.125" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280"><tspan x="1350" dy="0">sui dispositivi del pannello</tspan></text>
<rect x="40" y="600" width="740" height="370" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="50" y="616" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280"><tspan x="50" dy="0">Recupero senza rete</tspan></text>
<text x="56" y="636" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">TRAZIONE: freno a mano (5.9.2.2.2.7) oppure emergenza elettrica da riserva a ricarica</tspan></text>
<text x="56" y="666" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">   automatica; obbligatoria se serve una forza &gt; 400 N (5.9.2.3.3); ≤ 0,30 m/s; energia per 1 h (5.9.2.3.1 b).</tspan></text>
<text x="56" y="696" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">IDRAULICO: valvola manuale di discesa ≤ 0,3 m/s, azione mantenuta (5.9.3.9.1); pompa a mano (5.9.3.9.2);</tspan></text>
<text x="56" y="726" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">   YV4 (T03) azionata da batteria per la discesa elettrica al piano.</tspan></text>
<text x="56" y="756" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">ARD (opzionale): batteria + invertitore o alimentazione della valvola; il generale aperto non ammette marcia</tspan></text>
<text x="56" y="786" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">   automatica (5.10.5.5); in antincendio e ispezione l'ARD non interferisce (81-73 5.1.2.2).</tspan></text>
<text x="56" y="816" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="56" dy="0">Istruzioni di soccorso nel pannello e nel manuale: EN 81-20 7.2.2 i), EN 13015 6.4.</tspan></text>
<rect x="800" y="600" width="750" height="370" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="810" y="616" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280"><tspan x="810" dy="0">Remoto e manutenzione</tspan></text>
<text x="816" y="636" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="816" dy="0">EN 81-20 5.12.1.7 — nel quadro: mezzi riservati per escludere chiamate e comandi remoti.</tspan></text>
<text x="816" y="666" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="816" dy="0">EN 81-50 B.1 r. 7–8 — da remoto solo dati informativi; il codice non si modifica da remoto.</tspan></text>
<text x="816" y="696" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="816" dy="0">EN 81-28:2004 4.1.1 — l'allarme si invia anche in manutenzione; il filtro mai in manutenzione (4.1.5).</tspan></text>
<text x="816" y="726" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="816" dy="0">Progetto: l'interruttore MANUTENZIONE spegne le scritture da web/5G (restano lettura e allarme).</tspan></text>
<text x="816" y="756" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="816" dy="0">Progetto: «modo prova» che blocca il servizio normale finché attivo (81-50 B.2 r. 13).</tspan></text>
<text x="816" y="786" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="816" dy="0">Marcia dal tetto o dal pannello: il PLC non genera mai comandi di marcia (la catena e le pulsantiere</tspan></text>
<text x="816" y="816" font-size="11.5" text-anchor="start" font-weight="400" fill="#111827"><tspan x="816" dy="0">agiscono direttamente sugli organi di potenza, 5.11.2.4).</tspan></text>
</g>

<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="827" y="1010" width="746" height="98" fill="#fff" stroke="#111827" stroke-width="1.2"/>
<line x1="827" y1="1042" x2="1573" y2="1042" stroke="#111827" stroke-width="0.8"/>
<line x1="1437" y1="1010" x2="1437" y2="1108" stroke="#111827" stroke-width="0.8"/>
<line x1="1437" y1="1075" x2="1573" y2="1075" stroke="#111827" stroke-width="0.8"/>
<text x="837" y="1028" font-size="10" fill="#6b7280">QUADRO DI MANOVRA A PLC — PROGETTO DI FATTIBILITÀ · Carbon Stealth VCC</text>
<text x="837" y="1062" font-size="17" font-weight="700" fill="#111827">Ispezione, emergenza, manutenzione e recupero</text>
<text x="837" y="1084" font-size="11" fill="#374151">Priorità: STOP &gt; ispezione &gt; emergenza elettrica &gt; normale · remoto escluso in manutenzione</text>
<text x="837" y="1100" font-size="10" fill="#b45309">Schema di principio: non è un esecutivo. Lo firma un progettista abilitato.</text>
<text x="1445" y="1026" font-size="10" fill="#6b7280">Tavola</text>
<text x="1445" y="1056" font-size="26" font-weight="700">T10</text>
<text x="1445" y="1090" font-size="10" fill="#6b7280">Rev. A · 2026-10-07</text>
<text x="1445" y="1103" font-size="10" fill="#6b7280">A3 · senza scala</text>
</g>
</svg>
