<line x1="1437" y1="1075" x2="1573" y2="1075" stroke="#111827" stroke-width="0.8"/>
<text x="837" y="1028" font-size="10" fill="#6b7280">QUADRO DI MANOVRA A PLC — PROGETTO DI FATTIBILITÀ · Carbon Stealth VCC</text>
<text x="837" y="1062" font-size="17" font-weight="700" fill="#111827">Macchina a stati del software di manovra (PLC)</text>
<text x="837" y="1084" font-size="11" fill="#374151">Manovra collettiva selettiva · stesso programma per trazione e idraulico (cambiano 3 blocchi)</text>
<text x="837" y="1100" font-size="10" fill="#b45309">Schema di principio: non è un esecutivo. Lo firma un progettista abilitato.</text>
<text x="1445" y="1026" font-size="10" fill="#6b7280">Tavola</text>
<text x="1445" y="1056" font-size="26" font-weight="700">T13</text>
<text x="1445" y="1090" font-size="10" fill="#6b7280">Rev. A · 2026-10-07</text>
<text x="1445" y="1103" font-size="10" fill="#6b7280">A3 · senza scala</text>
</g>
</svg>
