# deja.carbonstealth.eu — Nginx (по модела на adblock.conf).
# Деплоят го инсталира като /etc/nginx/sites-available/deja.conf + symlink.
# TLS: certbot --nginx -d deja.carbonstealth.eu (идемпотентно при всеки деплой).
server {
    listen 80;
    listen [::]:80;
    server_name deja.carbonstealth.eu;
    root /var/www/deja;

    # Chrome Web Store Privacy Policy URL (английската е каноничната)
    location = /privacy {
        try_files /privacy-en.html =404;
    }

    # Българската версия (landing-ът я линква за BG посетители)
    location = /privacy-bg {
        try_files /privacy.html =404;
    }

    # Английска landing страница (canonical за x-default)
    location = /en {
        try_files /en.html =404;
    }

    # Италианска landing страница
    location = /it {
        try_files /it.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
