# deja.carbonstealth.eu — Nginx (по модела на adblock.conf).
# Деплоят го инсталира като /etc/nginx/sites-available/deja.conf + symlink.
# TLS: certbot --nginx -d deja.carbonstealth.eu (идемпотентно при всеки деплой).
server {
    listen 80;
    listen [::]:80;
    server_name deja.carbonstealth.eu;
    root /var/www/deja;

    # Chrome Web Store Privacy Policy URL
    location = /privacy {
        try_files /privacy.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
