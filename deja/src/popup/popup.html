<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <title>Déjà</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="glass.css" />
  </head>
  <body>
    <main class="pop">
      <header class="pop-head">
        <h1 class="logo">Déjà<span class="dot">.</span></h1>
        <p id="stats" class="pill">…</p>
      </header>

      <button id="open" class="primary" data-i18n="popupOpenSearch">Отвори търсенето</button>
      <button id="panel" class="secondary" data-i18n="popupOpenPanel">Страничен панел</button>

      <label class="switch lg">
        <span data-i18n="popupPause">Пауза на запомнянето</span>
        <input type="checkbox" id="paused" role="switch" />
      </label>

      <button id="forget" class="danger" data-i18n="popupForgetPage">Забрави тази страница</button>
      <button id="clear" class="danger" data-i18n="popupClear">Изчисти паметта</button>

      <nav class="links lg">
        <a id="memory" href="#" data-i18n="popupMemory">Моята памет</a>
        <a id="options" href="#" data-i18n="popupOptions">Настройки</a>
        <a
          href="https://deja.carbonstealth.eu"
          target="_blank"
          rel="noopener"
          data-i18n="supportLink"
          >Подкрепи Déjà</a
        >
      </nav>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
