<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="panelTitle">Déjà — компаньон</title>
    <link rel="stylesheet" href="search.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body class="panel">
    <main class="wrap">
      <header class="head">
        <h1 class="logo">Déjà<span class="dot">.</span></h1>
      </header>

      <form id="form" class="searchbox" autocomplete="off">
        <input id="query" type="search" data-i18n-placeholder="searchPlaceholder" />
        <button type="submit" id="go" data-i18n="searchButton">Търси</button>
      </form>
      <p id="status" class="status"></p>
      <section id="results" class="results" aria-live="polite"></section>

      <section class="block">
        <h2 class="block-title" data-i18n="panelOnThisPage">По темата на тази страница</h2>
        <p id="contextNote" class="note"></p>
        <div id="context" class="results compact"></div>
      </section>

      <section class="block">
        <h2 class="block-title" data-i18n="panelRecent">Последни спомени</h2>
        <div id="recent" class="results compact"></div>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
