version: 2
updates:
  # Application & tooling dependencies (single pnpm workspace at the root).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk patch/minor bumps into one PR to cut noise; majors stay
      # individual so they get a deliberate review.
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # GitHub Actions used by CI/CD.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci

  # Base images for the service Dockerfiles.
  - package-ecosystem: docker
    directory: "/infra"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
