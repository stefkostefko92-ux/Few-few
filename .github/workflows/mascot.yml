name: mascot

on:
  push:
    paths:
      - 'mascot/**'
      - '.github/workflows/mascot.yml'
  pull_request:
    paths:
      - 'mascot/**'
      - '.github/workflows/mascot.yml'

concurrency:
  group: mascot-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Пакетът е с нула зависимости — няма `npm ci`, няма node_modules, няма билд.
      # Гейтът е: генерираният компонент в синхрон ли е с SVG-тата, чиста ли е палитрата,
      # спазени ли са правилата за нивата, достъпността и сигурността на асета.
      - name: Гейт на маскота
        working-directory: mascot
        run: npm run gate
