name: treydar

on:
  push:
    paths:
      - 'treydar/**'
      - 'tools/trading/**'
      - '.github/workflows/treydar.yml'
  pull_request:
    paths:
      - 'treydar/**'
      - 'tools/trading/**'
      - '.github/workflows/treydar.yml'

concurrency:
  group: treydar-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: treydar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: treydar/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
