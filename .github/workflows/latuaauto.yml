name: LaTuaAuto CI

on:
  push:
    branches: ["**"]
    paths: ["LaTuaAuto/**", ".github/workflows/latuaauto.yml"]
  pull_request:
    paths: ["LaTuaAuto/**", ".github/workflows/latuaauto.yml"]

concurrency:
  group: latuaauto-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LaTuaAuto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LaTuaAuto/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
