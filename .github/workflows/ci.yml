name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dev deps (linkedom for api tests)
        run: npm install
      - name: Run all tests (syntax + logic + engine + api parsing)
        run: npm test
      - name: Verify store package excludes server/controller/tools
        run: |
          bash tools/package.sh
          if unzip -l dist/*.zip | grep -E 'controller/|server/|tools/|genkey|screenshots/'; then
            echo "::error::store zip contains files that must not ship"; exit 1
          fi
          echo "package zip is clean"

  # Loads the real unpacked extension in headed Chromium (xvfb) and checks the
  # service worker + all pages + content script boot without errors.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Extension integration test (Chromium + xvfb)
        run: xvfb-run -a npm run test:ext
