# Behavioral eval — АГЕНТ-В-ЦИКЪЛА, напълно автоматичен (loop „behavioral-eval", L1 само доклад).
# Месечно + ръчно: пуска парично-критичните агенти headless (`claude -p`) срещу golden spec-овете
# им, скорира (eval --run --record) + верификатор. Лови ПОВЕДЕНЧЕСКА регресия без човек в цикъла.
#
# Изисква repo secret ANTHROPIC_API_KEY (Settings → Secrets → Actions). БЕЗ него job-ът излиза
# зелен с ясно съобщение „пропуснато" — гейт, който лъже червено заради конфигурация, е шум.
name: behavioral-eval
on:
  schedule:
    - cron: "43 5 2 * *" # 2-о число, 05:43 UTC (off-peak минута)
  workflow_dispatch: {}

concurrency:
  group: behavioral-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  behavioral:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # САМО за да върне trend.jsonl — виж стъпката „Запази тренда"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2, пинат по SHA
      - name: Claude Code CLI (headless)
        if: ${{ env.HAS_KEY == 'true' }}
        run: npm install -g @anthropic-ai/claude-code
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      - name: Headless рън на критичните агенти + скориране + верификатор
        run: node tools/agents/evals/headless-run.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Одит Кръг 8 (2026-08-04): дотук евалът пишеше `evals/trend.jsonl` ВЪТРЕ в runner-а и
      # файлът умираше с него — нито артефакт, нито комит, а правата бяха само `read`. Значи
      # месечният рън харчеше API пари и ИЗПАРЯВАШЕ резултата си: трендът в git стоеше празен,
      # макар механизмът да съществува. Поведенческа регресия НЕ може да се види от една точка —
      # тренд без история е нула. Затова резултатът се връща в репото.
      - name: Запази тренда (иначе измерването изпарява)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if git diff --quiet -- tools/agents/evals/trend.jsonl; then
            echo "trend.jsonl без промяна — няма какво да се запази."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/agents/evals/trend.jsonl
          git commit -m "chore(evals): поведенческа точка от месечния рън"
          git push
