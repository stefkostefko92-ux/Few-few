name: zabobovdol CI

on:
  push:
    branches: ["**"]
    paths: ["zabobovdol/**", ".github/workflows/zabobovdol.yml"]
  pull_request:
    paths: ["zabobovdol/**", ".github/workflows/zabobovdol.yml"]

defaults:
  run:
    working-directory: zabobovdol

concurrency:
  group: zabobovdol-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Прилага се само при билд; страниците с база са force-dynamic, така че
      # билдът не докосва реална база.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXT_PUBLIC_SITE_URL: https://zabobovdol.carbonstealth.eu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zabobovdol/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
