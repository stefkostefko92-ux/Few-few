name: vizitka

on:
  push:
    paths:
      - 'vizitka/**'
      - '.github/workflows/vizitka.yml'
  pull_request:
    paths:
      - 'vizitka/**'
      - '.github/workflows/vizitka.yml'

concurrency:
  group: vizitka-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: vizitka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: vizitka/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
