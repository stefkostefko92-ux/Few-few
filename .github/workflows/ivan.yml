name: ivan

on:
  push:
    paths:
      - 'Ivan/**'
      - '.github/workflows/ivan.yml'
  pull_request:
    paths:
      - 'Ivan/**'
      - '.github/workflows/ivan.yml'

concurrency:
  group: ivan-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Тестовете на входа, правата и поръчките вървят срещу истински PostgreSQL (backend/test/harness.js
    # иска база, чието име завършва на _test, и сам слага схемата).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sklad
          POSTGRES_PASSWORD: sklad
          POSTGRES_DB: sklad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sklad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ivan/backend/package-lock.json
      - name: Зависимости (lockfile)
        working-directory: Ivan/backend
        run: npm ci --no-audit --no-fund
      # Prisma на ПРОДУКТА (от lockfile-а), не `npx --yes prisma` — той дърпа latest, който може да
      # обяви валидна схема за невалидна. `validate` не се свързва, но иска DATABASE_URL да съществува.
      - name: Валидна Prisma схема (версията на продукта)
        working-directory: Ivan/backend
        env:
          DATABASE_URL: postgresql://localhost:5432/validate_only
        run: npx prisma validate
      - name: Синтаксис на сорса
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::синтактична грешка"; fail=1; }
          done < <(find Ivan -name '*.js' -o -name '*.mjs' | grep -v node_modules)
          exit $fail
      - name: Тестове (вход, сесии, права, поръчки, seed)
        working-directory: Ivan/backend
        env:
          TEST_DATABASE_URL: postgresql://sklad:sklad@127.0.0.1:5432/sklad_test
        run: |
          npx prisma generate
          npm test
