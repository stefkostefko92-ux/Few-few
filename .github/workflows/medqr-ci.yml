name: MedQR CI

on:
  push:
    paths:
      - 'medqr/**'
      - '.github/workflows/medqr-ci.yml'
  pull_request:
    paths:
      - 'medqr/**'
      - '.github/workflows/medqr-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: medqr

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: medqr/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medqr/package-lock.json
      - run: npm ci
      - name: Проверка за уязвими зависимости (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Генериране на SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: medqr-sbom
          path: medqr/sbom.json
          if-no-files-found: ignore
