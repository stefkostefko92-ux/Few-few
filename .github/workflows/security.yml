name: security

# Репо-широк слой за сигурност (defense-in-depth), налаган на всеки PR и push към main.
# „Непробиваемо" няма — целта е много слоя, всеки от които фейлва ЗАТВОРЕНО (блокира),
# а не отворено. Твърдият гейт е самостоятелният secret-scan (нула зависимости, винаги
# работи). Останалите слоеве (gitleaks по историята, dependency-review) допълват.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Тайни (secret-scan + gitleaks)
    runs-on: ubuntu-latest
    # Таван на цялата задача. Подразбиращият се на GitHub е 360 МИНУТИ — при
    # закъсала стъпка проверката стои „in progress" шест часа и блокира сливането,
    # без нищо да е счупено. Виж бележката при gitleaks стъпката.
    timeout-minutes: 15
    steps:
      # Забележка (state-level follow-up): пинвай action-ите към пълен commit SHA (не @vX),
      # за да не може tag-hijack да вкара supply-chain код в CI-то.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # пълна история — за gitleaks
          persist-credentials: false # не оставяй GITHUB_TOKEN в git config (по-малка exfil повърхност)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ТВЪРД ГЕЙТ: вграденият скенер (нула външни зависимости → нула supply-chain риск).
      # Той е задължителният слой; всичко останало е допълнение.
      - name: secret-scan (built-in, hard gate)
        run: node tools/security/secret-scan.mjs
      # ДОПЪЛНИТЕЛЕН СЛОЙ: gitleaks по цялата история. best-effort — сваля се непроверен
      # бинар, затова НЕ го правим твърда зависимост (иначе самото CI става вектор);
      # ако намери нещо, стъпката се проваля видимо, но твърдият гейт горе вече е минал.
      #
      # ЗАСЯЧЕНО НА ЖИВО (07.08.2026): стъпката ЗАКЪСА за 10+ минути и остави цялата
      # проверка „in progress". `continue-on-error` покрива ПРОВАЛ, не ЗАВИСВАНЕ —
      # висяща стъпка не се проваля, тя просто не свършва, а таванът на GitHub по
      # подразбиране е 360 минути. Тоест best-effort слой можеше да блокира сливането
      # за шест часа, без нищо да е счупено. Три независими тавана оттук нататък:
      #   • `timeout-minutes` на стъпката и на задачата (никога „in progress" завинаги);
      #   • `--max-time` на curl (свалянето на бинара е мрежово и може да увисне);
      #   • `--max-target-megabytes` на самия gitleaks (голям blob в историята).
      - name: gitleaks (история, best-effort)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          ver="8.21.2"
          curl -sSL --max-time 120 --retry 2 --retry-delay 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz gitleaks && sudo mv gitleaks /usr/local/bin/ || { echo "gitleaks недостъпен — пропускам"; exit 0; }
          gitleaks git --no-banner --redact --exit-code 1 --max-target-megabytes 5

  dependencies:
    name: Уязвими зависимости (dependency-review)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # ДОПЪЛНИТЕЛЕН СЛОЙ (best-effort, като gitleaks по-горе): официалният
      # GitHub action блокира PR, който добавя зависимост с висока/критична CVE
      # — НО изисква включен Dependency graph + GitHub Advanced Security на
      # репото. Без тях самият action фейлва („not supported on this repository")
      # преди изобщо да оцени зависимости, което блокира всеки PR по причина,
      # несвързана с кода. Затова е continue-on-error: ако е наличен, докладва
      # видимо; ако не е — не проваля целия гейт. Твърдият гейт остава
      # secret-scan (job „secrets" по-горе).
      - name: dependency-review (best-effort — иска GHAS)
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
