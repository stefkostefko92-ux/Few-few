name: eternaltouch

on:
  push:
    paths:
      - 'eternaltouch/**'
      - '.github/workflows/eternaltouch.yml'
  pull_request:
    paths:
      - 'eternaltouch/**'
      - '.github/workflows/eternaltouch.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: eternaltouch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: eternaltouch/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm test
