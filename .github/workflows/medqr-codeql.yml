name: MedQR CodeQL

on:
  push:
    paths:
      - 'medqr/**'
      - '.github/workflows/medqr-codeql.yml'
  pull_request:
    paths:
      - 'medqr/**'
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths:
              - medqr
            paths-ignore:
              - medqr/node_modules
              - medqr/test
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: medqr
