name: panev

on:
  push:
    paths:
      - 'panev/**'
      - '.github/workflows/panev.yml'
  pull_request:
    paths:
      - 'panev/**'
      - '.github/workflows/panev.yml'

concurrency:
  group: panev-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panev/package-lock.json

      # panev няма нито тестове, нито линт (виж package.json: start/dev/db:*/build:site).
      # Не измисляме гейт, който не съществува — гейтваме това, което Е проверимо днес:
      # инсталируемо дърво от зависимости (единственият сигнал за цялост при продукт с Stripe)
      # и валиден синтаксис на целия сорс.
      - name: Инсталируеми зависимости (lockfile е цял)
        working-directory: panev
        run: npm ci --no-audit --no-fund

      - name: Синтаксис на целия сорс
        working-directory: panev
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=panev/$f::синтактична грешка"; fail=1; }
          done < <(find . -name '*.js' -o -name '*.mjs' | grep -v node_modules)
          exit $fail

      # СЪЗНАТЕЛНО БЕЗ `npm run build:site`: `site/build.mjs` импортва `site/data/i18n/{it,en,bg}.mjs`,
      # а те НЕ са в репото — `panev/.gitignore` имаше неанкериран `data/`, който освен базата
      # (`panev/data/`) криеше и `panev/site/data/`. Правилото е поправено на `/data/`, но самите
      # файлове още липсват и билдът пада в чист клон (значи и в деплой архива). Щом собственикът
      # ги комитне, добави тук стъпка `npm run build:site` — тя е истинският гейт за сайта.

      # Блокерът по-горе беше само коментар — тоест невидим при реален рън. Тази стъпка го изважда
      # в лога на ВСЯКО пускане: изброява точно кои модули липсват, за да не се разчита някой да
      # прочете YAML коментар. НЕ гейтва (`continue-on-error` не е нужен — стъпката винаги излиза 0),
      # защото липсата е бизнес съдържание, което само собственикът може да достави.
      - name: Липсващо съдържание за сайта (видимост, не гейт)
        working-directory: panev
        run: |
          missing=0
          for f in site/data/i18n/it.mjs site/data/i18n/en.mjs site/data/i18n/bg.mjs site/data/products.mjs; do
            if [ ! -f "$f" ]; then
              echo "::warning file=panev/site/build.mjs::липсва $f — `npm run build:site` не може да мине"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "▲ $missing липсващи модула: билдът на сайта е блокиран, докато не бъдат комитнати."
            echo "  Щом ги има, добави стъпка \`npm run build:site\` — тя е истинският гейт за сайта."
          else
            echo "✓ всички модули с данни са налични — ВРЕМЕ Е за стъпка \`npm run build:site\` тук."
          fi
