name: panev

on:
  push:
    paths:
      - 'panev/**'
      - '.github/workflows/panev.yml'
  pull_request:
    paths:
      - 'panev/**'
      - '.github/workflows/panev.yml'

concurrency:
  group: panev-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panev/package-lock.json

      # panev няма нито тестове, нито линт (виж package.json: start/dev/db:*/build:site).
      # Не измисляме гейт, който не съществува — гейтваме това, което Е проверимо днес:
      # инсталируемо дърво от зависимости (единственият сигнал за цялост при продукт с Stripe)
      # и валиден синтаксис на целия сорс.
      - name: Инсталируеми зависимости (lockfile е цял)
        working-directory: panev
        run: npm ci --no-audit --no-fund

      - name: Синтаксис на целия сорс
        working-directory: panev
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=panev/$f::синтактична грешка"; fail=1; }
          done < <(find . -name '*.js' -o -name '*.mjs' | grep -v node_modules)
          exit $fail

      # Истинският гейт на сайта: генераторът минава и страниците, които дава, са точно тези в
      # репото — нито ръчна редакция на генериран HTML, нито забравен билд след промяна по site/
      # (или по 3d/template.html и 3d-viewer/, от които се правят 3D страниците), нито нова
      # страница, която не е комитната (`git status` вижда и неследените файлове, `git diff` — не).
      # В sitemap.xml се прощава само lastmod — датата на билда. site/data вече е в репото (беше
      # скрит от стария неанкериран `data/` в .gitignore и е възстановен от генерираните страници).
      - name: Билд на сайта без разминаване с репото
        working-directory: panev
        run: |
          npm run build:site
          drift="$(git status --porcelain -- . ':(exclude)sitemap.xml')"
          if [ -n "$drift" ] || ! git diff --quiet -I '<lastmod>' -- sitemap.xml; then
            echo "$drift"
            git diff --stat -I '<lastmod>' -- sitemap.xml
            echo "::error::генерираните страници се разминават с site/ — пусни npm run build:site в panev/ и комитни"
            exit 1
          fi
