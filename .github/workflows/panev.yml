name: panev

on:
  push:
    paths:
      - 'panev/**'
      - '.github/workflows/panev.yml'
  pull_request:
    paths:
      - 'panev/**'
      - '.github/workflows/panev.yml'

concurrency:
  group: panev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panev/package-lock.json
      - run: npm ci
      - run: npm run build:site
      # Продуктът докосва Stripe — паричният линт е задължителен гейт, не съвет.
      - name: Stripe линт (пари · webhook · идемпотентност)
        run: node ../tools/commerce/stripe-lint.mjs .
