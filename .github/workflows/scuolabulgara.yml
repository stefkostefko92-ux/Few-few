name: scuolabulgara

on:
  push:
    paths:
      - 'scuolabulgara/**'
      - '.github/workflows/scuolabulgara.yml'
  pull_request:
    paths:
      - 'scuolabulgara/**'
      - '.github/workflows/scuolabulgara.yml'

concurrency:
  group: scuolabulgara-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scuolabulgara
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scuolabulgara/package-lock.json
      # postinstall прави prisma generate — затова npm ci е достатъчен преди build.
      - run: npm ci
      - run: npm run build
