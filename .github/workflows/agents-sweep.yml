# Планиран health-sweep на агентския слой (loop „health-sweep", автономия L1 — само доклад).
# Защо: agents.yml е path-филтриран → тича само при промяна в агентските папки. Застой/гниене
# (просрочен срок, регресия на инструмент от външна промяна) остава невидим. Този sweep тича по
# КАДАНС и при ръчно пускане, покрива целия гейт, и е ЧЕРВЕН ако нещо е изгнило. Нищо не се авто-поправя.
name: agents-sweep
on:
  schedule:
    - cron: "17 6 * * 1" # понеделник 06:17 UTC (off-peak минута — не :00)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node версия (zero-dep)
        run: node --version
      - name: Loop-audit (readiness на автоматизациите)
        run: node tools/agents/loops/loop-audit.mjs
      - name: Пълен гейт на агентския слой (loop „health-sweep")
        run: |
          node tools/agents/oversee.mjs
          node tools/agents/drift-lint.mjs
          node tools/agents/evals/eval.mjs --check
          node tools/agents/coverage.mjs --json > /dev/null
          node tools/skills/lint.mjs
          node tools/agents/tools-audit.mjs
          node tools/agents/def-freshness.mjs
          node tools/agents/token-budget.mjs --check
      - name: Всички тестове
        run: node --test $(find tools -name '*.test.mjs')
