name: supremediscordbot

on:
  push:
    paths:
      - 'SupremeDiscordBot/**'
      - '.github/workflows/supremediscordbot.yml'
  pull_request:
    paths:
      - 'SupremeDiscordBot/**'
      - '.github/workflows/supremediscordbot.yml'

concurrency:
  group: supremediscordbot-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  # Продуктът е три отделни пакета (backend · bot · frontend), всеки със свой lock и скриптове.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SupremeDiscordBot/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SupremeDiscordBot/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SupremeDiscordBot/bot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SupremeDiscordBot/bot/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SupremeDiscordBot/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SupremeDiscordBot/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
