# Гейт за агентския слой — „ръката" на Президента в CI (Конвейерът).
# Пуска oversee.mjs (fail-closed) + unit тестовете за надзорната логика при всяка промяна по
# .claude/agents, settings.json, hooks, таблото или tools/. Досега надзорът беше само
# ръчен; вече един провал (сирак, рассинхрон FALLBACK↔agents.json, липсваща доктрина) блокира PR.
name: agents

on:
  push:
    branches: [main]
    paths:
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".claude/settings.json"
      - ".claude/hooks/**"
      - "agents-dashboard/agents.json"
      - "agents-dashboard/index.html"
      # ЦЯЛОТО tools/, не три избрани папки. Стъпката по-долу пуска `find tools -name '*.test.mjs'`
      # — тоест ВСИЧКИ тестове — но филтърът ги пускаше само при промяна в agents|memory|skills.
      # Промяна в tools/seo/, tools/lib/, tools/qa/, tools/security/… минаваше БЕЗ нито един тест.
      # Гейт, чийто обхват е по-тесен от това, което проверява, е зелен по слепота.
      - "tools/**"
      - ".github/workflows/agents.yml"
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".claude/settings.json"
      - ".claude/hooks/**"
      - "agents-dashboard/agents.json"
      - "agents-dashboard/index.html"
      # ЦЯЛОТО tools/, не три избрани папки. Стъпката по-долу пуска `find tools -name '*.test.mjs'`
      # — тоест ВСИЧКИ тестове — но филтърът ги пускаше само при промяна в agents|memory|skills.
      # Промяна в tools/seo/, tools/lib/, tools/qa/, tools/security/… минаваше БЕЗ нито един тест.
      # Гейт, чийто обхват е по-тесен от това, което проверява, е зелен по слепота.
      - "tools/**"
      - ".github/workflows/agents.yml"

# Least-privilege: гейтът само чете кода.
permissions:
  contents: read

# Отмени предходен ран за същия ref (пести минути).
concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oversee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Пинат по SHA (не по подвижен таг) — supply-chain дисциплина. actions/checkout v4.2.2.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Node версия (зависимости няма — инструментите са zero-dep)
        run: node --version
      # Списъкът със стъпки живееше преписан на ръка тук И в agents-sweep.yml — и двата бяха се
      # раздалечили. Вече има един източник: tools/agents/gate.mjs. Пуска ги паралелно (~0.8s
      # стенен часовник срещу ~4.5 минути последователно) и печата изхода на всяка паднала.
      - name: Пълен гейт на агентския слой (fail-closed)
        run: node tools/agents/gate.mjs
      - name: Тестове на надзорната логика + скорера + рубриката + бюджета
        run: node --test $(find tools -name '*.test.mjs')
