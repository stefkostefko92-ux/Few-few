# Гейт за агентския слой — „ръката" на Президента в CI (Конвейерът).
# Пуска oversee.mjs (fail-closed) + unit тестовете за надзорната логика при всяка промяна по
# .claude/agents, settings.json, hooks, таблото или tools/agents|memory. Досега надзорът беше само
# ръчен; вече един провал (сирак, рассинхрон FALLBACK↔agents.json, липсваща доктрина) блокира PR.
name: agents

on:
  push:
    branches: [main]
    paths:
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".claude/settings.json"
      - ".claude/hooks/**"
      - "agents-dashboard/agents.json"
      - "agents-dashboard/index.html"
      - "tools/agents/**"
      - "tools/memory/**"
      - "tools/skills/**"
      - ".github/workflows/agents.yml"
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".claude/settings.json"
      - ".claude/hooks/**"
      - "agents-dashboard/agents.json"
      - "agents-dashboard/index.html"
      - "tools/agents/**"
      - "tools/memory/**"
      - "tools/skills/**"
      - ".github/workflows/agents.yml"

# Least-privilege: гейтът само чете кода.
permissions:
  contents: read

# Отмени предходен ран за същия ref (пести минути).
concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oversee:
    runs-on: ubuntu-latest
    steps:
      # Пинат по SHA (не по подвижен таг) — supply-chain дисциплина. actions/checkout v4.2.2.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node версия (зависимости няма — инструментите са zero-dep)
        run: node --version
      - name: Надзор над екипа (fail-closed — изход 1 при твърд проблем)
        run: node tools/agents/oversee.mjs
      - name: Golden eval — структурна валидност на spec-овете (без агент)
        run: node tools/agents/evals/eval.mjs --check
      - name: Покритие на домейни (картата не сочи несъществуващи агенти)
        run: node tools/agents/coverage.mjs --json > /dev/null
      - name: Skills lint (frontmatter/name/тяло — fail-closed)
        run: node tools/skills/lint.mjs
      - name: Одит за най-малки права (advisory агенти без Write/Edit)
        run: node tools/agents/tools-audit.mjs
      - name: Свежест на дефинициите (без просрочени срокове)
        run: node tools/agents/def-freshness.mjs
      - name: Drift-lint (счупени референции + бройка/ростер consistency = твърд провал; memory дрейф = съвет)
        run: node tools/agents/drift-lint.mjs
      - name: Loop-audit (readiness на автоматизациите — автономия-стълба)
        run: node tools/agents/loops/loop-audit.mjs
      - name: Токен-бюджет (гейт срещу разбягване на дефиниция; печат за логовете)
        run: node tools/agents/token-budget.mjs --check
      - name: Кандидати за _shared (дедуп на памет през агенти; информативно)
        run: node tools/agents/shared-candidates.mjs
      - name: Тестове на надзорната логика + скорера + рубриката + бюджета
        run: node --test $(find tools -name '*.test.mjs')
