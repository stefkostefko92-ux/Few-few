name: FiveM CI

on:
  push:
    branches: ["**"]
    paths: ["FiveM/**", ".github/workflows/fivem.yml"]
  pull_request:
    paths: ["FiveM/**", ".github/workflows/fivem.yml"]

concurrency:
  group: fivem-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    # Висяща стъпка не се проваля — тя не свършва, и без таван държи runner до
    # 360 мин по подразбиране. `continue-on-error` НЕ помага тук.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FiveM
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FiveM/package-lock.json
      - run: npm ci
      # Prisma клиентът се генерира преди typecheck — иначе типовете липсват.
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Билдът не се свързва с база (страниците с БД са dynamic и падат
          # меко), но Prisma иска валиден URL, за да не шуми в лога.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
