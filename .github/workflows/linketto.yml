name: linketto

on:
  push:
    paths:
      - 'linketto/**'
      - '.github/workflows/linketto.yml'
  pull_request:
    paths:
      - 'linketto/**'
      - '.github/workflows/linketto.yml'

concurrency:
  group: linketto-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linketto
    # Реален Postgres за интеграционните тестове на плащанията
    # (src/lib/__tests__/plan-order-service.int.test.ts: FOR UPDATE, CAS, refund).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linketto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/linketto_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linketto/package-lock.json
      - run: npm ci
      # Prisma клиентът се генерира преди typecheck — иначе типовете на модела липсват.
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      # Миграциите върху празна база — проверява и че веригата миграции е цяла.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      - run: npm test
      - run: npm run build
