name: linketto

on:
  push:
    paths:
      - 'linketto/**'
      - '.github/workflows/linketto.yml'
  pull_request:
    paths:
      - 'linketto/**'
      - '.github/workflows/linketto.yml'

concurrency:
  group: linketto-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linketto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linketto/package-lock.json
      - run: npm ci
      # Prisma клиентът се генерира преди typecheck — иначе типовете на модела липсват.
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
