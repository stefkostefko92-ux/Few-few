name: linketto

on:
  push:
    paths:
      - 'linketto/**'
      - '.github/workflows/linketto.yml'
  pull_request:
    paths:
      - 'linketto/**'
      - '.github/workflows/linketto.yml'

concurrency:
  group: linketto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linketto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linketto/package-lock.json
      - run: npm ci
      # Prisma клиентът се генерира преди typecheck — иначе типовете на модела липсват.
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
