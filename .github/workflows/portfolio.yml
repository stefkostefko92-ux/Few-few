name: portfolio

on:
  push:
    paths:
      - 'portfolio/**'
      - '.github/workflows/portfolio.yml'
  pull_request:
    paths:
      - 'portfolio/**'
      - '.github/workflows/portfolio.yml'

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Нула зависимости → няма npm ci. Гейт: билд → тестове (паритет на езиците, SEO инварианти,
      # цени ≥15% под пазара) → статичната проверка на репото върху генерирания dist/.
      - name: Билд
        working-directory: portfolio
        run: node build.mjs
      - name: Тестове
        working-directory: portfolio
        run: node --test test/build.test.mjs
      - name: Проверка на статичния сайт (препратки · ключови думи · title/lang)
        run: node tools/qa/static-site-check.mjs portfolio/dist
