name: ospedali

on:
  push:
    paths:
      - 'ospedali/**'
      - '.github/workflows/ospedali.yml'
  pull_request:
    paths:
      - 'ospedali/**'
      - '.github/workflows/ospedali.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: ospedali
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Нула зависимости → без npm ci и без npm кеш (няма lockfile).
      - run: npm run lint
      - run: npm test
