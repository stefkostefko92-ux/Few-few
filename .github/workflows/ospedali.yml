name: ospedali

on:
  push:
    paths:
      - 'ospedalitrasparenti/**'
      - '.github/workflows/ospedali.yml'
  pull_request:
    paths:
      - 'ospedalitrasparenti/**'
      - '.github/workflows/ospedali.yml'

concurrency:
  group: ospedali-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: ospedalitrasparenti
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Нула зависимости → без npm ci и без npm кеш (няма lockfile).
      - run: npm run lint
      - run: npm test
      # Типова проверка: strict @ts-check. TypeScript/@types/node се теглят само за
      # CI (--no-save) → package.json остава без зависимости. Само на един Node.
      - name: typecheck (@ts-check)
        if: matrix.node == 22
        run: |
          npm i --no-save typescript@5.7 @types/node
          npx tsc --allowJs --checkJs --noEmit --strict --module NodeNext \
            --moduleResolution NodeNext --skipLibCheck --target ES2022 --types node \
            src/*.js src/lib/*.js src/render/*.js server/*.js server/lib/*.js
