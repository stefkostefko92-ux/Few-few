name: Mastilko CI

on:
  push:
    branches: ["**"]
    paths: ["mastilko/**", ".github/workflows/mastilko.yml"]
  pull_request:
    paths: ["mastilko/**", ".github/workflows/mastilko.yml"]

concurrency:
  group: mastilko-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  # ── Качествена порта ──────────────────────────────────────────────────────
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mastilko
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mastilko/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
