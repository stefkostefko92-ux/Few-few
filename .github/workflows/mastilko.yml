name: Mastilko CI

on:
  push:
    branches: ["**"]
    paths: ["mastilko/**", ".github/workflows/mastilko.yml"]
  pull_request:
    paths: ["mastilko/**", ".github/workflows/mastilko.yml"]

concurrency:
  group: mastilko-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  # ── Качествена порта ──────────────────────────────────────────────────────
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mastilko
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mastilko/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Уязвимости в зависимостите. Без тази стъпка два RCE advisory-та срещу
      # next@16.3.0 и три high транзитивни стояха месец незабелязани — гейтът
      # беше зелен, защото никой не питаше. `--omit=dev` гледа това, което
      # реално тръгва на сървъра (деплоят прунва dev зависимостите).
      - name: npm audit (production зависимости)
        run: npm audit --omit=dev --audit-level=high
