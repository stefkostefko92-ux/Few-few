name: hospis

on:
  push:
    paths:
      - 'hospis/**'
      - '.github/workflows/hospis.yml'
  pull_request:
    paths:
      - 'hospis/**'
      - '.github/workflows/hospis.yml'

concurrency:
  group: hospis-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Статичен сайт без билд и без зависимости. Общият гейт: локалните препратки съществуват,
      # всяка страница носи ≥5 ключови думи с „Carbon Stealth“, има непразен <title> + lang.
      - name: Проверка на статичния сайт
        run: node tools/qa/static-site-check.mjs hospis
      # Специфичното за този сайт — неща, които вече са го чупили.
      - name: JSON-LD е валиден JSON, а sitemap сочи към реални страници
        run: |
          node --input-type=module -e '
            import { readFileSync, readdirSync, existsSync } from "node:fs";
            let bad = 0;
            for (const f of readdirSync("hospis").filter((x) => x.endsWith(".html"))) {
              const html = readFileSync(`hospis/${f}`, "utf8");
              for (const m of html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)) {
                try { JSON.parse(m[1]); } catch (e) { bad++; console.error(`✗ ${f}: невалиден JSON-LD — ${e.message}`); }
              }
              if (/\sstyle="/.test(html)) { bad++; console.error(`✗ ${f}: инлайн style="" нарушава CSP (style-src 'self')`); }
              if (/<script(?![^>]*\bsrc=)(?![^>]*ld\+json)[^>]*>/.test(html)) { bad++; console.error(`✗ ${f}: инлайн <script> нарушава CSP`); }
            }
            const sm = readFileSync("hospis/sitemap.xml", "utf8");
            for (const m of sm.matchAll(/<loc>https:\/\/hospis\.carbonstealth\.eu(\/[^<]*)<\/loc>/g)) {
              const p = m[1] === "/" ? "index.html" : m[1].slice(1);
              if (!existsSync(`hospis/${p}`)) { bad++; console.error(`✗ sitemap.xml сочи към липсваща страница: ${m[1]}`); }
            }
            JSON.parse(readFileSync("hospis/site.webmanifest", "utf8"));
            if (bad) process.exit(1);
            console.log("✓ JSON-LD, CSP-чистота (без инлайн style/script), sitemap и манифест — наред");
          '
