name: publikator

on:
  push:
    paths:
      - 'publikator/**'
      - '.github/workflows/publikator.yml'
  pull_request:
    paths:
      - 'publikator/**'
      - '.github/workflows/publikator.yml'

concurrency:
  group: publikator-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: publikator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: publikator/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: publikator
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: publikator
          POSTGRES_PASSWORD: publikator
          POSTGRES_DB: publikator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U publikator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://publikator:publikator@127.0.0.1:5432/publikator_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: publikator/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:integration
