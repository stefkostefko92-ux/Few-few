name: CSPos CI + desktop .exe

on:
  push:
    branches: ["**"]
    tags: ["cspos-v*"]
    paths: ["CSPos/**", ".github/workflows/cspos.yml"]
  pull_request:
    paths: ["CSPos/**", ".github/workflows/cspos.yml"]
  workflow_dispatch: # ръчно пускане на инсталатора от раздел Actions

concurrency:
  group: cspos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Качествена порта (Linux) ──────────────────────────────────────────────
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CSPos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CSPos/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # build-time стойност; реалната тайна се генерира в десктоп приложението
          SESSION_SECRET: ci_build_only_session_secret_32_chars_min_0123456789

  # ── Windows .exe инсталатор ───────────────────────────────────────────────
  desktop:
    name: Windows инсталатор (.exe)
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # за публикуване на Release при таг
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CSPos/package-lock.json

      - name: Приложение — зависимости и standalone билд
        working-directory: CSPos
        run: |
          npm ci
          npm run build
        env:
          SESSION_SECRET: ci_build_only_session_secret_32_chars_min_0123456789

      - name: Десктоп — зависимости
        working-directory: CSPos/desktop
        run: npm install

      - name: Сглобяване + electron-builder (NSIS .exe)
        working-directory: CSPos/desktop
        run: npm run dist:win

      - name: Качване на инсталатора като artifact
        uses: actions/upload-artifact@v7
        with:
          name: carbon-stealth-pos-setup
          path: CSPos/desktop/dist/*.exe
          if-no-files-found: error

      - name: Публикуване на Release (само при таг cspos-v*)
        if: startsWith(github.ref, 'refs/tags/cspos-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: CSPos/desktop/dist/*.exe
          name: Carbon Stealth POS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
