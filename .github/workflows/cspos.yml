name: CSPos CI + desktop .exe

on:
  push:
    branches: ["**"]
    tags: ["cspos-v*"]
    paths: ["CSPos/**", ".github/workflows/cspos.yml"]
  pull_request:
    paths: ["CSPos/**", ".github/workflows/cspos.yml"]
  workflow_dispatch: # ръчно пускане на инсталатора от раздел Actions

concurrency:
  group: cspos-${{ github.ref }}
  cancel-in-progress: true

# Най-малко права по подразбиране; само job-ът за Release вдига contents: write при себе си.
permissions:
  contents: read

jobs:
  # ── Качествена порта (Linux) ──────────────────────────────────────────────
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CSPos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CSPos/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # build-time стойност; реалната тайна се генерира в десктоп приложението
          SESSION_SECRET: ci_build_only_session_secret_32_chars_min_0123456789

  # ── Windows .exe инсталатор ───────────────────────────────────────────────
  desktop:
    name: Windows инсталатор (.exe)
    needs: quality
    # САМО при таг cspos-v* или ръчно пускане. Преди това се строеше на всеки
    # push към всеки клон: windows-latest се таксува ×2, а Electron билдът
    # (npm ci + Next билд + electron-builder NSIS) отнема 15-25 мин → 30-50
    # изядени минути на коммит. Безплатната квота е 2000/месец за частно репо,
    # тоест десетина коммита по CSPos я изчерпваха и целият CI на монорепото
    # оставаше без runner. Инсталаторът не е нужен на всеки коммит — нужен е
    # на релийз, а качествената порта (quality, Linux ×1) си тича както преди.
    if: startsWith(github.ref, 'refs/tags/cspos-v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    # Билдът няма права за запис: npm ci изпълнява install скриптове на ~400 пакета (electron,
    # electron-builder). Публикуването е в отделния job „release" по-долу.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CSPos/package-lock.json

      - name: Приложение — зависимости и standalone билд
        working-directory: CSPos
        run: |
          npm ci
          npm run build
        env:
          SESSION_SECRET: ci_build_only_session_secret_32_chars_min_0123456789

      - name: Десктоп — зависимости
        working-directory: CSPos/desktop
        # npm ci по закования package-lock.json (детерминистично). Без --ignore-scripts: electron
        # сваля бинара си в postinstall; правата на job-а са само за четене.
        run: npm ci

      - name: Сглобяване + electron-builder (NSIS .exe)
        working-directory: CSPos/desktop
        run: npm run dist:win

      - name: Качване на инсталатора като artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carbon-stealth-pos-setup
          path: CSPos/desktop/dist/*.exe
          if-no-files-found: error


  # ── Публикуване на Release (само при таг) ─────────────────────────────────
  # Отделен job: contents: write е тук, а не в билда. Не изпълнява код от репото/зависимости —
  # само тегли готовия artifact и го качва.
  release:
    name: Release (.exe → GitHub Release)
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/cspos-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # публикуване на Release
      id-token: write # OIDC за Sigstore provenance (без дълготрайни тайни)
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: carbon-stealth-pos-setup
          path: dist

      # SLSA build provenance през OIDC — без тайни. Best-effort: атестациите на частно репо
      # изискват GitHub Enterprise Cloud; без него стъпката не бива да блокира релийза.
      - name: Provenance атестация (best-effort)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe

      - name: Публикуване на Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.exe
          name: Carbon Stealth POS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
