name: chatchat

on:
  push:
    paths:
      - 'chatchat/**'
      - '.github/workflows/chatchat.yml'
  pull_request:
    paths:
      - 'chatchat/**'
      - '.github/workflows/chatchat.yml'

concurrency:
  group: chatchat-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chatchat
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chatchat/package-lock.json
      - run: npm ci
      # prettier · typecheck · unit тестове · build
      - run: npm run gate

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chatchat
    services:
      postgres:
        # Същият образ като в docker-compose.yml (PostgreSQL 16 + vector) — миграцията прави
        # CREATE EXTENSION vector, а postgres:16-alpine го няма.
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: chatchat
          POSTGRES_PASSWORD: chatchat
          POSTGRES_DB: chatchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatchat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://chatchat:chatchat@127.0.0.1:5432/chatchat_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chatchat/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      # Схемата и миграциите не бива да се разминават.
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      # Интеграционните тестове още се пишат: при празна папка job-ът минава.
      - name: Интеграционни тестове
        run: |
          if compgen -G "tests/integration/*.test.ts" > /dev/null; then
            npm run test:integration
          else
            echo "Няма tests/integration/*.test.ts — пропускам."
          fi

  # E2E (§17.2): истински Chromium срещу истинското приложение (фалшив модел и антивирус),
  # вкл. axe проверката за достъпност. Браузърът се сваля САМО тук (локално е в PLAYWRIGHT_BROWSERS_PATH).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chatchat
    services:
      postgres:
        # Същият пиннат образ като в integration job-а (PostgreSQL 16 + vector).
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: chatchat
          POSTGRES_PASSWORD: chatchat
          POSTGRES_DB: chatchat_test_ac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatchat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://chatchat:chatchat@127.0.0.1:5432/chatchat_test_ac
      CI: 'true' # playwright.config.ts: retries 2, junit репортер, forbidOnly
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chatchat/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      # Версията на браузъра следва пинатия @playwright/test (1.56.1) от package-lock.json.
      - name: Chromium (само в CI)
        run: npx playwright install --with-deps chromium
      - name: E2E (вкл. axe)
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chatchat-e2e-results
          path: chatchat/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Оценъчният набор (§16, AC-09) с фалшив модел: вижда се как промяна на промпта/правилата
  # движи метриките; изход 1 при нарушение на безопасността. Истинският Vertex не се вика в CI.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chatchat
    services:
      postgres:
        # Същият пиннат образ като в integration job-а (PostgreSQL 16 + vector).
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: chatchat
          POSTGRES_PASSWORD: chatchat
          POSTGRES_DB: chatchat_test_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatchat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://chatchat:chatchat@127.0.0.1:5432/chatchat_test_eval
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chatchat/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Оценка (--fake)
        run: npm run eval -- --set evals/sample.json --db "$DATABASE_URL" --fake --out evals/reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chatchat-eval-report
          path: |
            chatchat/evals/reports/*.json
            chatchat/evals/reports/*.md
          if-no-files-found: warn
          retention-days: 30

  # Сканиране на контейнера (§17.2): билд от chatchat/Dockerfile + Trivy.
  # Гейтът пада на CRITICAL/HIGH със налична поправка; SARIF отива в Security таба.
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # само за качване на SARIF
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Билд на образа
        run: docker build -t chatchat:ci chatchat
      - name: Trivy (гейт)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chatchat:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chatchat:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-chatchat.sarif
          skip-setup-trivy: true
      # Форк-PR получава read-only токен → без качване. Не носеща стъпка (гейтът е горе).
      - name: Качване на SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-chatchat.sarif
          category: chatchat-image

  # Блокиращ dependency-review САМО за промени в chatchat/ (общият в security.yml е best-effort).
  # Иска включен Dependency graph в Settings → Advanced Security; иначе job-ът пада.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
