name: rendetto

on:
  push:
    paths:
      - 'rendetto/**'
      - '.github/workflows/rendetto.yml'
  pull_request:
    paths:
      - 'rendetto/**'
      - '.github/workflows/rendetto.yml'

concurrency:
  group: rendetto-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rendetto
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rendetto/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      # DXF одитът минава през ezdxf; без него тестът се пропуска, затова го слагаме изрично.
      - run: python3 -m pip install --user ezdxf==1.4.4
      - run: npm run test:engine
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rendetto
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rendetto
          POSTGRES_PASSWORD: rendetto
          POSTGRES_DB: rendetto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rendetto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Само за теста: локална база в контейнера на GitHub, нищо общо с продукцията.
      TEST_DATABASE_URL: postgresql://rendetto:rendetto@127.0.0.1:5432/rendetto_test
      DATABASE_URL: postgresql://rendetto:rendetto@127.0.0.1:5432/rendetto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rendetto/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration
