name: nexus CI

on:
  push:
    branches: ["**"]
    paths: ["Nexus/**", ".github/workflows/nexus.yml"]
  pull_request:
    paths: ["Nexus/**", ".github/workflows/nexus.yml"]

defaults:
  run:
    working-directory: Nexus

concurrency:
  group: nexus-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, build, release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Nexus/package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Server typecheck
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Server tests
        run: npm test --workspace server

      - name: Client build (tsc -b + vite)
        run: npm run build --workspace client

      # Автоматичен release gate — фейлва при PLACEHOLDER правни данни,
      # некомерсиални асети в realistic/ или .dockerignore↔Dockerfile
      # несъответствие. Виж scripts/release-gate.sh.
      - name: Release gate
        run: bash scripts/release-gate.sh
