name: karakochev

# Гейтът на „Каракочев“ (iOS). Ядрото (сметки за дати + планиране на известия)
# е Foundation-only и се тества на Linux при всяка промяна — без Mac и без
# минути от скъп macOS runner.
#
# Целият проект (SwiftUI + SwiftData) се билдва с xcodebuild, но само РЪЧНО:
# Actions → „karakochev“ → Run workflow (macOS runner-ите се таксуват 10×).

on:
  push:
    paths:
      - "karakochev/**"
      - ".github/workflows/karakochev.yml"
  pull_request:
    paths:
      - "karakochev/**"
      - ".github/workflows/karakochev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karakochev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Ядро (Linux)
    runs-on: ubuntu-latest
    # Точна patch версия — `swift:6.1-noble` е подвижен таг и се рипъблишва.
    container: swift:6.1.2-noble
    defaults:
      run:
        working-directory: karakochev
    steps:
      # Пинат по SHA — supply-chain дисциплина. actions/checkout v4.2.2.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Формат
        run: swift format lint --strict --recursive Karakochev Tests

      - name: Локализация
        run: |
          command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends python3)
          python3 scripts/check-localization.py

      - name: Билд
        run: swift build

      - name: Тестове
        run: swift test

      - name: Иконата е възпроизводима от скрипта
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/generate-icon.py
          git diff --exit-code -- Karakochev/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

  app:
    name: Приложение (xcodebuild)
    # Не харчи 10× по-скъпи macOS минути, ако Linux гейтът е червен.
    needs: core
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: karakochev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Билд за симулатор (без подписване)
        run: |
          xcodebuild build \
            -project Karakochev.xcodeproj \
            -scheme Karakochev \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Архив за истинско устройство, БЕЗ подпис. Подписването иска сертификат,
      # вързан за конкретен Apple ID и телефон — то става на машината на
      # собственика (Xcode, Sideloadly или AltStore), не тук.
      - name: Архив за устройство (без подписване)
        run: |
          xcodebuild archive \
            -project Karakochev.xcodeproj \
            -scheme Karakochev \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Karakochev.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # .ipa е обикновен zip с папка `Payload/`. Правим го ръчно, защото
      # `xcodebuild -exportArchive` изисква подпис, какъвто тук няма.
      - name: Сглоби .ipa
        run: |
          set -e
          APP="build/Karakochev.xcarchive/Products/Applications/Karakochev.app"
          test -d "$APP" || { echo "::error::архивът не съдържа Karakochev.app"; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "Karakochev-$VERSION-unsigned.ipa" Payload)
          shasum -a 256 "build/Karakochev-$VERSION-unsigned.ipa" | tee build/SHA256.txt
          {
            echo "### Готов за подписване"
            echo ""
            echo '`Karakochev-'"$VERSION"'-unsigned.ipa` — свали го от „Artifacts“ по-долу.'
            echo "Инсталация: **Sideloadly** или **AltStore** (Windows/Mac) с твоя Apple ID,"
            echo "или Xcode → Window → Devices and Simulators. Виж \`karakochev/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Качи .ipa
        # По таг (както android.yml) — не пиша SHA по памет, който не мога да проверя.
        uses: actions/upload-artifact@v4
        with:
          name: karakochev-ipa-unsigned
          path: |
            karakochev/build/*.ipa
            karakochev/build/SHA256.txt
          if-no-files-found: error
          retention-days: 30
