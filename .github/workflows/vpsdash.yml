name: vpsdash

on:
  push:
    paths:
      - 'vpsdash/**'
      - '.github/workflows/vpsdash.yml'
  pull_request:
    paths:
      - 'vpsdash/**'
      - '.github/workflows/vpsdash.yml'

permissions:
  contents: read

concurrency:
  group: vpsdash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: vpsdash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Нула зависимости → без npm ci и без npm кеш (няма lockfile).
      # ЕДНА команда: съставът на гейта живее в scripts/gate.mjs, не тук. Точно
      # такова дублиране дрейфва — CI-ят тихо става по-слаб от локалния гейт.
      # Браузърните проверки се пропускат сами, ако Playwright липсва.
      - run: npm run gate
      # Проверка, че деплой скриптовете са валиден bash + минават deploy-check.
      - name: bash syntax
        run: bash -n deploy/install.sh
      - name: deploy-check (zero-dep линтер)
        run: node ../tools/vps/deploy-check.mjs deploy/install.sh
