name: semki

on:
  push:
    paths:
      - 'semki/**'
      - '.github/workflows/semki.yml'
  pull_request:
    paths:
      - 'semki/**'
      - '.github/workflows/semki.yml'

concurrency:
  group: semki-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: продуктовият гейт само чете кода.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: semki
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: semki/package-lock.json
      - run: npm ci
      # Целият гейт: prisma generate, prettier, типове, unit тестове (вкл. deploy.sh), билд.
      - run: npm run check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: semki
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: semki
          POSTGRES_PASSWORD: semki
          POSTGRES_DB: semki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semki"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Името завършва на _test: тестовете трият таблиците и отказват всяка друга база.
      TEST_DATABASE_URL: postgresql://semki:semki@127.0.0.1:5432/semki_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: semki/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration
