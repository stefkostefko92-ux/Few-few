<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поръчката е приета — Carbon Stealth POS</title>
<style>
  body{margin:0;font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#17203a;min-height:100vh;
    background:linear-gradient(180deg,#eef1f8,#e6ebf4);display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .card{max-width:34rem;width:100%;background:rgba(255,255,255,.6);backdrop-filter:blur(14px) saturate(1.5);
    border:1px solid rgba(255,255,255,.75);border-radius:24px;padding:2rem;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 18px 44px -20px rgba(23,32,58,.35);text-align:center}
  h1{font-size:1.5rem;margin:.4rem 0}
  p{color:#5c6b85}
  .key{font-family:ui-monospace,Consolas,monospace;font-size:1.15rem;font-weight:700;letter-spacing:.04em;
    background:#fff;border:1px dashed #d98e0b;border-radius:14px;padding:.9rem;margin:1rem 0;user-select:all;word-break:break-all}
  a.dl{display:inline-block;margin-top:.6rem;padding:.85rem 1.6rem;border-radius:16px;font-weight:800;text-decoration:none;
    background:linear-gradient(180deg,#ffd873,#f5a623);color:#231a05;box-shadow:0 10px 26px -10px rgba(217,142,11,.6)}
  .muted{font-size:.85rem}
  .spin{width:2rem;height:2rem;border:3px solid rgba(23,32,58,.15);border-top-color:#f5a623;border-radius:50%;
    margin:1rem auto;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="box">
  <div class="spin"></div>
  <h1>Потвърждаваме плащането…</h1>
  <p>Обикновено отнема няколко секунди. Не затваряйте страницата.</p>
</div>
<script>
const sid = new URLSearchParams(location.search).get("session_id");
async function poll(){
  try{
    const r = await fetch(`/api/session-status?session_id=${encodeURIComponent(sid)}`);
    const d = await r.json();
    if (d.status === "ready"){
      document.getElementById("box").innerHTML = `
        <h1>Благодарим Ви! 🎉</h1>
        <p>Вашият лицензен ключ за <b>${d.seats} ${d.seats===1?"каса":"каси"}</b> (план: ${d.plan}):</p>
        <div class="key">${d.key}</div>
        <p class="muted">Запазете ключа — той е и Вашият достъп за сваляне и активация.
        При активация въведете ключа в „Настройки → Лиценз“ на всяка каса.</p>
        <a class="dl" href="${d.download}">⬇ Свали Carbon Stealth POS (.exe)</a>`;
      return;
    }
  }catch{}
  setTimeout(poll, 2000);
}
if (sid) poll();
</script>
</body>
</html>
