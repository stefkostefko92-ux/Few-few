# nginx — reverse proxy за лицензионния магазин. TLS с certbot (Let's Encrypt).
# Приложението слуша на 127.0.0.1:8790 (systemd unit-ът е зад тази стена + ufw).

# Пренасочване на HTTP към HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name pos.carbonstealth.eu;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pos.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/pos.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.carbonstealth.eu/privkey.pem;

    # Само модерни протоколи и шифри.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Магазинът НЕ задава HSTS/CSP в кода (за разлика от medqr) → задаваме тук.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    # Малки JSON заявки (планове, ключове, активации). Голямото е само /download.
    client_max_body_size 64k;

    # Stripe webhook — RAW body, проверява се по подпис в приложението.
    # Стандартният proxy_pass предава байтовете непокътнати; лимитът е малко
    # по-голям, защото някои Stripe събития надхвърлят 64k.
    location = /api/webhook {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Сваляне на инсталатора (.exe, десетки MB) — без буфериране към временен
    # файл, стриймва се директно; по-дълги таймаути за бавни връзки.
    location /download {
        client_max_body_size 0;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
