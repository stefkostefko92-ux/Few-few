# Linketto — сайт-блок за Nginx на хоста (еднократна инсталация, DEPLOY.md §7):
#
#   sudo install -m 644 /opt/few-few/current/linketto/deploy/nginx.conf /etc/nginx/sites-available/linketto
#   sudo ln -sfn /etc/nginx/sites-available/linketto /etc/nginx/sites-enabled/linketto
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d piuma.carbonstealth.eu --redirect
#
# Блокът е САМО HTTP нарочно (моделът на FiveM/adblock): готов `listen 443 ssl`
# без сертификат не минава `nginx -t`, а сертификатът се издава чак след това.
# `certbot --nginx` сам добавя 443 блока и пренасочването.
#
# Файлът се включва от /etc/nginx/nginx.conf ВЪТРЕ в http {} — затова директивите от http
# контекста (log_format, зоните на лимитите, кешът, map-овете) са тук, с префикс `linketto_`
# (имената са общи за целия nginx на хоста). Пакетният nginx на Ubuntu 24.04 е 1.24 — нищо тук
# не иска по-нов (без `http2 on;`).

# Дневник за достъп БЕЗ IP адрес и без user agent. Политиката на Linketto обещава,
# че IP се записва само при вход в акаунта (90 дни) и „не важи за посетителите
# на профили“ — стандартният `combined` формат би го нарушил за всяка заявка.
log_format linketto_noip '[$time_local] "$request" $status $body_bytes_sent $request_time';

# ── Лимити (на IP) ──────────────────────────────────────────────────────────────
# Първи пласт пред приложението; вторият е src/lib/rate-limit.ts (по IP и имейл). Ключът е
# $binary_remote_addr — истинският IP, защото пред nginx няма CDN (X-Real-IP по-долу е същото).
# Ако някога сложиш Cloudflare отпред, ПЪРВО real_ip (set_real_ip_from + real_ip_header), иначе
# всички посетители делят IP-тата на Cloudflare и лимитите режат всички наведнъж.
# Празен ключ = заявката не се брои (така GET-овете не харчат лимита на входа/действията).
map $request_method $linketto_post_key {
  POST    $binary_remote_addr;
  default '';
}
# Server actions на Next: POST с заглавка `Next-Action` към адреса на страницата.
map "$request_method:$http_next_action" $linketto_action_key {
  '~^POST:.+' $binary_remote_addr;
  default     '';
}
# Общо: всички заявки (страници, профили, снимки). Щедро — профилите се отварят от социалните
# мрежи и мобилните оператори пускат много хора през един IP (CGNAT).
limit_req_zone $binary_remote_addr zone=linketto_req:10m    rate=20r/s;
# /api/ (без уебхука на Revolut — той е отделно, без лимит; защитата му е подписът).
limit_req_zone $binary_remote_addr zone=linketto_api:10m    rate=5r/s;
# Вход, регистрация, „Забравена парола“, нова парола — само POST.
limit_req_zone $linketto_post_key  zone=linketto_auth:10m   rate=10r/m;
# Всички server actions (табло, публичните форми, качването) — само POST с Next-Action.
limit_req_zone $linketto_action_key zone=linketto_action:10m rate=3r/s;
# Едновременни връзки от един IP (бавни клиенти, slowloris).
limit_conn_zone $binary_remote_addr zone=linketto_conn:10m;

# ── Кеш (само съдържание без бисквитки) ─────────────────────────────────────────
# /_next/static — имената носят хеш на билда (неизменни). /media — качените снимки с имена-
# случайни id; кешът е КРАТЪК (10 мин.), защото изтрита снимка (изтрит акаунт/смяна на аватар)
# не бива да се сервира от нас дълго след изтриването. nginx сам създава папката.
proxy_cache_path /var/cache/nginx/linketto levels=1:2 keys_zone=linketto_cache:10m
                 max_size=256m inactive=60m use_temp_path=off;

server {
  listen 80;
  listen [::]:80;
  server_name piuma.carbonstealth.eu;

  # Качване на снимка до 8 MB (src/lib/media.ts) през server action с таван
  # 9 MB (next.config.mjs → serverActions.bodySizeLimit) + multipart overhead. По-малко → nginx
  # връща 413 ПРЕДИ приложението да види заявката. /api/ е с по-нисък таван (по-долу).
  client_max_body_size 10m;

  # ── Таймаути ───────────────────────────────────────────────────────────────
  # Между две четения/записа, не за цялата заявка: качване на 10 MB по бавна мобилна мрежа минава,
  # стои ли клиентът 30 s без байт — затваря се (slowloris).
  client_header_timeout 15s;
  client_body_timeout   30s;
  send_timeout          30s;
  keepalive_timeout     30s;
  keepalive_requests    1000;
  reset_timedout_connection on;

  limit_req_status  429;
  limit_conn_status 429;
  limit_req_log_level warn;
  limit_conn linketto_conn 40;

  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Подпапка, не `/var/log/nginx/linketto.access.log`: пакетният
  # `/etc/logrotate.d/nginx` глоби `/var/log/nginx/*.log` и двата конфига биха се
  # били за едни и същи файлове (`duplicate log entry`, измерено при FiveM).
  # Папката и ротацията (7 дни) ги слага deploy/autodeploy.sh.
  access_log /var/log/nginx/linketto/access.log linketto_noip;
  # error_log съдържа `client: <IP>` и форматът му не се сменя — затова кратък
  # срок (deploy/logrotate.conf) и ниво `error`, не `notice`/`info`. (Затова и отказите по
  # лимит са на `warn` — не пълнят дневника с IP-та; виждат се като 429 в access.log.)
  error_log  /var/log/nginx/linketto/error.log error;

  # ── CSP — САМО ДОКЛАД (Report-Only), стъпка 1 ──────────────────────────────
  # Нищо не се блокира; браузърът докладва нарушенията на /api/csp-report (src/app/api/csp-report,
  # в дневника на app — без IP, без адреса на страницата с параметрите). Защо тук, а не с nonce в
  # middleware — DEPLOY.md §7 „CSP“. Останалите заглавия за сигурност (HSTS, X-Frame-Options,
  # nosniff, Referrer-Policy, COOP/CORP, Permissions-Policy) са в next.config.mjs и минават
  # непроменени. Внимание: location с СОБСТВЕН add_header не наследява тези (виж /_next/static/).
  # Снимките на профилите може да са от всеки https:// адрес (lib/style.ts → imageRef); вграденото
  # видео — само youtube-nocookie и player.vimeo (lib/blocks.ts → videoEmbedSrc).
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self'; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.revolut.com; frame-ancestors 'self'; report-uri /api/csp-report; report-to linketto-csp" always;
  add_header Reporting-Endpoints 'linketto-csp="/api/csp-report"' always;

  # ── Хедърите, които приложението НЕ бива да вижда от клиента ────────────────
  # На ниво server, за да важат за всеки `location` (вложен блок със собствен
  # `proxy_set_header` би изгубил наследяването — затова в location-ите няма).
  # `X-Real-IP` е доверения IP за лимитите на формите и входа (src/lib/limiter.ts).
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Изпразнени: иначе клиентът си подхвърля „IP“ и заобикаля лимитите.
  proxy_set_header X-Forwarded-For "";
  proxy_set_header True-Client-IP "";
  proxy_set_header CF-Connecting-IP "";
  # Държавата идва от нашата база по X-Real-IP — заглавките на CDN, които тук
  # няма, се изпразват (иначе посетителят си избира „държава“ в аналитиката).
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Vercel-IP-Country "";
  underscores_in_headers off;

  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # ── Скенери: тихо затваряне (444 — без отговор) ─────────────────────────────
  # Приложението няма нито един от тези пътища; заявките са само ботове, които търсят тайни и
  # WordPress. `.well-known` остава (ACME, security.txt). Regex-ите се проверяват преди
  # префиксните location-и по-долу — затова тук са само пътища, които никога не са наши.
  location ~ ^/\.(?!well-known/) {
    access_log off;
    return 444;
  }
  location ~* ^/(?:wp-admin|wp-content|wp-includes|wp-json|wordpress|cgi-bin|phpmyadmin|vendor/phpunit)(?:/|$) {
    access_log off;
    return 444;
  }
  location ~* \.(?:php[0-9]?|phtml|asp|aspx|jsp|cgi|env|ini|sql|bak|old|swp)$ {
    access_log off;
    return 444;
  }

  location / {
    limit_req zone=linketto_req burst=60 nodelay;
    limit_req zone=linketto_action burst=20 nodelay;
    proxy_pass http://127.0.0.1:4350;
  }

  # Вход/регистрация/забравена/нова парола на всеки език (/bg/login, /nap/register…) — POST-овете
  # (server actions) с отделен тесен лимит; GET-овете минават само през общия. Кавичките са
  # задължителни: `{` в regex без тях nginx чете като начало на блок.
  location ~ "^/[a-z]{2,3}/(?:login|register|forgot|reset)(?:/|$)" {
    limit_req zone=linketto_req burst=60 nodelay;
    limit_req zone=linketto_auth burst=10 nodelay;
    limit_req zone=linketto_action burst=20 nodelay;
    proxy_pass http://127.0.0.1:4350;
  }

  # Статиката на Next носи хеш в името — дълъг кеш в браузъра и в nginx (Node не я сервира
  # отново при всеки посетител). Собственият add_header тук спира наследяването на CSP-RO по-горе —
  # нарочно: това са JS/CSS файлове, не документи (nosniff и останалите идват от Next).
  location /_next/static/ {
    limit_req zone=linketto_req burst=200 nodelay;
    proxy_cache linketto_cache;
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_pass http://127.0.0.1:4350;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Качените снимки (src/app/(public)/media/[file]) — кратък кеш в nginx (виж proxy_cache_path).
  # Cache-Control от приложението (immutable за браузъра) остава към клиента, но nginx го
  # игнорира за собствения си срок. Без add_header тук — заглавията на Next минават и от кеша.
  location /media/ {
    limit_req zone=linketto_req burst=100 nodelay;
    proxy_cache linketto_cache;
    proxy_cache_valid 200 10m;
    proxy_cache_valid 404 1m;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_lock on;
    proxy_pass http://127.0.0.1:4350;
  }

  location /api/ {
    client_max_body_size 1m;
    limit_req zone=linketto_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:4350;
  }

  # Уебхукът на Revolut: без лимит на заявките (повторенията им идват на серии от няколко IP);
  # защитата е HMAC подписът върху суровото тяло. Телата са малки.
  location = /api/revolut/webhook {
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:4350;
  }

  # Докладите на CSP: малки JSON-и; лимитът е общият за /api/ плюс таван на тялото.
  location = /api/csp-report {
    client_max_body_size 64k;
    limit_req zone=linketto_api burst=20 nodelay;
    access_log off;
    proxy_pass http://127.0.0.1:4350;
  }

  # Cron маршрутите се викат САМО от хоста (systemd таймерите → 127.0.0.1:4350).
  # Отвън няма защо да стигат до тях — защитата е CRON_SECRET, това е втори пласт.
  location /api/cron/ {
    return 404;
  }
}

# Кратък домейн (PROFILE_HOST, по избор): добави името му в `server_name` горе,
# DNS запис и `certbot --nginx -d <домейн>` (DEPLOY.md §2).
