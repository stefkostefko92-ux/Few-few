# Linketto — сайт-блок за Nginx на хоста (еднократна инсталация, DEPLOY.md §7):
#
#   sudo install -m 644 /opt/few-few/current/linketto/deploy/nginx.conf /etc/nginx/sites-available/linketto
#   sudo ln -sfn /etc/nginx/sites-available/linketto /etc/nginx/sites-enabled/linketto
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d linketto.carbonstealth.eu --redirect
#
# Блокът е САМО HTTP нарочно (моделът на FiveM/adblock): готов `listen 443 ssl`
# без сертификат не минава `nginx -t`, а сертификатът се издава чак след това.
# `certbot --nginx` сам добавя 443 блока и пренасочването.

# Дневник за достъп БЕЗ IP адрес и без user agent. Политиката на Linketto обещава,
# че IP се записва само при вход в акаунта (90 дни) и „не важи за посетителите
# на профили“ — стандартният `combined` формат би го нарушил за всяка заявка.
# (log_format е в http контекст: този файл се включва от nginx.conf вътре в http {}.)
log_format linketto_noip '[$time_local] "$request" $status $body_bytes_sent $request_time';

server {
  listen 80;
  listen [::]:80;
  server_name linketto.carbonstealth.eu;

  # Качване на снимка до 8 MB (src/lib/media.ts) през server action с таван
  # 9 MB (next.config.mjs) + multipart overhead. По-малко → nginx връща 413
  # ПРЕДИ приложението да види заявката.
  client_max_body_size 10m;

  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Подпапка, не `/var/log/nginx/linketto.access.log`: пакетният
  # `/etc/logrotate.d/nginx` глоби `/var/log/nginx/*.log` и двата конфига биха се
  # били за едни и същи файлове (`duplicate log entry`, измерено при FiveM).
  # Папката и ротацията (7 дни) ги слага deploy/autodeploy.sh.
  access_log /var/log/nginx/linketto/access.log linketto_noip;
  # error_log съдържа `client: <IP>` и форматът му не се сменя — затова кратък
  # срок (deploy/logrotate.conf) и ниво `error`, не `notice`/`info`.
  error_log  /var/log/nginx/linketto/error.log error;

  # ── Хедърите, които приложението НЕ бива да вижда от клиента ────────────────
  # На ниво server, за да важат за всеки `location` (вложен блок със собствен
  # `proxy_set_header` би изгубил наследяването — затова в location-ите няма).
  # `X-Real-IP` е доверения IP за лимитите на формите и входа (src/lib/limiter.ts).
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Изпразнени: иначе клиентът си подхвърля „IP“ и заобикаля лимитите.
  proxy_set_header X-Forwarded-For "";
  proxy_set_header True-Client-IP "";
  proxy_set_header CF-Connecting-IP "";
  underscores_in_headers off;

  proxy_http_version 1.1;
  proxy_read_timeout 60s;

  location / {
    proxy_pass http://127.0.0.1:4340;
  }

  # Статиката на Next носи хеш в името — дълъг кеш.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:4340;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Cron маршрутите се викат САМО от хоста (systemd таймерите → 127.0.0.1:4340).
  # Отвън няма защо да стигат до тях — защитата е CRON_SECRET, това е втори пласт.
  location /api/cron/ {
    return 404;
  }
}

# Кратък домейн (PROFILE_HOST, по избор): добави името му в `server_name` горе,
# DNS запис и `certbot --nginx -d <домейн>` (DEPLOY.md §2).
