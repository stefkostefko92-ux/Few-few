# Ротация на дневниците на Linketto (nginx). Инсталира се от deploy/autodeploy.sh
# като /etc/logrotate.d/linketto. Проба през ОБЩИЯ вход (сблъсък с пакетния
# конфиг се вижда само така):
#   sudo logrotate -d /etc/logrotate.conf 2>&1 | grep -ci 'duplicate log entry'   # 0
#
# Срокът: 7 дни. Политиката (messages/*.json → legal.privacyBody) НЕ обявява
# срок за сървърни дневници и казва, че IP се пази само при вход в акаунта.
# Затова access.log е без IP (log_format linketto_noip в nginx.conf), а
# error.log (който носи `client: <IP>` и не може да се смени) живее кратко.
# Смениш ли срока тук — сверявай с политиката през Правния Разбирач.
#
# Пътищата трябва да съвпадат с access_log/error_log в deploy/nginx.conf.

/var/log/nginx/linketto/access.log
/var/log/nginx/linketto/error.log {
  daily
  rotate 7
  # По-старите се изтриват, не се архивират другаде.
  maxage 7
  missingok
  notifempty
  compress
  delaycompress
  create 0640 www-data adm
  sharedscripts
  postrotate
    [ -f /var/run/nginx.pid ] && kill -USR1 "$(cat /var/run/nginx.pid)"
  endscript
}
