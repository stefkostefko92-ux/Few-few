<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordini | Panev Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="shortcut icon" href="../favicon.ico">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside id="admin-sidebar"></aside>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">

      <div class="admin-toolbar">
        <div class="toolbar-left">
          <input type="text" id="ord-search" placeholder="Cerca per cliente, email, ID…" class="admin-search" oninput="renderOrders()">
          <select id="ord-stato-filter" class="admin-select" onchange="renderOrders()">
            <option value="">Tutti gli stati</option>
            <option>Nuovo</option>
            <option>Confermato</option>
            <option>In lavorazione</option>
            <option>Spedito</option>
            <option>Completato</option>
            <option>Annullato</option>
          </select>
        </div>
        <button class="btn-admin btn-outline-admin" onclick="exportOrders()">⬇ Esporta CSV</button>
      </div>

      <div id="ord-stats-row" class="prod-stats-row" style="margin-top:1.5rem"></div>

      <div class="admin-card" style="margin-top:1.5rem">
        <div id="orders-wrap"><div class="empty-placeholder">Caricamento…</div></div>
      </div>

    </div>
  </div>
</div>

<!-- Order Detail Modal -->
<div id="order-detail-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeOrderModal()">
  <div class="modal-box large-modal">
    <div class="modal-head">
      <h3 id="order-modal-title">Dettaglio Ordine</h3>
      <button class="modal-close" onclick="closeOrderModal()">✕</button>
    </div>
    <div class="modal-body" id="order-modal-body"></div>
  </div>
</div>

<script src="../js/admin.js"></script>
<script>
let ordersCache = [];
let orderStats = {};

async function initPageContent() {
  renderAdminTopbar('Gestione Ordini');
  await loadOrders();
}

async function loadOrders() {
  try {
    const data = await AdminOrders.list();
    ordersCache = data.orders || [];
    orderStats = data.stats || {};
    renderOrders();
  } catch (err) {
    adminToast('Errore caricamento: ' + err.message, 'error');
  }
}

function renderOrders() {
  const search = document.getElementById('ord-search').value.toLowerCase();
  const statoFilter = document.getElementById('ord-stato-filter').value;
  let orders = ordersCache.slice();

  if (search) orders = orders.filter(o =>
    (o.id||'').toLowerCase().includes(search) ||
    (o.cliente||'').toLowerCase().includes(search) ||
    (o.email||'').toLowerCase().includes(search)
  );
  if (statoFilter) orders = orders.filter(o => o.stato === statoFilter);

  const total = Number(orderStats.revenue) || 0;
  const nuovi = Number(orderStats.newCount) || 0;
  const done  = Number(orderStats.doneCount) || 0;
  document.getElementById('ord-stats-row').innerHTML = `
    <div class="prod-stat"><span class="ps-num">${ordersCache.length}</span><span class="ps-lbl">Totale</span></div>
    <div class="prod-stat"><span class="ps-num" style="color:#f39c12">${nuovi}</span><span class="ps-lbl">Nuovi</span></div>
    <div class="prod-stat"><span class="ps-num" style="color:#2ed573">${done}</span><span class="ps-lbl">Completati</span></div>
    <div class="prod-stat"><span class="ps-num">€${total.toLocaleString('it-IT',{maximumFractionDigits:0})}</span><span class="ps-lbl">Valore totale</span></div>`;

  const wrap = document.getElementById('orders-wrap');
  if (orders.length === 0) {
    wrap.innerHTML = `<div class="empty-placeholder" style="padding:3rem">Nessun ordine trovato</div>`;
    return;
  }

  wrap.innerHTML = `
    <table class="admin-table">
      <thead>
        <tr>
          <th>ID Ordine</th>
          <th>Cliente</th>
          <th>Email</th>
          <th>Articoli</th>
          <th>Totale</th>
          <th>Stato</th>
          <th>Data</th>
          <th style="text-align:right">Azioni</th>
        </tr>
      </thead>
      <tbody>
        ${orders.map(o => `
          <tr>
            <td><code style="font-size:.78rem;color:var(--admin-gold)">${escHtml(o.id)}</code></td>
            <td style="font-weight:600">${escHtml(o.cliente || '—')}</td>
            <td style="font-size:.82rem;color:var(--admin-text-muted)">${escHtml(o.email || '—')}</td>
            <td style="font-size:.82rem">${(o.items||[]).length} prodotto/i</td>
            <td style="color:var(--admin-gold);font-weight:700">€${Number(o.totale||0).toFixed(2)}</td>
            <td>
              <select class="stato-select" data-status="${escAttr(o.id)}">
                ${['Nuovo','Confermato','In lavorazione','Spedito','Completato','Annullato'].map(s =>
                  `<option ${o.stato===s?'selected':''}>${s}</option>`
                ).join('')}
              </select>
            </td>
            <td style="font-size:.8rem;color:var(--admin-text-muted)">${fmtDate(o.data)}</td>
            <td>
              <div class="action-btns">
                <button class="action-btn" data-detail="${escAttr(o.id)}" title="Dettaglio">🔍</button>
                <button class="action-btn delete-btn" data-del="${escAttr(o.id)}" title="Elimina">🗑️</button>
              </div>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  wrap.querySelectorAll('[data-status]').forEach(sel =>
    sel.addEventListener('change', () => changeOrderStatus(sel.dataset.status, sel.value))
  );
  wrap.querySelectorAll('[data-detail]').forEach(b =>
    b.addEventListener('click', () => openOrderModal(b.dataset.detail))
  );
  wrap.querySelectorAll('[data-del]').forEach(b =>
    b.addEventListener('click', () => deleteOrder(b.dataset.del))
  );
}

async function changeOrderStatus(id, stato) {
  try {
    await AdminOrders.updateStatus(id, stato);
    adminToast(`Stato aggiornato: ${stato}`);
    // Reload to refresh stats
    const data = await AdminOrders.list();
    ordersCache = data.orders || [];
    orderStats = data.stats || {};
    renderOrders();
    renderAdminLayout();
  } catch (err) {
    adminToast('Errore: ' + err.message, 'error');
  }
}

function openOrderModal(id) {
  const o = ordersCache.find(x => x.id === id);
  if (!o) return;
  document.getElementById('order-modal-title').textContent = `Ordine ${o.id}`;
  document.getElementById('order-modal-body').innerHTML = `
    <div class="order-detail-grid">
      <div>
        <h4 style="color:var(--admin-gold);margin-bottom:1rem">Dati Cliente</h4>
        <div class="detail-row"><span>Nome</span><strong>${escHtml(o.cliente||'—')}</strong></div>
        <div class="detail-row"><span>Email</span>${o.email ? '<a href="mailto:'+escAttr(o.email)+'" style="color:var(--admin-gold)">'+escHtml(o.email)+'</a>' : '—'}</div>
        <div class="detail-row"><span>Telefono</span>${o.tel ? '<a href="tel:'+escAttr(o.tel)+'" style="color:var(--admin-gold)">'+escHtml(o.tel)+'</a>' : '—'}</div>
        ${o.azienda ? `<div class="detail-row"><span>Azienda</span><strong>${escHtml(o.azienda)}</strong></div>` : ''}
        ${o.note ? `<div class="detail-row"><span>Note</span><span style="color:var(--admin-text-muted);white-space:pre-wrap">${escHtml(o.note)}</span></div>` : ''}
        ${o.stripeSessionId ? `<div class="detail-row"><span>Stripe Session</span><code style="font-size:.78rem">${escHtml(o.stripeSessionId)}</code></div>` : ''}
      </div>
      <div>
        <h4 style="color:var(--admin-gold);margin-bottom:1rem">Info Ordine</h4>
        <div class="detail-row"><span>ID</span><code style="font-size:.85rem">${escHtml(o.id)}</code></div>
        <div class="detail-row"><span>Data</span><strong>${fmtDate(o.data)}</strong></div>
        <div class="detail-row"><span>Pagamento</span><strong>${escHtml(o.pagamento || '—')}</strong></div>
        <div class="detail-row"><span>Stato</span>
          <select class="stato-select" id="modal-stato-select">
            ${['Nuovo','Confermato','In lavorazione','Spedito','Completato','Annullato'].map(s =>
              `<option ${o.stato===s?'selected':''}>${s}</option>`
            ).join('')}
          </select>
        </div>
        <div class="detail-row"><span>Totale</span><strong style="color:var(--admin-gold);font-size:1.1rem">€${Number(o.totale||0).toFixed(2)}</strong></div>
      </div>
    </div>
    <h4 style="color:var(--admin-gold);margin:1.5rem 0 1rem">Prodotti Ordinati</h4>
    <table class="admin-table">
      <thead><tr><th>Prodotto</th><th>Prezzo unitario</th><th>Qty</th><th>Subtotale</th></tr></thead>
      <tbody>
        ${(o.items||[]).map(item => `
          <tr>
            <td>${escHtml(item.icon || '📦')} ${escHtml(item.name || '—')}</td>
            <td>€${Number(item.price||0).toFixed(2)}</td>
            <td>${Number(item.qty)||0}</td>
            <td style="font-weight:700;color:var(--admin-gold)">€${(Number(item.price||0)*Number(item.qty||0)).toFixed(2)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  document.getElementById('modal-stato-select').addEventListener('change', (e) =>
    changeOrderStatus(o.id, e.target.value)
  );
  document.getElementById('order-detail-modal').style.display = 'flex';
}

function closeOrderModal() {
  document.getElementById('order-detail-modal').style.display = 'none';
}

function deleteOrder(id) {
  adminConfirm('Eliminare questo ordine permanentemente?', async () => {
    try {
      await AdminOrders.remove(id);
      adminToast('Ordine eliminato');
      await loadOrders();
    } catch (err) {
      adminToast('Errore: ' + err.message, 'error');
    }
  });
}

function exportOrders() {
  const orders = ordersCache;
  if (!orders.length) { adminToast('Nessun ordine da esportare', 'error'); return; }
  const rows = [['ID','Cliente','Email','Telefono','Azienda','Totale','Stato','Data','Pagamento']];
  orders.forEach(o => rows.push([
    o.id, o.cliente, o.email, o.tel, o.azienda,
    (Number(o.totale)||0).toFixed(2), o.stato, fmtDate(o.data), o.pagamento
  ]));
  const csv = rows.map(r => r.map(c => `"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ordini_panev_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  adminToast('CSV esportato');
}
</script>

<style>
.stato-select { background:var(--admin-bg); border:1px solid var(--admin-border); border-radius:5px; padding:.3rem .5rem; color:var(--admin-text); font-family:inherit; font-size:.8rem; }
.stato-select:focus { outline:none; border-color:var(--admin-gold); }
.order-detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:2rem; }
@media(max-width:600px){ .order-detail-grid { grid-template-columns:1fr; } }
.detail-row { display:flex; justify-content:space-between; align-items:center; padding:.5rem 0; border-bottom:1px solid var(--admin-border); font-size:.88rem; gap:1rem; }
.detail-row:last-child { border-bottom:none; }
.detail-row > span:first-child { color:var(--admin-text-muted); flex-shrink:0; }
.admin-toolbar { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
.toolbar-left { display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; }
.admin-search { background:var(--admin-surface); border:1px solid var(--admin-border); border-radius:6px; padding:.6rem 1rem; color:var(--admin-text); font-family:inherit; font-size:.88rem; min-width:240px; }
.admin-search:focus { outline:none; border-color:var(--admin-gold); }
.admin-select { background:var(--admin-surface); border:1px solid var(--admin-border); border-radius:6px; padding:.6rem .9rem; color:var(--admin-text); font-family:inherit; font-size:.88rem; }
.action-btns { display:flex; gap:.4rem; justify-content:flex-end; }
.action-btn { background:var(--admin-bg); border:1px solid var(--admin-border); border-radius:5px; padding:.3rem .5rem; cursor:pointer; font-size:.85rem; }
.action-btn:hover { border-color:var(--admin-gold); }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem; }
.modal-box { background:var(--admin-surface); border:1px solid var(--admin-border); border-radius:12px; width:100%; max-height:90vh; overflow-y:auto; }
.large-modal { max-width:820px; }
.modal-head { display:flex; justify-content:space-between; align-items:center; padding:1.5rem 2rem; border-bottom:1px solid var(--admin-border); }
.modal-close { background:none; border:none; color:var(--admin-text-muted); font-size:1.1rem; cursor:pointer; }
.modal-body { padding:2rem; }
.prod-stats-row { display:flex; gap:1rem; flex-wrap:wrap; }
.prod-stat { background:var(--admin-surface); border:1px solid var(--admin-border); border-radius:8px; padding:.8rem 1.5rem; display:flex; flex-direction:column; align-items:center; gap:.2rem; min-width:80px; }
.ps-num { font-size:1.4rem; font-weight:700; color:var(--admin-gold); }
.ps-lbl { font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--admin-text-muted); }
.empty-placeholder { text-align:center; padding:2rem; color:var(--admin-text-muted); font-size:.9rem; }
</style>
</body>
</html>
