# Production стек за един VPS: PostgreSQL, Redis, API, worker и Caddy (reverse
# proxy + статичен admin + автоматичен HTTPS). Стартирай от папка deploy/ с
# попълнен .env (виж .env.prod.example). Само web-ът отваря портове навън.
name: pomagam

# Ротация на логовете за всички услуги — иначе json-file драйверът расте без лимит.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomagam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-pomagam}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pomagam} -d ${POSTGRES_DB:-pomagam}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '4400'
      DATABASE_URL: postgresql://${POSTGRES_USER:-pomagam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pomagam}
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:4400/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    command: ['node', 'dist/src/worker.js']
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pomagam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pomagam}
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  redis_data:
  media:
  caddy_data:
  caddy_config:
