<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark" />

    <!--
      SEO метаданните (title, description, keywords, robots, canonical,
      hreflang, Open Graph, JSON-LD) се рендират на сървъра за всеки маршрут и
      език — server/src/seo/pages.ts заменя целия блок между маркерите (и
      lang на <html>). Тук е само резервният вариант за `vite dev`.
    -->
    <!--seo:head-->
    <title>Nexus Dominion — Free Browser MMORPG</title>
    <meta name="description" content="Server-authoritative turn-based MMORPG. Four classes, 500 levels of roster, ELO arena, real-time auction, five-tier guilds. Free, browser-based, no installer." />
    <!--/seo:head-->

    <!--
      Fonts are bundled with the build (see src/main.tsx + @fontsource/*),
      so the runtime no longer talks to fonts.googleapis.com / fonts.gstatic.com.
      Google Fonts CDN calls leak the visitor's IP to a US recipient
      pre-consent — German court LG München 20 O 11024/20 awarded €100
      per affected user. The Sentry sub-processor block in the Privacy
      Policy stays the only third-party data path.
      (A leftover `preconnect href="/"` was removed — preconnect to the
      own origin is a no-op, and vite 8's html asset pass chokes on it.)
    -->
  </head>
  <body>
    <!-- Текст за краулъри без JS (H1 + кратко описание на езика на страницата) —
         рендира се на сървъра (server/src/seo/pages.ts) и се маха от DOM-а при
         монтиране на React (main.tsx), така че в рендираната страница няма
         скрит текст. -->
    <!--seo:body--><!--/seo:body-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
