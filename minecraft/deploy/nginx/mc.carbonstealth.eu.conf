# nginx на ХОСТА за Pelican Panel (админ панелът на Minecraft сървъра).
# Панелът слуша на 127.0.0.1:4330 (docker compose, minecraft/deploy/compose.yml).
#
# Не се пише на ръка: minecraft/deploy/install.sh слага точно този файл в
# /etc/nginx/sites-available/pelican-panel (подменя порта, ако PANEL_PORT е друг), nginx -t, reload.
# Самата игра също е на mc.carbonstealth.eu, но на порт 25565 — nginx не участва в нея.

# Опитите за вход ги брои самият панел (Filament: 5/мин. на IP — затова X-Forwarded-For отдолу се
# презаписва с реалния адрес). Тук е втората спирачка: 10 зареждания/мин. на IP на страниците за
# вход и пароли, за да не стигат ботовете и до PHP.
limit_req_zone $binary_remote_addr zone=pelican_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mc.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://$host$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mc.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/mc.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Импорт на egg-ове/плъгини през панела. Файловете на сървъра се качват директно към Wings
    # (node-mc.carbonstealth.eu), не през тук.
    client_max_body_size 20m;

    # Панелът сам праща X-Frame-Options: DENY, X-Content-Type-Options и Referrer-Policy — тук само
    # HSTS, който той не задава. Два източника на един заглавен ред се разминават (DENY срещу
    # SAMEORIGIN), затова не се дублират.
    # CSP не се задава: Filament/Livewire ползват inline скриптове — строга политика чупи панела,
    # а разхлабена не пази нищо.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    location ~ ^/(login|password|auth) {
        limit_req zone=pelican_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4330;
        include /etc/nginx/snippets/pelican-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:4330;
        include /etc/nginx/snippets/pelican-proxy.conf;
    }
}
