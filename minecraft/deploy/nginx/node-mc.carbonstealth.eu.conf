# nginx на ХОСТА за Pelican Wings (демонът на нода). Wings слуша на 127.0.0.1:4331 без собствен TLS.
# През този адрес минават: панелът → Wings (API), браузърът → Wings (конзолата по WebSocket,
# качване/сваляне на файлове). В панела нодът е с FQDN node-mc.carbonstealth.eu и
# „HTTPS with (reverse) proxy“ — връзка на 443, слушане на 4331.
#
# Не се пише на ръка: minecraft/deploy/install.sh го слага в /etc/nginx/sites-available/pelican-node.

server {
    listen 80;
    listen [::]:80;
    server_name node-mc.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name node-mc.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/node-mc.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node-mc.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # = upload_limit на Wings (100 MiB по подразбиране). Тялото не се буферира — отива направо.
    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:4331;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Конзолата на сървъра е WebSocket.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
