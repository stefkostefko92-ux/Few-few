# frontend/nginx-security-headers.conf
# Базовите заглавия за сигурност — ЕДИН източник, включен във ВСЯКА локация.
#
# ЗАЩО ФАЙЛ, а не веднъж на ниво `server` (одит етап 12, 12.08.2026):
# в nginx `add_header` във вложен блок ЗАМЕСТВА всички наследени, а не ги
# допълва. Затова заглавия на ниво server изчезват в мига, в който локация
# добави собствено — класически капан.
#
# Досега всяка локация ги преписваше на ръка и това вече беше дрейфнало:
#   • `/api` и `/public` нямаха НИТО ЕДНО заглавие;
#   • `/archive` беше без HSTS — а точно тя сервира транскрипти с лични данни
#     по СПОДЕЛЯНИ линкове, тоест често е първият контакт с домейна и няма
#     кой да е закачил HSTS преди това.
#
# CSP нарочно НЕ е тук: той е различен по локация (архивът е много по-строг).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
