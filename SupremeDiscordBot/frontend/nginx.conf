server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # ── Относителни редиректи (КРИТИЧНО зад reverse proxy) ────────────────────
    # Пререндерените маршрути са директории (dist/terms/index.html), затова
    # заявка за /terms кара nginx да редиректне към /terms/. По подразбиране
    # `absolute_redirect on` строи адреса от ВЪТРЕШНИТЕ стойности на контейнера
    # → `http://host:8080/terms/`: изтича вътрешният порт (127.0.0.1-only, значи
    # линкът е и НЕДОСТИЖИМ отвън) и сваля схемата до http.
    # `absolute_redirect off` праща само пътя (`Location: /terms/`), а браузърът
    # го решава спрямо публичния origin — чист HTTPS адрес без порт.
    absolute_redirect off;

    # ── DNS за upstream-ите (КРИТИЧНО в Docker) ───────────────────────────────
    # `proxy_pass http://backend:3000;` с ЛИТЕРАЛНО име се резолвира ВЕДНЪЖ, при
    # стартиране на nginx. Пресъздаден backend контейнер получава нов IP в
    # бриджа, а nginx продължава да чука на стария — 502 за всичко, докато някой
    # не рестартира ФРОНТЕНДА. Тоест обикновен `docker compose up -d backend`
    # поваля сайта и причината не е никъде видима.
    # Име в ПРОМЕНЛИВА кара nginx да резолвира по време на заявка; резолверът е
    # вграденият DNS на Docker (127.0.0.11), с кратък TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream "backend";

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/xml
        application/json application/javascript application/manifest+json
        image/svg+xml font/woff2;

    # ── SEO files — explicit types + short cache ──────────────────────────────
    location = /robots.txt {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /site.webmanifest {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    # security.txt — responsible disclosure (RFC 9116)
    location = /.well-known/security.txt {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    # llms.txt — for AI/LLM crawlers (per llmstxt.org spec)
    location = /llms.txt {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    # ── OG image + favicons — long cache ──────────────────────────────────────
    location ~* ^/(og-image\.(svg|png|jpg)|favicon\.svg|favicon.*\.png|apple-touch-icon.*\.png)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Static assets (Vite adds content hashes) — immutable 1y ──────────────
    location /assets/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy → backend ───────────────────────────────────────────────────
    location /api {
        proxy_pass http://$backend_upstream:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # ── Public ticket archive viewer → backend ────────────────────────────────
    # Serves public HTML transcripts — apply clickjacking + sniffing protection
    # and a locked-down CSP (transcript markup uses only inline styles + images).
    location /archive {
        proxy_pass http://$backend_upstream:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Идентичен на политиката, която backend/src/routes/archive.js слага сам.
        # Два РАЗЛИЧНИ CSP хедъра се прилагат като СЕЧЕНИЕ — разминаване тихо
        # блокира легитимни ресурси (напр. media.discordapp.net) и никой не
        # разбира защо. Промяна тук иска промяна и там (тест ги сверява).
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' https://cdn.discordapp.com https://media.discordapp.net data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # ── Public REST API → backend ─────────────────────────────────────────────
    location /public {
        proxy_pass http://$backend_upstream:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── SPA fallback — index.html with no-cache so new builds show up ────────
    # Backend Helmet CSP is disabled with the assumption that nginx sets it,
    # so the Content-Security-Policy header here is load-bearing.
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cdn.discordapp.com; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://discord.com https://checkout.stripe.com" always;
        # `$uri/` караше nginx да ОТКРИЕ директорията и да издаде 301 към
        # /terms/ — точно тази заобикалка изтичаше вътрешния порт. С
        # `$uri/index.html` пререндерената страница се сервира ДИРЕКТНО (200),
        # без никакъв редирект: адресът остава /terms, какъвто е и каноничният
        # URL и записът в sitemap.xml. Последният кандидат е SPA fallback-ът.
        try_files $uri $uri/index.html /index.html;
    }

    location = /index.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cdn.discordapp.com; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://discord.com https://checkout.stripe.com" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
