# nginx на ХОСТА за Piuma. TLS сертификатите се управляват с certbot.
# Приложението слуша на 127.0.0.1:4310 (публикуван порт от docker-compose.yml).
#
# Инсталация (веднъж, от release-а — не се пише на ръка):
#   sudo cp piuma/deploy/nginx/piuma.carbonstealth.eu.conf /etc/nginx/sites-available/piuma
#   sudo ln -sfn /etc/nginx/sites-available/piuma /etc/nginx/sites-enabled/piuma
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d piuma.carbonstealth.eu

# Пренасочване на HTTP към HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name piuma.carbonstealth.eu;
    location / { return 308 https://$host$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1 на сървъра;
    # новият `http2 on;` дава „unknown directive" при по-стар nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name piuma.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/piuma.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/piuma.carbonstealth.eu/privkey.pem;

    # Само модерни протоколи и шифри.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    # 1m е с ясен запас над лимитите на самото приложение (JSON 256 KB, форми 64 KB),
    # но не отваря машината за произволно голямо тяло.
    client_max_body_size 1m;

    # Компресия на текста. Основният nginx.conf на Ubuntu компресира само text/html —
    # CSS-ът и JSON-ът пътуваха сурови (landing.css 20 KB → 5.5 KB компресиран).
    # Картинките (WebP/PNG) вече са компресирани — не се пипат.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml
               image/svg+xml text/plain text/xml;

    # CSP, HSTS и Referrer-Policy ги задава САМОТО приложение (helmet, с nonce на
    # заявка). Не ги дублираме тук — два източника на един и същ заглавен ред се
    # разминават тихо и по-строгият печели, тоест панелът спира да се оформя.
    add_header X-Content-Type-Options "nosniff" always;

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:4310;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Публикуването към Instagram чака транскодиране на Reels — кратък таймаут
        # би прекъснал заявка, която още работи.
        proxy_read_timeout 120s;
    }
}
