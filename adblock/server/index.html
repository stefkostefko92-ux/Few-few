<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Best Ads Block</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: #060608; color: #f5f5f0;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-image: repeating-linear-gradient(45deg, rgba(245,245,240,.02) 0 1px, transparent 1px 3px);
    background-size: 6px 6px; padding: 24px; text-align: center;
  }
  .card { max-width: 440px; }
  .shield { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 16px;
    background: linear-gradient(135deg, #00e5ff, #0096b4); display: grid; place-items: center;
    box-shadow: 0 0 40px rgba(0,229,255,.25); }
  .shield span { font-size: 38px; }
  h1 { font-size: 24px; letter-spacing: .3px; }
  .tag { color: #00e5ff; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
  p { color: #8c8c84; margin: 18px 0 24px; }
  a.btn { display: inline-block; text-decoration: none; font-weight: 600; color: #04232a;
    background: linear-gradient(135deg, #00e5ff, #00b8d4); padding: 11px 22px; border-radius: 10px; }
  .links { margin-top: 22px; font-size: 14px; }
  .links a { color: #8c8c84; text-decoration: none; margin: 0 8px; }
  .links a:hover { color: #00e5ff; }
</style>
</head>
<body>
<main class="card">
  <div class="shield"><span>🛡️</span></div>
  <h1>The Best Ads Block</h1>
  <div class="tag">Carbon Stealth</div>
  <p>Block ads everywhere — YouTube, banners, pop-ups, trackers. Free, fast and private.</p>
  <a class="btn" href="https://carbonstealth.eu">carbonstealth.eu</a>
  <div class="links">
    <a href="/privacy">Privacy</a>·<a href="/filters.json">Filters</a>
  </div>
</main>
</body>
</html>
