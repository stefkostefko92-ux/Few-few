# adblock.carbonstealth.eu — Nginx вариант (сървъри с Nginx + certbot вместо Caddy).
# Деплоят го инсталира като /etc/nginx/sites-available/adblock.conf + symlink.
# TLS: certbot --nginx -d adblock.carbonstealth.eu (деплоят опитва автоматично,
# ако certbot е наличен и има издаден акаунт).
server {
    listen 80;
    listen [::]:80;
    server_name adblock.carbonstealth.eu;
    root /var/www/adblock;

    # Политиката за поверителност (server/privacy.html) обещава: без access логове
    # (IP) за сайта и за ъпдейтите на филтрите. Грешки — само критични.
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Заглавки за сигурност. ВНИМАНИЕ: nginx НЕ наследява add_header в location,
    # който има свои add_header — затова са повторени по-долу.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'none'" always;
    add_header Permissions-Policy "browsing-topics=(), interest-cohort=(), camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # Кратките адреси на страниците (Web Store Privacy Policy URL е /privacy, Support URL — /support).
    # Нова страница = ред тук + в Caddyfile + в списъка на deploy/autodeploy.sh (гейт: tests/site.test.mjs).
    location ~ ^/(privacy|support|youtube-ad-blocker|cookie-banner-blocker|bye)$ {
        try_files /$1.html =404;
        # страниците: браузърът винаги пита (304 по ETag е евтин) — иначе държи старата версия
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'none'" always;
        add_header Permissions-Policy "browsing-topics=(), interest-cohort=(), camera=(), microphone=(), geolocation=()" always;
    }

    # Езиковите страници (tools/site_lang.mjs → /<език>/index.html): каноничният адрес е с „/“
    # накрая; без него — 301 натам. Самата страница я дава location / (index.html на папката).
    location ~ ^/(bg|de|it|es|fr|pt-br)$ {
        return 301 /$1/;
    }

    # Живият филтър файл + подписът му: кратък кеш + CORS
    location ~ ^/filters\.json(\.sig)?$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Точните текстове на вградените филтър-листи (THIRD_PARTY_NOTICES.txt): името е SHA-256-ът на
    # съдържанието, така че файлът никога не се сменя — дълъг кеш; изтегля се като gzip, не се разархивира.
    location ^~ /sources/ {
        types { }
        default_type application/gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Графиките се сменят само с релийз; index.html ги вика с ?v=<хеш на съдържанието>
    # (tools/landing_assets.mjs), така че нова картинка = нов адрес, дългият кеш не пречи.
    location ~* \.(webp|png)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'none'" always;
        add_header Permissions-Policy "browsing-topics=(), interest-cohort=(), camera=(), microphone=(), geolocation=()" always;
    }
}
