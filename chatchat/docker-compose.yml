# ChatChat в продукция: база (PostgreSQL 16 + pgvector) + антивирус (ClamAV) + Redis 7 (опашките, pub/sub
# между инстанциите, общите лимити) + приложение (API) + worker (същият образ: приемане/OCR/вектори).
#
# TLS и публичният вход са на nginx-а на ХОСТА (Let's Encrypt) — конфигът е
# `deploy/nginx/chatchat.carbonstealth.eu.conf` в това репо, не се пише на ръка на сървъра.
#
# Тайните НЕ са тук — идват от `.env` до този файл (mode 600 на сървъра, никога в репото).
# Задължителни: POSTGRES_PASSWORD и REDIS_PASSWORD (openssl rand -hex 32 — влизат некодирани в адресите) ·
# SESSION_PEPPER (openssl rand -hex 32) · ATTACHMENT_URL_KEY, MFA_ENC_KEY и FILES_KEK (openssl rand
# -base64 32) · PUBLIC_BASE_URL. За AI: VERTEX_PROJECT_ID + GCP_SA_FILE. Образецът — `.env.example`.
# В контейнера влиза само изброеното в `environment:` — нова настройка от `.env` се добавя и там.
#
# Шифроване в покой (NFR-03): прикачените файлове — в приложението (FILES_KEK); данните на базата — в
# LUKS2 том, щом deploy/pgdata-encrypt.sh е пуснат: тогава .env носи
# COMPOSE_FILE=docker-compose.yml:docker-compose.pgdata.yml и тома db-data го заменя bind към тома.
name: chatchat

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Всички контейнери: файловата система е само за четене (пише се само в томовете и в tmpfs), без Linux
# capabilities (базата и антивирусът пазят само нужните им, за да сменят собственика на данните и
# потребителя), без придобиване на права (no-new-privileges), с таван на памет, процесор и процеси.
x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

# Мрежите: `backend` е вътрешна (internal: true — без изход навън и без публикувани портове); в нея са
# всички услуги. Базата и Redis са САМО там. `default` има изход навън: приложението (Vertex AI, публикуваният
# порт на 127.0.0.1) и антивирусът (freshclam тегли сигнатурите от database.clamav.net).
networks:
  backend:
    internal: true
  default: {}

services:
  db:
    # PostgreSQL 16 + разширението vector (семантичното търсене; миграцията прави CREATE EXTENSION vector).
    # Debian (glibc), закован по digest на индекса (amd64 + arm64); тагът pg16 сочи същия digest.
    # Обновяване: `docker buildx imagetools inspect pgvector/pgvector:<версия>-pg16` → новият Digest тук
    # и в .github/workflows/chatchat.yml. Преминаването от postgres:16-alpine го прави deploy/deploy.sh
    # (еднократен REINDEX заради смяната musl → glibc, DEPLOY.md, т. 11).
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /var/run/postgresql:size=4m
      - /tmp:size=64m
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}
      POSTGRES_DB: chatchat
    volumes:
      # Без шифрования том. С него (DEPLOY.md, т. 12) docker-compose.pgdata.yml заменя този ред с bind към
      # $CHATCHAT_SHARED/pgdata/data (LUKS2); старият том остава до ръчното му изтриване.
      - db-data:/var/lib/postgresql/data
    # Без `ports:` и само във вътрешната мрежа — базата не се вижда нито от хоста, нито отвън.
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatchat -d chatchat']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  clamav:
    # Официалният образ на ClamAV (Cisco Talos), Debian вариантът — индексът е за amd64 И arm64
    # (Alpine вариантът е само amd64). Закован по digest; тагът 1.5.4-debian сочи същия.
    # Обновяване: `docker buildx imagetools inspect clamav/clamav:<версия>-debian` → новият Digest тук.
    image: clamav/clamav:1.5.4-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578
    <<: *hardening
    cap_drop: [ALL]
    # /init тече като root: chown на базата сигнатури, после freshclam/clamd сменят потребителя на clamav.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      # /run/clamav и /run/lock; /tmp — локалният сокет и временните файлове при сканиране; дневникът.
      - /run:size=8m
      - /tmp:size=128m
      - /var/log/clamav:size=16m,mode=1777
    # clamd с пълната база държи ~1 GB (измерено: 962 MiB, 1.5.4, 09.10.2026); с ConcurrentDatabaseReload
    # no (deploy/clamav/clamd.conf) презареждането след ъпдейт не я удвоява. Таванът 2 GB е с резерв за
    # растежа на базата и за сканиранията — DEPLOY.md, „ClamAV“.
    mem_limit: 2g
    cpus: 1
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # Проверки за нови сигнатури на денонощие (freshclam --checks); огледалата на ClamAV ограничават
      # по-честите заявки.
      FRESHCLAM_CHECKS: '4'
    volumes:
      # Сигнатурите (~110 MB) — в том, за да не се теглят наново при всяко пресъздаване на контейнера.
      # Нов том се пълни от базата, вградена в образа (по-стара) — clamd тръгва и без мрежа, freshclam я обновява.
      - clamav-db:/var/lib/clamav
      # deploy/clamav/clamd.conf от репото — deploy/deploy.sh го слага на СТАБИЛНИЯ път (не в release
      # папката: там пътят се сменя с всеки release и compose би пресъздавал clamav при всеки деплой).
      - ${CHATCHAT_SHARED:-/opt/few-few/shared/chatchat}/clamd.conf:/etc/clamav/clamd.conf:ro
    # Без `ports:` — 3310 е достъпен само за приложението през вътрешната мрежа на проекта.
    networks: [backend, default]
    healthcheck:
      # Скриптът на образа: PING → PONG на 3310. Зареждането на базата е 1–2 минути (повече на бавен
      # диск) — затова дългият start_period (дотогава неуспешна проверка не брои).
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10m
    logging: *logging

  redis:
    # Redis 7 (NFR-06): опашките на BullMQ (приемане, OCR, вектори, dead-letter), pub/sub между
    # инстанциите на API-то (SSE), общите лимити на заявките и пазачът срещу повторен TOTP код.
    # Debian (glibc), закован по digest на индекса (amd64 + arm64); тагът 7.4-bookworm сочи същия (7.4.11).
    # Обновяване: `docker buildx imagetools inspect redis:7.4-bookworm` → новият Digest тук.
    image: redis:7.4-bookworm@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    <<: *hardening
    # Тече направо като потребителя redis на образа (999) — без chown/setpriv, значи без capabilities.
    user: '999:999'
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    # Паролата е и в командата (видима само за root на хоста, като останалите тайни в compose);
    # noeviction — BullMQ иска задачите да не изчезват при пълна памет (по-добре грешка, отколкото загуба).
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?липсва REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - ''
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      # За redis-cli в healthcheck-а (не за сървъра).
      REDISCLI_AUTH: ${REDIS_PASSWORD:?липсва REDIS_PASSWORD}
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    volumes:
      # AOF — опашките преживяват рестарт (задача, приета от API-то, не се губи).
      - redis-data:/data
    # Без `ports:` и само във вътрешната мрежа — Redis не се вижда нито от хоста, нито отвън.
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    build: .
    # Именуваният образ ползва и worker-ът (същият код, друга команда) — билдът е само тук.
    image: chatchat-app
    <<: *hardening
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    # Приложението само се спира до 10 s (src/index.ts); 15 s дават време да затвори базата, преди SIGKILL.
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      PORT: '4330'
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?липсва PUBLIC_BASE_URL}
      DATABASE_URL: postgresql://chatchat:${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}@db:5432/chatchat
      SESSION_PEPPER: ${SESSION_PEPPER:?липсва SESSION_PEPPER}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      RETENTION_SESSION_DAYS: ${RETENTION_SESSION_DAYS:-30}
      RETENTION_CASE_DAYS: ${RETENTION_CASE_DAYS:-}
      # Ретенция по класове (NFR-08/13): празно → подразбирането в src/config.ts (съобщенията по вид
      # разговор — не се трият, докато администраторът на данните не зададе срок; одит — 10 г.).
      RETENTION_DIRECT_DAYS: ${RETENTION_DIRECT_DAYS:-}
      RETENTION_GROUP_DAYS: ${RETENTION_GROUP_DAYS:-}
      RETENTION_CHANNEL_DAYS: ${RETENTION_CHANNEL_DAYS:-}
      RETENTION_NOTIFICATION_DAYS: ${RETENTION_NOTIFICATION_DAYS:-}
      RETENTION_PRESENCE_DAYS: ${RETENTION_PRESENCE_DAYS:-}
      RETENTION_METADATA_DAYS: ${RETENTION_METADATA_DAYS:-}
      RETENTION_PROPOSAL_DAYS: ${RETENTION_PROPOSAL_DAYS:-}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-}
      RETENTION_ORPHAN_HOURS: ${RETENTION_ORPHAN_HOURS:-}
      RETENTION_QUARANTINE_DAYS: ${RETENTION_QUARANTINE_DAYS:-}
      # Имейл известия през Brevo (HTTPS API, порт 443 — Hetzner блокира 25/465/587). Ключът — само в
      # .env на сървъра (mode 600). Празен ключ → имейлите са изключени, известията в приложението остават.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      EMAIL_DELAY_SECONDS: ${EMAIL_DELAY_SECONDS:-}
      EMAIL_DIGEST_HOUR: ${EMAIL_DIGEST_HOUR:-}
      # Един прокси отпред (nginx на хоста). Портът е публикуван през Docker: приложението вижда шлюза
      # на мрежата като пряк събеседник, а nginx презаписва X-Forwarded-For с истинския адрес.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Прикачени файлове (F2): антивирусът е услугата clamav (само вътрешната мрежа); файловете са в
      # тома по-долу — единственото записваемо място на приложението освен /tmp.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      ATTACHMENTS_DIR: /data/attachments
      # Подписът на краткотрайните адреси за сваляне на прикачен файл. Смяната обезсилва издадените адреси.
      ATTACHMENT_URL_KEY: ${ATTACHMENT_URL_KEY:?липсва ATTACHMENT_URL_KEY}
      # Шифроването на MFA (TOTP) тайните в базата. Смяната = всички MFA устройства се записват наново.
      MFA_ENC_KEY: ${MFA_ENC_KEY:?липсва MFA_ENC_KEY}
      # Шифроването на файловете в покой (NFR-03): главният ключ (KEK), който опакова ключа на всеки файл.
      # Загубата = файловете (и в бекъпите) не се отварят. Ротация: старият в FILES_KEK_PREVIOUS, после
      # files:rekey (DEPLOY.md, т. 12). FILES_PLAINTEXT=deny — след files:encrypt (стари нешифровани → отказ).
      FILES_KEK: ${FILES_KEK:?липсва FILES_KEK}
      FILES_KEK_PREVIOUS: ${FILES_KEK_PREVIOUS:-}
      FILES_PLAINTEXT: ${FILES_PLAINTEXT:-}
      # Интеграцията с helpdesk (FR-09, §14.4): ключът на тайните на конектора (deploy.sh го ражда). Празен →
      # интеграцията е изключена, приложението работи. Изходящите адреси минават SSRF защита в приложението.
      INTEGRATION_KEK: ${INTEGRATION_KEK:-}
      INTEGRATION_KEK_PREVIOUS: ${INTEGRATION_KEK_PREVIOUS:-}
      INTEGRATION_SWEEP_SECONDS: ${INTEGRATION_SWEEP_SECONDS:-}
      INTEGRATION_MAX_ATTEMPTS: ${INTEGRATION_MAX_ATTEMPTS:-}
      INTEGRATION_TIMEOUT_MS: ${INTEGRATION_TIMEOUT_MS:-}
      INTEGRATION_INBOUND_TOLERANCE_SECONDS: ${INTEGRATION_INBOUND_TOLERANCE_SECONDS:-}
      INTEGRATION_LOG_DAYS: ${INTEGRATION_LOG_DAYS:-}
      # Единният вход (OIDC / Entra ID): ключът за client secret на доставчиците в базата (deploy.sh го
      # ражда). Празно → единният вход е изключен. Ротация: старият в SSO_KEK_PREVIOUS.
      SSO_KEK: ${SSO_KEK:-}
      SSO_KEK_PREVIOUS: ${SSO_KEK_PREVIOUS:-}
      # Семантично търсене (pgvector) — по избор; празно → само точното и пълнотекстовото търсене.
      # Имената се сверяват със src/config.ts (празен низ трябва да значи „не е зададено“).
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_REGION: ${EMBEDDING_REGION:-}
      # AI — само Vertex AI в ЕС. Празен VERTEX_PROJECT_ID → AI е изключен, /chat/messages връща 503.
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-eu}
      # Пътят В контейнера; задава се сам само ако в .env има GCP_SA_FILE (път на хоста).
      GOOGLE_APPLICATION_CREDENTIALS: ${GCP_SA_FILE:+/run/secrets/gcp-sa.json}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-8000}
      AI_MAX_TOOL_ROUNDS: ${AI_MAX_TOOL_ROUNDS:-4}
      # Под proxy_read_timeout в nginx конфига (120 s); config.ts не пуска над 115000.
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      # Circuit breaker към Vertex (NFR-07): последователни провала до отваряне · секунди отворен.
      AI_BREAKER_FAILURES: ${AI_BREAKER_FAILURES:-5}
      AI_BREAKER_COOLDOWN_SECONDS: ${AI_BREAKER_COOLDOWN_SECONDS:-30}
      # Опашките, pub/sub между инстанциите, общите лимити и TOTP (NFR-06): тежката работа (разбор, OCR,
      # вектори) е в услугата worker; API-то само слага задачи. Паролата — от .env (REDIS_PASSWORD).
      REDIS_URL: redis://:${REDIS_PASSWORD:?липсва REDIS_PASSWORD}@redis:6379
      # Метрики за Prometheus (NFR-09) — отделен слушател, НЕ публичният порт (nginx не го проксира).
      # Включват се с METRICS_PORT в .env (порт на ХОСТА); вътре в контейнера слушателят е винаги 9464.
      # 0.0.0.0 е само в мрежовото пространство на контейнера — Docker не стига до loopback-а му; на
      # хоста портът е публикуван САМО като 127.0.0.1 (по-долу). Празно → изключено (config.ts).
      METRICS_PORT: ${METRICS_PORT:+9464}
      METRICS_HOST: 0.0.0.0
      # Отчетите на оценъчния набор (evals/, §16.1) за KPI таблото — само за четене. Оценката не върви
      # в образа (тестова база + tsx); отчетите (*.json) се копират ръчно в $CHATCHAT_SHARED/eval-reports.
      EVAL_REPORTS_DIR: /data/eval-reports
    volumes:
      # JSON ключът на service account-а — само за четене, извън репото и образа. Без GCP_SA_FILE се
      # монтира /dev/null и променливата по-горе остава празна (Google ADC — на Hetzner няма такива).
      - ${GCP_SA_FILE:-/dev/null}:/run/secrets/gcp-sa.json:ro
      # Прикачените файлове — папка на ХОСТА извън release-а (оцелява деплоя, бекъпва се дневно с
      # базата от същия път). Собственик uid 1000 (node в образа), mode 700 — прави я deploy/deploy.sh.
      - ${CHATCHAT_SHARED:-/opt/few-few/shared/chatchat}/attachments:/data/attachments
      # Отчетите на оценъчния набор — само за четене (празна папка → метриките са „изисква оценка“).
      - ${CHATCHAT_SHARED:-/opt/few-few/shared/chatchat}/eval-reports:/data/eval-reports:ro
    ports:
      - '127.0.0.1:${HTTP_PORT:-4330}:4330'
      # Метриките — САМО на loopback-а на хоста, никога 0.0.0.0. Без METRICS_PORT в .env хостът взима
      # случаен свободен порт на 127.0.0.1 зад който нищо не слуша (няма сблъсък с други услуги).
      - '127.0.0.1:${METRICS_PORT:-}:9464'
    networks: [backend, default]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Само „пуснат“, не „здрав“: зареждането на сигнатурите е минути, а без антивирус
      # приложението пак работи — нов файл остава непоказан (PENDING/FAILED), докато clamd не го провери.
      clamav: { condition: service_started }
    logging: *logging

  worker:
    # Същият образ като app (`node dist/worker.js`, NFR-06): опашките от Redis — приемане/извличане на
    # документи (разбор в отделна нишка), OCR (pdftoppm + tesseract, execFile без shell), вектори (Vertex
    # в ЕС). Без HTTP; публикуван е само слушателят на метриките (по избор, само 127.0.0.1). Без миграции
    # (entrypoint-ът е node): тръгва СЛЕД като app е здрав, т.е. миграциите са приложени.
    image: chatchat-app
    pull_policy: never
    <<: *hardening
    cap_drop: [ALL]
    entrypoint: ['node']
    command: ['dist/worker.js']
    tmpfs:
      # Временните файлове на OCR (оригинал + растер на страница, трият се след всяка задача).
      - /tmp:size=512m,noexec,nosuid
    # Разборът е в нишка с таван 768 MB (INGEST_THREAD_HEAP_MB) × INGEST_CONCURRENCY (2) + tesseract.
    mem_limit: 2560m
    cpus: 2
    restart: unless-stopped
    # Плавно спиране: текущите задачи довършват до 90 s (src/worker.ts), после — принудително.
    stop_grace_period: 120s
    environment:
      # САМО каквото worker-ът ползва (least privilege): без SESSION_PEPPER, MFA_ENC_KEY, ключа за адресите.
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://chatchat:${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}@db:5432/chatchat
      REDIS_URL: redis://:${REDIS_PASSWORD:?липсва REDIS_PASSWORD}@redis:6379
      ATTACHMENTS_DIR: /data/attachments
      FILES_KEK: ${FILES_KEK:?липсва FILES_KEK}
      FILES_KEK_PREVIOUS: ${FILES_KEK_PREVIOUS:-}
      FILES_PLAINTEXT: ${FILES_PLAINTEXT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_SWEEP_SECONDS: ${EMBEDDING_SWEEP_SECONDS:-}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-eu}
      GOOGLE_APPLICATION_CREDENTIALS: ${GCP_SA_FILE:+/run/secrets/gcp-sa.json}
      AI_BREAKER_FAILURES: ${AI_BREAKER_FAILURES:-5}
      AI_BREAKER_COOLDOWN_SECONDS: ${AI_BREAKER_COOLDOWN_SECONDS:-30}
      # Приемането и OCR (src/config-queue.ts); празно → подразбирането там.
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-}
      OCR_ENGINE: ${OCR_ENGINE:-}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-}
      QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS:-}
      INGEST_TMP_DIR: /tmp
      WORKER_HEARTBEAT_FILE: /tmp/chatchat-worker.alive
      # Метриките на worker-а (опашки, OCR, приемане) — като на app: само 127.0.0.1 на хоста.
      METRICS_PORT: ${WORKER_METRICS_PORT:+9464}
      METRICS_HOST: 0.0.0.0
    volumes:
      - ${GCP_SA_FILE:-/dev/null}:/run/secrets/gcp-sa.json:ro
      # Оригиналите — само за четене: worker-ът никога не пише във файловото хранилище.
      - ${CHATCHAT_SHARED:-/opt/few-few/shared/chatchat}/attachments:/data/attachments:ro
    ports:
      - '127.0.0.1:${WORKER_METRICS_PORT:-}:9464'
    # backend — базата и Redis; default — Vertex AI (векторите).
    networks: [backend, default]
    # „Жив съм“ = файлът е по-нов от 60 s (обновява се на 10 s, само ако Redis отговаря).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('fs').statSync('/tmp/chatchat-worker.alive');process.exit(Date.now()-s.mtimeMs<60000?0:1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      app: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging

volumes:
  db-data:
  clamav-db:
  redis-data:
