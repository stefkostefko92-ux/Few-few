# ChatChat — Alertmanager: имейл през Brevo SMTP relay (docs/runbook.md, „Включване“).
#
# ШАБЛОН: entrypoint.sh го копира в /tmp на контейнера (600) и сменя маркерите __…__ с проверени
# стойности: получателят и подателят — от .env (ALERT_EMAIL_TO, ALERT_EMAIL_FROM); SMTP потребителят — от
# файла с тайна smtp-user; паролата (SMTP ключът на Brevo, НЕ API ключът) Alertmanager чете сам от файла
# smtp-password. Тайните са извън репото: /opt/few-few/shared/chatchat/monitoring/secrets/ (400, uid 65534).
#
# Hetzner блокира изходящите 25/465/587 → relay-ят е на 2525 със STARTTLS (smtp_require_tls: без TLS
# писмо не тръгва — паролата никога не минава открито).
#
# Маршрути: severity="page" — веднага, повтаря се на 1 ч, докато гори; severity="ticket" — събрани, на
# 24 ч. Страница потиска тикета за СЪЩИЯ компонент (етикетът `component` — всяка аларма го има;
# tools/vps/chatchat-monitoring.test.mjs го проверява). Писмата носят само етикетите и анотациите на
# алармите — кодове, без лични данни (CLAUDE.md, инвариантите на метриките).
#
# Проверка: amtool check-config <изобразения файл>.

global:
  smtp_smarthost: '__SMTP_SMARTHOST__'
  smtp_from: '__ALERT_EMAIL_FROM__'
  smtp_hello: 'chatchat-alertmanager'
  smtp_auth_username: '__SMTP_USER__'
  smtp_auth_password_file: '__SECRETS_DIR__/smtp-password'
  smtp_require_tls: true
  resolve_timeout: 5m

route:
  receiver: email-ticket
  group_by: ['alertname', 'severity']
  group_wait: 1m
  group_interval: 10m
  repeat_interval: 24h
  routes:
    - matchers: ['severity="page"']
      receiver: email-page
      group_wait: 15s
      group_interval: 5m
      repeat_interval: 1h

inhibit_rules:
  # Страница и тикет за едно и също — само страницата (тикетът остава видим в Prometheus).
  - source_matchers: ['severity="page"']
    target_matchers: ['severity="ticket"']
    equal: ['component']
  # Процесът е спрял: пробите отвън и отвътре падат като следствие — будим за причината веднъж.
  # Worker-ът тръгва само след здраво приложение (depends_on) — при спряно приложение е следствие.
  - source_matchers: ['alertname="ChatchatDown"']
    target_matchers: ['alertname=~"ChatchatNotReady|ChatchatPublicProbeFailed|ChatchatWorkerDown"']

receivers:
  - name: email-page
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true
        headers:
          Subject: '[ChatChat][PAGE][{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
  - name: email-ticket
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true
        headers:
          Subject: '[ChatChat][ticket][{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
