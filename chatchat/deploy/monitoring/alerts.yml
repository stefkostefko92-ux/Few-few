# ChatChat — правила за Prometheus (F3: NFR-01, NFR-02, NFR-06, NFR-07, NFR-09, NFR-11; FR-09).
#
# Аларми по СИМПТОМ (какво усеща техникът), не по причина (CPU/памет). Двете SLO-та са с error budget
# и burn-rate аларми на много прозорци (Google SRE Workbook, гл. 5, табл. 5-8):
#   страница  14.4× (2 % от 30-дневния бюджет за 1 ч)  дълъг 1 ч  + къс 5 мин
#   страница   6×   (5 % за 6 ч)                        дълъг 6 ч  + къс 30 мин
#   тикет      1×   (10 % за 3 дни)                     дълъг 3 д  + къс 6 ч
# Късият прозорец (~1/12 от дългия) потвърждава, че изгарянето ТЕЧЕ сега — алармата спира бързо.
#
# SLO-1 (NFR-01) наличност 99.5 % / 30 дни → бюджет 0.5 % (0.005) неуспешни заявки.
#   SLI = заявки без 5xx / всички заявки; без /healthz, /readyz (сонди) и /api/v1/events (SSE поток).
# SLO-2 (NFR-02) 95 % от текстовите AI отговори ≤ 8 s / 30 дни → бюджет 5 % (0.05).
#   SLI = отговори (answered/no_evidence) до 8 s / (answered + no_evidence + timeout), вход „text“.
#
# Prometheus 3 нормализира `le` до „8.0“ (docs: prometheus/latest/migration) — затова `le=~"8(\\.0)?"`.
# Таван на тишината при малко трафик: страниците искат минимален брой събития (MVP, 1 процес) — иначе
# една грешна заявка от две би будила човек. Праговете на обема са в коментарите до всяка аларма.
#
# Проверка: promtool check rules alerts.yml && promtool test rules alerts.test.yml
# Стекът (Prometheus + Alertmanager) — docker-compose.monitoring.yml, включва се с deploy/monitoring.sh
# (docs/runbook.md, „Включване“); машината, базата, пробите и одитът — infra-alerts.yml.
# Всяка аларма сочи своя раздел в runbook-а (annotations.runbook_url) и носи `component` — по него
# Alertmanager потиска тикета, щом за същото гори страница (alertmanager.yml, inhibit_rules).

groups:
  - name: chatchat-sli
    interval: 1m
    rules:
      # ── SLO-1: наличност (дял на 5xx) ─────────────────────────────────────────────────────────
      - record: chatchat:availability_errors:ratio_rate5m
        expr: |
          sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events",status=~"5.."}[5m]))
          / sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events"}[5m]))
      - record: chatchat:availability_errors:ratio_rate30m
        expr: |
          sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events",status=~"5.."}[30m]))
          / sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events"}[30m]))
      - record: chatchat:availability_errors:ratio_rate1h
        expr: |
          sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events",status=~"5.."}[1h]))
          / sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events"}[1h]))
      - record: chatchat:availability_errors:ratio_rate6h
        expr: |
          sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events",status=~"5.."}[6h]))
          / sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events"}[6h]))
      - record: chatchat:availability_errors:ratio_rate3d
        expr: |
          sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events",status=~"5.."}[3d]))
          / sum(rate(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events"}[3d]))
      - record: chatchat:http_requests:increase1h
        expr: sum(increase(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events"}[1h]))
      - record: chatchat:http_requests:increase6h
        expr: sum(increase(chatchat_http_requests_total{route!~"/healthz|/readyz|/api/v1/events"}[6h]))

      # ── SLO-2: латентност на текстовия AI отговор (дял над 8 s) ──────────────────────────────
      - record: chatchat:ai_text_slow:ratio_rate5m
        expr: |
          1 - (
            sum(rate(chatchat_ai_answer_duration_seconds_bucket{input="text",outcome=~"answered|no_evidence",le=~"8(\\.0)?"}[5m]))
            / sum(rate(chatchat_ai_answer_duration_seconds_count{input="text",outcome=~"answered|no_evidence|timeout"}[5m]))
          )
      - record: chatchat:ai_text_slow:ratio_rate30m
        expr: |
          1 - (
            sum(rate(chatchat_ai_answer_duration_seconds_bucket{input="text",outcome=~"answered|no_evidence",le=~"8(\\.0)?"}[30m]))
            / sum(rate(chatchat_ai_answer_duration_seconds_count{input="text",outcome=~"answered|no_evidence|timeout"}[30m]))
          )
      - record: chatchat:ai_text_slow:ratio_rate1h
        expr: |
          1 - (
            sum(rate(chatchat_ai_answer_duration_seconds_bucket{input="text",outcome=~"answered|no_evidence",le=~"8(\\.0)?"}[1h]))
            / sum(rate(chatchat_ai_answer_duration_seconds_count{input="text",outcome=~"answered|no_evidence|timeout"}[1h]))
          )
      - record: chatchat:ai_text_slow:ratio_rate6h
        expr: |
          1 - (
            sum(rate(chatchat_ai_answer_duration_seconds_bucket{input="text",outcome=~"answered|no_evidence",le=~"8(\\.0)?"}[6h]))
            / sum(rate(chatchat_ai_answer_duration_seconds_count{input="text",outcome=~"answered|no_evidence|timeout"}[6h]))
          )
      - record: chatchat:ai_text_slow:ratio_rate3d
        expr: |
          1 - (
            sum(rate(chatchat_ai_answer_duration_seconds_bucket{input="text",outcome=~"answered|no_evidence",le=~"8(\\.0)?"}[3d]))
            / sum(rate(chatchat_ai_answer_duration_seconds_count{input="text",outcome=~"answered|no_evidence|timeout"}[3d]))
          )
      - record: chatchat:ai_text_answers:increase1h
        expr: sum(increase(chatchat_ai_answer_duration_seconds_count{input="text",outcome=~"answered|no_evidence|timeout"}[1h]))
      - record: chatchat:ai_text_answers:increase6h
        expr: sum(increase(chatchat_ai_answer_duration_seconds_count{input="text",outcome=~"answered|no_evidence|timeout"}[6h]))

  - name: chatchat-slo-alerts
    rules:
      # ── SLO-1 наличност 99.5 % (бюджет 0.005) ─────────────────────────────────────────────────
      - alert: ChatchatAvailabilityBurnFast
        # 14.4 × 0.005 = 0.072; поне 20 заявки за час (иначе е шум, не страница).
        expr: |
          chatchat:availability_errors:ratio_rate1h > (14.4 * 0.005)
          and chatchat:availability_errors:ratio_rate5m > (14.4 * 0.005)
          and chatchat:http_requests:increase1h >= 20
        labels:
          severity: page
          component: availability
          slo: nfr-01-availability
        annotations:
          summary: 'ChatChat: 5xx изгарят бюджета на наличността 14.4× (2 % от месечния за 1 ч)'
          description: 'Дял на 5xx за 1 ч: {{ $value | humanizePercentage }} (праг 7.2 %). Техниците виждат грешки.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatavailabilityburnfast'
      - alert: ChatchatAvailabilityBurnSlow
        # 6 × 0.005 = 0.03; поне 50 заявки за 6 ч.
        expr: |
          chatchat:availability_errors:ratio_rate6h > (6 * 0.005)
          and chatchat:availability_errors:ratio_rate30m > (6 * 0.005)
          and chatchat:http_requests:increase6h >= 50
        labels:
          severity: page
          component: availability
          slo: nfr-01-availability
        annotations:
          summary: 'ChatChat: 5xx изгарят бюджета на наличността 6× (5 % от месечния за 6 ч)'
          description: 'Дял на 5xx за 6 ч: {{ $value | humanizePercentage }} (праг 3 %).'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatavailabilityburnslow'
      - alert: ChatchatAvailabilityBudgetTicket
        # 1 × 0.005 — бюджетът свършва точно за 30 дни; тикет, не страница.
        expr: |
          chatchat:availability_errors:ratio_rate3d > 0.005
          and chatchat:availability_errors:ratio_rate6h > 0.005
        labels:
          severity: ticket
          component: availability
          slo: nfr-01-availability
        annotations:
          summary: 'ChatChat: бюджетът на наличността (99.5 %) изтича с темп ≥ 1× за 3 дни'
          description: 'Дял на 5xx за 3 дни: {{ $value | humanizePercentage }} (праг 0.5 %).'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatavailabilitybudgetticket'

      # ── SLO-2 P95 на текстовия AI отговор ≤ 8 s (бюджет 0.05) ─────────────────────────────────
      - alert: ChatchatAiLatencyBurnFast
        # 14.4 × 0.05 = 0.72; поне 5 текстови отговора за час.
        expr: |
          chatchat:ai_text_slow:ratio_rate1h > (14.4 * 0.05)
          and chatchat:ai_text_slow:ratio_rate5m > (14.4 * 0.05)
          and chatchat:ai_text_answers:increase1h >= 5
        labels:
          severity: page
          component: ai-latency
          slo: nfr-02-ai-latency
        annotations:
          summary: 'ChatChat: AI отговорите са над 8 s — бюджетът на латентността гори 14.4×'
          description: 'Дял над 8 s (или таймаут) за 1 ч: {{ $value | humanizePercentage }} (праг 72 %).'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatailatencyburnfast'
      - alert: ChatchatAiLatencyBurnSlow
        # 6 × 0.05 = 0.3; поне 10 текстови отговора за 6 ч.
        expr: |
          chatchat:ai_text_slow:ratio_rate6h > (6 * 0.05)
          and chatchat:ai_text_slow:ratio_rate30m > (6 * 0.05)
          and chatchat:ai_text_answers:increase6h >= 10
        labels:
          severity: page
          component: ai-latency
          slo: nfr-02-ai-latency
        annotations:
          summary: 'ChatChat: AI отговорите са над 8 s — бюджетът на латентността гори 6×'
          description: 'Дял над 8 s (или таймаут) за 6 ч: {{ $value | humanizePercentage }} (праг 30 %).'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatailatencyburnslow'
      - alert: ChatchatAiLatencyBudgetTicket
        expr: |
          chatchat:ai_text_slow:ratio_rate3d > 0.05
          and chatchat:ai_text_slow:ratio_rate6h > 0.05
        labels:
          severity: ticket
          component: ai-latency
          slo: nfr-02-ai-latency
        annotations:
          summary: 'ChatChat: P95 на текстовия AI отговор е над 8 s за последните 3 дни'
          description: 'Дял над 8 s (или таймаут) за 3 дни: {{ $value | humanizePercentage }} (праг 5 %).'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatailatencybudgetticket'

  - name: chatchat-symptoms
    rules:
      - alert: ChatchatDown
        # Процесът не отговаря на скрейпа: 5xx по-горе не се виждат, защото метриките са в него.
        # Външната истина (https://…/healthz) е синтетичната проба — ChatchatPublicProbeFailed.
        expr: up{job="chatchat"} == 0 or absent(up{job="chatchat"})
        for: 3m
        labels:
          severity: page
          component: app
        annotations:
          summary: 'ChatChat не отговаря на /metrics от 3 мин — вероятно процесът е спрял'
          description: 'Prometheus не може да прочете /metrics на приложението ({{ $labels.instance }}).'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatdown'
      - alert: ChatchatAiProviderUnavailable
        # Отворен breaker = AI отговорите са бърз 503 (страницата идва от SLO-1, ако има трафик).
        expr: max(chatchat_circuit_breaker_state{breaker="vertex_messages"}) >= 2
        for: 15m
        labels:
          severity: ticket
          component: ai-provider
        annotations:
          summary: 'ChatChat: circuit breaker-ът към Vertex е отворен над 15 мин — AI отговори няма'
          description: 'Техниците получават ai_unavailable; случаите и разговорите работят.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchataiproviderunavailable'
      - alert: ChatchatSemanticSearchDegraded
        expr: max(chatchat_circuit_breaker_state{breaker="vertex_embeddings"}) >= 2
        for: 30m
        labels:
          severity: ticket
          component: semantic-search
        annotations:
          summary: 'ChatChat: семантичното търсене е изключено от breaker-а над 30 мин (само лексикално)'
          description: 'Отговорите работят, но без семантично подкрепени източници.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatsemanticsearchdegraded'
      - alert: ChatchatUploadsFailing
        # Техникът не може да прикачи снимка/лог: проверката в clamd пада за ≥ половината качвания.
        expr: |
          sum(increase(chatchat_attachment_uploads_total{result="scan_failed"}[30m])) >= 3
          and sum(increase(chatchat_attachment_uploads_total{result="scan_failed"}[30m]))
            / sum(increase(chatchat_attachment_uploads_total{result!="rejected"}[30m])) > 0.5
        labels:
          severity: ticket
          component: antivirus
        annotations:
          summary: 'ChatChat: качванията падат на антивируса (av_scan_failed) — над 50 % за 30 мин'
          description: 'Файловете не се приемат (fail-closed). Чатът работи без прикачени файлове.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatuploadsfailing'
      - alert: ChatchatRealtimeSlow
        # NFR-11: P95 на доставката ≤ 2 s. Над 5 % от събитията за 1 ч (и сега) — бавен поток.
        expr: |
          (
            1 - sum(rate(chatchat_realtime_delivery_seconds_bucket{le=~"2(\\.0)?"}[1h]))
              / sum(rate(chatchat_realtime_delivery_seconds_count[1h]))
          ) > 0.05
          and (
            1 - sum(rate(chatchat_realtime_delivery_seconds_bucket{le=~"2(\\.0)?"}[5m]))
              / sum(rate(chatchat_realtime_delivery_seconds_count[5m]))
          ) > 0.05
          and sum(increase(chatchat_realtime_delivery_seconds_count[1h])) >= 20
        labels:
          severity: ticket
          component: realtime
          slo: nfr-11-realtime
        annotations:
          summary: 'ChatChat: събитията в реално време закъсняват над 2 s (P95, NFR-11)'
          description: 'Дял над 2 s за 1 ч: {{ $value | humanizePercentage }}. UI-ят догонва по REST.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatrealtimeslow'
      - alert: ChatchatMetricsCardinalityCap
        # Таванът на сериите е ударен — нов етикет носи променлива стойност (грешка в кода).
        expr: sum(increase(chatchat_metrics_series_dropped_total[1h])) > 0
        labels:
          severity: ticket
          component: metrics
        annotations:
          summary: 'ChatChat: метрика удари тавана на сериите — проверка за висока кардиналност'
          description: 'Метрика: виж chatchat_metrics_series_dropped_total по етикета metric.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatmetricscardinalitycap'

  # ── Фоновите потоци (NFR-06, FR-09): worker-ът с опашките и изпращачът към helpdesk ─────────────
  # Симптомът е „работата на човека стои“: файлът за базата знания не се приема, тикетът не стига до
  # helpdesk-а. Чатът и вече публикуваното знание не зависят от тях → тикети, не страници.
  - name: chatchat-background
    rules:
      - alert: ChatchatWorkerDown
        # Worker-ът не отговаря на скрейпа (job chatchat-worker): опашките ingest/ocr/embed не се
        # обработват. Метриките на опашките са в него — без този скрейп алармите им мълчат.
        expr: up{job="chatchat-worker"} == 0 or absent(up{job="chatchat-worker"})
        for: 10m
        labels:
          severity: ticket
          component: worker
        annotations:
          summary: 'ChatChat: worker-ът не отговаря от 10 мин — новите файлове за знанието не се обработват'
          description: 'Prometheus не чете /metrics на worker-а (job chatchat-worker). Чатът работи; приемането, OCR и векторите стоят.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatworkerdown'
      - alert: ChatchatQueueDeadLetters
        # Задача изчерпа опитите си (dead-letter) през последния час: файлът е „Неуспех“ в конзолата.
        # Сериите съществуват от старта с 0 (queueHooks) — и първият провал след рестарт се вижда.
        expr: sum by (queue) (increase(chatchat_queue_jobs_total{result="dead"}[1h])) > 0
        for: 5m
        labels:
          severity: ticket
          component: queue
        annotations:
          summary: 'ChatChat: задачи в опашката {{ $labels.queue }} отидоха в dead-letter през последния час'
          description: 'Опашка {{ $labels.queue }}: файлът е „Неуспех“ (или векторите не са обновени) — „Повтори“ в конзолата след поправката.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatqueuedeadletters'
      - alert: ChatchatQueueBacklog
        # Има чакащи задачи и нито една не завършва — 30 мин без прекъсване (`for`): опашката не се
        # изпразва. Празна опашка (waiting = 0 поне веднъж) или завършена задача нулират брояча на `for`;
        # `for` (не прозорец [30m]) пази и от фалшива тревога при нова серия без история. `dead` не е
        # работна опашка.
        expr: |
          (
            max by (queue) (chatchat_queue_depth{queue=~"ingest|ocr|embed",state="waiting"}) > 0
          )
          unless on (queue)
          (
            sum by (queue) (increase(chatchat_queue_jobs_total{result="completed"}[5m])) > 0
          )
        for: 30m
        labels:
          severity: ticket
          component: queue
        annotations:
          summary: 'ChatChat: опашката {{ $labels.queue }} стои — чакащи задачи без нито една завършена за 30 мин'
          description: 'Чакащи сега: {{ $value }} (опашка {{ $labels.queue }}). Файловете остават „В опашката“.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchatqueuebacklog'
      - alert: ChatchatHelpdeskDeadLetters
        # Доставка към helpdesk е в dead-letter (окончателна грешка или изчерпани опити) на ВКЛЮЧЕН
        # конектор: тикетът е спрял към helpdesk-а, следващите му събития чакат зад нея. max — всяка
        # инстанция на API-то чете същия агрегат от базата.
        expr: max(chatchat_helpdesk_outbox{state="dead"}) > 0
        for: 15m
        labels:
          severity: ticket
          component: helpdesk
        annotations:
          summary: 'ChatChat: доставки към helpdesk са в dead-letter от 15 мин — тикетите им са спрели'
          description: 'Доставки в dead-letter: {{ $value }}. Нужно е „Пусни отново“ от администратора на клиента след поправката.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchathelpdeskdeadletters'
      - alert: ChatchatHelpdeskBacklog
        # Най-старата доставка, която изпращачът МОЖЕ да вземе (без чакащите зад dead-letter), е на над
        # 30 мин: helpdesk-ът отказва/не отговаря (повтор с отстъп) или изпращачът не върви. Възрастта
        # расте и когато изпращачът спре да чете базата (смята се при четене на /metrics).
        expr: max(chatchat_helpdesk_oldest_pending_seconds) > 1800
        for: 5m
        labels:
          severity: ticket
          component: helpdesk
        annotations:
          summary: 'ChatChat: доставка към helpdesk чака над 30 мин — промените по тикетите закъсняват'
          description: 'Най-старата чакаща доставка: {{ $value | humanizeDuration }}.'
          runbook_url: 'https://github.com/stefkostefko92-ux/Few-few/blob/main/chatchat/docs/runbook.md#chatchathelpdeskbacklog'
