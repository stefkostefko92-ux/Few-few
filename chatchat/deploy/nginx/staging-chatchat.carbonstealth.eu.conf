# nginx на ХОСТА за STAGING на ChatChat (DEPLOY.md, „Staging“). TLS — certbot (Let's Encrypt), отделен
# сертификат за staging-chatchat.carbonstealth.eu. Приложението на staging слуша на 127.0.0.1:4331
# (HTTP_PORT в .env на staging); при друг HTTP_PORT deploy.sh вписва него.
#
# Слага го deploy/staging.sh → deploy.sh в /etc/nginx/sites-available/chatchat-staging (+ връзка в
# sites-enabled), след като сертификатът вече го има. Маршрутите и таваните са същите като на
# продукцията (deploy/nginx/chatchat.carbonstealth.eu.conf — тестът tools/vps/chatchat-staging.test.mjs
# пази двата файла в синхрон); разликите са само три:
#   1. Достъп: САМО от адрес в allowlist-а ИЛИ с парола (basic auth) — без публичен достъп. Файловете
#      са извън репото, в /etc/nginx/chatchat-staging/ (staging.sh ги създава празни; празни = затворено
#      за всички): allow.conf (`allow <IP>;` на ред) и htpasswd (`htpasswd -B -C 12 …`, DEPLOY.md).
#      Липсващ/празен htpasswd → nginx връща 500 вместо страницата — пак затворено, никога отворено.
#   2. `X-Robots-Tag: noindex` на всеки отговор (и на 401/5xx на самия nginx) — staging не се индексира.
#   3. Без HSTS с includeSubDomains — staging не решава за другите поддомейни (HSTS е само за хоста).
#
# Без дневник на заявките и с error_log само за crit (като продукцията): нула IP адреси в дневниците.

server {
    listen 80;
    listen [::]:80;
    server_name staging-chatchat.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-chatchat.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/staging-chatchat.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-chatchat.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    # Отделен кеш от продукцията (същото име в два server блока с различен размер чупи nginx -t).
    ssl_session_cache shared:ChatChatStaging:2m;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # ── Достъпът (наследява се от всички location-и; /readyz го заменя изрично по-долу) ──
    # `satisfy any`: минава адрес от allow.conf ИЛИ вярна парола. Всичко останало — 401.
    satisfy any;
    include /etc/nginx/chatchat-staging/allow.conf;
    deny all;
    auth_basic "ChatChat staging";
    auth_basic_user_file /etc/nginx/chatchat-staging/htpasswd;

    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 1m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # Паролата на basic auth не стига до приложението (то има свой вход; Authorization не му трябва).
    proxy_set_header Authorization     "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;

    location = /healthz {
        proxy_pass http://127.0.0.1:4331;
    }

    # Само от самия сървър, без парола (сондата и мониторът ползват 127.0.0.1:4331 направо).
    location = /readyz {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4331;
    }

    # ВНИМАНИЕ: `proxy_set_header` и `add_header` в location ЗАМЕНЯТ наследените от server — затова тук
    # няма нито един от тях (иначе изпадат X-Forwarded-For, noindex и HSTS).

    location /api/v1/admin/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4331;
    }

    location /api/v1/cases/ {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:4331;
    }

    location /api/v1/events {
        proxy_pass http://127.0.0.1:4331;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location /q/ {
        proxy_pass http://127.0.0.1:4331;
    }

    location / {
        proxy_pass http://127.0.0.1:4331;
    }
}
