# nginx на ХОСТА за ChatChat. TLS сертификатите се управляват с certbot (Let's Encrypt).
# Приложението слуша на 127.0.0.1:4330 (публикуван порт от docker-compose.yml); при друг HTTP_PORT
# в .env се сменя и тук.
#
# Слага се в /etc/nginx/sites-available/chatchat (+ връзка в sites-enabled), след като сертификатът
# вече го има — преди това `nginx -t` отказва заради липсващите файлове (виж DEPLOY.md, т. 2).
#
# Без дневник на заявките и с error_log само за crit (като korpora): нула IP адреси в дневниците на
# nginx. Приложението води свой дневник (pino).

server {
    listen 80;
    listen [::]:80;
    server_name chatchat.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://$host$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chatchat.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/chatchat.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatchat.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    # Без OCSP stapling: Let's Encrypt вече не слага OCSP адрес в сертификатите.

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # HSTS — един източник: заглавният ред на helmet се скрива и nginx слага своя, с `always` —
    # така го носят и отговорите на самия nginx (502/504, докато приложението е спряно).
    # CSP, X-Frame-Options, Referrer-Policy и останалите идват само от приложението (helmet).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Общият таван е малък (API-то приема JSON до 64 KB); 8 MB само за админ пътя по-долу.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    # Общите настройки към приложението (наследяват се от всички location-и по-долу).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Презаписва, не добавя: клиентът не може да подпъхне свой адрес — от него зависят лимитите на
    # входа и на чата (TRUST_PROXY=1 в приложението).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    # AI отговорът е до ~60 s (AI_TIMEOUT_MS, таван 115 s в config.ts) — 120 s покриват и тавана.
    proxy_read_timeout    120s;

    location = /healthz {
        proxy_pass http://127.0.0.1:4330;
    }

    # Готовността пита базата при всяка заявка — отвън не трябва (мониторът на хоста ползва
    # http://127.0.0.1:4330/readyz директно, без nginx).
    location = /readyz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4330;
    }

    # Админ качване на документи — express.json там е с таван 8 MB (src/app.ts).
    location /api/v1/admin/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:4330;
    }

    location / {
        proxy_pass http://127.0.0.1:4330;
    }
}
