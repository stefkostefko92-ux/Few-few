# clamd за ChatChat — deploy/deploy.sh го слага в /opt/few-few/shared/chatchat/clamd.conf, а compose го
# монтира САМО ЗА ЧЕТЕНЕ в /etc/clamav/clamd.conf на услугата clamav (промяна тук → рестарт на clamav при
# следващия деплой). Файловата система на контейнера е само за четене, затова настройките не се подават
# с CLAMD_CONF_* (образът ги вписва със `sed -i` в /etc/clamav — това би се провалило).
# Имената и стойностите по подразбиране са сверени с образеца в clamav/clamav:1.5.4-debian.

# Дневникът е в tmpfs (виж compose); с LogFileMaxSize ротацията е винаги включена.
LogFile /var/log/clamav/clamd.log
LogTime yes
LogFileMaxSize 2M
LogRotate yes

# Сокетите: локалният е за clamdcheck.sh/freshclam, TCP 3310 — за приложението през вътрешната мрежа
# на проекта (портът НЕ е публикуван към хоста).
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Паметта (DEPLOY.md, „ClamAV“): с пълната база clamd държи ~1 GB (измерено: 962 MiB); паралелното
# презареждане след всеки ъпдейт държи ВРЕМЕННО два двигателя (двойно) — близо до тавана от 2 GB → OOM.
# „no“ = по време на презареждането (десетки секунди, няколко пъти дневно) сканиранията ЧАКАТ, не падат.
ConcurrentDatabaseReload no

# Таваните — над най-големия файл, който приложението приема (PDF до 50 MB, снимка до 10 MB).
# StreamMaxLength: INSTREAM над него се прекъсва с грешка (приложението го брои за FAILED).
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 400M
# Fail-closed: файл (или вложено в него), който надхвърля таван, НЕ минава за чист без сканиране,
# а се отбелязва като „Heuristics.Limits.Exceeded“ (по подразбиране clamd просто го пропуска като OK).
AlertExceedsMax yes
