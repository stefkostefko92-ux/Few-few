# nginx на ХОСТА за Rilievi Impianti. TLS сертификатите се управляват с certbot.
# Приложението слуша на 127.0.0.1:4330 (публикуван порт от docker-compose.yml); при друг HTTP_PORT
# в .env deploy.sh вписва него вместо 4330.
#
# Не се пише на ръка: rilievi/deploy/deploy.sh слага точно този файл в
# /etc/nginx/sites-available/rilievi при всеки деплой (nginx -t, после reload), щом има сертификат.
# Сертификатът — веднъж, преди това (DEPLOY.md, т. 2).
#
# Без дневник на заявките и с error_log само за crit: IP адреси не се събират (политиката за
# поверителност на витрината го обещава — /privacy, раздел „Сигурност“).

server {
    listen 80;
    listen [::]:80;
    server_name rilievi.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://$host$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rilievi.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/rilievi.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rilievi.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RilieviSSL:10m;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Над тавана на приложението (форма 1 MB), без да отваря машината за големи тела — освен качването на
    # снимките и клиповете (location-ът по-долу).
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml text/plain;

    # CSP, HSTS, X-Frame-Options и Referrer-Policy ги задава приложението (helmet, nonce на заявка).
    # Не се дублират тук — два източника на един заглавен ред се разминават тихо.

    # Снимките и клиповете на картите: качването (клип до MEDIA_MAX_VIDEO_MB = 1024 MB + опаковката на
    # формата — при по-висок таван в .env се вдига и тук) тече право към приложението, без да минава
    # през диска на nginx; файловете (Range за клиповете) — също без временни файлове на nginx.
    location ~ ^/schede/[a-z0-9]+/allegati {
        client_max_body_size 1100m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:4330;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Записът на картата носи и листовете на скицника — приложението приема до 4 MB само тук
    # (src/server.ts); всичко друго остава до 2 MB.
    location ~ ^/schede(/[a-z0-9]+)?$ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:4330;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:4330;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Презаписва, не добавя: клиентът не може да подпъхне свой адрес — от него зависят таваните.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
