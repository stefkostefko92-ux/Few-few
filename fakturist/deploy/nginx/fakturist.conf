# nginx на ХОСТА за Фактурист. TLS сертификатите се управляват с certbot.
# Приложението слуша на 127.0.0.1:4340 (публикуван порт от docker-compose.yml).
# Домейнът за тестовете: fakturist.carbonstealth.eu (решение на собственика от 13.11.2026). Марката в
# документите остава fakturist.eu (src/brand.ts). При преминаване на собствен домейн: нов server блок за
# него, а този връща 301 към новия адрес; PUBLIC_BASE_URL в .env се сменя заедно с него.
#
# Без дневник на заявките и с error_log само за crit: IP адреси не се събират.

map $request_method $fakturist_auth_limit {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $fakturist_auth_limit zone=fakturist_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name fakturist.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://fakturist.carbonstealth.eu$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fakturist.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/fakturist.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fakturist.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FakturistSSL:10m;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Формата на документ е до 256 KB (src/routes/mount.ts); webhook-ът — до 64 KB.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml text/plain;

    # CSP, HSTS, X-Frame-Options и Referrer-Policy ги задава приложението (helmet, nonce на заявка).

    location ~ ^/(vhod|registraciya|pokana)(/|$) {
        limit_req zone=fakturist_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
