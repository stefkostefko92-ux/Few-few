# Фактурист в продукция: база + приложение.
#
# TLS и публичният вход са на nginx-а на ХОСТА (Let's Encrypt) — конфигът е
# `deploy/nginx/fakturist.conf` в това репо, не се пише на ръка на сървъра.
#
# Тайните НЕ са тук — идват от `.env` до този файл (mode 600 на сървъра, никога в репото).
# Задължителни: POSTGRES_PASSWORD (hex) · JWT_SECRET · LEDGER_SEAL_KEY (НИКОГА не се сменя след първата
# издадена фактура — с него се проверява веригата) · PUBLIC_BASE_URL. По избор: REGISTRATION_OPEN
# (true само след публикуване на правните текстове), REVOLUT_WEBHOOK_SECRET, BILLING_IBAN, HTTP_PORT (4340),
# SMTP_HOST/SMTP_USER/SMTP_PASS (Brevo — писмата към шкафчетата).
name: fakturist

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /var/run/postgresql:size=4m
      - /tmp:size=64m
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    environment:
      POSTGRES_USER: fakturist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}
      POSTGRES_DB: fakturist
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fakturist -d fakturist']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    build:
      context: .
      target: runner
    <<: *hardening
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4340'
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://fakturist:${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}@db:5432/fakturist
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?липсва PUBLIC_BASE_URL}
      JWT_SECRET: ${JWT_SECRET:?липсва JWT_SECRET}
      LEDGER_SEAL_KEY: ${LEDGER_SEAL_KEY:?липсва LEDGER_SEAL_KEY}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
      REVOLUT_WEBHOOK_SECRET: ${REVOLUT_WEBHOOK_SECRET:-}
      BILLING_IBAN: ${BILLING_IBAN:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-info@carbonstealth.eu}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL:-privacy@carbonstealth.eu}
      # Brevo SMTP (порт 2525). Без SMTP_HOST писмата към шкафчетата чакат в опашката.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Фактурист <no-reply@fakturist.eu>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Портът е публикуван през Docker NAT; `uniquelocal` вярва само на nginx-а на хоста през тази мрежа.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
    ports:
      - '127.0.0.1:${HTTP_PORT:-4340}:4340'
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

volumes:
  db-data:
