<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <title>Фактурист — промо клип</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      :root {
        --navy: #0a1524;
        --navy-2: #0f1f33;
        --ink: #eef3f8;
        --ink-2: #a9bacb;
        --ink-3: #6f8399;
        --teal: #2cc5b5;
        --teal-2: #05a699;
        --teal-deep: #03756c;
        --paper: #f4f6f8;
        --line: rgba(233, 239, 245, 0.08);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      body {
        font-family: 'IBM Plex Sans', sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* фон */
      .bg {
        position: absolute;
        inset: -10%;
        background:
          radial-gradient(
            60% 50% at var(--gx, 30%) var(--gy, 20%),
            rgba(44, 197, 181, 0.16),
            transparent 70%
          ),
          radial-gradient(
            50% 45% at var(--hx, 80%) var(--hy, 85%),
            rgba(5, 166, 153, 0.12),
            transparent 70%
          ),
          linear-gradient(160deg, #0d1c30 0%, var(--navy) 55%, #08111e 100%);
      }
      .grid {
        position: absolute;
        left: -20%;
        right: -20%;
        top: 45%;
        height: 120%;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 80px 80px;
        transform-origin: 50% 0;
        transform: perspective(900px) rotateX(62deg);
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent 80%);
      }
      #grain {
        position: absolute;
        inset: 0;
        opacity: 0.055;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.55));
        pointer-events: none;
      }

      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      /* текст */
      .kt {
        position: absolute;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.08;
      }
      .kt .w {
        display: inline-block;
        white-space: pre;
        will-change: transform, opacity, filter;
      }
      .kt .accent {
        color: var(--teal);
      }
      .h1 {
        font-size: 84px;
      }
      .h2 {
        font-size: 60px;
      }
      .h3 {
        font-size: 40px;
      }
      .sub {
        font-weight: 400;
        font-size: 32px;
        color: var(--ink-2);
        letter-spacing: 0;
        line-height: 1.35;
      }
      .small {
        font-weight: 400;
        font-size: 22px;
        color: var(--ink-3);
        letter-spacing: 0.01em;
      }
      .mono {
        font-family: 'IBM Plex Mono', monospace;
      }
      .pill.solo {
        position: absolute;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid rgba(44, 197, 181, 0.45);
        color: var(--teal);
        font-size: 22px;
        font-weight: 500;
        background: rgba(44, 197, 181, 0.08);
      }

      /* прозорец на браузъра */
      .win {
        position: absolute;
        border-radius: 16px;
        background: #fff;
        overflow: hidden;
        box-shadow:
          0 60px 120px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.08);
        transform-style: preserve-3d;
      }
      .win .top {
        height: 44px;
        background: #eef1f5;
        border-bottom: 1px solid #d9dee6;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 18px;
      }
      .win .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #d5dae2;
      }
      .win .url {
        margin-left: 18px;
        flex: 1;
        max-width: 640px;
        height: 28px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid #d9dee6;
        font:
          400 15px/28px 'IBM Plex Sans',
          sans-serif;
        color: #4a5a6c;
        padding: 0 14px;
        white-space: nowrap;
        overflow: hidden;
      }
      .win .url b {
        color: #0c1929;
        font-weight: 500;
      }
      .win .view {
        position: absolute;
        left: 0;
        right: 0;
        top: 44px;
        bottom: 0;
        overflow: hidden;
        background: var(--paper);
      }
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .cam img {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
      }
      .reveal {
        position: absolute;
        overflow: hidden;
      }
      .reveal img {
        position: absolute;
      }
      .hl {
        position: absolute;
        border-radius: 10px;
        border: 3px solid var(--teal-2);
        box-shadow:
          0 0 0 6px rgba(44, 197, 181, 0.22),
          0 0 40px rgba(44, 197, 181, 0.45);
      }
      .caret {
        position: absolute;
        width: 2px;
        background: #0c1929;
      }

      /* курсор */
      .cursor {
        position: absolute;
        width: 34px;
        height: 34px;
        z-index: 50;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
      }
      .ripple {
        position: absolute;
        border-radius: 50%;
        border: 3px solid var(--teal);
        z-index: 49;
      }

      /* телефон */
      .phone {
        position: absolute;
        width: 360px;
        height: 760px;
        border-radius: 56px;
        background: #0b0f16;
        padding: 14px;
        box-shadow:
          0 50px 100px rgba(0, 0, 0, 0.6),
          inset 0 0 0 2px #2a3240;
      }
      .phone .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 44px;
        overflow: hidden;
        background: #fff;
      }
      .phone .screen img {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .phone .notch {
        position: absolute;
        left: 50%;
        top: 22px;
        width: 110px;
        height: 30px;
        margin-left: -55px;
        border-radius: 20px;
        background: #0b0f16;
        z-index: 3;
      }

      /* карти */
      .card {
        position: absolute;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.03));
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
      }
      .tile {
        overflow: hidden;
      }
      .tile .shot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: 120px;
        overflow: hidden;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .tile .shot img {
        position: absolute;
        transform-origin: 0 0;
      }
      .tile h4 {
        position: absolute;
        left: 36px;
        top: 34px;
        right: 36px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .tile p {
        position: absolute;
        left: 36px;
        top: 80px;
        right: 36px;
        font-size: 21px;
        color: var(--ink-2);
      }

      .sheet {
        position: absolute;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .sheet img {
        width: 100%;
        display: block;
      }
      .code {
        position: absolute;
        border-radius: 18px;
        background: #07101c;
        border: 1px solid rgba(44, 197, 181, 0.25);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
        padding: 30px 34px;
        font:
          400 21px/1.62 'IBM Plex Mono',
          monospace;
        color: #c8d6e4;
        white-space: pre;
        overflow: hidden;
      }
      .code .tg {
        color: #7fb4ff;
      }
      .code .at {
        color: #f2c46d;
      }
      .code .vl {
        color: var(--teal);
      }
      .code .bt {
        color: #6f8399;
      }
      .code .ln {
        display: block;
      }

      .check {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 34px;
        font-weight: 500;
        margin: 0 0 26px;
      }
      .check i {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(44, 197, 181, 0.15);
        border: 2px solid var(--teal);
        display: grid;
        place-items: center;
        flex: none;
      }
      .check i svg {
        width: 24px;
        height: 24px;
      }

      .block {
        position: absolute;
        width: 250px;
        height: 150px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(44, 197, 181, 0.35);
        padding: 22px;
      }
      .block .n {
        font:
          600 30px 'IBM Plex Mono',
          monospace;
        color: var(--ink);
      }
      .block .hsh {
        font:
          400 18px 'IBM Plex Mono',
          monospace;
        color: var(--teal);
        margin-top: 14px;
      }
      .block .lbl {
        font-size: 18px;
        color: var(--ink-3);
        margin-top: 6px;
      }
      .link {
        position: absolute;
        height: 3px;
        background: linear-gradient(90deg, var(--teal-2), var(--teal));
        transform-origin: 0 50%;
      }

      .org {
        position: absolute;
        width: 520px;
        height: 230px;
        padding: 34px 40px;
      }
      .org .nm {
        font-size: 34px;
        font-weight: 600;
      }
      .org .meta {
        font-size: 21px;
        color: var(--ink-2);
        margin-top: 10px;
      }
      .org .tag {
        position: absolute;
        left: 40px;
        bottom: 30px;
      }
      .doc {
        position: absolute;
        width: 150px;
        height: 196px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
        padding: 18px 16px;
        z-index: 5;
      }
      .doc .bar {
        height: 10px;
        border-radius: 5px;
        background: #d6dde6;
        margin-bottom: 10px;
      }
      .doc .bar.t {
        background: var(--teal-2);
        width: 60%;
        height: 14px;
      }
      .doc .badge {
        position: absolute;
        right: -18px;
        bottom: -14px;
        padding: 6px 12px;
        border-radius: 10px;
        background: var(--teal-deep);
        color: #fff;
        font:
          600 16px 'IBM Plex Mono',
          monospace;
      }

      .price {
        position: absolute;
        width: 380px;
        height: 330px;
        padding: 40px 38px;
      }
      .price .nm {
        font-size: 30px;
        font-weight: 600;
      }
      .price .amt {
        font-size: 92px;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin-top: 26px;
      }
      .price .amt small {
        font-size: 26px;
        font-weight: 400;
        color: var(--ink-2);
        letter-spacing: 0;
        margin-left: 8px;
      }
      .price .ds {
        font-size: 21px;
        color: var(--ink-2);
        margin-top: 18px;
        line-height: 1.4;
      }
      .price.hi {
        border-color: rgba(44, 197, 181, 0.6);
        background: linear-gradient(180deg, rgba(44, 197, 181, 0.16), rgba(44, 197, 181, 0.04));
      }

      .icon {
        width: 120px;
        height: 120px;
        border-radius: 30px;
        display: grid;
        place-items: center;
        background: rgba(44, 197, 181, 0.12);
        border: 1px solid rgba(44, 197, 181, 0.4);
      }
      .icon svg {
        width: 60px;
        height: 60px;
        stroke: var(--teal);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .logo {
        position: absolute;
      }
      .sweep {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 35%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 65%
        );
        mix-blend-mode: soft-light;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="bg" id="bg"></div>
      <div class="grid" id="grid"></div>
      <div id="scenes"></div>
      <div class="vignette"></div>
      <canvas id="grain" width="480" height="270"></canvas>
    </div>
    <script>
      /*__DATA__*/
    </script>
    <script src="/film-lib.js"></script>
    <script src="/film.js"></script>
    <script src="/film-end.js"></script>
  </body>
</html>
