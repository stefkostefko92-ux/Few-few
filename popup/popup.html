<!DOCTYPE html>
<html lang="bg" data-theme="carbon">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="popup.css" />
  <title>Few-Few AdBlocker</title>
</head>
<body>
  <header>
    <div class="logo">🛡️</div>
    <div class="brand">
      <h1>Few-Few</h1>
      <span class="tagline">AdBlocker · Carbon Stealth</span>
    </div>
  </header>

  <main>
    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Защита</span>
        <label class="switch">
          <input type="checkbox" id="toggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <p class="status-text" id="statusText">Активна — рекламите се блокират</p>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="blockedTotal">0</div>
        <div class="stat-label">Блокирани</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="savedData">0</div>
        <div class="stat-label">Спестени данни</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="savedTime">0</div>
        <div class="stat-label">Спестено време</div>
      </div>
    </div>

    <div class="site-card">
      <span class="site-host" id="siteHost">този сайт</span>
      <label class="mini-switch">
        <span id="allowLabel">Блокиране</span>
        <input type="checkbox" id="allowToggle" checked />
        <span class="slider sm"></span>
      </label>
    </div>

    <div class="actions">
      <button id="pickBtn" class="action-btn">🎯 Скрий елемент</button>
      <button id="settingsBtn" class="action-btn">⚙️ Настройки</button>
    </div>

    <ul class="features">
      <li>YouTube видео реклами (pre/mid-roll)</li>
      <li>Банери, popup-и и native реклами</li>
      <li>Cookie банери и anti-adblock защити</li>
    </ul>
  </main>

  <footer>
    <span>Few-Few v2.2.0</span>
    <span class="dot" id="listDot">филтри</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
