<!DOCTYPE html>
<html lang="en" data-theme="carbon">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="popup.css" />
  <title>The Best ads block</title>
</head>
<body>
  <header>
    <div class="logo">🛡️</div>
    <div class="brand">
      <h1>The Best Ads Block</h1>
      <span class="tagline">Carbon Stealth Edition</span>
    </div>
  </header>

  <main>
    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Protection</span>
        <label class="switch">
          <input type="checkbox" id="toggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <p class="status-text" id="statusText">Active — ads are being blocked</p>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="blockedTotal">0</div>
        <div class="stat-label">Blocked</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="savedData">0</div>
        <div class="stat-label">Data saved</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="savedTime">0</div>
        <div class="stat-label">Time saved</div>
      </div>
    </div>

    <div class="site-card">
      <span class="site-host" id="siteHost">this site</span>
      <label class="mini-switch">
        <span id="allowLabel">Blocking</span>
        <input type="checkbox" id="allowToggle" checked />
        <span class="slider sm"></span>
      </label>
    </div>

    <div class="actions">
      <button id="pickBtn" class="action-btn">🎯 Hide element</button>
      <button id="settingsBtn" class="action-btn">⚙️ Settings</button>
    </div>

    <a class="promo" id="promo" href="https://carbonstealth.eu" target="_blank" rel="noopener">
      <div class="promo-text">
        <strong>Carbon Stealth</strong>
        <span>Sleek tools &amp; gear — visit the site</span>
      </div>
      <span class="promo-go">→</span>
    </a>

    <div class="donate-card">
      <span>Free forever. If it helps you, you can support us 💜</span>
      <a class="donate-btn" id="donate" href="https://revolut.me/vycanismajoris" target="_blank" rel="noopener">Donate via Revolut</a>
    </div>
  </main>

  <footer>
    <span>v3.0.0</span>
    <span class="dot" id="listDot">filters</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
