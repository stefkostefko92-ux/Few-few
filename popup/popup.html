<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">⚔️</span>
    <h1 data-i18n="extName">Tanoth Master Bot</h1>
  </header>

  <div id="no-game" class="banner hidden" data-i18n="popupNoGame">
    Open Tanoth in a tab to control the bot.
  </div>

  <section class="status-card">
    <div class="status-row">
      <span class="dot" id="dot"></span>
      <span id="status-text" data-i18n="uiIdle">Idle</span>
    </div>
    <div class="char" id="char"></div>
  </section>

  <div class="controls">
    <button id="btn-start" class="btn start" data-i18n="uiStart">Start</button>
    <button id="btn-pause" class="btn pause" data-i18n="uiPause">Pause</button>
    <button id="btn-stop" class="btn stop" data-i18n="uiStop">Stop</button>
  </div>

  <section class="stats" id="stats"></section>

  <footer>
    <a id="open-options" data-i18n="uiOptions">Settings</a>
    <a id="show-panel" data-i18n="popupShowPanel">Show panel</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
