# nginx на ХОСТА за Semki Bot (дашбордът). TLS сертификатите се управляват с certbot.
# Приложението слуша на 127.0.0.1:4340 (публикуван порт от docker-compose.yml); при друг HTTP_PORT
# в .env deploy.sh вписва него вместо 4340.
#
# Не се пише на ръка: semki/deploy/deploy.sh слага точно този файл в
# /etc/nginx/sites-available/semki при всеки деплой (nginx -t, после reload), щом има сертификат.
# Сертификатът — веднъж, преди това (DEPLOY.md, т. 3).
#
# Без дневник на заявките и с error_log само за crit: IP адреси не се събират.

# Входът през Discord — таван по адрес още в nginx, преди приложението (то има свой таван):
# 10 заявки в минута с запас 10. Зоната е в паметта на nginx; на диска нищо не се пише.
limit_req_zone $binary_remote_addr zone=semki_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vps2.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://$host$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vps2.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/vps2.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps2.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SemkiSSL:10m;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Формите на дашборда са малки (приложението приема до 20 KB).
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/json image/svg+xml text/plain;

    # CSP, HSTS, X-Frame-Options и Referrer-Policy ги задава приложението (helmet).
    # Не се дублират тук — два източника на един заглавен ред се разминават тихо.

    location /auth/ {
        limit_req zone=semki_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Презаписва, не добавя: клиентът не може да подпъхне свой адрес — от него зависят таваните.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
