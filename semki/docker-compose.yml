# Semki Bot в продукция: база + приложение (ботът, известията и дашбордът в един процес).
#
# TLS и публичният вход са на nginx-а на ХОСТА (Let's Encrypt) — конфигът е
# `deploy/nginx/vps2.carbonstealth.eu.conf` в това репо, не се пише на ръка на сървъра.
#
# Тайните НЕ са тук — идват от `.env` до този файл (mode 600 на сървъра, никога в репото; прави го
# `deploy/setup-env.sh`). Задължителни: POSTGRES_PASSWORD (hex — влиза некодирана в DATABASE_URL) ·
# SESSION_SECRET · PUBLIC_BASE_URL · DISCORD_TOKEN · DISCORD_CLIENT_ID · DISCORD_CLIENT_SECRET ·
# DISCORD_GUILD_ID. По избор: HTTP_PORT (4340), LOG_LEVEL, ALERT_TICK_SECONDS.
# В контейнера влиза само изброеното в `environment:` — нова настройка от `.env` се добавя и там.
name: semki

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Файловата система е само за четене (пише се само в тома и в tmpfs), без Linux capabilities (базата
# пази само нужните ѝ), без придобиване на права, с таван на памет и процеси.
x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  pids_limit: 128

services:
  db:
    # закован по digest (същият като rilievi); обновяване: `docker buildx imagetools inspect postgres:16-alpine`
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /var/run/postgresql:size=4m
      - /tmp:size=32m
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: semki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}
      POSTGRES_DB: semki
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U semki -d semki']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    build:
      context: .
      target: runner
    <<: *hardening
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4340'
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://semki:${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}@db:5432/semki
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?липсва PUBLIC_BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?липсва SESSION_SECRET}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?липсва DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?липсва DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?липсва DISCORD_CLIENT_SECRET}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?липсва DISCORD_GUILD_ID}
      ALERT_TICK_SECONDS: ${ALERT_TICK_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Портът е публикуван през Docker NAT: приложението вижда шлюза на мрежата, не 127.0.0.1.
      # `uniquelocal` вярва само на nginx-а на хоста през тази мрежа; портът е вързан за 127.0.0.1.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
    ports:
      - '127.0.0.1:${HTTP_PORT:-4340}:4340'
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

volumes:
  db-data:
