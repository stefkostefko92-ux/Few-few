# Ловец в продукция: база + приложение. TLS, IP allowlist и публичният вход са в nginx на ХОСТА —
# конфигът е deploy/nginx/lovets.carbonstealth.eu.conf в това репо.
# Тайните идват от `.env` до този файл (mode 600 на сървъра, никога в репото):
# POSTGRES_PASSWORD (hex) · LOVETS_PEPPER · JWT_SECRET · TOTP_KEY · APP_ORIGIN. По избор: HTTP_PORT (4360);
# за черновите на писма — LOVETS_UNSUB_KEY и LOVETS_NOTICE_URL (без тях черновите са изключени).
name: lovets

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /var/run/postgresql:size=4m
      - /tmp:size=64m
    mem_limit: 384m
    cpus: 1
    restart: unless-stopped
    environment:
      POSTGRES_USER: lovets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}
      POSTGRES_DB: lovets
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lovets -d lovets']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    build:
      context: .
      target: runner
    <<: *hardening
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 384m
    cpus: 1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HTTP_PORT: '4360'
      DATABASE_URL: postgresql://lovets:${POSTGRES_PASSWORD:?липсва POSTGRES_PASSWORD}@db:5432/lovets
      LOVETS_PEPPER: ${LOVETS_PEPPER:?липсва LOVETS_PEPPER}
      JWT_SECRET: ${JWT_SECRET:?липсва JWT_SECRET}
      TOTP_KEY: ${TOTP_KEY:?липсва TOTP_KEY}
      APP_ORIGIN: ${APP_ORIGIN:?липсва APP_ORIGIN}
      LOVETS_UNSUB_KEY: ${LOVETS_UNSUB_KEY:-}
      LOVETS_NOTICE_URL: ${LOVETS_NOTICE_URL:-}
      LOVETS_PUBLIC_URL: ${LOVETS_PUBLIC_URL:-}
      LOVETS_RETENTION_MONTHS: ${LOVETS_RETENTION_MONTHS:-}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${HTTP_PORT:-4360}:4360'
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

volumes:
  db-data:
