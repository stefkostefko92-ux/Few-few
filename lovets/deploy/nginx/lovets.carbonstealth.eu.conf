# nginx на ХОСТА за Ловец. Приложението слуша на 127.0.0.1:4360 (docker-compose.yml).
# Достъп само от позволените адреси: /etc/nginx/lovets-allow.conf на сървъра (по образеца
# deploy/nginx/lovets-allow.conf.example) — адресите не влизат в репото.
# Без дневник на заявките; error_log само crit.

map $request_method $lovets_post_limit {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $lovets_post_limit zone=lovets_post:10m rate=30r/m;
# Публичното отписване (/u/<токен>) — по-строг таван за всички методи.
limit_req_zone $binary_remote_addr zone=lovets_unsub:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lovets.carbonstealth.eu;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lovets.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/lovets.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lovets.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LovetsSSL:10m;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    include /etc/nginx/lovets-allow.conf;
    deny all;

    # Вносът на регистрите е до 25 MB (express.json в приложението).
    client_max_body_size 26m;

    # CSP, HSTS, X-Frame-Options, Referrer-Policy и X-Robots-Tag ги задава приложението (helmet).

    # Единственият публичен път: връзката за отписване от писмата (ОРЗД чл. 21). Без вход и без бисквитка
    # (RFC 8058 one-click не носи нито едно); приложението приема само валиден шифрован токен, иначе 404.
    # Регулярният израз е в кавички — съдържа „{“ (изискване на nginx).
    location ~ "^/u/[A-Za-z0-9_.-]{20,600}$" {
        allow all;
        limit_req zone=lovets_unsub burst=5 nodelay;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:4360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        limit_req zone=lovets_post burst=20 nodelay;
        proxy_pass http://127.0.0.1:4360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
