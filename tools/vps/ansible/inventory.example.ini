# Инвентар за ВСЯКО пускане след първото (root по SSH вече е забранен от site.yml).
# Копирай като inventory.ini до този файл и смени SERVER с адреса на сървъра:
#   ansible-playbook -i tools/vps/ansible/inventory.ini tools/vps/ansible/site.yml
# Първото пускане на чист хост е с `-u root` (виж tools/vps/README.md, „IaC (Ansible)").
[vps]
SERVER

[vps:vars]
ansible_user=deploy
ansible_become=true
# При много ключове в агента: MaxAuthTries 3 на сървъра → подай точния ключ.
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
