# site.yml — декларативна основа на VPS-а (Ubuntu 24.04 LTS). Прави хоста rebuildable, не „snowflake".
#
# Пускане (подробно — tools/vps/README.md, „IaC (Ansible)"):
#   ПЪРВИ ПЪТ (чист хост, влиза се само като root):
#     SSH_PUBKEY="$(cat ~/.ssh/id_ed25519.pub)" ansible-playbook -i 'SERVER,' -u root tools/vps/ansible/site.yml
#   ОТТУК НАТАТЪК (root по SSH вече е забранен):
#     ansible-playbook -i tools/vps/ansible/inventory.ini tools/vps/ansible/site.yml   # ansible_user=deploy + become
#
# Ред, който не заключва достъпа: deploy + ключ + sudo → ПРОБА от контролната машина („deploy влиза с
# ключ и има sudo") → всичко останало → накрая SSH втвърдяването, с `sshd -t` и втора проба след рестарта;
# провал → старият конфиг се връща и sshd се рестартира пак (rescue). Отворената сесия на Ansible
# (ControlPersist) оцелява при рестарта на sshd.
#
# Изисква колекциите community.general (ufw) и ansible.posix (authorized_key):
#   ansible-galaxy collection install community.general ansible.posix
- hosts: all
  become: true
  vars:
    deploy_user: deploy
    ssh_pubkey: "{{ lookup('env', 'SSH_PUBKEY') }}"   # подай през env, не в репото
    # Кой може да влиза по SSH. Добавиш ли човек — добави го тук, иначе AllowUsers го спира.
    ssh_allow_users: ["{{ deploy_user }}"]
    # Твоят статичен IP (по избор, през env): fail2ban никога не го баннва — предпазва от самозаключване.
    fail2ban_ignoreip: "{{ lookup('env', 'F2B_IGNOREIP') }}"
    # Часовата зона на хоста. UTC, за да няма „местно" време, което се мести с лятното часово време:
    # таймерите с „UTC" в OnCalendar и тези без зона (Nexus 03:30, supreme-restore-drill Sun 04:30,
    # cron редовете на vizitka/panev/zabobovdol) тогава се четат в един и същ часовник.
    host_timezone: Etc/UTC
    # Час за автоматичен рестарт след ъпдейт на ядро/libc — в UTC (виж host_timezone). 01:30 е ПРЕДИ
    # всички нощни задачи: бекъпите 02:30–03:40 UTC (korpora 02:30, openseo 02:45, supreme 03:00,
    # rilievi 03:10, vizitka 03:25, panev 03:15, Nexus 03:30 + до 10 мин), репетицията supreme в
    # неделя 04:30–04:45 + времето ѝ; и след zabobovdol (00:00). Застъпване няма; 01:30 UTC е
    # 03:30/04:30 в София и 02:30/03:30 в Рим — най-тихият час за сайтовете.
    unattended_reboot_time: "01:30"
    # Официалният ключ за подписване на Docker apt хранилището (docs.docker.com/engine/install/ubuntu).
    # Свален ключ с друг отпечатък = спиране, не инсталация.
    docker_gpg_fingerprint: "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
    # След колко секунди systemd връща стария SSH конфиг, ако втората проба не го отмени.
    ssh_deadman_seconds: 300
  tasks:
    - name: Ключ за deploy — подаден или вече на хоста (иначе спирам ПРЕДИ каквато и да е промяна)
      ansible.builtin.stat:
        path: "/home/{{ deploy_user }}/.ssh/authorized_keys"
      register: deploy_keys_before
    - name: Без ключ за deploy няма как да се забрани root — спирам
      ansible.builtin.assert:
        that:
          - (ssh_pubkey | length > 0) or (deploy_keys_before.stat.exists and deploy_keys_before.stat.size > 0)
        fail_msg: "Задай SSH_PUBKEY (публичния ключ на deploy) — иначе след втвърдяването никой не може да влезе."

    - name: Базови пакети
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - python3-systemd          # backend = systemd за [sshd] в fail2ban
          - unattended-upgrades
          - update-notifier-common   # без него Automatic-Reboot нито рестартира, нито уведомява
          - auditd
          - restic
          - curl
          - unzip
          - ca-certificates
          - gnupg                    # проверката на отпечатъка на Docker ключа
        update_cache: true
        state: present

    # ── 1) deploy: потребител, ключ, sudo ─────────────────────────────────────────────────────────
    - name: Потребител deploy (без парола — вход само с ключ)
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: sudo
        append: true
        shell: /bin/bash
    - name: Authorized key за deploy
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ ssh_pubkey }}"
      when: ssh_pubkey | length > 0
    # deploy няма парола, затова --become иска NOPASSWD. Входът в deploy е само с ключ, тоест
    # ключът е и правото за root — пази го (ed25519, по възможност FIDO2 ed25519-sk).
    - name: sudo за deploy (visudo проверява файла преди запис)
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ deploy_user }}"
        content: "{{ deploy_user }} ALL=(ALL:ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    # ControlPath=none/ControlMaster=no: мултиплексиран сокет от ~/.ssh/config би минал по стара
    # връзка — пробата трябва да е НОВ вход (нов ключ/sshd конфиг), иначе нищо не доказва.
    - name: ПРОБА — deploy влиза с ключ от тази машина и има sudo (иначе root не се забранява)
      ansible.builtin.command: >-
        ssh -o BatchMode=yes -o ConnectTimeout=15 -o ControlPath=none -o ControlMaster=no -p {{ ansible_port | default(22) }}
        {{ ('-i ' + ansible_ssh_private_key_file) if ansible_ssh_private_key_file is defined else '' }}
        {{ deploy_user }}@{{ ansible_host | default(inventory_hostname) }} sudo -n true
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false   # само чете — върви и при --check

    # ── 2) fail2ban: бързи локални банове за SSH + повторни нарушители ─────────────────────────────
    - name: fail2ban jail.local — [sshd] от журнала и [recidive]
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
        content: |
          # Управлява се от tools/vps/ansible/site.yml — ръчни промени се презаписват.
          [DEFAULT]
          ignoreip = 127.0.0.1/8 ::1 {{ fail2ban_ignoreip }}
          bantime  = 1h
          findtime = 10m
          maxretry = 5

          [sshd]
          enabled  = true
          backend  = systemd
          port     = ssh
          maxretry = 4

          # Повторни нарушители: 5 бана за ден → седмица бан на ВСИЧКИ портове.
          # Чете собствения лог на fail2ban, затова backend е файлов, не systemd.
          [recidive]
          enabled   = true
          backend   = auto
          logpath   = /var/log/fail2ban.log
          banaction = %(banaction_allports)s
          bantime   = 1w
          findtime  = 1d
          maxretry  = 5
      register: f2b_conf
      notify: restart fail2ban   # handler-ът тръгва чак след проверката долу (провал спира play-я)
    - name: fail2ban — проверка на конфигурацията преди рестарт
      ansible.builtin.command: fail2ban-client -t
      changed_when: false
      when: f2b_conf.changed
    - name: fail2ban включен
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

    # ── 3) ufw: SSH с таван на новите връзки, HTTP(S) ─────────────────────────────────────────────
    # Редът е важен: първо `limit` за 22, после махаме старото `allow` (иначе то печели като по-ранно
    # правило и таванът не важи). Нито за миг няма момент без правило за SSH.
    # Внимание: Docker публикува портове през DNAT ПРЕДИ ufw — затова приложенията се връзват на 127.0.0.1.
    - name: UFW — SSH с limit (6 нови връзки за 30 s от един адрес)
      community.general.ufw:
        rule: limit
        port: "22"
        proto: tcp
    - name: UFW — махни старото allow за 22 (вече е limit)
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        delete: true
    - name: UFW — HTTP(S)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["80", "443"]
    - name: UFW deny incoming by default + enable
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # ── 4) Автоматични security ъпдейти + рестарт, когато ядрото го иска ──────────────────────────
    # Първо зоната: часът на рестарта и таймерите без зона се четат в нея (timedatectl set-timezone).
    - name: Часова зона {{ host_timezone }}
      community.general.timezone:
        name: "{{ host_timezone }}"
      notify: restart cron   # crond кешира зоната при старт (препоръка в документацията на модула)
    - name: unattended-upgrades — периодичност
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
    # 52- се чете след 50unattended-upgrades → тези стойности печелят. Провери: apt-config dump | grep Reboot
    # Лог: /var/log/unattended-upgrades/unattended-upgrades.log (виж README — следене).
    - name: unattended-upgrades — автоматичен рестарт в {{ unattended_reboot_time }} ({{ host_timezone }})
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        owner: root
        group: root
        mode: "0644"
        content: |
          // Управлява се от tools/vps/ansible/site.yml.
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "{{ unattended_reboot_time }}";

    # ── 5) Docker от официалното apt хранилище, ключът — проверен по отпечатък ───────────────────
    - name: Архитектура за apt
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false
      check_mode: false   # само чете — иначе при --check docker.sources няма архитектура
    - name: Папка за ключовете на apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
    - name: Docker GPG ключ
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
    # При --check get_url не сваля нищо: на чист хост файлът го няма и проверката се прескача
    # (истинският пробег я прави винаги).
    - name: Ключът на диска ли е
      ansible.builtin.stat:
        path: /etc/apt/keyrings/docker.asc
      register: docker_key_file
    - name: Отпечатък на сваления ключ
      ansible.builtin.command: gpg --show-keys --with-colons --with-fingerprint /etc/apt/keyrings/docker.asc
      register: docker_key
      changed_when: false
      check_mode: false   # само чете
      when: not ansible_check_mode or docker_key_file.stat.exists
    # Точно ЕДИН първичен ключ (`pub:`) и отпечатъкът е НЕГОВИЯТ — редът `fpr:` веднага след `pub:`.
    # Иначе файл с официалния ключ + още един (или с отпечатъка само като подключ) би минал, а apt
    # приема подпис от всеки ключ във файла от Signed-By.
    - name: Ключът трябва да е официалният на Docker и сам — иначе спирам
      ansible.builtin.assert:
        that:
          - docker_key_pub | length == 1
          - docker_key.stdout_lines[docker_key.stdout_lines.index(docker_key_pub[0]) + 1] == "fpr:::::::::" + docker_gpg_fingerprint + ":"
        fail_msg: >-
          Docker GPG ключът НЕ е точно един първичен ключ с отпечатък {{ docker_gpg_fingerprint }}
          (намерени pub: {{ docker_key_pub | length }}) — спирам.
      vars:
        docker_key_pub: "{{ docker_key.stdout_lines | select('match', '^pub:') | list }}"
      when: docker_key is not skipped
    # get.docker.com пишеше същото хранилище като docker.list; два файла за един източник = предупреждения.
    - name: Махни стария docker.list от get.docker.com (същото хранилище)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent
    - name: Docker apt хранилище (deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: {{ dpkg_arch.stdout }}
          Signed-By: /etc/apt/keyrings/docker.asc
    - name: Docker Engine + Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true
        state: present

    # ── 5b) Логове с таван: Docker json-file и journald ──────────────────────────────────────────
    # json-file по подразбиране НЕ ротира → логовете на контейнерите пълнят диска. Сливаме с
    # досегашния daemon.json (ако има други настройки — остават), проверяваме с `dockerd --validate`
    # и рестартираме Docker САМО при промяна. Таванът важи за НОВОсъздадени контейнери: старите
    # го поемат при следващото пресъздаване (деплой / `docker compose up -d --force-recreate`).
    # Рестартът на Docker спира и пуска всички контейнери (restart: unless-stopped ги връща) —
    # първото пускане с тази промяна е кратко прекъсване на всички Compose продукти.
    - name: daemon.json — има ли досегашен
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: docker_daemon_json
    - name: daemon.json — досегашното съдържание
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_json_raw
      when: docker_daemon_json.stat.exists
    - name: daemon.json — log-driver json-file с max-size/max-file
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        validate: /usr/bin/dockerd --validate --config-file=%s
        content: "{{ (docker_daemon_json_current | combine(docker_log_config, recursive=true)) | to_nice_json(indent=2) }}\n"
      vars:
        docker_daemon_json_current: "{{ (docker_daemon_json_raw.content | b64decode | from_json) if docker_daemon_json.stat.exists else {} }}"
        # log-opts са низове — число дава грешка при старта на dockerd.
        docker_log_config:
          log-driver: json-file
          log-opts:
            max-size: "10m"
            max-file: "3"
      notify: restart docker
    - name: journald — папка за drop-in
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: journald — таван на журнала на диска
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/50-few-few.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Управлява се от tools/vps/ansible/site.yml.
          [Journal]
          SystemMaxUse=500M
      notify: restart journald

    # ── 6) auditd: кой пипна входовете (SSH, sudo, ключове, cron, unit-и) ─────────────────────────
    # Без `-e 2` (immutable), за да може playbook-ът да сменя правилата без рестарт на хоста.
    # Търсене: ausearch -k sshd_config -i   ·   aureport -k
    - name: auditd правила
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/50-few-few.rules
        owner: root
        group: root
        mode: "0640"
        content: |
          # Управлява се от tools/vps/ansible/site.yml.
          -w /etc/ssh/ -p wa -k sshd_config
          -w /etc/sudoers -p wa -k sudoers
          -w /etc/sudoers.d/ -p wa -k sudoers
          -w /root/.ssh/ -p wa -k authorized_keys
          {% for u in ssh_allow_users %}
          -w /home/{{ u }}/.ssh/ -p wa -k authorized_keys
          {% endfor %}
          -w /etc/crontab -p wa -k cron
          -w /etc/cron.d/ -p wa -k cron
          -w /etc/cron.hourly/ -p wa -k cron
          -w /etc/cron.daily/ -p wa -k cron
          -w /etc/cron.weekly/ -p wa -k cron
          -w /etc/cron.monthly/ -p wa -k cron
          -w /var/spool/cron/ -p wa -k cron
          -w /etc/systemd/system/ -p wa -k systemd_units
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
      notify: load audit rules
    - name: auditd включен
      ansible.builtin.service:
        name: auditd
        enabled: true
        state: started

    # Другите handler-и (fail2ban, auditd, docker, journald) — преди SSH втвърдяването, докато всичко
    # е по старому.
    - name: Изпълни чакащите handler-и
      ansible.builtin.meta: flush_handlers

    # ── 7) SSH втвърдяване — ПОСЛЕДНО, с проверка и връщане назад ─────────────────────────────────
    # Ubuntu 24.04 пуска sshd през ssh.socket: /run/sshd може да липсва, докато няма връзка, и тогава
    # `sshd -t` пада с „Missing privilege separation directory" — създаваме я.
    - name: /run/sshd за проверката
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: SSH втвърдяване с проверка и връщане назад
      block:
        # Името 10-… е нарочно: Include на sshd_config.d е най-отгоре в sshd_config и ПЪРВАТА прочетена
        # стойност печели — 10- е преди 50-cloud-init.conf (който може да върне PasswordAuthentication yes).
        # PerSourcePenalties НЕ е тук: OpenSSH 9.6 в Ubuntu 24.04 не го познава (sshd -t би паднал).
        - name: sshd drop-in 10-hardening.conf (validate — самият файл като конфиг)
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/10-hardening.conf
            owner: root
            group: root
            mode: "0644"
            backup: true
            validate: /usr/sbin/sshd -t -f %s
            content: |
              # Управлява се от tools/vps/ansible/site.yml — ръчни промени се презаписват.
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              PubkeyAuthentication yes
              AuthenticationMethods publickey
              PermitRootLogin no
              AllowUsers {{ ssh_allow_users | join(' ') }}
              MaxAuthTries 3
              LoginGraceTime 30
              LogLevel VERBOSE
              ClientAliveInterval 300
              ClientAliveCountMax 2
          register: sshd_conf
        - name: sshd -t — целият конфиг (с всички drop-in-и) е валиден
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false
          check_mode: false   # само чете
        # DEAD-MAN SWITCH: rescue долу помага само докато Ansible още има връзка. Ако връзката падне
        # след рестарта (мрежа, лаптоп, Ctrl-C), никой не връща стария конфиг. Затова ПРЕДИ рестарта
        # systemd сам насрочва връщането след {{ ssh_deadman_seconds }} s; успешната втора проба го отменя.
        - name: Dead-man — изчисти остатък от предишен пробег
          ansible.builtin.shell: >-
            systemctl stop ssh-deadman.timer ssh-deadman.service 2>/dev/null;
            systemctl reset-failed ssh-deadman.timer ssh-deadman.service 2>/dev/null; true
          changed_when: false
          when: sshd_conf.changed
        - name: Dead-man — насрочи връщане на стария drop-in + рестарт на ssh
          ansible.builtin.command:
            argv:
              - systemd-run
              - --unit=ssh-deadman
              - --description=Връщане на SSH втвърдяването, ако site.yml не потвърди входа
              - --on-active={{ ssh_deadman_seconds }}
              - --timer-property=AccuracySec=1s
              - /bin/sh
              - -c
              - "{{ deadman_restore }}; systemctl restart ssh"
          vars:
            sshd_dropin: /etc/ssh/sshd_config.d/10-hardening.conf
            # Имаше предишен файл → връщам копието от `backup: true`; нямаше → махам новия.
            deadman_restore: "{{ ('cp -p -- ' + (sshd_conf.backup_file | quote) + ' ' + sshd_dropin) if sshd_conf.backup_file is defined else ('rm -f -- ' + sshd_dropin) }}"
          when: sshd_conf.changed
        - name: Рестарт на ssh само след успешна проверка
          ansible.builtin.service:
            name: ssh
            state: restarted
          when: sshd_conf.changed
        - name: ВТОРА ПРОБА — нова връзка като deploy с новия конфиг + sudo
          ansible.builtin.command: >-
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o ControlPath=none -o ControlMaster=no -p {{ ansible_port | default(22) }}
            {{ ('-i ' + ansible_ssh_private_key_file) if ansible_ssh_private_key_file is defined else '' }}
            {{ deploy_user }}@{{ ansible_host | default(inventory_hostname) }} sudo -n true
          delegate_to: localhost
          become: false
          changed_when: false
          check_mode: false   # само чете
        # Провал тук води в rescue → връщане + ясна грешка: по-добре еднозначно „върнато", отколкото
        # „успех", след който systemd тихо връща стария конфиг. (Пробата отнема секунди, таймерът — минути.)
        - name: Dead-man — входът е потвърден, отменям връщането
          ansible.builtin.command: systemctl stop ssh-deadman.timer
          when: sshd_conf.changed
      # При провал rescue връща веднага; насроченото връщане остава като резерва (прави същото —
      # ако rescue не стигне до хоста, то пак връща стария конфиг до {{ ssh_deadman_seconds }} s).
      rescue:
        - name: ВРЪЩАНЕ — предишният 10-hardening.conf
          ansible.builtin.copy:
            src: "{{ sshd_conf.backup_file }}"
            dest: /etc/ssh/sshd_config.d/10-hardening.conf
            remote_src: true
            mode: "0644"
          when: sshd_conf.backup_file is defined
        - name: ВРЪЩАНЕ — нямаше предишен файл, махам новия
          ansible.builtin.file:
            path: /etc/ssh/sshd_config.d/10-hardening.conf
            state: absent
          when: sshd_conf.backup_file is not defined and (sshd_conf.changed | default(false))
        - name: ВРЪЩАНЕ — рестарт на ssh със стария конфиг
          ansible.builtin.service:
            name: ssh
            state: restarted
        # Старият конфиг вече е върнат — насроченото връщане е излишно. Без грешка, ако таймерът го няма.
        - name: ВРЪЩАНЕ — спирам dead-man таймера
          ansible.builtin.shell: systemctl stop ssh-deadman.timer 2>/dev/null; true
          changed_when: false
        - name: Спирам с ясна грешка
          ansible.builtin.fail:
            msg: >-
              SSH втвърдяването е ВЪРНАТО: sshd -t или пробата като {{ deploy_user }} се провали.
              Провери ключа (ssh -v {{ deploy_user }}@сървъра; MaxAuthTries 3 — при много ключове в агента
              ползвай IdentitiesOnly=yes) и пусни пак.

  handlers:
    - name: restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
    - name: load audit rules
      ansible.builtin.command: augenrules --load
    - name: restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
    - name: restart cron
      ansible.builtin.service:
        name: cron
        state: restarted
    - name: restart journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted
