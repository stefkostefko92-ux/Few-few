# Лек мониторинг за един VPS (VPS-аджията v2.0) — Beszel (метрики) + Uptime Kuma
# (външни health probe-и + алерти). 50× по-леко от Prometheus+Grafana+Loki за 2 апа.
#   docker compose -f docker-compose.monitoring.yml up -d
services:
  beszel:
    # Заковано: таг + digest (Docker Hub henrygd/beszel, 0.21.2 от 2026-11-12). Без :latest —
    # иначе `pull` тихо сменя версията. Обновяване: нов таг + digest от официалния release,
    # сървър и агент ЗАЕДНО (една и съща версия).
    image: henrygd/beszel:0.21.2@sha256:b0be90bd4aee2993fde763032a5098ce4386fba43cfe5031ec017b8d9e8c97a2
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8090"]   # зад reverse proxy; не публично
    volumes: ["./beszel_data:/beszel_data"]

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2@sha256:343254226ae57a5cc6f8c23c755b1464730aba2abc7043116a2e222711ec6e1a
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "45876"
      KEY: "${BESZEL_KEY:?виж Beszel UI за публичния ключ}"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3001"]   # зад reverse proxy
    volumes: ["./kuma_data:/app/data"]
# Алерти: Uptime Kuma → Telegram/имейл при HTTP != 200 на
#   https://zabobovdol.carbonstealth.eu/ и https://medqr.carbonstealth.eu/
# Linketto: монитор „HTTP(s) - Keyword“ към https://piuma.carbonstealth.eu/api/health с ключова дума
#   "app":"linketto" (200 без маркера = чужд процес на порта). Kuma е на СЪЩИЯ хост — затова
#   външната проба е отделно: .github/workflows/linketto-health.yml → probe-health.sh (тук).
# Тайните (BESZEL_KEY, токени) идват от .env с mode 600, не от репото.
