<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tanoth Master Bot — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="wrap">
    <aside>
      <div class="brand"><span>⚔️</span><b data-i18n="extName">Tanoth Master Bot</b></div>
      <nav id="nav"></nav>
      <div class="aside-actions">
        <button id="save" class="primary" data-i18n="optSave">Save</button>
        <button id="reset" data-i18n="optReset">Reset to defaults</button>
        <button id="reset-stats" data-i18n="optResetStats">Reset statistics</button>
      </div>
      <p class="hint" id="saved-hint"></p>
    </aside>
    <main>
      <section id="sub" class="sub-card">
        <div class="sub-head">
          <h2 data-i18n="subTitle">Subscription</h2>
        </div>
        <div class="sub-status" id="sub-status"></div>
        <div class="sub-plans">
          <button class="btn-pay" id="sub-pay-monthly">€<span id="sub-price-m">4</span> / <span data-i18n="uiMonth">month</span></button>
          <button class="btn-pay alt" id="sub-pay-lifetime">€<span id="sub-price-l">20</span> <span data-i18n="uiLifetime">lifetime</span></button>
        </div>
        <div class="sub-row" style="margin-top:14px">
          <input id="sub-key" type="text" data-i18n-ph="uiKeyPlaceholder" placeholder="License key">
          <button id="sub-activate" data-i18n="uiActivate">Activate</button>
        </div>
        <div class="sub-msg" id="sub-msg"></div>
        <p class="sub-note"></p>
      </section>

      <section class="tools-card">
        <h2 data-i18n="toolsTitle">Tools</h2>
        <div class="tool-row">
          <span class="tool-label" data-i18n="toolPreset">Apply preset</span>
          <select id="preset-select"></select>
          <button id="preset-apply" data-i18n="toolApply">Apply</button>
        </div>
        <div class="tool-row">
          <span class="tool-label" data-i18n="toolBackup">Backup</span>
          <button id="export-btn" data-i18n="toolExport">Export settings</button>
          <button id="import-btn" data-i18n="toolImport">Import settings</button>
          <input id="import-file" type="file" accept="application/json" style="display:none">
        </div>
        <div class="tool-row">
          <span class="tool-label" data-i18n="toolProfiles">Profiles</span>
          <input id="profile-name" type="text" data-i18n-ph="toolProfileName" placeholder="Profile name">
          <button id="profile-save" data-i18n="toolSave">Save</button>
          <select id="profile-select"></select>
          <button id="profile-load" data-i18n="toolLoad">Load</button>
          <button id="profile-delete" data-i18n="toolDelete">Delete</button>
        </div>
        <div class="tool-row">
          <span class="tool-label" data-i18n="toolNotify">Notifications</span>
          <button id="notify-test" data-i18n="toolTestNotify">Send test notification</button>
          <a id="open-stats" class="tool-link" data-i18n="toolStats">Open statistics ↗</a>
        </div>
        <div class="tool-msg" id="tool-msg"></div>
      </section>

      <div id="form"></div>
    </main>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
