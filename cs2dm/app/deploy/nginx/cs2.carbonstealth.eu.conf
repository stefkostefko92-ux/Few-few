# nginx на ХОСТА за сайта на cs2dm. TLS сертификатите се управляват с certbot (Let's Encrypt).
# Приложението слуша на 127.0.0.1:4350 (HTTP_PORT от /etc/cs2/app.env; 4330 и 4340 на VPS-а са заети).
#
# Инсталация (веднъж, от release-а — не се пише на ръка):
#   sudo certbot certonly --nginx -d cs2.carbonstealth.eu
#   sudo cp cs2dm/app/deploy/nginx/cs2.carbonstealth.eu.conf /etc/nginx/sites-available/cs2dm.conf
#   sudo ln -sfn /etc/nginx/sites-available/cs2dm.conf /etc/nginx/sites-enabled/cs2dm.conf   # с .conf, като другите сайтове на VPS-а
#   sudo nginx -t && sudo systemctl reload nginx
#
# Без дневник на заявките и с error_log само за crit: политиката за поверителност обещава, че
# посещението на сайта не оставя IP адрес в дневниците (приложението също не го логва).

server {
    listen 80;
    listen [::]:80;
    server_name cs2.carbonstealth.eu;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location / { return 308 https://$host$request_uri; }
}

server {
    # Старият синтаксис (listen … http2) работи и на nginx < 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cs2.carbonstealth.eu;

    ssl_certificate     /etc/letsencrypt/live/cs2.carbonstealth.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cs2.carbonstealth.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # За TLS 1.2 само AEAD с ECDHE (Mozilla intermediate); TLS 1.3 не се влияе от ssl_ciphers.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CS2DM:10m;
    ssl_session_tickets off;
    # Без OCSP stapling: Let's Encrypt спря OCSP (08.2025) — `ssl_stapling on` дава само предупреждение.

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Сайтът на етап 1 няма форми — тялото на заявка е празно; таванът е само предпазител.
    client_max_body_size 64k;

    # HSTS се задава ТУК, не в приложението (helmet го е изключил): един източник на заглавието,
    # и то стига и до страниците за грешка, които прави самият nginx (502/503/504).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # CSP, X-Frame-Options, Referrer-Policy и Permissions-Policy ги задава приложението (helmet,
    # nonce на заявка). Не се дублират тук — два източника на едно заглавие се разминават тихо.

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json application/xml
               image/svg+xml text/plain text/xml;

    location = /health {
        proxy_pass http://127.0.0.1:4350;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:4350;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Презаписва, не добавя: клиентът не може да подпъхне свой адрес — от него зависи
        # ограничението на заявките.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
