# cs2dm — заковани модове. Формат (разделител TAB): име  версия  URL  sha256  метод
# Всеки архив се проверява по sha256 преди разархивиране (fail closed). Нова версия = нов ред с
# нов хеш, сметнат на ръка върху свален файл, и PR. Методи: tar/zip — архивът е с addons/ и се
# разархивира в game/csgo/; cssplugin — zip с папката на плъгина в корена → addons/counterstrikesharp/plugins/.
# multiaddonmanager се слага само при Workshop addon-и (CS2_WORKSHOP_ADDONS и/или звуците на quakesounds).
# Всеки мод без първите три се изключва с CS2DM_SKIP_MODS (виж cs2.env.example и README.md).
