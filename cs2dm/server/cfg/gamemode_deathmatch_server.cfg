// cs2dm — нашите настройки върху ваниловия Deathmatch (gamemode_deathmatch.cfg на Valve).
//
// Изпълнява се при ВСЯКО зареждане на картата: gamemodes.txt → "exec" → gamemode_deathmatch.cfg,
// после този файл. Файлът НЕ е в депото на играта, затова ъпдейтите не го презаписват; server.cfg
// е в депото — не го пипаме. update.sh все пак го слага наново след всеки ъпдейт.
//
// Червена линия (правилата на Valve за GSLT): нищо, което симулира предмети или рангове.
// Тайни (GSLT, пароли) НИКОГА тук — само в /etc/cs2/cs2.env.

hostname "CarbonStealth.eu | Dust2 DM"
sv_tags "deathmatch,dm,dust2,ffa,eu,bg"
sv_lan 0
sv_cheats 0

// Празен сървър „заспива“ — пести CPU на споделения VPS. Има съобщения за крашове с hibernation;
// systemd го вдига наново (Restart=on-failure). При проблем: 0.
sv_hibernate_when_empty 1

// Deathmatch — FFA е ваниля (mp_teammates_are_enemies 1). С модовете DM плъгинът поема
// времето (Game Length 30) и защитата при спаун; тези стойности важат за ванилов режим.
mp_timelimit 30
mp_respawn_immunitytime 5

// Край на мача (на 30 мин) = истинско презареждане на картата: changelevel дори към същата карта
// (иначе само рестарт на мача), 10 s таблица вместо 25, без гласуване (групата е само de_dust2).
// Играчите остават свързани; плъгинът CarbonStealth предупреждава 60 и 10 s преди.
mp_match_end_changelevel 1
mp_match_restart_delay 10
mp_endmatch_votenextmap 0

// Ботове: попълват до 10 участници, излизат при реални играчи; не влизат, докато няма човек.
bot_quota 10
bot_quota_mode fill
bot_difficulty 2
bot_join_after_player 1

// A2S заявки — вградените лимити (ваниля), изрично за яснота.
sv_max_queries_sec 3
sv_max_queries_sec_global 60
sv_max_queries_window 30
