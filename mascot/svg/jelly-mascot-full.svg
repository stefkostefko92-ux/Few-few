<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jm-title jm-desc">
  <title id="jm-title">Желирано маскотче с очила и академична шапка</title>
  <desc id="jm-desc">Полупрозрачно неоново-зелено желирано телце с вътрешни мехурчета, дебели черни кръгли очила, папийонка и черна академична шапка със златен пискюл.</desc>

  <defs>
    <!-- Тяло: ключова светлина горе-вляво → дълбока сянка долу-вдясно (подповърхностно разсейване). -->
    <radialGradient id="jm-body" cx="36%" cy="26%" r="84%">
      <stop offset="0%" stop-color="var(--jm-pale, #C8DDA6)"/>
      <stop offset="18%" stop-color="var(--jm-olive, #99E72A)"/>
      <stop offset="55%" stop-color="var(--jm-neon, #5AB60D)"/>
      <stop offset="88%" stop-color="var(--jm-bottle, #297F04)"/>
      <stop offset="100%" stop-color="var(--jm-deep, #0D4A02)"/>
    </radialGradient>

    <!-- Вътрешна емисия — най-силна в долната половина („свети отвътре", не отгоре). -->
    <radialGradient id="jm-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--jm-olive, #99E72A)" stop-opacity="1"/>
      <stop offset="45%" stop-color="var(--jm-olive, #99E72A)" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="var(--jm-neon, #5AB60D)" stop-opacity="0"/>
    </radialGradient>

    <!-- Подсветка под тялото (underglow) — лежи на пода зад силуета. -->
    <radialGradient id="jm-underglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--jm-neon, #5AB60D)" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="var(--jm-neon, #5AB60D)" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light: нула отгоре-вляво, ярък кант долу-вдясно. -->
    <linearGradient id="jm-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--jm-pale, #C8DDA6)" stop-opacity="0"/>
      <stop offset="0.45" stop-color="var(--jm-pale, #C8DDA6)" stop-opacity="0.05"/>
      <stop offset="1" stop-color="var(--jm-pale, #C8DDA6)" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Горна дъга на шапката: плоскостта хваща светлина отляво. -->
    <linearGradient id="jm-board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--jm-ink-soft, #2A2E24)"/>
      <stop offset="1" stop-color="var(--jm-ink, #0A0C0A)"/>
    </linearGradient>

    <linearGradient id="jm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--jm-gold-light, #F2D479)"/>
      <stop offset="1" stop-color="var(--jm-gold, #D9A521)"/>
    </linearGradient>

    <!-- Мек преход, за да не оставя долният кант хоризонтален шев по тялото. -->
    <linearGradient id="jm-bottom-fade" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0.45" stop-color="#000000"/>
      <stop offset="0.85" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="jm-bottom">
      <rect x="0" y="0" width="512" height="512" fill="url(#jm-bottom-fade)"/>
    </mask>

    <clipPath id="jm-clip">
      <path d="M256 148C346 148 406 212 406 294C406 362 372 412 322 436C302 446 280 452 256 452C232 452 210 446 190 436C140 412 106 362 106 294C106 212 166 148 256 148Z"/>
    </clipPath>

    <filter id="jm-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="jm-soft-s" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <g class="jm-root">
    <!-- 1. Подсветка (зад всичко). -->
    <ellipse class="jm-glow" cx="256" cy="452" rx="176" ry="44" fill="url(#jm-underglow)" filter="url(#jm-soft)"/>
    <path class="jm-bloom" d="M256 148C346 148 406 212 406 294C406 362 372 412 322 436C302 446 280 452 256 452C232 452 210 446 190 436C140 412 106 362 106 294C106 212 166 148 256 148Z" fill="var(--jm-neon, #5AB60D)" opacity="0.45" filter="url(#jm-soft)"/>

    <!-- 2. Ръчички — зад тялото, за да „излизат" от него. -->
    <g class="jm-arms" stroke="url(#jm-body)" stroke-width="36" stroke-linecap="round" fill="none">
      <path d="M138 356C114 368 98 384 90 400"/>
      <path d="M374 356C398 368 414 384 422 400"/>
    </g>

    <!-- 3. Тяло. -->
    <path class="jm-body" d="M256 148C346 148 406 212 406 294C406 362 372 412 322 436C302 446 280 452 256 452C232 452 210 446 190 436C140 412 106 362 106 294C106 212 166 148 256 148Z" fill="url(#jm-body)"/>

    <!-- 4. Вътрешност — светещо ядро, мехурчета, специалитет. Всичко изрязано по силуета. -->
    <g clip-path="url(#jm-clip)">
      <!-- Вътрешна сянка по ръба: желето е плътно по контура и светло в средата — това,
           а не бликът отгоре, е което разчита окото като „полупрозрачно". -->
      <path d="M256 148C346 148 406 212 406 294C406 362 372 412 322 436C302 446 280 452 256 452C232 452 210 446 190 436C140 412 106 362 106 294C106 212 166 148 256 148Z" fill="none" stroke="var(--jm-deep, #0D4A02)" stroke-width="46" opacity="0.55" filter="url(#jm-soft-s)"/>
      <ellipse class="jm-core" cx="256" cy="382" rx="150" ry="118" fill="url(#jm-core)"/>

      <!-- Сянка от шапката върху темето. -->
      <ellipse cx="256" cy="152" rx="96" ry="26" fill="var(--jm-deep, #0D4A02)" opacity="0.55" filter="url(#jm-soft-s)"/>

      <!-- Мехурчета: неравномерни, по-нагъсто в долната половина. -->
      <g class="jm-bubbles">
        <circle cx="176" cy="332" r="9" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="176" cy="332" r="9" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="2.0" opacity="0.55"/>
        <circle cx="172.9" cy="328.6" r="2.3" fill="var(--jm-white, #FFFFFF)" opacity="0.75"/>
        <circle cx="212" cy="392" r="6" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="212" cy="392" r="6" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.3" opacity="0.55"/>
        <circle cx="210.0" cy="389.7" r="1.6" fill="var(--jm-white, #FFFFFF)" opacity="0.75"/>
        <circle cx="158" cy="392" r="4" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="158" cy="392" r="4" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.1" opacity="0.55"/>
        <circle cx="242" cy="424" r="11" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="242" cy="424" r="11" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="2.4" opacity="0.55"/>
        <circle cx="238.3" cy="419.8" r="2.9" fill="var(--jm-white, #FFFFFF)" opacity="0.75"/>
        <circle cx="296" cy="404" r="7" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="296" cy="404" r="7" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.5" opacity="0.55"/>
        <circle cx="293.6" cy="401.3" r="1.8" fill="var(--jm-white, #FFFFFF)" opacity="0.75"/>
        <circle cx="332" cy="356" r="10" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="332" cy="356" r="10" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="2.2" opacity="0.55"/>
        <circle cx="328.6" cy="352.2" r="2.6" fill="var(--jm-white, #FFFFFF)" opacity="0.75"/>
        <circle cx="352" cy="410" r="5" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="352" cy="410" r="5" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.1" opacity="0.55"/>
        <circle cx="350.3" cy="408.1" r="1.3" fill="var(--jm-white, #FFFFFF)" opacity="0.75"/>
        <circle cx="196" cy="356" r="3.5" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="196" cy="356" r="3.5" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.1" opacity="0.55"/>
        <circle cx="276" cy="352" r="4.5" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="276" cy="352" r="4.5" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.1" opacity="0.55"/>
        <circle cx="320" cy="300" r="6" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="320" cy="300" r="6" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.3" opacity="0.55"/>
        <circle cx="318.0" cy="297.7" r="1.6" fill="var(--jm-white, #FFFFFF)" opacity="0.75"/>
        <circle cx="150" cy="270" r="5" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="150" cy="270" r="5" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.1" opacity="0.55"/>
        <circle cx="148.3" cy="268.1" r="1.3" fill="var(--jm-white, #FFFFFF)" opacity="0.75"/>
        <circle cx="368" cy="268" r="3.5" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="368" cy="268" r="3.5" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.1" opacity="0.55"/>
        <circle cx="228" cy="300" r="3" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="228" cy="300" r="3" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.1" opacity="0.55"/>
        <circle cx="300" cy="436" r="4" fill="var(--jm-pale, #C8DDA6)" opacity="0.18"/>
        <circle cx="300" cy="436" r="4" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.1" opacity="0.55"/>
      </g>

      <!-- Голям мек блик горе-вляво + остър специалитет. -->
      <ellipse cx="182" cy="212" rx="58" ry="34" fill="var(--jm-white, #FFFFFF)" opacity="0.16" transform="rotate(-32 182 212)" filter="url(#jm-soft-s)"/>
      <ellipse cx="168" cy="196" rx="16" ry="10" fill="var(--jm-white, #FFFFFF)" opacity="0.55" transform="rotate(-32 168 196)"/>
      <!-- Тъмен контур по долния десен ръб — дава обем на желето. -->
      <ellipse cx="368" cy="418" rx="104" ry="76" fill="var(--jm-deep, #0D4A02)" opacity="0.22" filter="url(#jm-soft)"/>
    </g>

    <!-- 5. Кант (rim light) по силуета + лаймов кант отдолу от подсветката. -->
    <g clip-path="url(#jm-clip)">
      <path d="M256 148C346 148 406 212 406 294C406 362 372 412 322 436C302 446 280 452 256 452C232 452 210 446 190 436C140 412 106 362 106 294C106 212 166 148 256 148Z" fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="16" opacity="0.95" filter="url(#jm-soft-s)" mask="url(#jm-bottom)"/>
    </g>
    <path d="M256 148C346 148 406 212 406 294C406 362 372 412 322 436C302 446 280 452 256 452C232 452 210 446 190 436C140 412 106 362 106 294C106 212 166 148 256 148Z" fill="none" stroke="url(#jm-rim)" stroke-width="5"/>

    <!-- 6. Лице. -->
    <g class="jm-face">
      <!-- Вежди. -->
      <g stroke="var(--jm-ink, #0A0C0A)" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M164 202C182 190 206 188 224 194"/>
        <path d="M348 202C330 190 306 188 288 194"/>
      </g>

      <!-- Очи. -->
      <g class="jm-eyes">
        <circle cx="200" cy="266" r="34" fill="var(--jm-eye, #F4FAEA)"/>
        <circle cx="312" cy="266" r="34" fill="var(--jm-eye, #F4FAEA)"/>
        <circle cx="202" cy="270" r="21" fill="var(--jm-ink, #0A0C0A)"/>
        <circle cx="314" cy="270" r="21" fill="var(--jm-ink, #0A0C0A)"/>
        <g fill="var(--jm-white, #FFFFFF)">
          <circle cx="193" cy="261" r="8"/>
          <circle cx="305" cy="261" r="8"/>
          <circle cx="210" cy="280" r="4" opacity="0.6"/>
          <circle cx="322" cy="280" r="4" opacity="0.6"/>
        </g>
      </g>

      <!-- Очила: дебели черни кръгли рамки + стъкла с лек блясък. -->
      <g class="jm-glasses">
        <circle cx="200" cy="266" r="48" fill="var(--jm-white, #FFFFFF)" opacity="0.07"/>
        <circle cx="312" cy="266" r="48" fill="var(--jm-white, #FFFFFF)" opacity="0.07"/>
        <g fill="none" stroke="var(--jm-ink, #0A0C0A)" stroke-width="13" stroke-linecap="round">
          <circle cx="200" cy="266" r="48"/>
          <circle cx="312" cy="266" r="48"/>
          <path d="M249 260C253 253 259 253 263 260"/>
          <path d="M152 254C138 246 126 244 114 246"/>
          <path d="M360 254C374 246 386 244 398 246"/>
        </g>
        <!-- Блясък по стъклата (къси наклонени черти). -->
        <g stroke="var(--jm-white, #FFFFFF)" stroke-width="7" stroke-linecap="round" opacity="0.5">
          <path d="M176 246L192 232"/>
          <path d="M288 246L304 232"/>
        </g>
      </g>

      <!-- Усмивка. -->
      <path d="M236 322C244 336 268 336 276 322" fill="none" stroke="var(--jm-ink, #0A0C0A)" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- 7. Папийонка. -->
    <g class="jm-bowtie">
      <path d="M250 400C234 386 220 376 208 375C202 388 202 412 208 425C220 424 234 414 250 400Z" fill="var(--jm-ink, #0A0C0A)"/>
      <path d="M262 400C278 386 292 376 304 375C310 388 310 412 304 425C292 424 278 414 262 400Z" fill="var(--jm-ink, #0A0C0A)"/>
      <rect x="246" y="389" width="20" height="22" rx="7" fill="var(--jm-ink-soft, #2A2E24)"/>
      <path d="M250 400C234 386 220 376 208 375C202 388 202 412 208 425C220 424 234 414 250 400ZM262 400C278 386 292 376 304 375C310 388 310 412 304 425C292 424 278 414 262 400Z" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="2" opacity="0.35"/>
      <path d="M214 383C220 391 222 405 220 416" fill="none" stroke="var(--jm-ink-soft, #2A2E24)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <path d="M298 383C292 391 290 405 292 416" fill="none" stroke="var(--jm-ink-soft, #2A2E24)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- 8. Академична шапка — леко наклонена, „плава" над темето. -->
    <g class="jm-cap" transform="translate(0 18) rotate(-6 256 110)">
      <ellipse cx="256" cy="120" rx="66" ry="26" fill="var(--jm-ink, #0A0C0A)"/>
      <path d="M256 62L390 100L256 138L122 100Z" fill="var(--jm-ink, #0A0C0A)" opacity="0.9" transform="translate(0 9)"/>
      <path d="M256 62L390 100L256 138L122 100Z" fill="url(#jm-board)"/>
      <path d="M256 62L390 100L256 106L122 100Z" fill="var(--jm-ink-soft, #2A2E24)" opacity="0.5"/>
      <circle cx="256" cy="100" r="6" fill="var(--jm-ink-soft, #2A2E24)"/>
      <!-- Пискюл: шнур през ръба на дъската и висящ помпон. -->
      <path d="M256 100C300 106 340 108 372 102" fill="none" stroke="url(#jm-gold)" stroke-width="6" stroke-linecap="round"/>
      <path class="jm-tassel" d="M372 102C378 124 378 146 374 162" fill="none" stroke="url(#jm-gold)" stroke-width="6" stroke-linecap="round"/>
      <path class="jm-tassel-bob" d="M362 160H386L380 196C378 202 370 202 368 196Z" fill="url(#jm-gold)"/>
    </g>
  </g>
</svg>
