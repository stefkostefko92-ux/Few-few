<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jm-title jm-desc">
  <title id="jm-title">Желирано маскотче с очила и академична шапка (средно ниво на детайл)</title>
  <desc id="jm-desc">Опростен вариант на маскота — без филтри и блурове, само плътни форми и градиенти. За среден размер, печат и лесна векторизация.</desc>

  <!-- Ниво „средно": нула `filter` елементи (блурът не оцелява във всеки векторен конвейер и
       поскъпва растеризацията). Обемът се строи само с градиенти — меките преходи, които при
       пълното ниво идват от блур, тук са направени със стопове до нула. Силуетът, лицето и
       аксесоарите са същите като при пълното ниво: маскотът е един и същ, не роднина. -->
  <defs>
    <radialGradient id="jmm-body" cx="36%" cy="24%" r="86%">
      <stop offset="0%" stop-color="var(--jm-pale, #C8DDA6)"/>
      <stop offset="16%" stop-color="var(--jm-olive, #99E72A)"/>
      <stop offset="52%" stop-color="var(--jm-neon, #5AB60D)"/>
      <stop offset="86%" stop-color="var(--jm-bottle, #297F04)"/>
      <stop offset="100%" stop-color="var(--jm-deep, #0D4A02)"/>
    </radialGradient>
    <radialGradient id="jmm-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--jm-olive, #99E72A)" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="var(--jm-olive, #99E72A)" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="var(--jm-neon, #5AB60D)" stop-opacity="0"/>
    </radialGradient>
    <!-- Вътрешната сянка по ръба без блур: пръстеновиден градиент, стопен навътре. -->
    <radialGradient id="jmm-edge" cx="50%" cy="50%" r="50%">
      <stop offset="0.62" stop-color="var(--jm-deep, #0D4A02)" stop-opacity="0"/>
      <stop offset="0.88" stop-color="var(--jm-deep, #0D4A02)" stop-opacity="0.34"/>
      <stop offset="1" stop-color="var(--jm-deep, #0D4A02)" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="jmm-gloss" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="var(--jm-white, #FFFFFF)" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="var(--jm-white, #FFFFFF)" stop-opacity="0.12"/>
      <stop offset="1" stop-color="var(--jm-white, #FFFFFF)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jmm-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--jm-pale, #C8DDA6)" stop-opacity="0"/>
      <stop offset="0.42" stop-color="var(--jm-pale, #C8DDA6)" stop-opacity="0.05"/>
      <stop offset="1" stop-color="var(--jm-pale, #C8DDA6)" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="jmm-glass" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="var(--jm-pale, #C8DDA6)" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="var(--jm-pale, #C8DDA6)" stop-opacity="0.05"/>
      <stop offset="1" stop-color="var(--jm-white, #FFFFFF)" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="jmm-board" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="var(--jm-soft-olive, #848D68)" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="var(--jm-ink-soft, #2A2E24)"/>
      <stop offset="1" stop-color="var(--jm-ink, #0A0C0A)"/>
    </linearGradient>
    <linearGradient id="jmm-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--jm-ink-soft, #2A2E24)"/>
      <stop offset="1" stop-color="var(--jm-ink, #0A0C0A)"/>
    </linearGradient>
    <linearGradient id="jmm-gold" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="var(--jm-gold, #D9A521)"/>
      <stop offset="0.3" stop-color="var(--jm-gold-light, #F2D479)"/>
      <stop offset="0.42" stop-color="var(--jm-white, #FFFFFF)"/>
      <stop offset="0.58" stop-color="var(--jm-gold-light, #F2D479)"/>
      <stop offset="1" stop-color="var(--jm-gold, #D9A521)"/>
    </linearGradient>
    <!-- Контактната сянка и подсветката без блур: градиенти до прозрачно. -->
    <radialGradient id="jmm-contact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="var(--jm-mask-black, #000000)" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="var(--jm-mask-black, #000000)" stop-opacity="0.28"/>
      <stop offset="1" stop-color="var(--jm-mask-black, #000000)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jmm-underglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--jm-olive, #99E72A)" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="var(--jm-neon, #5AB60D)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--jm-neon, #5AB60D)" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="jmm-clip">
      <path d="M252 126C332 126 394 190 402 268C408 328 396 374 366 408C342 436 302 452 254 452C206 452 168 434 144 406C116 372 106 328 112 268C120 190 172 126 252 126Z"/>
    </clipPath>
  </defs>

  <g class="jm-root">
    <ellipse cx="254" cy="486" rx="132" ry="20" fill="url(#jmm-contact)"/>
    <ellipse class="jm-glow" cx="254" cy="480" rx="172" ry="38" fill="url(#jmm-underglow)"/>

    <g class="jm-arms">
      <g stroke="url(#jmm-body)" stroke-width="34" stroke-linecap="round" fill="none">
        <path d="M144 356C120 368 102 384 94 400"/>
        <path d="M368 356C392 368 410 384 418 400"/>
      </g>
      <g stroke="var(--jm-olive, #99E72A)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5">
        <path d="M138 372C118 382 104 394 98 406"/>
        <path d="M374 372C394 382 408 394 414 406"/>
      </g>
    </g>



    <path class="jm-body" d="M252 126C332 126 394 190 402 268C408 328 396 374 366 408C342 436 302 452 254 452C206 452 168 434 144 406C116 372 106 328 112 268C120 190 172 126 252 126Z" fill="url(#jmm-body)"/>


    <!-- Крачета: две малки стъпала под тялото. Характерът СТЪПВА — блоб без стъпала се чете
         като предмет, не като герой. -->
    <g class="jm-feet">
      <ellipse cx="196" cy="462" rx="44" ry="22" fill="url(#jmm-body)"/>
      <ellipse cx="312" cy="462" rx="44" ry="22" fill="url(#jmm-body)"/>
      <path d="M164 468C174 478 192 482 210 480" fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <path d="M280 468C290 478 308 482 326 480" fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <ellipse cx="196" cy="450" rx="36" ry="15" fill="var(--jm-deep, #0D4A02)" opacity="0.35"/>
      <ellipse cx="312" cy="450" rx="36" ry="15" fill="var(--jm-deep, #0D4A02)" opacity="0.35"/>
    </g>

    <g clip-path="url(#jmm-clip)">
      <ellipse cx="254" cy="376" rx="150" ry="118" fill="url(#jmm-core)"/>
      <ellipse cx="250" cy="404" rx="90" ry="58" fill="url(#jmm-core)" opacity="0.7"/>
      <ellipse cx="256" cy="292" rx="152" ry="164" fill="url(#jmm-edge)"/>

      <g class="jm-bubbles">
        <circle cx="180" cy="330" r="12" fill="var(--jm-pale, #C8DDA6)" opacity="0.14"/>
        <circle cx="180" cy="330" r="12" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="2.4" opacity="0.6"/>
        <circle cx="175" cy="325" r="3.4" fill="var(--jm-white, #FFFFFF)" opacity="0.85"/>
        <circle cx="246" cy="420" r="15" fill="var(--jm-pale, #C8DDA6)" opacity="0.14"/>
        <circle cx="246" cy="420" r="15" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="2.6" opacity="0.6"/>
        <circle cx="240" cy="414" r="4.2" fill="var(--jm-white, #FFFFFF)" opacity="0.85"/>
        <circle cx="298" cy="398" r="9" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="2" opacity="0.55"/>
        <ellipse cx="328" cy="356" rx="12" ry="10" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="2" opacity="0.5"/>
        <circle cx="214" cy="392" r="8" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.6" opacity="0.5"/>
        <circle cx="344" cy="404" r="6" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="1.4" opacity="0.45"/>
      </g>

      <path class="jm-gloss" d="M152 232C156 184 200 146 246 144C260 143 268 150 264 158C256 172 216 184 192 216C178 236 174 256 164 258C154 260 150 250 152 232Z" fill="url(#jmm-gloss)"/>
      <ellipse cx="170" cy="188" rx="15" ry="9" fill="var(--jm-white, #FFFFFF)" opacity="0.7" transform="rotate(-34 170 188)"/>
    </g>

    <path d="M252 126C332 126 394 190 402 268C408 328 396 374 366 408C342 436 302 452 254 452C206 452 168 434 144 406C116 372 106 328 112 268C120 190 172 126 252 126Z" fill="none" stroke="url(#jmm-rim)" stroke-width="5"/>

    <g class="jm-face" transform="translate(0 10) rotate(-2.5 254 276) scale(0.92) translate(22 24)">
      <g class="jm-brows" stroke="var(--jm-ink, #0A0C0A)" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M166 208C184 196 208 194 226 200"/>
        <path d="M346 208C328 196 304 194 286 200"/>
      </g>
      <g class="jm-eyes">
        <circle cx="200" cy="272" r="34" fill="var(--jm-eye, #F4FAEA)"/>
        <circle cx="310" cy="272" r="34" fill="var(--jm-eye, #F4FAEA)"/>
          <g class="jm-pupils">
          <circle cx="202" cy="276" r="21" fill="var(--jm-ink, #0A0C0A)"/>
          <circle cx="312" cy="276" r="21" fill="var(--jm-ink, #0A0C0A)"/>
          <g fill="none" stroke="var(--jm-neon, #5AB60D)" stroke-width="3" opacity="0.55">
            <circle cx="202" cy="276" r="18"/>
            <circle cx="312" cy="276" r="18"/>
          </g>
        </g>
        <g fill="var(--jm-white, #FFFFFF)">
          <rect x="185" y="256" width="17" height="12" rx="5" transform="rotate(-24 193 262)"/>
          <rect x="295" y="256" width="17" height="12" rx="5" transform="rotate(-24 303 262)"/>
          <circle cx="211" cy="287" r="4" opacity="0.7"/>
          <circle cx="321" cy="287" r="4" opacity="0.7"/>
        </g>
      </g>
      <g class="jm-glasses">
        <circle cx="200" cy="272" r="48" fill="url(#jmm-glass)"/>
        <circle cx="310" cy="272" r="48" fill="url(#jmm-glass)"/>
        <g fill="none" stroke="var(--jm-ink, #0A0C0A)" stroke-width="13" stroke-linecap="round">
          <circle cx="200" cy="272" r="48"/>
          <circle cx="310" cy="272" r="48"/>
          <path d="M248 266C252 259 258 259 262 266"/>
          <path d="M152 260C138 252 126 250 114 252"/>
          <path d="M358 260C372 252 384 250 396 252"/>
        </g>
        <g fill="none" stroke="var(--jm-soft-olive, #848D68)" stroke-width="3" stroke-linecap="round" opacity="0.7">
          <path d="M164 240C176 230 190 226 204 226"/>
          <path d="M274 240C286 230 300 226 314 226"/>
        </g>
        <g fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="3" stroke-linecap="round" opacity="0.45">
          <path d="M170 304C180 314 196 320 212 320"/>
          <path d="M280 304C290 314 306 320 322 320"/>
        </g>
        <g stroke="var(--jm-white, #FFFFFF)" stroke-linecap="round" fill="none">
          <path d="M172 256L192 236" stroke-width="9" opacity="0.55"/>
          <path d="M282 256L302 236" stroke-width="9" opacity="0.55"/>
        </g>
      </g>
      <g class="jm-mouth">
        <path d="M234 332C242 346 266 346 274 332" fill="none" stroke="var(--jm-ink, #0A0C0A)" stroke-width="9" stroke-linecap="round"/>
        <path d="M238 342C244 350 264 350 270 342" fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
      </g>
    </g>

    <g class="jm-bowtie" transform="translate(0 8) rotate(-2 254 404) scale(0.94) translate(16 26)">
      <path d="M248 404C232 390 218 380 206 379C200 392 200 416 206 429C218 428 232 418 248 404Z" fill="var(--jm-ink, #0A0C0A)"/>
      <path d="M260 404C276 390 290 380 302 379C308 392 308 416 302 429C290 428 276 418 260 404Z" fill="var(--jm-ink, #0A0C0A)"/>
      <g fill="none" stroke="var(--jm-ink-soft, #2A2E24)" stroke-width="3.5" stroke-linecap="round">
        <path d="M212 387C218 395 220 409 218 420"/>
        <path d="M296 387C290 395 288 409 290 420"/>
      </g>
      <g fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
        <path d="M244 400C236 394 224 386 212 383"/>
        <path d="M264 400C272 394 284 386 296 383"/>
      </g>
      <rect x="244" y="393" width="20" height="22" rx="7" fill="url(#jmm-band)"/>
    </g>

    <g class="jm-cap" transform="translate(0 14) rotate(-9 254 108) scale(0.93) translate(19 9)">
      <ellipse cx="254" cy="118" rx="66" ry="26" fill="url(#jmm-band)"/>
      <path d="M198 132C214 142 294 142 310 132" fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="3" opacity="0.4"/>
      <path d="M120 98L254 136L388 98L388 108L254 146L120 108Z" fill="var(--jm-ink, #0A0C0A)"/>
      <path d="M254 60L388 98L254 136L120 98Z" fill="url(#jmm-board)"/>
      <path d="M254 60L388 98L254 104L120 98Z" fill="var(--jm-soft-olive, #848D68)" opacity="0.16"/>
      <path d="M120 98L254 60" fill="none" stroke="var(--jm-pale, #C8DDA6)" stroke-width="2" opacity="0.35"/>
      <circle cx="254" cy="98" r="6" fill="var(--jm-ink-soft, #2A2E24)"/>
      <path d="M254 98C298 104 338 106 370 100" fill="none" stroke="url(#jmm-gold)" stroke-width="6" stroke-linecap="round"/>
      <g class="jm-tassel">
        <path d="M370 100C376 122 376 144 372 160" fill="none" stroke="url(#jmm-gold)" stroke-width="6" stroke-linecap="round"/>
        <g class="jm-tassel-bob">
          <path d="M360 156H384L378 194C376 200 368 200 366 194Z" fill="url(#jmm-gold)"/>
          <rect x="359" y="153" width="26" height="8" rx="4" fill="var(--jm-gold-light, #F2D479)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
