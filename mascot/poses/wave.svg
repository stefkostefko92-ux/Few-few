<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jm-title">
  <title id="jm-title">Поза „маха" — сменяемият модул на ръцете</title>
  <!--
    МОДУЛ НА ПОЗА, не самостоятелен асет. Съдържа точно групата `jm-arms` в координатите на
    маскота (512×512); `node build.mjs` я вгражда в базовия SVG и произвежда
    `svg/poses/jelly-mascot-wave.svg`.

    Препратката `url(#jm-body)` се пренасочва към градиента на съответното ниво при вграждане —
    затова тук се пише винаги с префикса на пълното ниво.
  -->
  <g class="jm-arms">
    <g stroke="url(#jm-body)" stroke-width="34" stroke-linecap="round" fill="none">
      <path d="M144 356C120 368 102 384 94 400"/>
      <path d="M360 350C396 336 422 302 428 262"/>
    </g>
    <g stroke="var(--jm-olive, #99E72A)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M138 372C118 382 104 394 98 406"/>
      <path d="M368 364C396 350 414 324 420 296"/>
    </g>
    <!-- Дланта: заоблена „ръкавичка" с два пръста — жестът се чете и при малък размер. -->
    <g class="jm-hand">
      <path d="M406 236C406 210 420 194 438 194C456 194 470 210 470 236C470 260 456 276 438 276C420 276 406 260 406 236Z" fill="url(#jm-body)"/>
      <path d="M412 222C414 210 421 202 428 204" fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
      <path d="M448 204C457 212 460 222 459 234" fill="none" stroke="var(--jm-deep, #0D4A02)" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
      <path d="M434 202C443 210 445 222 443 234" fill="none" stroke="var(--jm-deep, #0D4A02)" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
      <path d="M408 252C414 266 424 274 436 274" fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
</svg>
