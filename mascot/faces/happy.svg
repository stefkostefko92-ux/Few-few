<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jm-title">
  <title id="jm-title">Изражение „щастлив" — сменяемите модули на лицето</title>
  <!--
    МОДУЛ НА ЛИЦЕТО, не самостоятелен асет. Съдържа точно трите сменяеми групи
    (`jm-brows` · `jm-eyes` · `jm-mouth`) в координатите на маскота (512×512).
    `node build.mjs` ги вгражда в базовия SVG и произвежда `svg/expressions/happy.svg`.
    Очилата, тялото и шапката НЕ се пипат оттук — само лицето.
  -->

  <g class="jm-brows" stroke="var(--jm-ink, #0A0C0A)" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M164 198C182 184 208 182 226 190"/>
    <path d="M348 198C330 184 304 182 286 190"/>
  </g>

  <g class="jm-eyes">
      <g class="jm-pupils">
      <g fill="none" stroke="var(--jm-ink, #0A0C0A)" stroke-width="11" stroke-linecap="round">
        <path d="M176 282C186 262 214 262 224 282"/>
        <path d="M286 282C296 262 324 262 334 282"/>
      </g>
    </g>
    <g fill="var(--jm-white, #FFFFFF)" opacity="0.5">
      <circle cx="182" cy="272" r="3"/>
      <circle cx="292" cy="272" r="3"/>
    </g>
  </g>

  <g class="jm-mouth">
    <path d="M226 328C234 356 274 356 282 328C264 338 244 338 226 328Z" fill="var(--jm-ink, #0A0C0A)"/>
    <path d="M240 348C246 353 262 353 268 348" fill="none" stroke="var(--jm-olive, #99E72A)" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
