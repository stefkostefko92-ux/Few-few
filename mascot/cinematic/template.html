<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маскот — кинематографична 3D витрина | Carbon Stealth</title>
<meta name="description" content="Фотореалистична 3D версия на маскота на Carbon Stealth: желирано тяло с подповърхностно разсейване, карбонов плат запечатан отвътре, лакирани очила и академична шапка със златен пискюл — рендерирана на живо в браузъра.">
<meta name="keywords" content="Carbon Stealth, маскот, 3D маскот, WebGL желе, three.js рендер, желиран герой, кинематографичен рендер">
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; --bg: #050706; --pale: #c8dda6; --olive: #99e72a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #stage-wrap { position: relative; width: 100%; height: 100%; background: var(--bg); }
  canvas#stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas#stage:active { cursor: grabbing; }
  canvas#stage.hidden, #fallback.hidden, #hint.hidden, #controls.hidden { display: none !important; }
  #fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #fallback img { width: min(72vmin, 640px); height: auto; }
  #hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); color: var(--pale); opacity: .55; letter-spacing: .01em; pointer-events: none; transition: opacity .6s ease; white-space: nowrap; }
  #hint.faded { opacity: 0; }
  #controls { position: absolute; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 10px; }
  #pause-btn, #quality-select { appearance: none; border: 1px solid color-mix(in srgb, var(--pale) 35%, transparent); background: color-mix(in srgb, var(--bg) 72%, transparent); color: var(--pale); font: inherit; border-radius: 999px; backdrop-filter: blur(6px); }
  #pause-btn { padding: 9px 14px; cursor: pointer; }
  #pause-btn:hover, #quality-select:hover { border-color: var(--pale); }
  #pause-btn:focus-visible, #quality-select:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
  #quality-select { padding: 8px 12px; }
  #credit { position: absolute; left: 18px; bottom: 18px; margin: 0; color: var(--pale); opacity: .55; font-size: 11px; letter-spacing: .04em; }
  #credit a { color: var(--pale); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--pale) 40%, transparent); }
  @media (max-width: 480px) {
    #hint { font-size: 12px; bottom: 20px; }
    #pause-btn { padding: 8px 12px; font-size: 13px; }
    #credit { display: none; }
  }
</style>
</head>
<body>

<div id="stage-wrap" role="img" aria-label="Триизмерен желиран маскот на Carbon Stealth: капковидно неоново зелено телце със светеща сърцевина, запечатан отвътре карбонов плат, големи кръгли черни очила, черна академична шапка със златен пискюл и черна папийонка — кинематографичен студиен рендер, бавно завъртане при влачене.">
  <canvas id="stage" aria-hidden="true"></canvas>

  <div id="fallback" class="hidden" aria-hidden="true">
    <img src="../svg/jelly-mascot-full-animated.svg" alt="" width="640" height="640">
  </div>

  <p id="hint">Плъзни, за да завъртиш</p>

  <div id="controls">
    <button id="pause-btn" type="button" aria-pressed="false">Пауза</button>
    <label class="sr-only" for="quality-select" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Качество</label>
    <select id="quality-select">
      <option value="auto">Авто</option>
      <option value="low">Ниско</option>
      <option value="high">Високо</option>
      <option value="ultra">Ултра</option>
    </select>
  </div>

  <p id="credit">Created and Designed by <a href="https://carbonstealth.eu" target="_blank" rel="noopener">Carbon Stealth VCC</a></p>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
<script type="module">
/*BUNDLE*/
</script>
</body>
</html>
