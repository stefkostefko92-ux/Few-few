<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prodotti | Panev Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="shortcut icon" href="../favicon.ico">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside id="admin-sidebar"></aside>

  <div class="admin-main">
    <div id="admin-topbar"></div>

    <div class="admin-content">

      <div class="admin-toolbar">
        <div class="toolbar-left">
          <input type="text" id="prod-search" aria-label="Cerca prodotti" placeholder="Cerca prodotti…" class="admin-search" oninput="filterProducts()">
          <select id="prod-cat-filter" class="admin-select" onchange="filterProducts()">
            <option value="">Tutte le categorie</option>
          </select>
        </div>
        <button class="btn-admin btn-primary-admin" onclick="openProductModal()">+ Nuovo Prodotto</button>
      </div>

      <div id="prod-stats-row" class="prod-stats-row"></div>

      <div class="admin-card" style="margin-top:1.5rem">
        <div id="products-table-wrap"><div class="empty-placeholder">Caricamento…</div></div>
      </div>

    </div>
  </div>
</div>

<!-- Product Modal -->
<div id="prod-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeProductModal()">
  <div class="modal-box large-modal">
    <div class="modal-head">
      <h3 id="modal-title">Nuovo Prodotto</h3>
      <button class="modal-close" onclick="closeProductModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="pm-id">

      <div class="modal-two-col">
        <div>
          <div class="form-group-admin">
            <label for="pm-name">Nome Prodotto *</label>
            <input type="text" id="pm-name" placeholder="es. Staffa Porta A 65.170.7" maxlength="200">
          </div>
          <div class="form-group-admin">
            <label for="pm-cat">Categoria *</label>
            <select id="pm-cat">
              <option value="">— Seleziona —</option>
              <option value="Staffe Porte Brevettate">Staffe Porte Brevettate</option>
              <option value="Staffe Contrapeso">Staffe Contrapeso</option>
              <option value="Accessori">Accessori</option>
              <option value="Servizi">Servizi</option>
            </select>
          </div>
          <div class="form-group-admin">
            <label for="pm-codice">Codice</label>
            <input type="text" id="pm-codice" placeholder="COD.- A 65 170 7" maxlength="80">
          </div>
          <div class="form-group-admin">
            <label for="pm-price">Prezzo (€) — 0 per "su richiesta"</label>
            <input type="number" id="pm-price" placeholder="0.00" min="0" step="0.01">
          </div>
          <div class="form-group-admin">
            <label for="pm-pricelabel">Etichetta Prezzo</label>
            <input type="text" id="pm-pricelabel" placeholder="es. 13,03 € o Su richiesta" maxlength="80">
          </div>
          <div class="form-row-admin">
            <div class="form-group-admin">
              <label for="pm-badge">Badge</label>
              <input type="text" id="pm-badge" placeholder="es. 🏛 Brevettata" maxlength="80">
            </div>
            <div class="form-group-admin">
              <label for="pm-icon">Icona</label>
              <input type="text" id="pm-icon" placeholder="🔩" maxlength="4">
            </div>
          </div>
        </div>
        <div>
          <div class="form-group-admin">
            <label for="pm-image">URL Immagine</label>
            <input type="text" id="pm-image" placeholder="img/staffa-A65-170.png" oninput="previewImage(this.value)" maxlength="300">
            <div id="pm-img-preview" class="img-preview-box">
              <span>Anteprima immagine</span>
            </div>
          </div>
          <div class="form-row-admin">
            <div class="form-group-admin">
              <label for="pm-spessore">Spessore</label>
              <input type="text" id="pm-spessore" placeholder="5mm" maxlength="30">
            </div>
            <div class="form-group-admin">
              <label for="pm-larghezza">Larghezza</label>
              <input type="text" id="pm-larghezza" placeholder="65mm" maxlength="30">
            </div>
          </div>
          <div class="form-row-admin">
            <div class="form-group-admin">
              <label for="pm-lunghezza">Lunghezza</label>
              <input type="text" id="pm-lunghezza" placeholder="170mm" maxlength="30">
            </div>
            <div class="form-group-admin">
              <label for="pm-sort">Ordinamento</label>
              <input type="number" id="pm-sort" placeholder="0" value="0">
            </div>
          </div>
        </div>
      </div>

      <div class="form-group-admin">
        <label for="pm-descrizione">Descrizione breve</label>
        <input type="text" id="pm-descrizione" placeholder="Staffa porte superiore" maxlength="500">
      </div>

      <div class="form-group-admin">
        <label for="pm-desc">Descrizione completa</label>
        <textarea id="pm-desc" rows="4" placeholder="Descrizione dettagliata del prodotto…" maxlength="2000"></textarea>
      </div>

      <div class="modal-toggles">
        <label class="toggle-row">
          <div>
            <div class="toggle-label">Disponibile</div>
            <div class="toggle-sub">Il prodotto è visibile nel negozio</div>
          </div>
          <div class="toggle-wrap">
            <input type="checkbox" id="pm-available" class="toggle-inp" checked>
            <span class="toggle-slider"></span>
          </div>
        </label>
        <label class="toggle-row">
          <div>
            <div class="toggle-label">In Evidenza</div>
            <div class="toggle-sub">Mostra nella homepage</div>
          </div>
          <div class="toggle-wrap">
            <input type="checkbox" id="pm-featured" class="toggle-inp">
            <span class="toggle-slider"></span>
          </div>
        </label>
        <label class="toggle-row">
          <div>
            <div class="toggle-label">Brevettato</div>
            <div class="toggle-sub">Marca prodotto come coperto dal brevetto UIBM</div>
          </div>
          <div class="toggle-wrap">
            <input type="checkbox" id="pm-patented" class="toggle-inp">
            <span class="toggle-slider"></span>
          </div>
        </label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-admin btn-outline-admin" onclick="closeProductModal()">Annulla</button>
      <button class="btn-admin btn-primary-admin" onclick="saveProduct()" id="pm-save-btn">Salva Prodotto</button>
    </div>
  </div>
</div>

<script src="../js/admin.js"></script>
<script>
let editingId = null;
let productsCache = [];

async function initPageContent() {
  renderAdminTopbar('Gestione Prodotti');
  await loadProducts();
}

async function loadProducts() {
  try {
    productsCache = await AdminProducts.list();
    renderProductsTable();
    populateCategoryFilter();
  } catch (err) {
    adminToast('Errore caricamento: ' + err.message, 'error');
  }
}

function populateCategoryFilter() {
  const cats = [...new Set(productsCache.map(p => p.category).filter(Boolean))];
  const sel = document.getElementById('prod-cat-filter');
  const current = sel.value;
  sel.innerHTML = '<option value="">Tutte le categorie</option>' +
    cats.map(c => `<option value="${escAttr(c)}" ${c === current ? 'selected' : ''}>${escHtml(c)}</option>`).join('');
}

function filterProducts() {
  renderProductsTable(
    document.getElementById('prod-search').value.toLowerCase(),
    document.getElementById('prod-cat-filter').value
  );
}

function renderProductsTable(search = '', catFilter = '') {
  let products = productsCache.slice();
  if (search)    products = products.filter(p => (p.name||'').toLowerCase().includes(search) || (p.description||'').toLowerCase().includes(search) || (p.codice||'').toLowerCase().includes(search));
  if (catFilter) products = products.filter(p => p.category === catFilter);

  document.getElementById('prod-stats-row').innerHTML = `
    <div class="prod-stat"><span class="ps-num">${productsCache.length}</span><span class="ps-lbl">Totale</span></div>
    <div class="prod-stat"><span class="ps-num">${productsCache.filter(p=>p.available).length}</span><span class="ps-lbl">Disponibili</span></div>
    <div class="prod-stat"><span class="ps-num">${productsCache.filter(p=>p.featured).length}</span><span class="ps-lbl">In Evidenza</span></div>
    <div class="prod-stat"><span class="ps-num">${[...new Set(productsCache.map(p=>p.category))].length}</span><span class="ps-lbl">Categorie</span></div>`;

  const wrap = document.getElementById('products-table-wrap');
  if (products.length === 0) {
    wrap.innerHTML = `<div class="empty-placeholder" style="padding:3rem">Nessun prodotto trovato</div>`;
    return;
  }

  wrap.innerHTML = `
    <table class="admin-table">
      <thead>
        <tr>
          <th style="width:56px">Img</th>
          <th>Nome Prodotto</th>
          <th>Categoria</th>
          <th>Prezzo</th>
          <th>Badge</th>
          <th>Stato</th>
          <th>Evidenza</th>
          <th style="text-align:right">Azioni</th>
        </tr>
      </thead>
      <tbody>
        ${products.map(p => `
          <tr>
            <td>
              <div class="prod-thumb">
                ${p.image ? '<img src="'+(p.image.startsWith('http')?escAttr(p.image):'../'+escAttr(p.image))+'" alt="'+escAttr(p.name)+'">' : '<span>'+escHtml(p.icon || '📦')+'</span>'}
              </div>
            </td>
            <td>
              <div class="prod-name-cell">
                <div class="prod-n">${escHtml(p.name)}</div>
                ${p.codice ? '<div class="prod-desc-preview" style="color:var(--admin-gold)">'+escHtml(p.codice)+'</div>' : ''}
                ${p.description ? '<div class="prod-desc-preview">'+escHtml(p.description.slice(0,60))+'…</div>' : ''}
              </div>
            </td>
            <td><span class="badge badge-default">${escHtml(p.category || '—')}</span></td>
            <td style="color:var(--admin-gold);font-weight:700">${escHtml(p.priceLabel || (p.price > 0 ? '€' + Number(p.price).toLocaleString('it-IT', {minimumFractionDigits:2}) : '—'))}</td>
            <td>${p.badge ? '<span class="badge badge-warning">'+escHtml(p.badge)+'</span>' : '—'}</td>
            <td>
              <span class="badge ${p.available ? 'badge-success' : 'badge-danger'}">
                ${p.available ? 'Disponibile' : 'Non disp.'}
              </span>
            </td>
            <td style="text-align:center">
              ${p.featured ? '<span style="color:var(--admin-gold);font-size:1.1rem">★</span>' : '<span style="color:var(--admin-text-muted)">☆</span>'}
            </td>
            <td>
              <div class="action-btns">
                <button class="action-btn edit-btn" data-edit="${escAttr(p.id)}" title="Modifica">✏️</button>
                <button class="action-btn view-btn" onclick="window.open('../prodotti.html','_blank')" title="Vedi nel sito">🌐</button>
                <button class="action-btn delete-btn" data-del="${escAttr(p.id)}" title="Elimina">🗑️</button>
              </div>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  // Bind via data attributes (avoid inline JS with user-generated IDs)
  wrap.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openProductModal(b.dataset.edit)));
  wrap.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteProduct(b.dataset.del)));
}

function openProductModal(id = null) {
  editingId = id;
  const modal = document.getElementById('prod-modal');
  document.getElementById('modal-title').textContent = id ? 'Modifica Prodotto' : 'Nuovo Prodotto';

  const setVal = (el, v) => { document.getElementById(el).value = v == null ? '' : v; };
  const setChk = (el, v) => { document.getElementById(el).checked = !!v; };

  if (id) {
    const p = productsCache.find(x => x.id === id);
    if (!p) return;
    setVal('pm-id', p.id);
    setVal('pm-name', p.name);
    setVal('pm-cat', p.category);
    setVal('pm-codice', p.codice);
    setVal('pm-price', p.price);
    setVal('pm-pricelabel', p.priceLabel);
    setVal('pm-badge', p.badge);
    setVal('pm-icon', p.icon);
    setVal('pm-image', p.image);
    setVal('pm-spessore', p.spessore);
    setVal('pm-larghezza', p.larghezza);
    setVal('pm-lunghezza', p.lunghezza);
    setVal('pm-sort', p.sortOrder || 0);
    setVal('pm-descrizione', p.descrizione);
    setVal('pm-desc', p.description);
    setChk('pm-available', p.available !== false);
    setChk('pm-featured', p.featured);
    setChk('pm-patented', p.patented);
    previewImage(p.image || '');
  } else {
    setVal('pm-id', ''); setVal('pm-name', ''); setVal('pm-cat', '');
    setVal('pm-codice', ''); setVal('pm-price', ''); setVal('pm-pricelabel', '');
    setVal('pm-badge', ''); setVal('pm-icon', '📦'); setVal('pm-image', '');
    setVal('pm-spessore', ''); setVal('pm-larghezza', ''); setVal('pm-lunghezza', '');
    setVal('pm-sort', 0); setVal('pm-descrizione', ''); setVal('pm-desc', '');
    setChk('pm-available', true); setChk('pm-featured', false); setChk('pm-patented', false);
    previewImage('');
  }
  modal.style.display = 'flex';
}

function previewImage(url) {
  const box = document.getElementById('pm-img-preview');
  if (!url) { box.innerHTML = '<span>Anteprima immagine</span>'; return; }
  const src = url.startsWith('http') ? url : '../' + url;
  const img = new Image();
  img.onload = () => { box.innerHTML = `<img src="${escAttr(src)}" alt="preview" style="max-width:100%;max-height:120px;border-radius:6px;object-fit:contain">`; };
  img.onerror = () => { box.innerHTML = `<span style="color:#e04040">Immagine non trovata: ${escHtml(url)}</span>`; };
  img.src = src;
}

function closeProductModal() {
  document.getElementById('prod-modal').style.display = 'none';
  editingId = null;
}

async function saveProduct() {
  const saveBtn = document.getElementById('pm-save-btn');
  const val = id => document.getElementById(id).value.trim();
  const chk = id => document.getElementById(id).checked;

  const name = val('pm-name');
  const cat  = val('pm-cat');
  const price = parseFloat(val('pm-price'));

  if (!name) { adminToast('Inserisci il nome del prodotto', 'error'); return; }
  if (!cat)  { adminToast('Seleziona una categoria', 'error'); return; }
  if (isNaN(price) || price < 0) { adminToast('Inserisci un prezzo valido (0 per "su richiesta")', 'error'); return; }

  const priceLabel = val('pm-pricelabel');
  const data = {
    name,
    category: cat,
    codice: val('pm-codice'),
    price,
    priceLabel: priceLabel || (price > 0 ? price.toLocaleString('it-IT', {minimumFractionDigits:2}) + ' €' : 'Su richiesta'),
    badge: val('pm-badge'),
    icon: val('pm-icon') || '📦',
    image: val('pm-image'),
    spessore: val('pm-spessore'),
    larghezza: val('pm-larghezza'),
    lunghezza: val('pm-lunghezza'),
    descrizione: val('pm-descrizione'),
    description: val('pm-desc'),
    sortOrder: parseInt(val('pm-sort'), 10) || 0,
    available: chk('pm-available'),
    featured:  chk('pm-featured'),
    patented:  chk('pm-patented'),
  };

  saveBtn.disabled = true;
  try {
    if (editingId) {
      await AdminProducts.update(editingId, data);
      adminToast('Prodotto aggiornato con successo');
    } else {
      await AdminProducts.create(data);
      adminToast('Prodotto aggiunto con successo');
    }
    closeProductModal();
    await loadProducts();
  } catch (err) {
    adminToast('Errore salvataggio: ' + err.message, 'error');
  } finally {
    saveBtn.disabled = false;
  }
}

function deleteProduct(id) {
  const p = productsCache.find(x => x.id === id);
  if (!p) return;
  adminConfirm(`Eliminare "${p.name}"? L'operazione non può essere annullata.`, async () => {
    try {
      await AdminProducts.remove(id);
      adminToast('Prodotto eliminato');
      await loadProducts();
    } catch (err) {
      adminToast('Errore eliminazione: ' + err.message, 'error');
    }
  });
}
</script>

<style>
.admin-toolbar { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
.toolbar-left { display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; }
.admin-search { background:var(--admin-surface); border:1px solid var(--admin-border); border-radius:6px; padding:.6rem 1rem; color:var(--admin-text); font-family:inherit; font-size:.88rem; min-width:220px; }
.admin-search:focus { outline:none; border-color:var(--admin-gold); }
.admin-select { background:var(--admin-surface); border:1px solid var(--admin-border); border-radius:6px; padding:.6rem .9rem; color:var(--admin-text); font-family:inherit; font-size:.88rem; }
.admin-select:focus { outline:none; border-color:var(--admin-gold); }
.prod-stats-row { display:flex; gap:1rem; margin-top:1.5rem; flex-wrap:wrap; }
.prod-stat { background:var(--admin-surface); border:1px solid var(--admin-border); border-radius:8px; padding:.8rem 1.5rem; display:flex; flex-direction:column; align-items:center; gap:.2rem; min-width:80px; }
.ps-num { font-size:1.4rem; font-weight:700; color:var(--admin-gold); }
.ps-lbl { font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--admin-text-muted); }
.prod-thumb { width:40px; height:40px; border-radius:6px; background:var(--admin-bg); display:flex; align-items:center; justify-content:center; font-size:1.3rem; overflow:hidden; }
.prod-thumb img { width:100%; height:100%; object-fit:cover; }
.prod-name-cell .prod-n { font-weight:600; font-size:.9rem; }
.prod-name-cell .prod-desc-preview { font-size:.75rem; color:var(--admin-text-muted); margin-top:2px; }
.action-btns { display:flex; gap:.4rem; justify-content:flex-end; }
.action-btn { background:var(--admin-bg); border:1px solid var(--admin-border); border-radius:5px; padding:.3rem .5rem; cursor:pointer; font-size:.85rem; transition:border-color .2s; }
.action-btn:hover { border-color:var(--admin-gold); }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem; }
.modal-box { background:var(--admin-surface); border:1px solid var(--admin-border); border-radius:12px; width:100%; max-height:90vh; overflow-y:auto; }
.large-modal { max-width:820px; }
.modal-head { display:flex; justify-content:space-between; align-items:center; padding:1.5rem 2rem; border-bottom:1px solid var(--admin-border); }
.modal-head h3 { font-size:1.1rem; }
.modal-close { background:none; border:none; color:var(--admin-text-muted); font-size:1.1rem; cursor:pointer; }
.modal-close:hover { color:var(--admin-text); }
.modal-body { padding:2rem; }
.modal-foot { padding:1.5rem 2rem; border-top:1px solid var(--admin-border); display:flex; justify-content:flex-end; gap:.8rem; }
.modal-two-col { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem; }
@media(max-width:700px){ .modal-two-col { grid-template-columns:1fr; } }
.form-group-admin { display:flex; flex-direction:column; gap:.4rem; margin-bottom:1rem; }
.form-group-admin label { font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--admin-text-muted); }
.form-group-admin input, .form-group-admin select, .form-group-admin textarea {
  background:var(--admin-bg); border:1px solid var(--admin-border); border-radius:6px;
  padding:.65rem .9rem; color:var(--admin-text); font-family:inherit; font-size:.88rem;
}
.form-group-admin input:focus, .form-group-admin select:focus, .form-group-admin textarea:focus { outline:none; border-color:var(--admin-gold); }
.form-group-admin textarea { resize:vertical; min-height:90px; }
.form-group-admin select option { background:var(--admin-surface); }
.form-row-admin { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.img-preview-box { margin-top:.5rem; min-height:60px; background:var(--admin-bg); border:1px dashed var(--admin-border); border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--admin-text-muted); font-size:.8rem; padding:.5rem; }
.modal-toggles { display:flex; flex-direction:column; gap:.5rem; padding:1rem; background:var(--admin-bg); border:1px solid var(--admin-border); border-radius:8px; margin-top:.5rem; }
.toggle-row { display:flex; justify-content:space-between; align-items:center; padding:.5rem 0; cursor:pointer; }
.toggle-label { font-size:.88rem; font-weight:600; }
.toggle-sub { font-size:.75rem; color:var(--admin-text-muted); margin-top:2px; }
.toggle-wrap { position:relative; }
.toggle-inp { display:none; }
.toggle-slider { display:block; width:44px; height:24px; background:var(--admin-border); border-radius:12px; position:relative; transition:background .25s; cursor:pointer; }
.toggle-slider::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .25s; }
.toggle-inp:checked + .toggle-slider { background:var(--admin-gold); }
.toggle-inp:checked + .toggle-slider::after { left:22px; }
.empty-placeholder { text-align: center; padding: 2rem; color: var(--admin-text-muted); font-size: .9rem; }
</style>
</body>
</html>
