# ─────────────────────────────────────────────────────────────────────────────
#  Panev Ascensori — nginx vhost (reverse proxy пред Node на 127.0.0.1:4102)
#
#  Каноничен домейн: https://panevascensori.it  (БЕЗ www — така са canonical,
#  hreflang, sitemap.xml и JSON-LD в генерирания сайт). www.* прави 301 насам.
#
#  Инсталиране: виж panev/DEPLOY.md (сертификатът трябва да покрива И www.*,
#  иначе редиректът от https://www.… се чупи с cert-mismatch преди редиректа).
#    /etc/nginx/sites-available/panev.conf  → symlink в sites-enabled/
#    certbot certonly --webroot -w /var/www/html -d panevascensori.it -d www.panevascensori.it
#
#  ВНИМАНИЕ (капан на nginx): add_header НЕ се наследява от server ниво, ако в
#  location блока има поне един add_header. Затова тук няма add_header на server
#  ниво — заглавията за сигурност идват от приложението (server.js: CSP, HSTS,
#  nosniff, Referrer-Policy…), а за файловете, които nginx сервира от диска,
#  заглавията са изписани изрично във всеки location.
# ─────────────────────────────────────────────────────────────────────────────

upstream panev_app {
    server 127.0.0.1:4102;
    keepalive 32;
}

# ── 1) HTTP: ACME + всичко останало към каноничния HTTPS ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name panevascensori.it www.panevascensori.it;

    # Подновяването на сертификата минава без редирект (webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / { return 301 https://panevascensori.it$request_uri; }
}

# ── 2) HTTPS www → non-www (301, каноничен домейн) ───────────────────────────
server {
    # Стар синтаксис (listen … http2) работи и на nginx < 1.25.1; на 1.25.1+
    # може да се смени с отделна директива `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.panevascensori.it;

    ssl_certificate     /etc/letsencrypt/live/panevascensori.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panevascensori.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;

    return 301 https://panevascensori.it$request_uri;
}

# ── 3) HTTPS каноничен сайт ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panevascensori.it;

    ssl_certificate     /etc/letsencrypt/live/panevascensori.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panevascensori.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    # Let's Encrypt НЕ поддържа OCSP → stapling няма какво да закачи; отзоваването
    # е през CRL/кратък живот на сертификата. Затова не включваме ssl_stapling.

    server_tokens off;
    # Формата за контакт праща JSON ≤100 kb (express.json limit) — 1m е с резерв.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/manifest+json;

    # Логове (виж DEPLOY.md за logrotate).
    access_log /var/log/nginx/panev.access.log;
    error_log  /var/log/nginx/panev.error.log;

    # ── Статика директно от диска (без Node hop) ────────────────────────────
    # root се задава ВЪТРЕ в блоковете нарочно: така nginx сервира от диска само
    # тези четири публични префикса, а всичко останало минава през приложението
    # (и през неговия blocklist за data/, lib/, scripts/, .env, *.db …).

    # Шрифтове: имената са с хеш на съдържанието (Inter-latin-6ab57b19.woff2) →
    # безопасно immutable за година.
    location ^~ /fonts/ {
        root /opt/panev;
        try_files $uri =404;
        # Само add_header (без `expires`) — иначе nginx праща ДВА реда
        # Cache-Control (един от expires, един оттук).
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Изображения: НЕ ги сервираме от диска! Приложението прави прозрачна WebP
    # преговорка (server.js — при `Accept: image/webp` връща .webp двойника на
    # .png/.jpg, ~50% по-малко, с `Vary: Accept`). Директното сервиране от nginx
    # би изхвърлило тази оптимизация. Затова само пренаписваме Cache-Control:
    # имената НЕ са хеширани (img/staffa-A65-170.png), значи `immutable` би
    # замразил стар кадър при подмяна на снимка — 30 дни е балансът.
    # proxy_hide_header + add_header (а не само add_header) — иначе отговорът
    # излиза с ДВА реда Cache-Control (един от приложението, един оттук).
    location ^~ /img/ {
        proxy_pass http://panev_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # CSS/JS: /css/site.css и /js/site.js са БЕЗ хеш в името. `immutable` тук би
    # оставил върнал се посетител със стар CSS/JS до година след деплой (счупен
    # сайт, невъзможен за поправяне отдалеч). Затова 7 дни + must-revalidate —
    # същата стойност, която задава и приложението (server.js). Ако някой ден
    # билдът почне да слага хеш в имената, вдигни на 1y immutable.
    location ^~ /css/ {
        root /opt/panev;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /js/ {
        root /opt/panev;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Каталогът (PDF) — голям и рядко сменян.
    location ^~ /docs/ {
        root /opt/panev;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # /.well-known/ (security.txt, ai.txt) се сервира от приложението. Този блок е
    # с `^~` НАРОЧНО: префикс с ^~ бие regex-а по-долу, иначе „скритите файлове"
    # правилото би върнало 404 за легитимния security.txt.
    location ^~ /.well-known/ {
        proxy_pass http://panev_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Всички останали скрити файлове — никога.
    location ~ /\. { deny all; return 404; }

    # ── Админ: без кеш, без индексиране ─────────────────────────────────────
    location /admin {
        proxy_pass http://panev_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;   # без дубъл: приложението също го праща
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── API (вкл. /api/contact): никога кеширано ────────────────────────────
    location /api/ {
        proxy_pass http://panev_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Имейлът към Aruba се праща в рамките на заявката — дай му въздух.
        proxy_read_timeout 60s;
    }

    # ── Всичко останало (HTML страници, clean URLs, редиректи) → приложението ─
    # Cache-Control за HTML идва от приложението: `no-cache, must-revalidate`
    # (server.js) — НЕ го презаписваме тук, за да не се разминат двата слоя.
    location / {
        proxy_pass http://panev_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
    }
}
