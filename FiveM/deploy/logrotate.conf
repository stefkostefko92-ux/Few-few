# Ротация на дневниците на FiveM BG.
#
#   sudo cp FiveM/deploy/logrotate.conf /etc/logrotate.d/fivembulgaria
#   # Пробата е през ОБЩИЯ вход, не върху този файл сам:
#   #   `logrotate -d /etc/logrotate.d/fivembulgaria` чете само него и по
#   #   определение НЕ може да види сблъсък с пакетния конфиг (виж по-долу).
#   sudo logrotate -d /etc/logrotate.conf 2>&1 | grep -i duplicate   # ПРАЗНО
#
# ЗАЩО СЪЩЕСТВУВА ТОЗИ ФАЙЛ. `/privacy` обявява техническия дневник на уеб
# сървъра като **14 дни**. Обявен срок без изпълнител е нарушение на чл. 5,
# ал. 1, б. „д“ ОРЗД, независимо колко добре звучи текстът, а срокът по
# подразбиране е ЧУЖДО решение — идва от `/etc/logrotate.d/nginx` на пакета
# `nginx-common` и се мени между версии на дистрибуцията (историческият Debian
# пазеше `weekly rotate 52`, тоест ГОДИНА). Не го помни — сверявай го на място:
#   grep -E 'daily|weekly|rotate|maxage' /etc/logrotate.d/nginx
# Какъвто и да е, той не е нашето обещание. Този файл го прави наше.
#
# Промениш ли срока тук, промени и текста в `src/content/legal.ts`.
#
# ЗАЩО ДНЕВНИЦИТЕ СА В ПОДПАПКА, а не `/var/log/nginx/fivembulgaria.access.log`.
# Първата версия ги държеше право в `/var/log/nginx/`, тоест точно там, където
# сочи и глобът на пакетния конфиг `/etc/logrotate.d/nginx`
# (`/var/log/nginx/*.log`). Два файла обявяваха собственост върху едни и същи
# дневници и logrotate го отказва на глас — измерено на живия сървър:
#
#   error: nginx:1 duplicate log entry for /var/log/nginx/fivembulgaria.access.log
#
# Това НЕ е козметика, и точното поведение е ИЗМЕРЕНО (logrotate 3.21.0,
# възпроизведено с временна пясъчна инсталация, не прочетено от документация):
# губещият блок не пада цял — от него отпадат ТОЧНО дублираните файлове, а
# останалите му дневници се въртят нормално. Тоест съседните сайтове на машината
# НЕ страдат; страда обещанието НА ТОЗИ файл.
# Кой е губещият се решава от реда на четене — `/etc/logrotate.d/` се обхожда по
# азбучен ред. Днес печелим само защото `f` < `n`. Преименува ли се файлът на
# нещо след „nginx“ (или се преномерира, както се прави за подредба), измереният
# резултат е:
#
#   error: zz-fivembulgaria:1 duplicate log entry for …/fivembulgaria.access.log
#   error: zz-fivembulgaria:1 duplicate log entry for …/fivembulgaria.error.log
#
# — и двата ни дневника минават под пакетния блок, а `maxage 14` изчезва БЕЗ
# нито един ред разлика в текста на `/privacy`. Обявените 14 дни висяха на
# азбучен ред на имена на файлове. Отделно целият пробег излиза с код 1, значи
# всяко наблюдение върху изхода на logrotate е трайно червено и слепва с
# истинските провали.
#
# Подпапката е поправката, която оцелява и след `apt upgrade`: глобът
# `/var/log/nginx/*.log` НЕ влиза в поддиректории, значи припокриване няма и
# няма нужда да пипаме `/etc/logrotate.d/nginx` (той е dpkg conffile — редакция
# там пита при всяко обновяване на nginx, а изберат ли „версията на пакета“,
# дублирането се връща тихо, без никакъв сигнал).
#
# Пътищата тук трябва да съвпадат с `access_log`/`error_log` в `nginx.conf`.

/var/log/nginx/fivembulgaria/access.log
/var/log/nginx/fivembulgaria/error.log {
  daily
  rotate 14
  # По-старите се изтриват, не се архивират другаде — иначе „14 дни“ пак не е
  # вярно, само че копието е на друго място.
  maxage 14
  missingok
  notifempty
  compress
  delaycompress
  create 0640 www-data adm
  sharedscripts
  postrotate
    [ -f /var/run/nginx.pid ] && kill -USR1 "$(cat /var/run/nginx.pid)"
  endscript
}
