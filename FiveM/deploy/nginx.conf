# FiveM Bulgaria — сайт-блок за Nginx.
#
#   sudo cp FiveM/deploy/nginx.conf /etc/nginx/sites-available/fivembulgaria
#   sudo ln -s /etc/nginx/sites-available/fivembulgaria /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fivembulgaria.carbonstealth.eu
#
# Файлът стои в репото, а не само като откъс в документацията, защото два реда
# тук са част от ЗАЩИТАТА, не от настройката — виж коментарите при тях.

server {
  listen 80;
  listen [::]:80;
  server_name fivembulgaria.carbonstealth.eu;

  # Certbot ще пренапише този блок при издаване на сертификата.
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name fivembulgaria.carbonstealth.eu;

  # Пътищата се попълват от certbot.
  # ssl_certificate     /etc/letsencrypt/live/fivembulgaria.carbonstealth.eu/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/fivembulgaria.carbonstealth.eu/privkey.pem;

  # Тялото е малко навсякъде: най-голямата форма е ревю с 4000 знака.
  client_max_body_size 1m;

  # Компресията е за текста, който наистина пращаме.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  access_log /var/log/nginx/fivembulgaria.access.log;
  error_log  /var/log/nginx/fivembulgaria.error.log;

  location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Двата реда, които са ЗАЩИТА, не настройка ─────────────────────────
    # 1) `X-Real-IP` е ЕДИНСТВЕНИЯТ хедър, от който приложението чете подателя
    #    за тавана на опитите за вход (`src/lib/admin/auth.ts`). Без него всички
    #    опити изглеждат от един принципал и таванът заключва собственика.
    proxy_set_header X-Real-IP $remote_addr;
    # 2) Останалите „IP“ хедъри се ИЗПРАЗВАТ. Празната стойност ги маха, за да
    #    не стигне до приложението нещо, което клиентът си е написал сам.
    #    Доказано с PoC: докато приложението четеше и `CF-Connecting-IP`,
    #    подхвърлен хедър махаше тавана, а хедър с IP-то на собственика го
    #    заключваше. Кодът вече чете само един — тези редове пазят това да
    #    остане вярно и след следващия рефактор.
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header True-Client-IP "";

    proxy_read_timeout 60s;
  }

  # Статиката на Next носи хеш в името — може да се кешира дълго.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Панелът никога не се кешира от прокси — там има лични данни.
  location /bg/admin { proxy_pass http://127.0.0.1:3010; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header CF-Connecting-IP ""; proxy_set_header X-Forwarded-For ""; add_header Cache-Control "no-store"; }
  location /en/admin { proxy_pass http://127.0.0.1:3010; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header CF-Connecting-IP ""; proxy_set_header X-Forwarded-For ""; add_header Cache-Control "no-store"; }
}

# ВНИМАНИЕ: политиката обявява дневника за достъп като 14 дни. Ако logrotate
# пази по-дълго, текстът в /privacy лъже — сверявай ги заедно.
