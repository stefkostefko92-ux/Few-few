# FiveM Bulgaria — сайт-блок за Nginx.
#
#   sudo cp FiveM/deploy/nginx.conf /etc/nginx/sites-available/fivembulgaria
#   sudo ln -s /etc/nginx/sites-available/fivembulgaria /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fivembulgaria.carbonstealth.eu
#
# ЗАЩО БЛОКЪТ Е САМО HTTP. Първата версия носеше готов `listen 443 ssl` със
# закоментирани `ssl_certificate` пътища — и това НЕ МИНАВА `nginx -t`: nginx
# пада с emerg, защото `ssl` без сертификат е грешка, а сертификатът още го няма
# (издава го certbot по-късно). Тоест инсталацията спираше на първата команда и
# TLS никога не тръгваше. `certbot --nginx` сам добавя 443 блока и
# пренасочването — точно както при `adblock/`.
#
# Файлът стои в репото, а не като откъс в документацията, защото три реда тук са
# част от ЗАЩИТАТА, не от настройката — виж коментарите при тях.

server {
  listen 80;
  listen [::]:80;
  server_name fivembulgaria.carbonstealth.eu;

  # Тялото е малко навсякъде: най-голямата форма е ревю с 4000 знака.
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ПОДПАПКА, не `/var/log/nginx/fivembulgaria.access.log`. Пакетният конфиг
  # `/etc/logrotate.d/nginx` глоби `/var/log/nginx/*.log`; докато дневниците ни
  # бяха право там, двата конфига обявяваха собственост върху едни и същи файлове
  # и logrotate падаше с `duplicate log entry`. Глобът не влиза в поддиректории —
  # затова тук няма припокриване. Папката се създава в „Еднократно“ (DEPLOY.md);
  # липсва ли, nginx не тръгва изобщо (`nginx -t` го хваща преди reload).
  access_log /var/log/nginx/fivembulgaria/access.log;
  error_log  /var/log/nginx/fivembulgaria/error.log;

  # ── Хедърите, които приложението НЕ бива да вижда от клиента ────────────────
  # Стойностите се задават на ниво server, за да важат за ВСЕКИ `location` —
  # включително за такъв, който някой добави утре и забрави да ги повтори.
  # `proxy_set_header` се наследява само ако вложеният блок НЕ дефинира свои,
  # затова по-долу няма нито един `proxy_set_header` в `location`.
  #
  # 1) `X-Real-IP` е ЕДИНСТВЕНИЯТ хедър, от който приложението чете подателя за
  #    тавана на опитите за вход (`src/lib/admin/auth.ts`). Без него всички опити
  #    изглеждат от един принципал и таванът заключва собственика.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  # 2) Останалите „IP“ хедъри се ИЗПРАЗВАТ. Празната стойност ги маха, за да не
  #    стигне до приложението нещо, което клиентът си е написал сам. Доказано с
  #    PoC: докато приложението четеше и `CF-Connecting-IP`, подхвърлен хедър
  #    махаше тавана, а хедър с IP-то на собственика го заключваше. Кодът вече
  #    чете само един — тези редове пазят това да остане вярно и след рефактор.
  proxy_set_header CF-Connecting-IP "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header True-Client-IP "";
  # 3) Подчертавките в имена на хедъри се отхвърлят по подразбиране, но го
  #    заявяваме изрично: `x_real_ip` не бива да мине за `X-Real-IP`.
  underscores_in_headers off;

  proxy_http_version 1.1;
  proxy_read_timeout 60s;

  location / {
    proxy_pass http://127.0.0.1:3010;
  }

  # Статиката на Next носи хеш в името — може да се кешира дълго.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3010;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Панелът никога не се кешира от прокси — там има лични данни.
  location ~ ^/(bg|en)/admin {
    proxy_pass http://127.0.0.1:3010;
    add_header Cache-Control "no-store";
  }
}

# ВНИМАНИЕ: политиката обявява дневника за достъп като 14 дни. Ако logrotate
# пази по-дълго, текстът в /privacy лъже — сверявай ги заедно.
