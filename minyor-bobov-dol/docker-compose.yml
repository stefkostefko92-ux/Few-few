# Продукционен стек: Next.js приложение + PostgreSQL.
# Стартиране: `docker compose up -d --build`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minyor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-minyor}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minyor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      DATABASE_URL: "postgresql://${POSTGRES_USER:-minyor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-minyor}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?Задайте AUTH_SECRET в .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@carbonstealth.eu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в .env}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://minyor.carbonstealth.eu}
    ports:
      - "${HTTP_PORT:-3000}:3000"

volumes:
  db-data:
