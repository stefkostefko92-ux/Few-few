# Заглавия за /admin: същите като на сайта, но БЕЗ Content-Security-Policy — CSP-то на панела го слага
# приложението (server/src/admin/index.ts, CSP_ADMIN: blob: за снимките от устройството, worker за офлайн).
# Два CSP заглавия се пресичат, затова Nginx не добавя своя тук.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
