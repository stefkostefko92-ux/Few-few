# LiftCon — Nginx (хост). Статичният сайт от /var/www/liftcon.it/current (връзка към последната версия,
# публикувана от панела), формата и /admin → 127.0.0.1:4370.
# Домейнът се сменя от deploy.sh (DOMAIN=...), не на ръка на сървъра.
limit_req_zone $binary_remote_addr zone=liftcon_api:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=liftcon_login:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name liftcon.it www.liftcon.it;
    location ^~ /.well-known/acme-challenge/ { root /var/www/liftcon.it/current; }
    location / { return 301 https://liftcon.it$request_uri; }
}

server {
    # `listen … http2` (а не `http2 on;`) — работи и с nginx 1.24 на Ubuntu 24.04.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.liftcon.it;
    ssl_certificate /etc/letsencrypt/live/liftcon.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liftcon.it/privkey.pem;
    include /etc/nginx/snippets/liftcon-headers.conf;
    return 301 https://liftcon.it$request_uri;
}

server {
    # `listen … http2` (а не `http2 on;`) — работи и с nginx 1.24 на Ubuntu 24.04.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liftcon.it;
    root /var/www/liftcon.it/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/liftcon.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liftcon.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:liftcon_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 32k;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml text/xml text/plain application/rss+xml application/manifest+json image/x-icon;

    include /etc/nginx/snippets/liftcon-headers.conf;
    add_header Cache-Control "no-cache" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Активи с хеш в името — неизменими.
    location ^~ /assets/css/ { include /etc/nginx/snippets/liftcon-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location ^~ /assets/js/ { include /etc/nginx/snippets/liftcon-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location ^~ /assets/fonts/ { include /etc/nginx/snippets/liftcon-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location ^~ /assets/brand/ { include /etc/nginx/snippets/liftcon-headers.conf; add_header Cache-Control "public, max-age=2592000" always; }
    location ^~ /img/ { include /etc/nginx/snippets/liftcon-headers.conf; add_header Cache-Control "public, max-age=2592000" always; }

    location = /site.webmanifest { default_type application/manifest+json; include /etc/nginx/snippets/liftcon-headers.conf; add_header Cache-Control "public, max-age=86400" always; }
    location = /guide/feed.xml { default_type application/rss+xml; include /etc/nginx/snippets/liftcon-headers.conf; add_header Cache-Control "public, max-age=3600" always; }
    location ~ ^/(llms|llms-full)\.txt$ { default_type "text/plain; charset=utf-8"; include /etc/nginx/snippets/liftcon-headers.conf; add_header Cache-Control "public, max-age=3600" always; }

    # Бекендът на формата (само POST) и проверката на здравето.
    location = /api/richiesta {
        limit_except POST { deny all; }
        limit_req zone=liftcon_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4370;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:4370/health;
        proxy_http_version 1.1;
        access_log off;
    }
    location ^~ /api/ { return 404; }

    # Админ панелът: само през приложението; вход и 2FA с допълнителен лимит. Префикси с ^~ (не regex):
    # при ^~ /admin Nginx не проверява regex локациите, а по-дългият префикс печели.
    location ^~ /admin/login {
        include /etc/nginx/snippets/liftcon-headers-admin.conf;
        limit_req zone=liftcon_login burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4370;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /admin/2fa {
        include /etc/nginx/snippets/liftcon-headers-admin.conf;
        limit_req zone=liftcon_login burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4370;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Документите: снимките се качват тук (смалени в браузъра до 2560 px; приложението приема до 15 MB).
    location ^~ /admin/api/documenti/ {
        include /etc/nginx/snippets/liftcon-headers-admin.conf;
        client_max_body_size 16m;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:4370;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location ^~ /admin {
        include /etc/nginx/snippets/liftcon-headers-admin.conf;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:4370;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 150s;
    }

    # Чисти адреси: /servizi/ → /servizi/index.html; без .html в адресите на съдържанието.
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\.(?!well-known) { deny all; }
}
