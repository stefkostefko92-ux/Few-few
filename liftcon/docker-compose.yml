# LiftCon — само бекендът на формата; статичният сайт го сервира Nginx на хоста от /var/www/<домейн>.
# Портът е публикуван само на 127.0.0.1 (зад Nginx с TLS). Тайните — в env_file на сървъра (mode 600).
services:
  api:
    build: ./server
    image: liftcon-api:latest
    container_name: liftcon-api
    restart: unless-stopped
    env_file:
      - ${LIFTCON_ENV_FILE:-/opt/few-few/shared/liftcon/.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4370"
    ports:
      - "127.0.0.1:${LIFTCON_HTTP_PORT:-4370}:4370"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
