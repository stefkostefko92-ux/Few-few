<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carbon Stealth · VPS Dashboard</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#091813" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CS VPS" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preload" href="/fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Вход -->
    <div id="login" class="login hidden">
      <form id="login-form" class="login-card" autocomplete="off">
        <div class="brand"><span class="logo">◆</span> Carbon Stealth <em>VPS</em></div>
        <p class="login-sub">Контролен панел за сървъра</p>
        <label>Потребител<input id="login-user" name="user" value="admin" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" /></label>
        <label>Парола<input id="login-pass" name="password" type="password" autocomplete="current-password" /></label>
        <label id="login-code-wrap" class="hidden">Код от приложението (2FA)<input id="login-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" /></label>
        <button type="submit" class="btn btn-primary">Вход</button>
        <div id="login-err" class="login-err"></div>
      </form>
    </div>

    <!-- Приложение — „Топокарта": рейл с 7-те хъба · горна лента · лента със
         секциите на хъба · изглед. На телефон рейлът се заменя от дока долу. -->
    <div id="app" class="app hidden">
      <aside class="rail" aria-label="Хъбове">
        <div class="rail-in">
          <div class="rail-brand"><span class="logo" aria-hidden="true">◆</span><span class="rail-label">Carbon Stealth <em>VPS</em></span></div>
          <nav id="hubs" class="hubs" aria-label="Хъбове"></nav>
          <div class="rail-foot">
            <button id="btn-logout" class="btn btn-ghost btn-sm logout" aria-label="Изход"><span aria-hidden="true">⏻</span><span class="rail-label">Изход</span></button>
            <span id="ver" class="ver"></span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <!-- „Къде съм": името на възела стои ПРЕД пътя хъб › секция. Панелът може
               да управлява и съсед — бутон, натиснат на грешната машина,
               рестартира грешния сървър. -->
          <div class="where">
            <div class="where-path"><span class="node-chip"><span id="host-badge"></span><span class="remote-tag">отдалечен</span></span><span id="hub-crumb" class="hub-crumb"></span></div>
            <h1 id="section-title">Обзор</h1>
          </div>
          <div class="cmdbar">
            <button id="btn-cmd" class="cmd" title="Команди (Ctrl+K)"><img class="ico-img" src="/icons/act-search.png" alt="" /><span class="cmd-txt">Отиди където и да е — секция, услуга, действие…</span><kbd>Ctrl K</kbd></button>
            <div id="recent" class="recent" role="group" aria-label="Последни секции"></div>
          </div>
          <div class="topbar-right">
            <span class="node-switch hidden"><select id="node-select" aria-label="Възел"></select></span>
            <span id="node-status" class="sr-only"></span>
            <!-- Главна сигнализация (master caution): активните аларми на ТЕКУЩИЯ
                 възел, видими от всяка секция. Иначе „всичко гори" се разбира само
                 ако случайно отвориш „Аларми". -->
            <button id="annun" class="annun hidden" title="Активни аларми на този възел"></button>
            <span id="stale-banner" class="stale hidden"></span>
            <!-- Живо състояние на повишените права. Дотук те бяха НЕВИДИМИ: даваш
                 парола за едно действие и оставаш с отключен панел още пет минути,
                 без нищо да го показва. Сега се вижда, брои надолу и се заключва
                 с един клик. -->
            <span id="sudo-badge" class="sudo-badge hidden" role="status" aria-live="polite">
              <span class="sudo-dot" aria-hidden="true"></span>
              <span id="sudo-left" class="sudo-left"></span>
              <button id="sudo-lock" class="sudo-lock" title="Заключи сега">Заключи</button>
            </span>
            <span id="conn-dot" class="dot" title="Връзка на живо"></span>
            <span id="conn-sr" class="sr-only" aria-live="polite"></span>
            <button id="btn-refresh" class="icon-btn" title="Опресни (r)" aria-label="Опресни"><img class="ico-img" src="/icons/ui-refresh.png" alt="" /></button>
          </div>
        </header>
        <nav id="secs" class="secbar" aria-label="Секции"></nav>
        <div id="view" class="view"></div>
      </main>

      <!-- Телефон: докът е в зоната на палеца — къде съм (отваря хъбовете) ·
           търсене · аларми. Алармите са на ЕДНО докосване от всяко място. -->
      <nav id="dock" class="dock" aria-label="Навигация">
        <button id="dock-place" class="dock-place" aria-haspopup="dialog"><img id="dock-ico" src="/icons/nav-overview.png" alt="" /><span class="dp-txt"><span id="dock-hub" class="dp-hub"></span> › <span id="dock-sec"></span></span></button>
        <button id="dock-search" class="dock-search" aria-label="Търси"><img src="/icons/act-search.png" alt="" /></button>
        <button id="dock-al" class="dock-al" aria-label="Аларми"><span class="mk" aria-hidden="true"></span><span id="dock-al-n"></span></button>
      </nav>
      <dialog id="hub-sheet" class="sheet" aria-label="Хъбове">
        <div class="sheet-in">
          <div class="sheet-grip" aria-hidden="true"></div>
          <div id="hub-tiles" class="tiles"></div>
          <div id="sheet-foot" class="sheet-foot"></div>
        </div>
      </dialog>
    </div>

    <!-- Изскачащ прозорец за задача/лог/терминал -->
    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <span id="modal-title">Задача</span>
          <div class="modal-actions">
            <button id="modal-kill" class="btn btn-danger btn-sm hidden">Спри</button>
            <button id="modal-close" class="icon-btn" aria-label="Затвори"><img class="ico-img" src="/icons/ui-close.png" alt="" /></button>
          </div>
        </div>
        <pre id="modal-out" class="term-out"></pre>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
