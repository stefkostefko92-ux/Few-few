# Незадължителен графичен десктоп (Ubuntu + XFCE) за сървъра.
#
# НЕ се пуска по подразбиране и НЕ стартира с машината. Пускаш го от панела,
# когато ти трябва, и го спираш, когато свършиш. Причината не е RAM (той е малко
# при 16 GB) — а това, че жива десктоп сесия е ВТОРА врата към машината.
#
# Какво реално върши работа на headless сървър:
#   • браузър НА сървъра — виждаш сайта така, както го вижда светът от този IP
#     (гео, DNS, TLS верига, блокирали ли са ни някъде);
#   • графичен клиент за база;
#   • преглед на снимки/PDF, които терминалът не показва.
#
# Сигурност — всяко от тези неща е нарочно:
#   • слуша САМО на 127.0.0.1 → отвън е недостъпен, дори портът да е отворен;
#     единственият път навътре е през панела, тоест през неговия вход + 2FA;
#   • няма достъп до Docker сокета — иначе десктопът е root на целия хост;
#   • няма `privileged`, няма `network_mode: host`;
#   • файловата система на хоста е монтирана САМО за четене и само там, където
#     има смисъл. Искаш ли запис — смени го тук съзнателно, не по подразбиране.
services:
  desktop:
    # LinuxServer.io Webtop: Ubuntu + графична среда в един образ, поддържан.
    #
    # Средата е НАСТРОЙВАЕМА (`desktop.image` в конфига). Подразбирането е MATE,
    # защото той е най-близкото до класическия вид на Ubuntu — панел отгоре,
    # познато меню, тема и тапет. `ubuntu-xfce` е гол: черен фон, две икони и
    # нищо друго, което на екрана изглежда като счупено, а не като минимално.
    # Алтернативи: `ubuntu-kde` (най-лъскав, но 2+ GB — при 4 GB машина с жива
    # продукция е риск), `ubuntu-xfce` (най-лек).
    #
    # ВНИМАНИЕ, ТАГЪТ Е ПОДВИЖЕН. Пазехме се от `latest`, но `ubuntu-xfce` също
    # се мени: под него LinuxServer смениха ЦЯЛАТА технология — беше KasmVNC,
    # сега е Selkies (WebRTC). Тоест начинът, по който десктопът пази сесия и
    # обслужва подпапка, се промени без нито един ред при нас. Ако някой ден
    # рамката се счупи без наша промяна, ПЪРВО провери дали образът не е сменен
    # под теб (`docker image inspect` + логовете на контейнера).
    image: ${DESKTOP_IMAGE:-lscr.io/linuxserver/webtop:ubuntu-mate}
    container_name: csd-desktop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
      # KasmVNC се сервира под ПОДПАПКА, защото панелът го проксира на
      # `/desktop/`. Без това вътрешните му пътища сочат в корена и рамката
      # остава празна.
      - SUBFOLDER=/desktop/
      # Собствената му парола е ВТОРИ слой. Първият е входът на панела —
      # контейнерът не се вижда отвън изобщо. Задава се в `desktop.env`.
      - CUSTOM_USER=${DESKTOP_USER:-csd}
      - PASSWORD=${DESKTOP_PASSWORD:?Задай DESKTOP_PASSWORD в deploy/desktop/desktop.env}
    volumes:
      - desktop-config:/config
      # Само за ЧЕТЕНЕ. Достатъчно, за да разгледаш дъмп или лог с графичен
      # инструмент; недостатъчно, за да счупиш продукция от десктопа.
      - /opt/few-few/shared:/host/shared:ro
    ports:
      # 127.0.0.1 е задължително. Без него портът е публичен и целият модел
      # „само през панела" пада.
      #
      # Портът идва от `desktop.port` в конфига (панелът го подава като
      # DESKTOP_PORT). Беше закован на 3010 и това правеше настройката вързана
      # наполовина: панелът проксираше към новия порт, контейнерът публикуваше
      # на стария. А 3010 не е свободен навсякъде — на нашата машина вече е зает
      # и compose пада с „Bind for 127.0.0.1:3010 failed: port is already
      # allocated", без панелът да може да предложи изход.
      - '127.0.0.1:${DESKTOP_PORT:-3010}:3000'
    # Браузърите падат с малък /dev/shm — това е най-честата причина „Chrome не
    # тръгва в контейнер".
    shm_size: '1gb'
    # ТАВАН НА ПАМЕТТА — не е удобство, а защита на продукцията.
    #
    # Коментарът тук доскоро твърдеше „~1 GB при 16 GB е нищо". Машината е с
    # 4 GB. Тоест десктоп без таван може да изяде половината RAM, а изборът кого
    # да убие остава на ядрото — а то по правило избира НАЙ-ГОЛЕМИЯ процес, тоест
    # базата. Панелът има `OOMScoreAdjust=-500` и оцелява; продуктите нямат нищо.
    # С таван десктопът пада ПРЪВ и сам, а сървърът си върви.
    mem_limit: ${DESKTOP_MEM:-1500m}
    security_opt:
      - seccomp:unconfined
    restart: 'no' # НЕ се вдига сам след рестарт на машината — това е нарочно
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  desktop-config:
