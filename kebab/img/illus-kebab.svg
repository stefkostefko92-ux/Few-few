<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Panino kebab con carne alla brace e verdure fresche">
  <defs>
    <radialGradient id="kbg" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#2A1C13"/><stop offset="1" stop-color="#130D0A"/></radialGradient>
    <linearGradient id="kpita" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4D89A"/><stop offset="1" stop-color="#D9A659"/></linearGradient>
    <linearGradient id="kmeat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C46A22"/><stop offset="1" stop-color="#7E3C13"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#kbg)"/>
  <ellipse cx="400" cy="330" rx="330" ry="200" fill="#E8480C" opacity="0.10"/>
  <!-- plate -->
  <ellipse cx="400" cy="470" rx="320" ry="60" fill="#241a14"/>
  <ellipse cx="400" cy="460" rx="320" ry="56" fill="#31241b"/>
  <!-- pita back -->
  <path d="M250 200c0-70 300-70 300 0v150c0 70-300 70-300 0z" fill="url(#kpita)"/>
  <!-- filling: meat strips -->
  <g fill="url(#kmeat)">
    <rect x="300" y="150" width="40" height="200" rx="18" transform="rotate(-8 320 250)"/>
    <rect x="350" y="140" width="40" height="210" rx="18" transform="rotate(4 370 250)"/>
    <rect x="405" y="150" width="40" height="200" rx="18" transform="rotate(-6 425 250)"/>
    <rect x="455" y="145" width="40" height="205" rx="18" transform="rotate(8 475 250)"/>
  </g>
  <!-- lettuce -->
  <path d="M270 250c-30-10-40 20-18 34 30 16 70 6 96-8-26-18-52-18-78-26z" fill="#4d9162"/>
  <path d="M530 250c30-10 40 20 18 34-30 16-70 6-96-8 26-18 52-18 78-26z" fill="#3F7D52"/>
  <!-- tomato -->
  <circle cx="320" cy="320" r="22" fill="#D33A33"/><circle cx="470" cy="328" r="22" fill="#C1272D"/>
  <!-- onion -->
  <path d="M360 330c20-6 44-6 64 0" stroke="#C9A6D6" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- pita front -->
  <path d="M250 330c0 70 300 70 300 0v20c0 70-300 70-300 0z" fill="#E8B96A"/>
  <!-- sauce drizzle -->
  <path d="M300 300c20 14 40 14 60 0 22 14 44 14 66 0 20 14 40 14 60 0" stroke="#FBF1DC" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- fries beside -->
  <g fill="#E8B04B"><rect x="120" y="430" width="16" height="70" rx="6" transform="rotate(-18 128 465)"/><rect x="150" y="430" width="16" height="74" rx="6" transform="rotate(-4 158 465)"/><rect x="180" y="432" width="16" height="68" rx="6" transform="rotate(10 188 465)"/></g>
</svg>
