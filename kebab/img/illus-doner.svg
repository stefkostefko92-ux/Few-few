<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Spiedo di döner kebab alla brace">
  <defs>
    <radialGradient id="dbg" cx="62%" cy="32%" r="85%">
      <stop offset="0" stop-color="#2A1C13"/><stop offset="55%" stop-color="#1A130E"/><stop offset="1" stop-color="#120D0A"/>
    </radialGradient>
    <linearGradient id="dmeat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C879"/><stop offset="35%" stop-color="#D98A33"/>
      <stop offset="70%" stop-color="#A8551B"/><stop offset="1" stop-color="#6E3411"/>
    </linearGradient>
    <linearGradient id="dheat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C1272D"/><stop offset="55%" stop-color="#FF6A2B"/><stop offset="1" stop-color="#E8B04B"/>
    </linearGradient>
    <clipPath id="dclip"><path d="M360 175c92 18 150 92 150 215 0 150-70 250-150 300-80-50-150-150-150-300 0-123 58-197 150-215z"/></clipPath>
  </defs>
  <rect width="800" height="1000" fill="url(#dbg)"/>
  <!-- glow -->
  <ellipse cx="430" cy="430" rx="330" ry="380" fill="#E8480C" opacity="0.12"/>
  <!-- mount top + rod -->
  <rect x="350" y="70" width="20" height="640" rx="10" fill="#E8B04B"/>
  <rect x="300" y="58" width="120" height="26" rx="13" fill="#C9A24A"/>
  <circle cx="360" cy="70" r="16" fill="#E8B04B"/>
  <!-- heat element -->
  <g opacity="0.9">
    <rect x="560" y="200" width="34" height="470" rx="16" fill="#3a2a20"/>
    <rect x="568" y="212" width="18" height="446" rx="9" fill="url(#dheat)"/>
  </g>
  <!-- meat cone -->
  <path d="M360 175c92 18 150 92 150 215 0 150-70 250-150 300-80-50-150-150-150-300 0-123 58-197 150-215z" fill="url(#dmeat)"/>
  <!-- striations -->
  <g clip-path="url(#dclip)" opacity="0.5">
    <g fill="#5e2d11">
      <ellipse cx="360" cy="220" rx="160" ry="13"/><ellipse cx="360" cy="270" rx="170" ry="13"/>
      <ellipse cx="360" cy="320" rx="172" ry="13"/><ellipse cx="360" cy="372" rx="168" ry="13"/>
      <ellipse cx="360" cy="424" rx="158" ry="13"/><ellipse cx="360" cy="476" rx="146" ry="13"/>
      <ellipse cx="360" cy="528" rx="130" ry="12"/><ellipse cx="360" cy="578" rx="112" ry="12"/>
      <ellipse cx="360" cy="626" rx="92" ry="11"/>
    </g>
    <g fill="#FBE6BC" opacity="0.6">
      <ellipse cx="360" cy="245" rx="165" ry="5"/><ellipse cx="360" cy="296" rx="170" ry="5"/>
      <ellipse cx="360" cy="398" rx="160" ry="5"/><ellipse cx="360" cy="502" rx="136" ry="5"/>
    </g>
  </g>
  <!-- crispy highlight edge -->
  <path d="M360 175c92 18 150 92 150 215 0 150-70 250-150 300" fill="none" stroke="#FBE6BC" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
  <!-- drip tray -->
  <ellipse cx="360" cy="730" rx="190" ry="34" fill="#241a14"/>
  <ellipse cx="360" cy="724" rx="190" ry="30" fill="#33251c"/>
  <!-- carved slices -->
  <g>
    <path d="M150 800c40-26 92-30 150-12-30 30-92 40-150 22z" fill="#C16A1E"/>
    <path d="M170 858c46-22 100-22 156 2-34 26-96 32-156 10z" fill="#D98A33"/>
    <path d="M210 906c44-18 96-16 148 6-32 22-92 28-148 4z" fill="#A8551B"/>
  </g>
  <!-- knife -->
  <g transform="rotate(18 600 760)">
    <rect x="470" y="744" width="220" height="20" rx="6" fill="#cdd3d8"/>
    <rect x="688" y="740" width="74" height="28" rx="10" fill="#2b2b2e"/>
  </g>
</svg>
