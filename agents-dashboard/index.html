function renderDocs() {

  if (typeof docs === "undefined" || !docs || !docs.files) { wrap.innerHTML = "<p style='color:var(--mut)'>Документите се зареждат от <code>docs.js</code> при деплой.</p>"; return; }
  document.getElementById("docsgen").textContent = docs.generated || "—";
  const tabs = document.getElementById("docstabs"); if (tabs.dataset.done) return; tabs.dataset.done = "1";
  docs.files.forEach((f, i) => { const b = document.createElement("button"); b.textContent = f.name; if (!i) b.classList.add("on"); b.onclick = () => { [...tabs.children].forEach(x => x.classList.remove("on")); b.classList.add("on"); wrap.innerHTML = md(f.content); }; tabs.appendChild(b); });
  if (docs.files[0]) wrap.innerHTML = md(docs.files[0].content);
}
function mdInline(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
function md(src) {
  const L = String(src).split("\n"); let out = "", i = 0;
  while (i < L.length) {
    const ln = L[i];
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < L.length && /^\s*\|[-:\s|]+\|\s*$/.test(L[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out += '<table class="md-table"><thead><tr>' + cells(ln).map(c => "<th>" + mdInline(c) + "</th>").join("") + "</tr></thead><tbody>"; i += 2;
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) { out += "<tr>" + cells(L[i]).map(c => "<td>" + mdInline(c) + "</td>").join("") + "</tr>"; i++; }
      out += "</tbody></table>"; continue;
    }
    if (/^#{1,3}\s/.test(ln)) { const n = ln.match(/^#+/)[0].length; out += `<h${n}>${mdInline(ln.replace(/^#+\s/, ""))}</h${n}>`; }
    else if (ln.trim() !== "") out += `<p>${mdInline(ln)}</p>`;
    i++;
  }
  return out;
}

    if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openPalette(); return; }
    if (e.key === "Escape") { if ($("#palette").classList.contains("open")) { closePalette(); return; } if ($("#help").classList.contains("open")) { $("#help").classList.remove("open"); return; } return; }
    if (typing()) return;
    if (e.key === "/") { e.preventDefault(); openPalette(); }
    else if (e.key === "?") { e.preventDefault(); toggleHelp(); }
    else if (e.key === "r" || e.key === "R") { randomAgent(); }
    else if (e.key === "g" || e.key === "G") { setView("sky"); }
    else if (e.key === "l" || e.key === "L") { setView("list"); }
    else if (e.key === "d" || e.key === "D") { setView("docs"); }
    else if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && $("#drawer").classList.contains("open")) { const ids = orderedIds(), i = ids.indexOf(window.__cur); if (i >= 0) openDrawer(byId(ids[(i + (e.key === "ArrowRight" ? 1 : -1) + ids.length) % ids.length])); }
  });

  /* ---- маршрутиране на чата към точния агент (експонирано за startChat) ---- */
  const ROUTES = [
    { k: ["мобил", "ios", "android", "app store", "play", "apk", "capacitor", "twa"], to: "mobildjiyata" },
    { k: ["одобр", "ревю", "review", "apple review", "app review", "мета", "meta", "cloaking", "notariz", "casa", "изряд"], to: "tayniyat-agent" },
    { k: ["право", "gdpr", "лични данни", "бисквит", "cookie", "импресум", "dsa", "закон", "правен"], to: "pravniyat-razbirach" },
    { k: ["stripe", "плащан", "checkout", "abonament", "абонамент", "webhook", "pci"], to: "prodavacha" },
    { k: ["seo", "класиран", "ранкинг", "hreflang", "sitemap", "видимост"], to: "seo" },
    { k: ["discord", "бот", "slash", "webhook discord", "gateway"], to: "diskordjiyata" },
    { k: ["chrome", "разширен", "extension", "mv3", "manifest"], to: "hromadjiyata" },
    { k: ["превод", "локализ", "english", "italiano", "bg en it"], to: "prevodach" },
    { k: ["ci", "cd", "github actions", "workflow", "pipeline", "конвейер", "релийз", "release", "билд", "actions", "гейт", "supply chain"], to: "konveyera" },
    { k: ["тест", "test", "playwright", "vitest", "jest", "e2e", "flaky", "unit", "покритие", "coverage", "spec"], to: "izpitatelya" },
    { k: ["документ", "docs", "readme", "changelog", "adr", "api докове", "diataxis", "onboarding", "ръководство", "llms.txt", "туториал"], to: "letopisetsa" },
    { k: ["сървър", "деплой", "deploy", "docker", "nginx", "tls", "hetzner", "vps"], to: "vps-adjiyata" },
    { k: ["каса", "фискал", "н-18", "супто", "бон", "pos"], to: "kasadjiyata" },
    { k: ["трейд", "trading", "борса", "binance", "бектест", "стоп-лос"], to: "treydara" },
    { k: ["fivem", "lua", "esx", "qbcore"], to: "geymara" },
    { k: ["3d", "меш", "mesh", "nurbs", "скан", "карбон"], to: "3d-maniac" },
    { k: ["печат", "print", "k2 plus", "orca", "fdm", "cfs"], to: "printadjiyata" },
    { k: ["дизайн", "шейдър", "webgl", "three", "анимац", "wow"], to: "dizayner" },
    { k: ["сийд", "seed", "prisma", "upsert"], to: "siydara" },
    { k: ["реклам", "tiktok", "reels", "social", "видео", "клип"], to: "socialdjiyata" },
    { k: ["качеств", "рефактор", "чист код", "дублир", "сложност"], to: "kachestveniyat" },
    { k: ["llm", "ai", "gemini", "openai", "claude", "модел", "prompt", "агент"], to: "ai-djiyata" },
    { k: ["бъг", "сигурност", "owasp", "уязвим", "код ревю", "xss"], to: "kodadjiyata" },
  ];
  window.chatRoute = function (a, text) { const t = (text || "").toLowerCase(); for (const r of ROUTES) { if (r.to === a.id) continue; if (r.k.some(w => t.includes(w))) return r.to; } return null; };
  window.openById = openById; window.byIdA = byId;

  /* ---- CSS за Знания/фийд/екип/рутер ---- */
  const css2 = document.createElement("style");
  css2.textContent = `
  .lessons{ display:flex;flex-direction:column;gap:8px; } .lsn{ background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--ac);border-radius:9px;padding:9px 11px; }
  .lsn .lx{ font-size:12.5px;line-height:1.5;color:var(--txt); } .lsn .lsrc{ margin-top:5px;font-size:10.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; } .lsn .lsrc span{ color:var(--ac); }
  #feed,#team{ position:fixed;z-index:20;background:rgba(8,11,17,.98);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);display:none; }
  #feed{ top:70px;right:16px;width:min(360px,92vw);max-height:78vh;overflow-y:auto;border-radius:14px;padding:14px 16px; } #feed.open{ display:block; }
  .frow{ display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer; } .frow:hover{ background:var(--panel2); }
  .frow svg{ width:16px;height:16px;flex:0 0 auto;margin-top:1px; } .frow .ft{ font-size:11.8px;line-height:1.42;color:var(--txt); } .frow .fm{ font-size:10px;color:var(--mut);margin-top:2px; } .frow .fm b{ color:var(--ac); }
  #team{ inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.82);backdrop-filter:blur(6px);border:none;border-radius:0; } #team.open{ display:flex; }
  .teambox{ width:min(920px,96vw);max-height:94vh;overflow-y:auto;background:rgba(9,13,20,.98);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 30px 90px rgba(0,0,0,.7); }
  .teamhd{ display:flex;justify-content:space-between;align-items:center;margin-bottom:6px; } .teamhd h3{ margin:0;font-size:16px; } .teamhd .tx{ background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer; }
  .teamsub{ color:var(--mut);font-size:12px;margin-bottom:8px; }
  .constel{ width:100%;height:auto;display:block; } .constel .edge{ stroke:var(--line);stroke-width:1;transition:.15s; } .constel .node circle{ transition:.15s;cursor:pointer; } .constel .node text{ font:600 9px system-ui;fill:var(--mut);pointer-events:none; }
  .constel .node:hover circle,.constel .node.hl circle{ r:11; } .constel .node:hover text{ fill:var(--txt); } .constel .edge.hl{ stroke-width:2.4;opacity:1; }
  .router{ margin-top:14px;border-top:1px solid var(--line);padding-top:14px; } .router h4{ margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut); }
  .router .rin{ display:flex;gap:8px; } .router textarea{ flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;min-height:44px;outline:none; }
  .router button.rgo{ align-self:stretch;padding:0 16px;background:var(--accent);color:#04121a;border:none;border-radius:10px;font-weight:700;cursor:pointer; }
  .rres{ margin-top:12px;display:flex;flex-wrap:wrap;gap:10px; } .rcard{ display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:11px;padding:10px 12px;cursor:pointer;min-width:200px; } .rcard:hover{ border-color:var(--ac); }
  .rcard svg{ width:20px;height:20px; } .rcard b{ font-size:13px;display:block; } .rcard span{ font-size:11px;color:var(--mut); }`;
  document.head.appendChild(css2);
  const xb = $(".xbtns");
  if (xb) xb.insertAdjacentHTML("beforeend", `<button class="xbtn" id="xb-feed" title="Учебен фийд" aria-label="Учебен фийд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="20" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg></button><button class="xbtn" id="xb-team" title="Екипна карта + кой агент да ползвам" aria-label="Екипна карта"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="17" r="2.2"/><circle cx="19" cy="17" r="2.2"/><path d="M12 7.2v3.6M10.5 12l-4 3.2M13.5 12l4 3.2M7 17h10"/></svg></button>`);
  document.body.insertAdjacentHTML("beforeend", `<div id="feed"></div><div id="team"></div>`);

  /* ---- учебен фийд ---- */
  function toggleFeed() { const f = $("#feed"); if (f.classList.contains("open")) { f.classList.remove("open"); return; } const items = []; DATA.agents.forEach(a => (a.recentLessons || []).slice(0, 3).forEach(L => items.push({ a, L }))); items.sort((x, y) => (y.L.date || "").localeCompare(x.L.date || "")); f.innerHTML = `<div class="stitle"><b>Учебен фийд · последно научено</b><button class="sx" aria-label="Затвори">×</button></div>` + items.slice(0, 40).map(it => `<button class="frow" data-id="${it.a.id}" style="--ac:${it.a.accent}"><span style="color:${it.a.accent}">${iconSVG(it.a.id, it.a.accent, 1.8)}</span><span><span class="ft">${esc(it.L.text)}</span><span class="fm"><b>${esc(it.a.name)}</b> · ${esc(it.L.date || "")}</span></span></button>`).join(""); f.classList.add("open"); f.querySelector(".sx").onclick = () => f.classList.remove("open"); f.querySelectorAll(".frow").forEach(b => b.onclick = () => { f.classList.remove("open"); openById(b.dataset.id); }); }

  /* ---- екипна карта (съзвездие) + рутер ---- */
  const TEAM = { "ai-djiyata": ["pravniyat-razbirach", "kodadjiyata", "tayniyat-agent", "mobildjiyata", "dizayner", "vps-adjiyata"], "pravniyat-razbirach": ["seo", "prevodach", "mobildjiyata", "prodavacha", "tayniyat-agent", "kasadjiyata"], "kodadjiyata": ["kachestveniyat", "geymara", "prodavacha", "hromadjiyata"], "kachestveniyat": ["kodadjiyata"], "tayniyat-agent": ["mobildjiyata", "hromadjiyata", "prodavacha", "socialdjiyata"], "mobildjiyata": ["seo", "prevodach", "kodadjiyata", "vps-adjiyata", "socialdjiyata"], "prodavacha": ["vps-adjiyata"], "seo": ["prevodach", "socialdjiyata", "dizayner"], "dizayner": ["kachestveniyat"], "vps-adjiyata": ["siydara", "diskordjiyata", "treydara"], "socialdjiyata": ["prevodach"], "diskordjiyata": [], "hromadjiyata": [], "prevodach": [], "siydara": [], "geymara": [], "treydara": [], "kasadjiyata": ["prodavacha"], "printadjiyata": ["3d-maniac"], "3d-maniac": [], "konveyera": ["vps-adjiyata", "kodadjiyata", "kachestveniyat", "tayniyat-agent", "mobildjiyata", "izpitatelya"], "izpitatelya": ["kachestveniyat", "kodadjiyata", "konveyera"], "letopisetsa": ["prevodach", "seo", "pravniyat-razbirach", "konveyera"] };
  function toggleTeam() { const T = $("#team"); if (T.classList.contains("open")) { T.classList.remove("open"); return; } renderTeam(); T.classList.add("open"); }
  function renderTeam() {
    const T = $("#team"), ag = DATA.agents, n = ag.length, cx = 300, cy = 300, R = 232;
    const pos = {}; ag.forEach((a, i) => { const th = -Math.PI / 2 + i / n * Math.PI * 2; pos[a.id] = { x: cx + Math.cos(th) * R, y: cy + Math.sin(th) * R, th, a }; });
    const seen = new Set(), edges = [];
    Object.keys(TEAM).forEach(id => (TEAM[id] || []).forEach(b => { const k = [id, b].sort().join("|"); if (seen.has(k) || !pos[id] || !pos[b]) return; seen.add(k); edges.push([id, b]); }));
    const edgeSVG = edges.map(([u, v]) => `<line class="edge" data-u="${u}" data-v="${v}" x1="${pos[u].x.toFixed(1)}" y1="${pos[u].y.toFixed(1)}" x2="${pos[v].x.toFixed(1)}" y2="${pos[v].y.toFixed(1)}"/>`).join("");
    const nodeSVG = ag.map(a => { const p = pos[a.id], lx = cx + Math.cos(p.th) * (R + 20), ly = cy + Math.sin(p.th) * (R + 20), anchor = Math.cos(p.th) > .3 ? "start" : Math.cos(p.th) < -.3 ? "end" : "middle"; return `<g class="node" data-id="${a.id}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isPrez(a) ? 9 : 7}" fill="${a.accent}"/><text x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="${anchor}">${esc(shortName(a.name))}</text></g>`; }).join("");
    T.innerHTML = `<div class="teambox"><div class="teamhd"><h3>Екипна карта · оркестрация</h3><button class="tx" aria-label="Затвори">×</button></div><div class="teamsub">Кой агент подава на кого. Посочи възел, за да видиш връзките му · клик отваря профила.</div>
      <svg class="constel" viewBox="0 0 600 600">${edgeSVG}${nodeSVG}</svg>
      <div class="router"><h4>Кой агент да ползвам?</h4><div class="rin"><textarea id="rtask" placeholder="Опиши задачата… напр. да мине приложението през App Store ревюто, или GDPR банер за бисквитки"></textarea><button class="rgo" id="rgo">Препоръчай</button></div><div class="rres" id="rres"></div></div></div>`;
    T.querySelector(".tx").onclick = () => T.classList.remove("open");
    T.addEventListener("click", e => { if (e.target === T) T.classList.remove("open"); }, { once: false });
    const svg = T.querySelector(".constel");
    svg.querySelectorAll(".node").forEach(g => {
      const id = g.dataset.id;
      g.addEventListener("mouseenter", () => { const nb = new Set(); edges.forEach(([u, v]) => { if (u === id || v === id) { nb.add(u); nb.add(v); } }); svg.querySelectorAll(".edge").forEach(e => e.classList.toggle("hl", e.dataset.u === id || e.dataset.v === id)); svg.querySelectorAll(".node").forEach(nn => nn.classList.toggle("hl", nb.has(nn.dataset.id))); });
      g.addEventListener("mouseleave", () => { svg.querySelectorAll(".hl").forEach(e => e.classList.remove("hl")); });
      g.addEventListener("click", () => { T.classList.remove("open"); openById(id); });
    });
    const go = () => { const q = ($("#rtask").value || "").toLowerCase(); const score = {}; ROUTES.forEach(r => r.k.forEach(w => { if (q.includes(w)) score[r.to] = (score[r.to] || 0) + 1; })); DATA.agents.forEach(a => { const hay = ((a.title || "") + " " + (a.mission || "") + " " + (a.capabilities || []).join(" ")).toLowerCase(); let s = score[a.id] || 0; q.split(/\s+/).filter(w => w.length > 3).forEach(w => { if (hay.includes(w)) s += 0.5; }); if (s) score[a.id] = s; }); const ranked = Object.keys(score).sort((x, y) => score[y] - score[x]).slice(0, 3); const box = $("#rres"); box.innerHTML = ranked.length ? ranked.map(id => { const a = byId(id); return `<button class="rcard" data-id="${id}" style="--ac:${a.accent}">${iconSVG(id, a.accent, 1.9)}<span><b>${esc(a.name)}</b><span>${esc(a.title || "")}</span></span></button>`; }).join("") : `<div style="color:var(--mut);font-size:12.5px">Опиши задачата с малко повече контекст (платформа, технология, цел).</div>`; box.querySelectorAll(".rcard").forEach(b => b.onclick = () => { T.classList.remove("open"); openById(b.dataset.id); }); };
    T.querySelector("#rgo").onclick = go; T.querySelector("#rtask").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) go(); });
  }
  bind("#xb-feed", toggleFeed); bind("#xb-team", toggleTeam);

  /* ---- отваряне по hash при зареждане ---- */
  function hashOpen() { const h = location.hash || ""; const vm = h.match(/v=(\w+)/); if (vm && ["sky", "list", "docs"].includes(vm[1])) setView(vm[1]); const m = h.match(/a=([a-z0-9\-]+)/i); if (m) { const a = byId(m[1]); if (a) openDrawer(a); } }
  setTimeout(hashOpen, 500);
})();
</script>
