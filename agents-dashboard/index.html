  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--mut); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, #05080a 100%);
    border: 1px solid var(--line); border-radius: 14px; padding: 20px; position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--ac); }
  .chead { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .ava { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; font-size: 22px;
         background: var(--ac15); border: 1px solid var(--ac40); }
  .chead h2 { margin: 0; font-size: 18px; }
  .chead .role { color: var(--mut); font-size: 12.5px; }
  .tag { color: var(--txt); font-size: 13.5px; margin: 10px 0 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .badge { font-size: 11.5px; color: var(--mut); background: var(--panel2); border: 1px solid var(--line);
           padding: 3px 9px; border-radius: 999px; }
  .badge.ac { color: #0c0f14; background: var(--ac); border-color: var(--ac); font-weight: 600; }
  .sec { margin-top: 14px; }
  .sec h3 { margin: 0 0 7px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--mut); }
  ul.caps { margin: 0; padding-left: 18px; }
  ul.caps li { margin: 2px 0; font-size: 13px; }
  .metrics { display: flex; gap: 16px; margin: 14px 0 2px; }
  .metric b { font-size: 18px; } .metric span { color: var(--mut); font-size: 11.5px; display: block; }
  .timeline { border-left: 2px solid var(--line); margin-left: 4px; padding-left: 14px; }
  .ev { position: relative; margin: 0 0 10px; }
  .ev::before { content: ""; position: absolute; left: -20px; top: 5px; width: 9px; height: 9px; border-radius: 50%;
                background: var(--ac); box-shadow: 0 0 0 3px var(--ac15); }
  .ev .v { font-weight: 600; font-size: 13px; } .ev .d { color: var(--mut); font-size: 11.5px; }
  .ev .x { font-size: 12.5px; color: var(--txt); }
  .feed { margin-top: 8px; }
  .feed .row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
  .feed .row:last-child { border: 0; }
  .feed .when { color: var(--mut); white-space: nowrap; }
  .pill { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--mut); }
  details.actv > summary { cursor: pointer; list-style: none; font-size: 11px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--mut); user-select: none; padding: 2px 0; }
  details.actv > summary::-webkit-details-marker { display: none; }
  details.actv > summary::before { content: "▸ "; color: var(--ac); }
  details.actv[open] > summary::before { content: "▾ "; }
  details.actv[open] > summary { margin-bottom: 4px; }
  #globalwrap > summary { cursor: pointer; list-style: none; font-size: 18px; font-weight: 600; margin: 34px 0 8px; }
  #globalwrap > summary::-webkit-details-marker { display: none; }
  #globalwrap > summary::before { content: "▸ "; color: var(--accent); }
  #globalwrap[open] > summary::before { content: "▾ "; }
  footer { margin-top: 40px; color: var(--mut); font-size: 12.5px; text-align: center; }
  code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }
.ava svg{ width:40px; height:40px; display:block; }

  const brows='<path d="M20 27 q4 -2 8 0" stroke="'+hr+'" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M36 27 q4 -2 8 0" stroke="'+hr+'" stroke-width="1.6" fill="none" stroke-linecap="round"/>';

    hair='<path d="M12 28 l3 -13 4 9 5 -14 5 14 4 -9 4 13 z" fill="'+hr+'"/>';
    gear='<g><rect x="14" y="29" width="36" height="11" rx="5" fill="'+ac+'" opacity=".88"/><rect x="14" y="29" width="36" height="4" rx="2" fill="#fff" opacity=".18"/><circle cx="24" cy="34.5" r="2" fill="#fff" opacity=".95"/><circle cx="40" cy="34.5" r="2" fill="#fff" opacity=".95"/></g>'
      +'<path d="M14 33 h-4 M50 33 h4" stroke="'+ac+'" stroke-width="3"/>';
  } else if(st==='creator'){
    back='<circle cx="32" cy="34" r="24" fill="none" stroke="'+ac+'" stroke-width="2" opacity=".45"/>';
    hair='<path d="M14 31 q4 -20 18 -20 q14 0 18 20 q-6 -10 -18 -10 q-12 0 -18 10z" fill="'+hr+'"/>'
      +'<path d="M40 16 q6 6 4 16" stroke="'+ac+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
    gear='<g transform="rotate(-16 50 47)"><rect x="46" y="40" width="9" height="16" rx="2" fill="#1e1e1e"/><rect x="47.4" y="42" width="6.2" height="11" rx="1" fill="'+ac+'" opacity=".55"/></g>'
      +'<g fill="'+ac+'"><circle cx="13" cy="20" r="1.2"/><circle cx="51" cy="15" r="1"/><path d="M11 29 l1 2 2 1 -2 1 -1 2 -1 -2 -2 -1 2 -1z"/></g>';
  } else if(st==='merchant'){
    hair='<path d="M15 31 q3 -19 17 -19 q14 0 17 19 q-7 -9 -17 -9 q-10 0 -17 9z" fill="'+hr+'"/>';
    gear='<g transform="rotate(-12 44 46)"><rect x="38" y="40" width="16" height="10" rx="2" fill="'+ac+'"/><rect x="38" y="43" width="16" height="2.4" fill="#fff" opacity=".85"/><circle cx="41" cy="48" r="1.1" fill="#fff" opacity=".9"/></g>'
      +'<g fill="'+ac+'"><circle cx="13" cy="20" r="1.1"/><circle cx="51" cy="16" r="1"/></g>';
  } else if(st==='mobile'){
    hair='<path d="M15 30 q3 -19 17 -19 q14 0 17 19 q-7 -8 -17 -8 q-10 0 -17 8z" fill="'+hr+'"/>';
    gear='<g transform="rotate(14 46 44)"><rect x="42" y="36" width="11" height="18" rx="2.5" fill="#1e1e1e"/><rect x="43.2" y="38.4" width="8.6" height="11.8" rx="1" fill="'+ac+'" opacity=".7"/><circle cx="47.5" cy="52" r="1" fill="#fff" opacity=".8"/></g>'
      +'<g stroke="'+ac+'" stroke-width="1.3" fill="none" opacity=".8"><path d="M40 31 q4 -4 8 0"/><path d="M37.5 28.5 q6.5 -6 13 0"/></g>';
  } else if(st==='printer'){
    hair='<path d="M15 31 q3 -19 17 -19 q14 0 17 19 q-7 -9 -17 -9 q-10 0 -17 9z" fill="'+hr+'"/>';
    gear='<g><rect x="38" y="38" width="16" height="13" rx="1.5" fill="#2a2a2a"/><rect x="40" y="40.5" width="12" height="2" rx="1" fill="'+ac+'"/>'
      +'<rect x="45" y="42.5" width="2" height="6" fill="#cfcfcf"/><rect x="44" y="48" width="4" height="2.4" rx="0.6" fill="'+ac+'"/></g>'
      +'<g fill="'+ac+'" opacity=".9"><rect x="44.4" y="50.4" width="3.2" height="4" rx="0.5"/></g>';
  } else if(st==='designer'){
    back='<radialGradient id="dz'+a.id+'" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="'+ac+'" stop-opacity=".55"/><stop offset="100%" stop-color="'+ac+'" stop-opacity="0"/></radialGradient><circle cx="32" cy="34" r="26" fill="url(#dz'+a.id+')"/>';
    hair='<path d="M13 32 q2 -21 19 -21 q17 0 19 21 q-7 -10 -19 -10 q-12 0 -19 10z" fill="'+hr+'"/>';
    gear='<g fill="'+ac+'"><path d="M50 16 l1.4 4 4 1.4 -4 1.4 -1.4 4 -1.4 -4 -4 -1.4 4 -1.4z"/><path d="M14 13 l1 2.8 2.8 1 -2.8 1 -1 2.8 -1 -2.8 -2.8 -1 2.8 -1z"/><circle cx="52" cy="40" r="1.4"/></g>'
      +'<path d="M11 47 q9 5 21 5 q12 0 21 -5" stroke="'+ac+'" stroke-width="1.4" fill="none" opacity=".55"/>';

const typeLabel = { research:"учене", born:"раждане", invoked:"извикване", upgrade:"ъпгрейд", learning:"научено", quarantine:"карантина" };

function render(data){
  document.getElementById("title").textContent = data.meta.title;
  document.getElementById("subtitle").textContent = data.meta.subtitle;
  document.getElementById("defdir").textContent = data.meta.definitionsDir;

  const agents = data.agents;
  const totalSources = agents.reduce((s,a)=>s+(a.knowledge?.sources||0),0);
  const totalCaps = agents.reduce((s,a)=>s+(a.capabilities?.length||0),0);
  const stats = [
    [agents.length, "агента"],
    [totalSources, "поети източника"],
    [totalCaps, "способности"],
    [data.meta.updated, "обновено"]
  ];
  const sw = document.getElementById("stats");
  stats.forEach(([b,s])=> sw.appendChild(el("div","stat",`<b>${b}</b><span>${s}</span>`)));

  const grid = document.getElementById("grid");
  agents.forEach(a=>{
    const card = el("div","card");
    card.style.setProperty("--ac", a.accent);
    card.style.setProperty("--ac15", hexA(a.accent,.15));
    card.style.setProperty("--ac40", hexA(a.accent,.40));

    card.appendChild(el("div","chead",
      `<div class="ava">${avatarSVG(a)}</div><div><h2>${a.name}</h2><div class="role">${a.title}</div></div>`));
    card.appendChild(el("div","tag", a.tagline));

    const badges = el("div","badges");
    badges.appendChild(el("span","badge ac", a.status==="active"?"● активен":a.status));
    badges.appendChild(el("span","badge", "модел: "+a.model));
    a.tools.forEach(t=> badges.appendChild(el("span","badge", t)));
    card.appendChild(badges);

    const m = el("div","metrics");
    m.appendChild(el("div","metric",`<b>${a.knowledge.sources}</b><span>източника</span>`));
    m.appendChild(el("div","metric",`<b>${a.capabilities.length}</b><span>способности</span>`));
    m.appendChild(el("div","metric",`<b>v${a.evolution[a.evolution.length-1].version}</b><span>версия</span>`));
    card.appendChild(m);

    const caps = el("div","sec"); caps.appendChild(el("h3",null,"Способности"));
    const ul = el("ul","caps"); a.capabilities.forEach(c=> ul.appendChild(el("li",null,c))); caps.appendChild(ul);
    card.appendChild(caps);

    const evo = el("details","sec actv");
    evo.innerHTML = `<summary>Развитие · версии (${a.evolution.length})</summary>`;
    const tl = el("div","timeline");
    a.evolution.slice().reverse().forEach(e=>{
      tl.appendChild(el("div","ev",
        `<div class="v">v${e.version} · ${e.event} <span class="d">— ${e.date}</span></div><div class="x">${e.detail}</div>`));
    });
    evo.appendChild(tl); card.appendChild(evo);

    // Дейност (сгъваем dropdown, без лимит) — целият поток на учене на агента.
    const acts = a.activity || [];
    if (acts.length) {
      const det = el("details","sec actv");
      det.innerHTML = `<summary>Дейност (${acts.length})</summary>`;
      const fd = el("div","feed");
      acts.forEach(ac=>{
        fd.appendChild(el("div","row",
          `<span class="when">${ac.date}</span>`+
          `<span class="pill" style="border-color:${hexA(a.accent,.5)};color:${a.accent}">${typeLabel[ac.type]||ac.type}</span>`+
          `<span>${ac.summary}</span>`));
      });
      det.appendChild(fd); card.appendChild(det);
    }

    grid.appendChild(card);
  });

  // Глобален поток на дейността
  const feed = document.getElementById("globalfeed");
  const all = [];
  agents.forEach(a=> (a.activity||[]).forEach(ac=> all.push({...ac, who:a.name, accent:a.accent})));
  all.sort((x,y)=> (y.date>x.date?1:-1));
  all.forEach(ac=>{
    const row = el("div","row");
    row.innerHTML = `<span class="when">${ac.date}</span>
      <span class="pill" style="border-color:${hexA(ac.accent,.5)};color:${ac.accent}">${typeLabel[ac.type]||ac.type}</span>
      <span><b>${ac.who}</b> — ${ac.summary}</span>`;
    feed.appendChild(row);
  });
}

fetch("./agents.json").then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(render).catch(()=> render(FALLBACK));
</script>
