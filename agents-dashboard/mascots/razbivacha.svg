<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"
     role="img" aria-label="Разбивача">
  <title>Разбивача — Червен екип — оторизирано отбранително стрес-тестване</title>
  <defs>
    <radialGradient id="body-razbivacha" cx="35%" cy="28%">
      <stop offset="0%" stop-color="#f8cdd7"/>
      <stop offset="35%" stop-color="#ef839a"/>
      <stop offset="72%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#8c122d"/>
    </radialGradient>
    <radialGradient id="inner-razbivacha">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottom-razbivacha" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0"/>
      <stop offset="100%" stop-color="#710f24"/>
    </linearGradient>
    <filter id="soft-razbivacha"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow-razbivacha">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#650d20" flood-opacity=".35"/>
    </filter>
  </defs>
  <style>
    .float{animation:mascotFloat 5s ease-in-out infinite;transform-origin:150px 170px}
    .halo{animation:haloPulse 3s ease-in-out infinite;transform-origin:150px 160px}
    .eye{animation:blink 5s infinite;transform-origin:center}
    @keyframes mascotFloat{
      0%,100%{transform:translateY(0) rotate(-1deg)}
      25%{transform:translateY(-4px) rotate(.6deg)}
      50%{transform:translateY(-8px) rotate(1deg)}
      75%{transform:translateY(-4px) rotate(-.6deg)}}
    @keyframes haloPulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.8;transform:scale(1.06)}}
    @keyframes blink{0%,47%{transform:scaleY(1)}49%,51%{transform:scaleY(.08)}53%,100%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.float,.halo,.eye{animation:none}}
  </style>

  <ellipse class="halo" cx="150" cy="160" rx="88" ry="104" fill="#e11d48" opacity=".18" filter="url(#soft-razbivacha)"/>

  <g class="float">
    <path d="M212 196 q22 -6 34 -18" fill="none" stroke="#9e1432" stroke-width="17" stroke-linecap="round"/>
    <g transform="translate(214,148) scale(.52)"><path d="M56 6 L104 26 v38 c0 34-26 56-48 66 -22-10-48-32-48-66 V26Z" fill="#ec738e"/>
    <path d="M56 20 L90 34 v30 c0 25-18 42-34 50 -16-8-34-25-34-50 V34Z" fill="#ffffff" opacity=".24"/></g>

    <path filter="url(#shadow-razbivacha)" fill="url(#body-razbivacha)" d="M150 66 C108 66 78 100 74 146 C70 185 82 228 112 250 C128 262 140 268 150 268 C160 268 172 262 188 250 C218 228 230 185 226 146 C222 100 192 66 150 66Z"/>
    <path opacity=".28" fill="url(#bottom-razbivacha)" d="M88 195 C104 246 132 266 150 268 C168 266 196 246 212 195Z"/>
    <ellipse cx="118" cy="118" rx="22" ry="42" fill="url(#inner-razbivacha)" opacity=".45" transform="rotate(-18 118 118)"/>
    <ellipse cx="165" cy="92" rx="10" ry="16" fill="#ffffff" opacity=".35"/>
    <ellipse cx="172" cy="150" rx="42" ry="64" fill="#ffffff" opacity=".05"/>

    <ellipse cx="102" cy="176" rx="10" ry="5" fill="#ffffff" opacity=".08"/>
    <ellipse cx="198" cy="176" rx="10" ry="5" fill="#ffffff" opacity=".08"/>

    <g class="eye"><ellipse cx="125" cy="145" rx="10" ry="12" fill="#151515"/>
      <circle cx="122" cy="141" r="3" fill="#ffffff" opacity=".95"/>
      <circle cx="127" cy="147" r="1.2" fill="#ffffff" opacity=".55"/></g>
    <g class="eye"><ellipse cx="175" cy="145" rx="10" ry="12" fill="#151515"/>
      <circle cx="172" cy="141" r="3" fill="#ffffff" opacity=".95"/>
      <circle cx="177" cy="147" r="1.2" fill="#ffffff" opacity=".55"/></g>

    <g class="glasses" fill="none" stroke="#101010" stroke-width="6">
      <circle cx="125" cy="145" r="22"/><circle cx="175" cy="145" r="22"/>
      <path d="M147 145 h6" stroke-width="5"/>
    </g>
    <path d="M112 118 Q125 112 138 118" stroke="#320610" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M162 118 Q175 112 188 118" stroke="#320610" stroke-width="4" stroke-linecap="round" fill="none"/>

    <path d="M122 186 Q150 205 178 186" stroke="#320610" stroke-width="5" stroke-linecap="round" fill="none"/>

    <polygon points="144,215 118,203 118,227" fill="#10201a"/>
    <polygon points="156,215 182,203 182,227" fill="#10201a"/>
    <circle cx="150" cy="215" r="6" fill="#0F1E17"/>
    <g class="hat">
      <path d="M78 116 C78 68 110 44 150 44 C190 44 222 68 222 116 l0 14 C214 96 186 76 150 76
               C114 76 86 96 78 130Z" fill="#12161f"/>
      <path d="M88 122 C90 82 116 62 150 62 C184 62 210 82 212 122 C202 96 178 82 150 82
               C122 82 98 96 88 122Z" fill="#5a0c1d"/></g>
  </g>
</svg>
