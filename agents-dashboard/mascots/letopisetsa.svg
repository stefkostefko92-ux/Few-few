<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Летописецът">
  <title>Летописецът — Техническа документация (docs-as-code)</title>
  <defs>
    <radialGradient id="body-letopisetsa" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#f5c7fc"/>
      <stop offset="45%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#793f81"/>
    </radialGradient>
    <filter id="glow-letopisetsa" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ореолът е ОТДЕЛЕН силует под тялото: филтър върху цялата фигура размазва и тъмните части. -->
  <path d="M256 96 C336 96 398 158 404 236 C412 336 350 448 256 448 C162 448 100 336 108 236 C114 158 176 96 256 96Z" fill="#e879f9" filter="url(#glow-letopisetsa)" opacity=".55"/>
  <ellipse cx="256" cy="452" rx="126" ry="18" fill="#e879f9" opacity=".25"/>

  <!-- Ръка + реквизит. Реквизитът се рисува в локална кутия 0..120 и се поставя ВЕДНЪЖ.
       Мащабът и отместването са подбрани така, че да е ИЗВЪН силуета на тялото (то стига до x≈404)
       и вътре в платното (макс. x = 392 + 120·0.82 ≈ 490) — първата версия го оставяше да пронизва корема. -->
  <path d="M382 322 q26 -6 42 -22" fill="none" stroke="#a757b3" stroke-width="24" stroke-linecap="round"/>
  <g transform="translate(392,250) scale(.82)"><path d="M2 20 c22-11 44-11 62 0 v70 c-18-11-40-11-62 0Z" fill="#c18ac9"/>
