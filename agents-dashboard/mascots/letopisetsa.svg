    <rect x="60" y="16" width="7" height="78" rx="3" fill="#2b3242"/></g>

  <path d="M256 96 C336 96 398 158 404 236 C412 336 350 448 256 448 C162 448 100 336 108 236 C114 158 176 96 256 96Z" fill="url(#body-letopisetsa)"/>
